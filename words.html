<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kuzey Arcade">
<title>Word Detective</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: a detective's case board. Mode and language on top, the 6x5 clue grid in the middle, the keyboard at the bottom. Dark only, like the rest of the arcade. */
:root{--night:#0b0820;--panel:#151036;--tile:#1d1748;--line:#2c2468;--ink:#ecebff;--mute:#9a94c9;
  --hit:#2fbf71;--near:#e8b330;--miss:#3a3552;--cyan:#3ef0ff;
  --display:'Orbitron',ui-monospace,monospace;--body:'Chakra Petch',system-ui,sans-serif;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-block:10px 8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
header{width:min(520px,100%);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:900;font-size:20px;margin:0 auto 0 0;letter-spacing:.04em;background:linear-gradient(90deg,var(--cyan),var(--near));-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:6px 10px;cursor:pointer;font-weight:700;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--cyan);color:var(--night)}
a.back{color:var(--mute);text-decoration:none;font-family:var(--display);font-size:11px;letter-spacing:.1em}
.status{width:min(520px,100%);display:flex;justify-content:space-between;color:var(--mute);font-size:13px;font-weight:700}
.grid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;width:min(330px,82vw,46vh);flex:none}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.row.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.t{aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;font-family:var(--display);font-weight:900;font-size:clamp(20px,6vw,30px);background:var(--tile);text-transform:none}
.t.full{border-color:var(--mute)}
.t.hit{background:var(--hit);border-color:var(--hit);color:#05200f}
.t.near{background:var(--near);border-color:var(--near);color:#2a1d00}
.t.miss{background:var(--miss);border-color:var(--miss);color:var(--mute)}
.t.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.08)}}
.msg{min-height:24px;font-weight:700;text-align:center}
.kb{width:min(560px,100%);display:flex;flex-direction:column;gap:6px;margin-top:auto}
.kr{display:flex;gap:4px;justify-content:center}
.k{flex:1;max-width:46px;height:52px;border:0;border-radius:7px;background:var(--line);font-weight:700;font-size:16px;cursor:pointer;touch-action:manipulation;padding:0}
.k.wide{max-width:72px;flex:1.6;font-size:12px}
.k.hit{background:var(--hit);color:#05200f}.k.near{background:var(--near);color:#2a1d00}.k.miss{background:#211d36;color:#5c5778}
.end{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.end b{font-family:var(--display);font-size:22px;letter-spacing:.08em}
.end .btn{border:0;border-radius:8px;padding:10px 18px;font-family:var(--display);font-weight:900;font-size:14px;cursor:pointer;background:var(--cyan);color:var(--night)}
.help{font-size:12px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.help i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.tools{width:min(520px,100%);display:flex;gap:6px;align-items:center}
.tools button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 9px;cursor:pointer;font-weight:700;font-size:13px}
.tools button:hover{border-color:var(--cyan)}.det{margin-right:auto;font-weight:700;font-size:13px;color:var(--ink)}.det small{color:var(--mute);font-weight:600}
.coin{font-weight:700;font-size:13px;color:#ffd23f}
#rushT{font-family:var(--display);color:#ffd23f}
.t.flip{animation:flip .45s both}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.t.hint{box-shadow:inset 0 0 0 2px #ffd23f}
.dist{display:flex;flex-direction:column;gap:3px;width:100%}.dist div{display:flex;gap:6px;align-items:center;font-size:13px}.dist i{display:block;height:18px;background:var(--line);border-radius:4px;min-width:20px;text-align:right;padding:0 6px;font-style:normal;font-weight:700;line-height:18px}.dist i.me{background:var(--hit);color:#05200f}
@media (prefers-reduced-motion:reduce){.row.shake,.t.pop{animation:none}}
</style>
</head>
<body>
<header>
  <h1>WORD DETECTIVE</h1>
  <div class="seg" role="group" aria-label="Language"><button data-lang="tr" aria-pressed="true">TR</button><button data-lang="en" aria-pressed="false">EN</button></div>
  <div class="seg" role="group" aria-label="Mode"><button data-mode="daily" aria-pressed="true" id="mDaily">Daily</button><button data-mode="practice" aria-pressed="false" id="mPractice">Practice</button><button data-mode="rush" aria-pressed="false" id="mRush">⏱ Rush</button></div>
  <a class="back" href="./">ARCADE</a>
</header>
<div class="tools"><span class="det" id="det"></span><span class="coin" id="coin">🪙 0</span><button id="tHint">💡 <span id="hintLbl">Hint</span></button><button id="tMulti" title="Multiplayer">🎮</button><button id="tStats">📊</button><button id="tAch">🏆</button><button id="tMe">👤</button></div>
<div class="status"><span id="caseNo"></span><span id="rushT" hidden></span><span id="streak"></span></div>
<div class="grid" id="grid"></div>
<div class="msg" id="msg" role="status"></div>
<div class="end" id="end" hidden><b id="endTitle"></b><span id="endText"></span><button class="btn" id="endBtn"></button></div>
<div class="help"><span><i style="background:var(--hit)"></i><span id="hHit"></span></span><span><i style="background:var(--near)"></i><span id="hNear"></span></span><span><i style="background:var(--miss)"></i><span id="hMiss"></span></span></div>
<div class="kb" id="kb"></div>
<script src="kit.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
// 5-letter words, written for this game
const WORDS={
 tr:`ARABA ELMAS KALEM KİTAP SINIF ÇİÇEK GÜNEŞ BULUT DENİZ ORMAN NEHİR KÖPEK TAVUK ASLAN ZEBRA BALIK HAVUÇ ARMUT KİRAZ LİMON KAVUN BİBER SOĞAN EKMEK ÇORBA PİLAV BÖREK SİMİT PASTA ŞEKER MASAL KÖPRÜ SAHİL BAHAR ÇANTA ŞAPKA ÇORAP CEKET KAZAK DOLAP YATAK BANYO SALON BAHÇE TARLA ŞEHİR DÜNYA ROKET MOTOR ROBOT MÜZİK ŞARKI DAVUL GİTAR RESİM FIRÇA KAĞIT SİLGİ TAHTA SINAV KARNE HAYAL SEVGİ TEYZE KOMŞU POLİS PİLOT HAKEM TENİS YÜZME ZAMAN HAFTA YARIN SABAH AKŞAM BEYAZ SİYAH YEŞİL PEMBE KARGA SERÇE ŞAHİN YILAN GEYİK TİLKİ KOYUN HOROZ ÖRDEK BÖCEK SİNEK`.split(' '),
 en:`APPLE BEACH BRAIN BREAD BRUSH CANDY CHAIR CHALK CLOUD CLOCK CRANE DANCE DREAM EAGLE EARTH FIELD FLAME FRUIT GHOST GIANT GRAPE GRASS HEART HORSE HOUSE JUICE KNIFE LEMON LIGHT MAGIC MONEY MOUSE MUSIC NIGHT OCEAN PAINT PAPER PIANO PIZZA PLANE PLANT QUEEN RIVER ROBOT SCARF SHARK SHEEP SHIRT SMILE SNAKE SPACE SPOON STORM SUGAR TABLE TIGER TOAST TRAIN TRUCK WATER WHALE WORLD ZEBRA STONE STORY SWEET TOWER CROWN CANOE CAMEL BERRY BLOCK BOARD CHESS CREAM DRESS FENCE FLOOR GLASS GLOVE HONEY LASER MANGO MAPLE MEDAL METAL NURSE ONION ORBIT OTTER PANDA PEACH PEARL PILOT PLATE RADIO SALAD SAUCE SHELL SKATE SLIDE SNACK SOLAR SPORT STAMP STEAM SUNNY TEETH THUMB TORCH TULIP UNCLE VOICE WAGON WHEEL YACHT`.split(' '),
};
const KEYS={tr:['ERTYUIOPĞÜ','ASDFGHJKLŞİ','ZCVBNMÖÇ'],en:['QWERTYUIOP','ASDFGHJKL','ZXCVBNM']};
const T={tr:{daily:'Günün vakası',practice:'Antrenman',streak:n=>n?`Seri: ${n} gün`:'',short:'5 harf yaz',win:['DÂHİYANE!','HARİKA!','ÇOK İYİ!','GÜZEL!','İYİ!','KIL PAYI!'],lose:'Kelime: ',again:'Yeni kelime',tomorrow:'Yarın yeni vaka var',hit:'Doğru yerde',near:'Kelimede var',miss:'Yok',solved:n=>`${n}. denemede çözdün.`},
       en:{daily:'Case of the day',practice:'Practice',streak:n=>n?`Streak: ${n} day${n>1?'s':''}`:'',short:'Type 5 letters',win:['GENIUS!','BRILLIANT!','GREAT!','NICE!','GOOD!','PHEW!'],lose:'The word was ',again:'New word',tomorrow:'A new case comes tomorrow',hit:'Right spot',near:'In the word',miss:'Not in it',solved:n=>`Solved in ${n} ${n>1?'tries':'try'}.`}};
const up=(s,l)=>l==='tr'?s.toLocaleUpperCase('tr-TR'):s.toUpperCase();
let st={lang:'tr',mode:'daily'};try{Object.assign(st,JSON.parse(localStorage.getItem('wdPrefs')||'{}'))}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('wdPrefs',JSON.stringify({lang:st.lang,mode:st.mode}))}catch(e){}};
const dayNo=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const list=()=>WORDS[st.lang].filter(w=>[...w].length===5);
let G=null;
function load(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function newGame(){
  const L=list();let answer;
  if(st.mode==='daily'){const d=dayNo();answer=L[(d*7919)%L.length];const saved=load('wdDaily:'+st.lang);
    G=saved&&saved.day===d&&saved.answer===answer?saved:{day:d,answer,guesses:[],cur:'',done:false,won:false};}
  else{const saved=load('wdPractice:'+st.lang);G=saved&&!saved.done?saved:{answer:L[Math.random()*L.length|0],guesses:[],cur:'',done:false,won:false}}
  G.cur=G.cur||'';draw();
}
const persist=()=>G&&G.mp?0:put(st.mode==='daily'?'wdDaily:'+st.lang:'wdPractice:'+st.lang,G);
// green first, then yellow only as many times as the letter is left over
function score(guess,answer){
  const g=[...guess],a=[...answer],res=Array(5).fill('miss'),left={};
  g.forEach((c,i)=>{if(c===a[i])res[i]='hit';else left[a[i]]=(left[a[i]]||0)+1});
  g.forEach((c,i)=>{if(res[i]!=='hit'&&left[c]){res[i]='near';left[c]--}});
  return res;
}
function draw(){
  const t=T[st.lang];document.documentElement.lang=st.lang;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===st.lang)));
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===st.mode)));
  $('mDaily').textContent=st.lang==='tr'?'Günlük':'Daily';$('mPractice').textContent=st.lang==='tr'?'Antrenman':'Practice';
  $('caseNo').textContent=st.mode==='daily'?`${t.daily} #${G.day%1000}`:t.practice;
  const sk=load('wdStreak:'+st.lang)||{n:0,last:0};$('streak').textContent=t.streak(sk.last>=dayNo()-1?sk.n:0);
  $('hHit').textContent=t.hit;$('hNear').textContent=t.near;$('hMiss').textContent=t.miss;
  const rows=[];
  for(let r=0;r<6;r++){
    const g=G.guesses[r],cur=r===G.guesses.length&&!G.done?[...G.cur]:null,res=g?score(g,G.answer):null,ch=g?[...g]:cur||[];
    rows.push(`<div class="row" data-r="${r}">${Array.from({length:5},(_,i)=>`<div class="t ${res?res[i]:ch[i]?'full':''}">${ch[i]||''}</div>`).join('')}</div>`);
  }
  $('grid').innerHTML=rows.join('');
  // keyboard colours: best result so far for each letter
  const best={},rank={miss:1,near:2,hit:3};
  for(const g of G.guesses){score(g,G.answer).forEach((r,i)=>{const c=[...g][i];if(!best[c]||rank[r]>rank[best[c]])best[c]=r})}
  const back='⌫',enter=st.lang==='tr'?'GİR':'ENTER';
  $('kb').innerHTML=KEYS[st.lang].map((row,i)=>`<div class="kr">${i===2?`<button class="k wide" data-k="enter">${enter}</button>`:''}${[...row].map(c=>`<button class="k ${best[c]||''}" data-k="${c}">${c}</button>`).join('')}${i===2?`<button class="k wide" data-k="back" aria-label="Delete">${back}</button>`:''}</div>`).join('');
  $('end').hidden=!G.done;
  if(G.done){$('endTitle').textContent=G.won?t.win[G.guesses.length-1]:t.lose+G.answer;$('endText').textContent=G.won?t.solved(G.guesses.length):'';
    if(st.mode==='daily'){$('endBtn').textContent=st.lang==='tr'?'Antrenman yap':'Play practice';$('endText').textContent+=' '+t.tomorrow}else $('endBtn').textContent=t.again}
}
function say(m){$('msg').textContent=m;clearTimeout(say.t);say.t=setTimeout(()=>$('msg').textContent='',1800)}
let AC=null;function beep(f,d=.06){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function press(k){
  if(!G||G.done)return;
  if(k==='back'){G.cur=[...G.cur].slice(0,-1).join('');draw();return}
  if(k==='enter'){
    if([...G.cur].length<5){const row=document.querySelector(`.row[data-r="${G.guesses.length}"]`);row&&row.classList.add('shake');say(T[st.lang].short);return}
    G.guesses.push(G.cur);G.cur='';
    if(G.guesses[G.guesses.length-1]===G.answer){G.done=true;G.won=true;beep(880,.15);setTimeout(()=>beep(1175,.2),120)}
    else if(G.guesses.length>=6){G.done=true;beep(200,.3)}
    else beep(520);
    if(G.done&&st.mode==='daily'){const sk=load('wdStreak:'+st.lang)||{n:0,last:0};if(sk.last!==G.day){const n=G.won?(sk.last===G.day-1?sk.n+1:1):0;put('wdStreak:'+st.lang,{n,last:G.won?G.day:sk.last})}}
    persist();draw();return}
  if([...G.cur].length>=5)return;
  G.cur+=k;persist();draw();
  const tiles=document.querySelectorAll(`.row[data-r="${G.guesses.length}"] .t`);const t=tiles[[...G.cur].length-1];t&&t.classList.add('pop');
}
$('kb').addEventListener('click',e=>{const k=e.target.closest('[data-k]');if(k)press(k.dataset.k)});
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter'){e.preventDefault();if(G.done)$('endBtn').click();else press('enter');return}
  if(e.key==='Backspace'){press('back');return}
  if(e.key.length===1){const c=up(e.key,st.lang);if(KEYS[st.lang].join('').includes(c))press(c)}});
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{st.lang=b.dataset.lang;savePrefs();newGame()});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode;savePrefs();newGame()});
$('endBtn').onclick=()=>{if(st.mode==='daily'){st.mode='practice';savePrefs();newGame()}else{put('wdPractice:'+st.lang,null);newGame()}};

/* ================= WD2: rush mode, hints, coins, stats, ranks, awards, more words ================= */
const {sfx:SFX,util:U,ach:ACH,profile:PROF,ui:UI}=KIT;const GAME='words';
WORDS.tr.push('ADRES','AHŞAP','ALTIN','AYRAN','BADEM','BAKIR','BALON','BEBEK','BEYİN','BİLGİ','BOYUN','BURUN','CADDE','CEVİZ','CÜMLE','ÇADIR','ÇAMUR','ÇATAL','ÇAYIR','ÇEKİÇ','ÇELİK','ÇİZGİ','DALGA','DEMİR','DEVRE','DİKEN','DOLMA','DÜDÜK','DÜĞME','FENER','FİDAN','GAZOZ','GÜVEN','HALAT','HAMUR','HASTA','HAVLU','HELVA','HIRKA','İNCİR','İPLİK','İSTEK','KABAK','KAKAO','KALIP','KANAT','KAPAK','KAŞIK','KAYAK','KAYIK','KEMİK','KILIÇ','KİLİT','KOLYE','KONAK','KUMAŞ','KUZEY','LEVHA','MAKAS','MANAV','MARUL','MASKE','MERAK','MEYVE','MİDYE','MUMYA','NOKTA','ÖĞLEN','PAMUK','PARKE','PERDE','RADYO','SAKIZ','SALÇA','SAMAN','SAPAN','SAYGI','SEPET','SERİN','SOKAK','TABAK','TAKSİ','TAVAN','TEPSİ','TOHUM','TOPAÇ','TUĞLA','TÜNEL','VAGON','YAYLA','YEMEK','YÜZÜK','ZEMİN','ZURNA');
WORDS.en.push(...`ACORN ALARM ANGEL ARROW BACON BADGE BAGEL BASIL BEARD BENCH BIRCH BISON BLAZE BLOOM BONUS BOOTS BRAVE BRICK BRIDE BROOM BUNNY CABIN CACTI CARGO CHART CHEEK CHIEF CHILD CIDER CLIFF COAST COBRA CORAL COUCH COMET CRAFT CRISP CROSS CUBIC DAISY DELTA DINER DONUT DRAFT DRAIN DRILL DRUMS EMBER ENJOY FABLE FAIRY FEAST FERRY FLASH FLUTE FOCUS FORGE FROST GECKO GRAIN GUARD GUIDE HATCH HIPPO HOBBY HOUND IGLOO IVORY JELLY JEWEL KAYAK KIOSK KOALA LADLE LLAMA LODGE LUNAR MARCH MERRY MOOSE MOTOR NOBLE NOVEL OASIS OLIVE OPERA PADDY PARTY PASTA PATCH PEDAL PENNY PIXEL PLAZA POLAR PRISM PUPPY QUEST QUILT RAVEN REALM RHINO ROAST ROYAL RULER SAINT SCOUT SHINY SKUNK SLOTH SNAIL SPARK SPICE SPIKE SQUID STAGE STOOL SWING SWORD THORN TIARA TOPAZ TRAIL TREAT TRICK TROUT TWIST VAPOR VIDEO VIOLA WAFER WHEAT WITCH YEAST YOUTH ZESTY`.split(' '));
const SD=Object.assign({coins:20,stats:{tr:{p:0,w:0,d:[0,0,0,0,0,0],max:0},en:{p:0,w:0,d:[0,0,0,0,0,0],max:0}},rushBest:{tr:0,en:0},hints:0,langs:{}},U.load('words:v2',{}));const sv=()=>U.save('words:v2',SD);
ACH.define(GAME,[
 {id:'first',icon:'🔍',name:'Case Closed',desc:'Solve your first word'},{id:'two',icon:'🧠',name:'Sharp Mind',desc:'Solve a word in 2 guesses'},{id:'one',icon:'🎯',name:'Mind Reader',desc:'Solve a word on the first guess'},
 {id:'w10',icon:'🕵️',name:'Detective',desc:'Solve 10 words'},{id:'w50',icon:'🎖️',name:'Inspector',desc:'Solve 50 words'},{id:'w100',icon:'👑',name:'Legend',desc:'Solve 100 words'},
 {id:'st3',icon:'🔥',name:'On a Roll',desc:'Daily streak of 3'},{id:'st7',icon:'📅',name:'Week Warrior',desc:'Daily streak of 7'},{id:'r5',icon:'⏱️',name:'Quick Thinker',desc:'Solve 5 words in one Rush'},
 {id:'r10',icon:'⚡',name:'Lightning Brain',desc:'Solve 10 words in one Rush'},{id:'hint',icon:'💡',name:'A Little Help',desc:'Use a hint'},{id:'bi',icon:'🌍',name:'Bilingual',desc:'Solve words in Turkish and English'},
 {id:'phew',icon:'😅',name:'Phew!',desc:'Solve on the 6th guess'},{id:'rich',icon:'🪙',name:'Paid Detective',desc:'Have 200 coins'}]);
const RANKS=[[0,'Rookie'],[5,'Junior Detective'],[15,'Detective'],[30,'Inspector'],[60,'Chief Inspector'],[100,'Legend']];
const wins=()=>SD.stats.tr.w+SD.stats.en.w;const rank=()=>{let r=RANKS[0];for(const x of RANKS)if(wins()>=x[0])r=x;return r[1]};
let R={on:false,t:180,solved:0,over:false,timer:null};
const _newGame=newGame;newGame=function(){if(st.mode!=='rush'){stopRush();const sp=load('wdPractice:'+st.lang);if(sp&&sp.rush)put('wdPractice:'+st.lang,null);_newGame();G.hints=G.hints||[];return}
  if(!R.on||R.over){R={on:true,t:180,solved:0,over:false,timer:setInterval(rushTick,250)}}
  const L=list();G={answer:L[Math.random()*L.length|0],guesses:[],cur:'',done:false,won:false,rush:true,hints:[]};draw()};
function stopRush(){if(R.timer)clearInterval(R.timer);R.on=false;$('rushT').hidden=true}
function rushTick(){if(R.over)return;R.t-=.25;$('rushT').hidden=false;$('rushT').textContent=`⏱ ${Math.ceil(R.t)}s · ✅ ${R.solved}`;if(R.t<=0){R.over=true;clearInterval(R.timer);G.done=true;G.won=false;
  const best=SD.rushBest[st.lang]||0;if(R.solved>best)SD.rushBest[st.lang]=R.solved;sv();SFX.lose();draw();
  $('endTitle').textContent=st.lang==='tr'?'SÜRE BİTTİ!':'TIME UP!';$('endText').textContent=(st.lang==='tr'?`${R.solved} kelime çözdün. En iyi: `:`You solved ${R.solved} words. Best: `)+SD.rushBest[st.lang]+(st.lang==='tr'?` · Son kelime: ${G.answer}`:` · Last word: ${G.answer}`);$('endBtn').textContent=st.lang==='tr'?'Tekrar':'Play again'}}
const _draw=draw;draw=function(){_draw();if(G&&G.rush&&!R.over)$('end').hidden=true;
  $('mRush').textContent=st.lang==='tr'?'⏱ Hızlı':'⏱ Rush';if(st.mode==='rush')$('caseNo').textContent=st.lang==='tr'?'Hızlı tur — 3 dakika':'Rush — 3 minutes';
  $('det').innerHTML=`🕵️${PROF.avatar} ${PROF.name} <small>· ${rank()}</small>`;$('coin').textContent='🪙 '+SD.coins;$('hintLbl').textContent=(st.lang==='tr'?'İpucu':'Hint')+' 15';
  // faint hint letters in the row you are typing
  if(G&&!G.done&&G.hints&&G.hints.length){const tiles=document.querySelectorAll(`.row[data-r="${G.guesses.length}"] .t`);for(const[i,c]of G.hints){const t=tiles[i];if(t&&!t.textContent){t.textContent=c;t.style.opacity=.35}t&&t.classList.add('hint')}}};
const _endBtn=$('endBtn').onclick;$('endBtn').onclick=()=>{if(st.mode==='rush'){R.over=true;stopRush();newGame();return}_endBtn()};
const _press=press;press=function(k){if(!G||G.done)return;const n=G.guesses.length;_press(k);if(G.guesses.length>n){
    // flip the row that was just checked
    document.querySelectorAll(`.row[data-r="${n}"] .t`).forEach((t,i)=>{t.style.animationDelay=(i*.09)+'s';t.classList.add('flip')});
    score(G.guesses[n],G.answer).forEach((r,i)=>SFX.tone(r==='hit'?880:r==='near'?660:330,.06,{type:'triangle',vol:.05,delay:i*.09}));
    if(G.done)finish()}};
function finish(){if(G.counted)return;G.counted=true;const S=SD.stats[st.lang];const n=G.guesses.length;
  if(G.won){S.p++;S.w++;S.d[n-1]++;const gain=10+(6-n)*5;SD.coins+=gain;setTimeout(()=>say(`+${gain} 🪙`),400);SFX.win();SD.langs[st.lang]=1;
    ACH.unlock(GAME,'first');if(n<=2)ACH.unlock(GAME,'two');if(n===1)ACH.unlock(GAME,'one');if(n===6)ACH.unlock(GAME,'phew');const w=wins();if(w>=10)ACH.unlock(GAME,'w10');if(w>=50)ACH.unlock(GAME,'w50');if(w>=100)ACH.unlock(GAME,'w100');
    if(SD.langs.tr&&SD.langs.en)ACH.unlock(GAME,'bi');if(SD.coins>=200)ACH.unlock(GAME,'rich');
    if(st.mode==='daily'){const sk=load('wdStreak:'+st.lang)||{n:0};S.max=Math.max(S.max,sk.n);if(sk.n>=3)ACH.unlock(GAME,'st3');if(sk.n>=7)ACH.unlock(GAME,'st7')}
    if(G.rush){R.solved++;R.t+=15;if(R.solved>=5)ACH.unlock(GAME,'r5');if(R.solved>=10)ACH.unlock(GAME,'r10');setTimeout(()=>{if(!R.over)newGame()},900)}}
  else{S.p++;SFX.lose();if(G.rush){say((st.lang==='tr'?'Kelime: ':'The word was ')+G.answer+' (−15s)');R.t-=15;setTimeout(()=>{if(!R.over)newGame()},1500)}}
  sv();draw()}
$('tHint').onclick=()=>{if(!G||G.done)return;if(SD.coins<15){say(st.lang==='tr'?'Yeterli 🪙 yok':'Not enough 🪙');SFX.error();return}
  const a=[...G.answer],known=new Set();for(const g of G.guesses)score(g,G.answer).forEach((r,i)=>{if(r==='hit')known.add(i)});for(const[i]of G.hints)known.add(i);
  const free=a.map((_,i)=>i).filter(i=>!known.has(i));if(!free.length){say('🤔');return}const i=free[Math.random()*free.length|0];G.hints.push([i,a[i]]);SD.coins-=15;SD.hints++;sv();ACH.unlock(GAME,'hint');SFX.power();
  say(st.lang==='tr'?`${i+1}. harf: ${a[i]}`:`Letter ${i+1} is ${a[i]}`);draw()};
$('tStats').onclick=()=>{const S=SD.stats[st.lang],mx=Math.max(1,...S.d);const sk=load('wdStreak:'+st.lang)||{n:0};const tr=st.lang==='tr';
  UI.modal(`<h2>📊 ${tr?'İstatistikler':'Statistics'} (${st.lang.toUpperCase()})</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center">${[[tr?'Oynanan':'Played',S.p],[tr?'Kazanma %':'Win %',S.p?Math.round(S.w/S.p*100):0],[tr?'Seri':'Streak',sk.n||0],[tr?'Hızlı rekor':'Rush best',SD.rushBest[st.lang]||0]].map(([a,b])=>`<div><b style="font:900 22px Orbitron;color:#ffd23f;display:block">${b}</b><small>${a}</small></div>`).join('')}</div>
    <b>${tr?'Tahmin dağılımı':'Guess distribution'}</b><div class="dist">${S.d.map((n,i)=>`<div>${i+1}<i class="${G&&G.won&&G.guesses.length===i+1?'me':''}" style="width:${8+n/mx*85}%">${n}</i></div>`).join('')}</div>
    <p style="margin:0;color:#9a94c9">🕵️ ${PROF.avatar} ${PROF.name} — ${rank()} · ${wins()} ${tr?'vaka çözüldü':'cases solved'} · 💡 ${SD.hints}</p><div style="display:flex;justify-content:flex-end"><button class="kbtn2" data-close>OK</button></div>`)};
$('tAch').onclick=()=>UI.achievements(GAME,'Word Detective');$('tMe').onclick=()=>UI.profileEditor(draw);

/* ================= multiplayer: one board taking turns (together) or the same 3 words (race) ================= */
let MPS=null,MPW=null;
const mpTurn=()=>!MPS||MPS.mode!=='coop'||(G.guesses.length%2===0)===MPS.host;
function mpWord(i){const L=WORDS[MPW.lang].filter(w=>[...w].length===5);return L[(MPW.seed+i*7919)%L.length]}
function mpNew(){G={answer:mpWord(MPW.round),guesses:[],cur:'',done:false,won:false,hints:[],mp:true};draw()}
function mpLabel(){if(!MPS||!G)return;const nm=MPS.peer.name,w=`${st.lang==='tr'?'Kelime':'Word'} ${Math.min(3,MPW.round+1)}/3`;
  $('caseNo').textContent=MPS.mode==='coop'?(G.done?'🤝 '+w:mpTurn()?`🤝 ${w} · 👉 ${st.lang==='tr'?'SIRA SENDE':'YOUR TURN'}`:`🤝 ${w} · ⏳ ${nm}`):`🏁 ${w} · ${MPW.points} ${st.lang==='tr'?'puan':'pts'}`;$('end').hidden=true}
const _draw2=draw;draw=function(){_draw2();if(MPS&&G&&G.mp)mpLabel()};
const _newGame2=newGame;newGame=function(){if(MPS&&MPW)return mpNew();_newGame2()};
let remote=false;
const _press2=press;press=function(k){if(!G||G.done)return;if(MPS&&G.mp&&MPS.mode==='coop'&&!remote&&!mpTurn())return;const n=G.guesses.length;_press2(k);
  if(MPS&&G.mp&&!remote){if(MPS.mode==='coop'){if(G.guesses.length>n)MPS.send('guess',{w:G.guesses[n],n});else MPS.send('cur',{c:G.cur,n})}
    else if(G.guesses.length>n){const pat=score(G.guesses[n],G.answer).map(r=>r==='hit'?'🟩':r==='near'?'🟨':'⬛').join('');MPS.status({score:MPW.points,txt:`${st.lang==='tr'?'kelime':'word'} ${MPW.round+1} · ${pat}`})}}};
const _finish2=finish;finish=function(){const first=!G.counted;_finish2();if(!MPS||!G.mp||!first)return;const n=G.guesses.length,pts=G.won?10+(6-n)*5:0;MPW.points+=pts;if(G.won)MPW.solved++;MPW.round++;
  say(G.won?`+${pts} ${st.lang==='tr'?'puan':'points'}!`:(st.lang==='tr'?'Kelime: ':'The word was ')+G.answer);
  if(MPS.mode==='race')MPS.status({score:MPW.points,txt:`${MPW.solved}/${MPW.round} ${st.lang==='tr'?'çözüldü':'solved'}`});
  if(MPW.round<3)setTimeout(mpNew,1800);else setTimeout(()=>MPS.finish({score:MPW.points,shared:MPS.mode==='coop',txt:`${MPW.solved}/3 ${st.lang==='tr'?'kelime':'words'}`}),1200)};
if(new URLSearchParams(location.search).get('mp')){const w=()=>window.KuzeyAccount&&KuzeyAccount.session?KuzeyAccount.session({hello:()=>({lang:st.lang}),goExtra:()=>({lang:st.lang}),
    start(SS,go){MPS=SS;MPW={lang:go.lang,seed:go.seed%100000,round:0,points:0,solved:0};st.lang=go.lang;stopRush();
      document.querySelectorAll('[data-lang],[data-mode],#tHint').forEach(b=>b.disabled=true);mpNew();
      SS.recv('cur',d=>{if(G&&G.mp&&d.n===G.guesses.length&&!mpTurn()){G.cur=d.c;draw()}});
      SS.recv('guess',d=>{if(!G||!G.mp||G.done||d.n!==G.guesses.length)return;G.cur=d.w;remote=true;try{press('enter')}finally{remote=false}})},
    onLeave(){}}):setTimeout(w,100);w()}
$('tMulti').onclick=()=>{if(window.KuzeyAccount)KuzeyAccount.multiplayer('words')};
if(new URLSearchParams(location.search).has('test'))window.__wd={get G(){return G},press:k=>press(k),SD,st,newGame:()=>newGame(),get MPS(){return MPS},get MPW(){return MPW}};

newGame();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
