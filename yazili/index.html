<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yazılı">
<title>Yazılı Planı</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* A night-time study desk: day chips on top, a stack of task cards for the chosen day, activities open as a full-screen sheet. Dark only, like the rest of the arcade. */
:root{
  --night:#141033; --panel:#1e1849; --panel-hi:#2a2263; --line:#3a3080; --ink:#f4f1ff; --mute:#b1a8db;
  --gold:#ffd166; --good:#6ee7a8; --bad:#ff7a7a;
  --tr:#ff9a76; --fen:#6ee7a8; --en:#7cc7ff; --din:#ffd166; --brk:#f0a6ff;
  --display:'Fredoka', ui-rounded, system-ui, sans-serif; --body:'Nunito', system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(ellipse at 85% -10%,#2b2170 0%,var(--night) 55%) fixed,var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
.mute{color:var(--mute)}
header{padding-block:16px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;color:inherit;text-decoration:none}
.brand img{width:40px;height:40px;border-radius:11px}
.brand h1{font-size:23px}
.brand p{margin:0;font-size:13px;color:var(--mute)}
.next{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-size:14px;line-height:1.3}
.next b{font-family:var(--display);font-weight:600;font-size:16px;display:block}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;margin:12px 0}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer;color:var(--mute)}
.tabs button[aria-selected=true]{background:var(--panel-hi);color:var(--ink)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-bottom:8px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:76px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 10px;text-align:center;cursor:pointer;line-height:1.2}
.day small{display:block;font-size:12px;color:var(--mute)}
.day b{font-family:var(--display);font-size:20px;font-weight:600}
.day .st{display:block;font-size:12px;margin-top:2px;color:var(--gold);min-height:15px}
.day[aria-pressed=true]{background:var(--panel-hi);border-color:var(--gold)}
.day.today small{color:var(--gold);font-weight:800}
.dayhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:10px 0 12px}
.dayhead h2{font-size:26px;margin-right:auto}
.bar{height:10px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line);flex:1 1 160px;max-width:240px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffb347);width:0;transition:width .4s}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px;background:var(--panel);border:1px dashed var(--line)}
.banner b{color:var(--gold)}
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 12px 12px 14px}
.task .chk{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--c);background:none;cursor:pointer;display:grid;place-items:center;font-size:18px;color:#141033}
.task.done .chk{background:var(--c)}
.task.done .chk::after{content:"✓";font-weight:800}
.task .body{flex:1;min-width:0}
.task .sub{font-size:13px;font-weight:800;color:var(--c)}
.task h3{font-size:18px}
.task p{margin:2px 0 0;font-size:14px;color:var(--mute)}
.task.done h3{text-decoration:line-through;text-decoration-color:var(--c);opacity:.75}
.go{flex:0 0 auto;border:0;border-radius:12px;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer;background:var(--c);color:#141033}
.btn{border:0;border-radius:12px;padding:11px 18px;font-family:var(--display);font-weight:600;font-size:17px;cursor:pointer;background:var(--gold);color:#241a00}
.btn.quiet{background:var(--panel-hi);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.group{margin-bottom:18px}
.group h2{font-size:21px;margin-bottom:8px;color:var(--c)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.set{text-align:left;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:12px;cursor:pointer}
.set b{font-family:var(--display);font-weight:600;font-size:17px;display:block}
.set span{font-size:13px;color:var(--mute)}
.exam{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.exam .when{flex:0 0 92px;font-family:var(--display);line-height:1.2}
.exam .when b{font-size:18px;font-weight:600;display:block}
.exam .when span{font-size:13px;color:var(--mute)}
.exam h3{font-size:18px}
.exam p{margin:0;font-size:14px;color:var(--mute)}
.exam.past{opacity:.55}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--panel-hi);color:var(--mute);margin-left:6px;vertical-align:2px}
.tag.cd{background:var(--gold);color:#241a00}
.donelist{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
/* activity sheet */
.sheet{position:fixed;inset:0;background:var(--night);z-index:10;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.sheet header{position:sticky;top:0;background:var(--night);z-index:2;border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:16px}
.sheet header .wrap{display:flex;align-items:center;gap:10px;width:100%}
.sheet header h2{font-size:20px;margin-right:auto;color:var(--c)}
.x{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:800}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:16px}
.notes h3{font-size:19px;color:var(--c);margin:6px 0 4px}
.notes ul{margin:4px 0 8px;padding-left:20px}
.notes li{margin:3px 0}
.notes .ex{color:var(--mute);font-style:italic}
.progress{font-size:14px;color:var(--mute);margin-bottom:8px}
.passage{background:#fff8e8;color:#2a2340;border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:16px}
.visual{font-size:46px;text-align:center;background:var(--panel);border-radius:14px;padding:10px;margin-bottom:12px;line-height:1.3}
.visual small{display:block;font-size:16px;font-weight:800;color:var(--gold)}
.q{font-family:var(--display);font-weight:500;font-size:22px;margin-bottom:14px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:13px 16px;cursor:pointer;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt.right{border-color:var(--good);background:#1c4a3d}
.opt.wrong{border-color:var(--bad);background:#4d1f33}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;border-radius:14px;padding:12px 16px;font-size:16px}
.feedback.ok{background:#1c4a3d}
.feedback.no{background:#4d1f33}
.result{text-align:center;padding:20px 0}
.result .big{font-family:var(--display);font-size:64px;font-weight:700;color:var(--gold);line-height:1}
.result p{font-size:18px}
.card3d{perspective:1200px;margin:6px auto 16px;max-width:520px;cursor:pointer}
.flip{position:relative;height:250px;transition:transform .45s;transform-style:preserve-3d}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:grid;place-items:center;text-align:center;padding:20px;font-size:20px}
.face.f{background:var(--panel-hi);border:2px solid var(--c);font-family:var(--display);font-size:30px;font-weight:600}
.face.b{background:#fff8e8;color:#2a2340;transform:rotateY(180deg)}
.hint{text-align:center;font-size:14px;color:var(--mute);margin-bottom:12px}
.center{justify-content:center}
.play{display:grid;place-items:center;width:110px;height:110px;margin:10px auto;border-radius:50%;border:0;background:var(--c);color:#141033;font-size:44px;cursor:pointer}
.timer{font-family:var(--display);font-size:72px;font-weight:700;text-align:center;color:var(--brk);line-height:1;margin:10px 0}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.games a{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:600;text-align:center}
.games a span{display:block;font-size:30px}
.xp{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.xp b{font-family:var(--display);font-weight:600;color:var(--gold)}
.xpbar{width:64px;height:8px;background:var(--panel-hi);border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--gold);color:#241a00;font-family:var(--display);font-weight:600;font-size:18px;padding:10px 20px;border-radius:99px;z-index:30;box-shadow:0 6px 24px #0008}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.gap{display:inline-block;min-width:2.6em;border-bottom:3px solid var(--c);color:var(--c);line-height:1.1}
.sortcard{background:#fff8e8;color:#2a2340;border-radius:18px;padding:24px 20px;font-size:21px;font-family:var(--display);font-weight:500;text-align:center;margin:4px 0 16px;line-height:1.35}
.sortcard .gap{border-color:#6b4fe0;color:#6b4fe0}
.sortcard.ok{box-shadow:0 0 0 4px var(--good)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bucket{border:2px solid var(--c);background:var(--panel);border-radius:16px;padding:16px 10px;font-family:var(--display);font-weight:600;font-size:19px;cursor:pointer}
.bucket:hover:not([disabled]){background:var(--panel-hi)}
.bucket.right{background:#1c4a3d;border-color:var(--good)}
.bucket.wrong{background:#4d1f33;border-color:var(--bad)}
.bucket[disabled]{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;cursor:pointer;font-size:16px;min-height:58px;overflow-wrap:anywhere;transition:opacity .3s}
.mt.sel{border-color:var(--gold);background:var(--panel-hi)}
.mt.done{border-color:var(--good);background:#1c4a3d;opacity:.45;cursor:default}
.mt.wrong{border-color:var(--bad);background:#4d1f33}
.speedhud{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:6px}
.speedhud .pts{text-align:right;font-size:15px}
.speedhud b{font-family:var(--display);font-size:36px;color:var(--gold);font-variant-numeric:tabular-nums}
.timer.small{font-size:56px;margin:0;color:var(--c);font-variant-numeric:tabular-nums}
.tbar{height:8px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:18px}
.tbar i{display:block;height:100%;background:var(--c);width:100%}
.opts.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.opt.big{text-align:center;font-family:var(--display);font-weight:600;font-size:19px;padding:18px 12px}
.typeform{display:flex;gap:8px;flex-wrap:wrap}
.typeform input{flex:1 1 220px;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:19px;color:var(--ink)}
.typeform input:focus{border-color:var(--c);outline:none}
.linkbtn{background:none;border:0;color:var(--c);text-decoration:underline;cursor:pointer;padding:10px 0;font-weight:700}
.ordered{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:12px 12px 12px 40px;min-height:56px;margin:0 0 14px}
.ordered li{padding:3px 0;font-weight:700;color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c);background:var(--panel);border-radius:99px;padding:10px 16px;cursor:pointer;font-size:16px;text-align:left}
.chip.wrong{border-color:var(--bad);background:#4d1f33}
.clock{width:210px;max-width:100%;display:block;margin:0 auto}
.clock .cface{fill:#fff8e8;stroke:var(--c);stroke-width:4}
.clock .ticks line{stroke:#2a2340}
.clock .nums text{font:600 17px var(--display);fill:#2a2340;text-anchor:middle}
.clock .hh{stroke:#2a2340;stroke-width:7;stroke-linecap:round}
.clock .mh{stroke:#e2553f;stroke-width:4;stroke-linecap:round}
.clock .pin{fill:#2a2340}
.digital{font-family:var(--display);font-size:64px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;padding:10px 0}
.tabs button{position:relative;font-size:15px;padding:9px 2px}
.tabs button.dot::after{content:"";position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--panel)}
.petmini{font-size:22px;line-height:1}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.lesson h2{font-size:24px;color:var(--c)}
.lesson p,.lesson ul,.lesson ol{margin:0}
.lesson ul,.lesson ol{padding-left:22px;display:flex;flex-direction:column;gap:5px}
.lesson .ex{color:var(--mute);font-style:italic}
.lesson blockquote{margin:0;border-left:4px solid var(--c);padding:8px 14px;background:var(--panel-hi);border-radius:0 12px 12px 0;font-size:18px}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.cards4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.box{background:var(--panel-hi);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.box b:first-child{font-family:var(--display);font-weight:600;font-size:17px;color:var(--c)}
.box ul{padding-left:18px}
.tblwrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--panel-hi);font-family:var(--display);font-weight:600;color:var(--c)}
.tip{background:#3d3410;border:1px solid #6b5a14;border-radius:12px;padding:10px 14px;color:#ffe8a3;margin:0}
.steps li::marker{color:var(--c);font-weight:800}
.big-mnemonic{font-family:var(--display);font-size:26px;font-weight:600;text-align:center;color:var(--gold);margin:8px 0}
.teeth{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.teeth div{background:var(--panel-hi);border-radius:12px;padding:10px 6px;font-size:14px}
.teeth span{display:block;font-size:30px}
.cycle{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;text-align:center;font-family:var(--display);font-weight:600;font-size:18px}
.cycle .arr{font-size:13px;color:var(--c);font-family:var(--body);font-weight:700;line-height:1.5}
.chips.static span{border:1px solid var(--c);border-radius:99px;padding:5px 12px;font-size:15px}
.dots{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:13px;color:var(--mute)}
.dots i{width:26px;height:6px;border-radius:99px;background:var(--panel-hi)}
.dots i.past{background:var(--c);opacity:.5}.dots i.now{background:var(--c)}
.dots span{margin-left:6px}
.widget{background:var(--night);border:2px solid var(--c);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wtitle{font-family:var(--display);font-weight:600;color:var(--c);font-size:17px}
.widget canvas{width:100%;height:auto;background:#0d0a26;border-radius:10px}
.btn.small{padding:7px 12px;font-size:15px;border-radius:10px}
.deda{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.deda .s{font-weight:800;min-width:150px}
.good{color:var(--good)}.badc{color:var(--tr)}
.journey{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.journey li{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:2px 8px;padding:6px 10px;border-radius:10px;opacity:.45}
.journey li .ic{font-size:22px;grid-row:span 2}
.journey li p{grid-column:2;margin:0;font-size:15px}
.journey li.past{opacity:.7}
.journey li.now{opacity:1;background:var(--panel-hi);outline:2px solid var(--c)}
.platebox{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:14px;align-items:center}
.plate{width:100%;max-width:220px}
.plate path{cursor:pointer;stroke:var(--night);stroke-width:2;transition:opacity .2s}
.plate path.dim{opacity:.35}
.plateinfo p{margin:4px 0 0}
.wq{font-size:19px;text-align:center;margin:4px 0}
.wans{font-size:18px;text-align:center;border-radius:12px;padding:10px}
.wans.w{background:#163652}.wans.g{background:#1c4a3d}
.tline{width:100%;height:auto}
.tline .axis{stroke:var(--mute);stroke-width:3}
.tline .long{fill:var(--en);opacity:.85}
.tline .short{stroke:var(--gold);stroke-width:5;stroke-linecap:round}
.tline text{fill:var(--ink);font:15px var(--body)}
.tline .lab{font-weight:800}
.tline .lab2{fill:var(--gold);font-weight:800}
.phrase{text-align:center;font-size:22px;font-family:var(--display);margin:0}
.verse{display:grid;grid-template-columns:32px 1fr;gap:4px 10px;text-align:left;background:var(--panel-hi);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:17px}
.verse .n{grid-row:span 2;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:#141033;font-weight:800}
.verse .m{color:var(--gold)}
.verse.open{border-color:var(--c)}
.checkq{margin-top:16px;background:var(--panel);border:2px dashed var(--c);border-radius:18px;padding:16px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--c);margin-bottom:6px}
.lessonnav{margin-top:16px;justify-content:flex-end}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lessoncard.done{opacity:.75}
.petcard{display:flex;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.petcard .pet{font-size:76px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.petcard h2{font-size:24px;color:var(--gold)}
.petcard p{margin:2px 0}
.bar.wide{max-width:none;margin:6px 0}
.bar.wide i{width:0}
@keyframes bob{50%{transform:translateY(-6px)}}
.chestrow{margin-bottom:18px}

.chest .ce{font-size:54px;animation:bob 1.2s ease-in-out infinite}
.chest.off{border-style:dashed;border-color:var(--line);background:var(--panel);cursor:default;text-align:center}
.chest.off .ce{animation:none;filter:grayscale(1);opacity:.5}
.sech{font-size:21px;margin:6px 0 10px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:2px;opacity:.55}
.badge span{font-size:34px}
.badge b{font-family:var(--display);font-weight:600}
.badge small{color:var(--mute);font-size:12px}
.badge.got{opacity:1;border-color:var(--gold);background:var(--panel-hi)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.stk{aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-size:34px;background:var(--panel);border:2px dashed var(--line);border-radius:14px;color:var(--mute);position:relative}
.stk.got{border-style:solid;border-color:var(--line);background:var(--panel-hi);color:var(--ink)}
.stk.rare.got{border-color:var(--gold);box-shadow:0 0 14px #ffd16666}
.stk small{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:800;color:var(--gold)}
.chestopen{text-align:center;padding-top:20px}
.bigchest{font-size:110px;cursor:pointer;display:inline-block;user-select:none}
.reveal{display:grid;grid-template-columns:repeat(3,minmax(0,110px));justify-content:center;gap:12px;margin-top:10px}
.reveal .stk{font-size:56px}
.pop{animation:pop .5s backwards}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

"fen-gas":{s:"fen",kind:"quiz",title:"Gases",
notes:`<h3>Solids, liquids and gases</h3><ul>
<li><b>Solid:</b> fixed shape, fixed volume. Particles packed tightly and only vibrate.</li>
<li><b>Liquid:</b> fixed volume, but it takes the shape of its container. Particles close but slide past each other.</li>
<li><b>Gas:</b> no fixed shape, no fixed volume. Particles are <b>far apart</b> and move <b>quickly in all directions</b>.</li></ul>
<h3>Properties of gases</h3><ul>
<li>A gas <b>spreads out to fill</b> any container.</li>
<li>A gas can be <b>squashed (compressed)</b> because there is lots of space between particles.</li>
<li>Gases <b>flow</b> and <b>have mass</b>: a pumped-up ball is heavier than a flat one.</li>
<li><b>Diffusion:</b> gas particles spread out, so a smell travels across a room.</li>
<li>Examples: oxygen, carbon dioxide, water vapour, helium. <b>Air</b> is a mixture of gases.</li>
<li><b>Evaporation:</b> liquid → gas. <b>Condensation:</b> gas → liquid.</li></ul>`,

 {q:"Which sentence describes the particles in a gas?",o:["They are far apart and move quickly in all directions.","They are packed tightly and only vibrate.","They are close together and slide past each other.","They do not move at all."],e:"Gas particles have big gaps and move fast."},
 {q:"Why can a gas be squashed (compressed)?",o:["There is a lot of space between its particles.","Its particles are very hard.","It has a fixed shape.","It is always hot."],e:"The particles can be pushed closer together."},
 {q:"You put some gas in a closed jar. What happens?",o:["It spreads out to fill the whole jar.","It stays at the bottom.","It makes a fixed shape.","It turns into a solid."],e:"Gases fill any container."},
 {q:"Which one is a gas at room temperature?",o:["Oxygen","Ice","Milk","Sand"],e:"Ice and sand are solids; milk is a liquid."},
 {q:"Someone opens a bottle of perfume in a corner. Soon you can smell it across the room. Why?",o:["Gas particles spread out (diffusion).","The perfume turns into a solid.","Sound carries the smell.","The bottle gets bigger."],e:"This spreading is called diffusion."},
 {q:"Does air have mass?",o:["Yes – a pumped-up ball is heavier than a flat ball.","No – air weighs nothing.","Only cold air has mass.","Only when it is wet."],e:"All gases have mass."},
 {q:"Water changing into water vapour is called…",o:["evaporation","condensation","melting","freezing"],e:"Liquid → gas = evaporation."},
 {q:"Which state has a fixed volume but no fixed shape?",o:["Liquid","Solid","Gas","None of them"],e:"Liquids take the shape of their container but keep their volume."},
 {q:"Which gas do we breathe out more of?",o:["Carbon dioxide","Oxygen","Helium","Water"],e:"We breathe in oxygen and breathe out carbon dioxide."}
]},
"fen-digest":{s:"fen",kind:"quiz",title:"The digestive system",
notes:`<h3>The journey of food</h3><p><b>mouth → oesophagus → stomach → small intestine → large intestine → rectum → anus</b></p><ul>
<li><b>Mouth:</b> teeth break food into small pieces. <i>Incisors</i> cut, <i>canines</i> tear, <i>molars</i> grind. <b>Saliva</b> makes food soft and wet and starts digestion.</li>
<li><b>Oesophagus</b> (food pipe): muscles squeeze food down to the stomach.</li>
<li><b>Stomach:</b> a muscly bag that churns food. Its <b>acid</b> kills germs and helps digest food.</li>
<li><b>Small intestine:</b> the longest part. Digested food (<b>nutrients</b>) is <b>absorbed into the blood</b>.</li>
<li><b>Large intestine:</b> <b>water is absorbed</b>.</li>
<li><b>Rectum</b> stores waste; it leaves the body through the <b>anus</b>.</li>
<li><b>Liver</b> and <b>pancreas</b> make juices that help digestion.</li>
<li><b>Digestion</b> = breaking food down into small pieces the body can absorb.</li></ul>`,
qs:[
 {q:"What is the correct order?",o:["mouth → oesophagus → stomach → small intestine → large intestine","mouth → stomach → oesophagus → large intestine → small intestine","oesophagus → mouth → stomach → small intestine → large intestine","mouth → small intestine → stomach → oesophagus → large intestine"],e:"Learn the order: mouth, oesophagus, stomach, small intestine, large intestine, rectum, anus."},
 {q:"Where are nutrients absorbed into the blood?",o:["Small intestine","Large intestine","Oesophagus","Mouth"],e:"The small intestine absorbs digested food."},
 {q:"What is the main job of the large intestine?",o:["To absorb water","To chew food","To make saliva","To kill germs with acid"],e:"Water is absorbed in the large intestine."},
 {q:"What does saliva do?",o:["Makes food soft and wet and starts digestion","Absorbs nutrients","Pushes food down to the stomach","Stores waste"],e:"Saliva is made in the mouth."},
 {q:"Which teeth grind and chew food?",o:["Molars","Incisors","Canines","None"],e:"Incisors cut, canines tear, molars grind."},
 {q:"What does the oesophagus do?",o:["Carries food from the mouth to the stomach","Absorbs water","Makes acid","Removes waste"],e:"It is the food pipe."},
 {q:"Why does the stomach contain acid?",o:["To kill germs and help digest food","To absorb water","To make teeth strong","To push food out"],e:"Acid kills germs and breaks down food."},
 {q:"Digestion means…",o:["breaking food down so the body can absorb it","only chewing food","drinking water","breathing in oxygen"],e:"Food must be broken into tiny pieces to enter the blood."}
]},
"fen-diet":{s:"fen",kind:"quiz",title:"Balanced diet",
notes:`<h3>Nutrients and their jobs</h3><ul>
<li><b>Carbohydrates</b> – give us <b>energy</b>: bread, rice, pasta, potatoes.</li>
<li><b>Proteins</b> – help us <b>grow and repair</b> the body: meat, fish, eggs, beans, lentils.</li>
<li><b>Fats</b> – store energy and keep us warm: butter, oil, cheese, nuts (eat small amounts).</li>
<li><b>Vitamins and minerals</b> – keep us <b>healthy</b>: fruit and vegetables. <b>Calcium</b> (milk, yoghurt, cheese) makes bones and teeth strong.</li>
<li><b>Fibre</b> – helps food <b>move through the intestines</b>: wholegrain bread, fruit, vegetables.</li>
<li><b>Water</b> – every part of the body needs it.</li></ul>
<p>A <b>balanced diet</b> has all of these in the <b>right amounts</b>. Too much sugar → tooth decay; too much fat and sugar → weight gain.</p>`,
qs:[
 {q:"What is the main job of proteins?",o:["Growth and repair","Giving quick energy","Helping food move through the gut","Keeping us cool"],e:"Proteins build and repair the body."},
 {q:"Which food is rich in carbohydrates?",o:["Pasta","Fish","Butter","Lettuce"],e:"Pasta, bread, rice and potatoes give energy."},
 {q:"Fibre helps us…",o:["move food through the intestines","grow taller","see in the dark","make saliva"],e:"Fibre keeps digestion working well."},
 {q:"Which mineral makes bones and teeth strong?",o:["Calcium","Sugar","Fat","Fibre"],e:"Milk, yoghurt and cheese contain calcium."},
 {q:"What is a balanced diet?",o:["Eating all the nutrient groups in the right amounts","Eating only fruit","Eating a lot of one food","Never eating fat"],e:"Balance = every group, right amounts."},
 {q:"Which lunch is the most balanced?",o:["Grilled chicken, rice, salad and an orange","Chips, crisps and cola","Cake and chocolate milk","Only bread and butter"],e:"It has protein, carbohydrate, vitamins and fibre."},
 {q:"Eating too much sugar can cause…",o:["tooth decay","strong bones","better eyesight","more fibre"],e:"Sugar feeds the bacteria that damage teeth."},
 {q:"Fruit and vegetables mainly give us…",o:["vitamins, minerals and fibre","mostly fat","mostly protein","nothing useful"],e:"Eat lots of fruit and vegetables!"}
]},

"en-verbs":{s:"en",kind:"quiz",title:"Stative and action verbs",
notes:`<h3>Action verbs</h3><p>Things we <b>do</b>: run, swim, cook, write, play. They can be in the continuous form: <i>I <b>am cooking</b> now.</i></p>
<h3>Stative verbs</h3><p>Feelings, thoughts, senses and owning: <b>know, like, love, hate, want, need, believe, understand, think</b> (= opinion), <b>own, have</b> (= own), <b>seem, taste, smell</b>.</p>
<p>We usually <b>don't</b> use them with -ing: ✔ <i>I <b>know</b> the answer.</i> ✘ <i>I am knowing the answer.</i></p>`,
qs:[
 {q:"I ___ this song. It's great!",o:["love","am loving","loving","am love"],e:"“love” is stative → present simple."},
 {q:"Look! The children ___ in the river.",o:["are swimming","swim","swims","swimming"],e:"“Look!” = happening now, and swim is an action verb."},
 {q:"Which one is a stative verb?",o:["know","run","write","jump"],e:"know = a thought, not an action."},
 {q:"She ___ the answer.",o:["knows","is knowing","know","knowing"],e:"Stative verb, present simple, she → knows."},
 {q:"We ___ a new tent for the camping trip.",o:["need","are needing","needing","needs"],e:"need is stative."},
 {q:"Which sentence is correct?",o:["This soup tastes delicious.","This soup is tasting delicious.","This soup taste delicious.","This soup tasting delicious."],e:"taste (= has a flavour) is stative."},
 {q:"Right now, my dad ___ dinner.",o:["is cooking","cooks","cook","cooking"],e:"“Right now” + action verb → present continuous."},
 {q:"I ___ you are right.",o:["think","am thinking","thinking","thinks"],e:"think = opinion → stative."}
]},
"en-past":{s:"en",kind:"quiz",title:"Past simple & past continuous",
notes:`<h3>Past simple</h3><p>A finished action: <i>I <b>visited</b> my grandma yesterday.</i> Irregular: go → <b>went</b>, see → <b>saw</b>, have → <b>had</b>, ring → <b>rang</b>. Negative/question: <b>didn't + verb</b>, <b>Did … + verb?</b></p>
<h3>Past continuous</h3><p>An action in progress in the past: <b>was/were + -ing</b>. <i>At 8 pm we <b>were watching</b> TV.</i></p>
<h3>Together</h3><p>Long action (past continuous) interrupted by a short one (past simple):<br><i>I <b>was reading</b> <u>when</u> the phone <b>rang</b>.</i> · <i><u>While</u> she <b>was walking</b> home, it <b>started</b> to rain.</i></p>`,
qs:[
 {q:"Yesterday I ___ to the park.",o:["went","go","was go","goed"],e:"go → went."},
 {q:"I was reading when the phone ___.",o:["rang","was ringing","rings","ring"],e:"Short interrupting action → past simple."},
 {q:"At 8 pm last night, we ___ TV.",o:["were watching","watched","are watching","was watching"],e:"In progress at a past time; we → were."},
 {q:"While she ___ home, it started to rain.",o:["was walking","walked","were walking","walks"],e:"While + long action → past continuous; she → was."},
 {q:"Did you ___ the film last night?",o:["see","saw","seen","seeing"],e:"Did + base verb."},
 {q:"They ___ football when the teacher came.",o:["were playing","was playing","played","plays"],e:"They → were + -ing."},
 {q:"We ___ go to school last Sunday.",o:["didn't","don't","weren't","wasn't"],e:"Past simple negative: didn't + verb."},
 {q:"When I ___ at the station, the train was leaving.",o:["arrived","was arriving","arrive","arrives"],e:"Short action → past simple."},
 {q:"Which sentence is in the past continuous?",o:["He was sleeping.","He slept.","He sleeps.","He is sleeping."],e:"was/were + -ing."}
]},
"en-cond":{s:"en",kind:"quiz",title:"Conditionals, future, goals & jobs",
notes:`<h3>First conditional – real, possible</h3><p><b>If + present simple, will + verb</b>: <i>If it rains tomorrow, we <b>will stay</b> at home.</i></p>
<h3>Second conditional – imaginary, unlikely</h3><p><b>If + past simple, would + verb</b>: <i>If I <b>had</b> a million dollars, I <b>would buy</b> a farm.</i> · <i>If I <b>were</b> a bird, I would fly.</i></p>
<h3>Future</h3><ul><li><b>be going to</b> – plans already decided, or predictions with proof: <i>Look at the clouds! It's <b>going to</b> rain.</i></li>
<li><b>will</b> – predictions/opinions: <i>I think robots <b>will</b> clean our houses.</i></li></ul>
<h3>Goals & jobs</h3><p><i>goal, dream, achieve, work hard, vet, architect, engineer, pilot, astronaut, scientist, doctor, chef, journalist</i></p>`,
qs:[
 {q:"If it rains tomorrow, we ___ at home.",o:["will stay","would stay","stayed","stay"],e:"First conditional: if + present, will + verb."},
 {q:"If I had a million dollars, I ___ a big house.",o:["would buy","will buy","buy","bought"],e:"Second conditional: if + past, would + verb."},
 {q:"If I ___ a bird, I would fly to Paris.",o:["were","am","will be","be"],e:"Second conditional: If I were…"},
 {q:"If you study hard, you ___ the exam.",o:["will pass","would pass","passed","passing"],e:"Real possibility → first conditional."},
 {q:"Which sentence is a second conditional?",o:["If I won the lottery, I would travel the world.","If it is sunny, we will go swimming.","I will call you tomorrow.","If you heat ice, it melts."],e:"if + past simple, would + verb."},
 {q:"Look at those dark clouds! It ___ rain.",o:["is going to","would","rains","rained"],e:"A prediction with proof → going to."},
 {q:"I've decided. I ___ be a vet when I grow up.",o:["am going to","would","was","am"],e:"A plan already decided → going to."},
 {q:"I think people ___ live on Mars one day.",o:["will","are","would","did"],e:"An opinion about the future → will."},
 {q:"A person who looks after sick animals is a…",o:["vet","pilot","chef","journalist"],e:"vet = veteriner."},
 {q:"A person who designs buildings is an…",o:["architect","astronaut","engineer","author"],e:"architect = mimar."}
]},

"en-school":{s:"en",kind:"quiz",title:"School life, likes & telling time",
notes:`<h3>Obligations</h3><ul><li><b>have to / must</b> – it's necessary: <i>We <b>have to</b> wear a uniform.</i></li>
<li><b>mustn't</b> – it's not allowed: <i>You <b>mustn't</b> run in the corridors.</i></li>
<li><b>don't have to</b> – it's not necessary: <i>We <b>don't have to</b> bring lunch.</i></li></ul>
<h3>Likes and dislikes (+ -ing)</h3><p>love ❤️ · like / enjoy 🙂 · don't mind 😐 · don't like 🙁 · hate / can't stand 😖<br><i>I <b>enjoy reading</b>. She <b>can't stand getting</b> up early.</i></p>
<h3>Telling the time</h3><p>9:15 = <b>quarter past</b> nine · 3:30 = <b>half past</b> three · 7:45 = <b>quarter to</b> eight · 10:10 = ten past ten · 4:50 = ten to five</p>
<h3>Present simple</h3><p>Routines and facts: <i>Tom <b>goes</b> to school by bus every day.</i> (he/she/it + -s)</p>`,
qs:[
 {q:"Students ___ wear a uniform at our school. It's a rule.",o:["have to","don't have to","mustn't","can't stand"],e:"A rule → have to / must."},
 {q:"You ___ run in the corridors. It's dangerous.",o:["mustn't","have to","don't have to","must"],e:"Not allowed → mustn't."},
 {q:"We ___ bring lunch. The school gives us food.",o:["don't have to","mustn't","have to","must"],e:"Not necessary → don't have to."},
 {q:"Where do you borrow books at school?",o:["Library","Canteen","Gym","Playground"],e:"library = kütüphane."},
 {q:"Where do students eat lunch?",o:["Canteen","Science lab","Library","Headteacher's office"],e:"canteen = yemekhane."},
 {q:"Who is in charge of the whole school?",o:["The headteacher","The caretaker","The school nurse","The cook"],e:"headteacher = okul müdürü."},
 {q:"I love ___ maths problems.",o:["solving","solve","to solved","solves"],e:"love + -ing."},
 {q:"She can't stand ___ up early.",o:["getting","get","gets","got"],e:"can't stand + -ing."},
 {q:"It's 7:45. What time is it?",o:["It's quarter to eight.","It's quarter past seven.","It's half past seven.","It's quarter to seven."],e:"15 minutes before eight."},
 {q:"It's 3:30. What time is it?",o:["It's half past three.","It's half past four.","It's quarter past three.","It's three to thirty."],e:"30 minutes after three."},
 {q:"It's 9:15. What time is it?",o:["It's quarter past nine.","It's quarter to nine.","It's half past nine.","It's nine to fifteen."],e:"15 minutes after nine."},
 {q:"Tom ___ to school by bus every day.",o:["goes","go","is go","going"],e:"Routine, he → goes."},
 {q:"In which lesson do you study maps and countries?",o:["Geography","History","Maths","Music"],e:"geography = coğrafya."},
 {q:"You use a ___ to draw straight lines.",o:["ruler","rubber","sharpener","glue stick"],e:"ruler = cetvel."}
]},

"din-duzen":{s:"din",kind:"quiz",title:"Evrendeki düzen ve Allah’ın birliği",
notes:`<h3>Evrende mükemmel bir düzen var</h3><ul>
<li>Güneş her gün doğar ve batar; gece ile gündüz birbirini izler.</li>
<li>Mevsimler sırayla gelir; Ay’ın evreleri hep aynı düzende tekrarlanır.</li>
<li>Dünya, Güneş’e canlıların yaşayabileceği kadar uzaklıktadır. Daha yakın olsa çok sıcak, daha uzak olsa çok soğuk olurdu.</li>
<li>Vücudumuzda kalp durmadan çalışır; her organın bir görevi vardır.</li></ul>
<h3>Akıl yürütme</h3><ul>
<li>Bir resim bir ressamı, bir bina bir mimarı gösterir. Evrendeki bu düzen de kendiliğinden olamaz; onu yaratan <b>Allah</b>’ı gösterir.</li>
<li>Düzenin hiç bozulmadan sürmesi, yaratıcının <b>bir</b> olduğunu gösterir: “Eğer yerde ve gökte Allah’tan başka ilahlar olsaydı, ikisinin de düzeni bozulurdu.” <span class="ex">(Enbiyâ suresi, 22. ayet)</span></li>
<li>Allah’ın bir olduğuna inanmaya <b>tevhid</b> denir.</li></ul>`,
qs:[
 {q:"Hangisi evrendeki düzene örnek <b>değildir</b>?",o:["Odamızın dağınık olması","Mevsimlerin sırayla gelmesi","Gece ve gündüzün oluşması","Kalbimizin düzenli atması"],e:"Dağınık oda insanın yaptığı bir şeydir, evrendeki düzene örnek değildir."},
 {q:"“Bir resim ressamını, bir bina mimarını gösterir.” Bu düşünce ne anlatmak için kullanılır?",o:["Evrendeki düzenin bir yaratıcısı olduğunu","Resim yapmanın zor olduğunu","Binaların çok büyük olduğunu","Herkesin ressam olabileceğini"],e:"Düzen, onu yapan birinin varlığını gösterir."},
 {q:"Evrendeki düzenin hiç bozulmadan devam etmesi neyi gösterir?",o:["Allah’ın bir (tek) olduğunu","Evrenin kendiliğinden oluştuğunu","Güneş’in çok büyük olduğunu","Düzenin bir gün biteceğini"],e:"Birden fazla yaratıcı olsaydı düzen bozulurdu."},
 {q:"“Eğer yerde ve gökte Allah’tan başka ilahlar olsaydı, ikisinin de düzeni bozulurdu.” (Enbiyâ, 22) Bu ayet hangi konuyu vurgular?",o:["Allah’ın birliğini","Mevsimleri","Güneş sistemini","Yağmurun önemini"],e:"Ayet tevhidi, yani Allah’ın birliğini anlatır."},
 {q:"Allah’ın bir olduğuna inanmaya ne denir?",o:["Tevhid","İhlas","Esmaü’l-Hüsna","Dua"],e:"Tevhid = birleme, Allah’ı bir bilme."},
 {q:"Dünya Güneş’e şimdikinden çok daha yakın olsaydı ne olurdu?",o:["Çok sıcak olur, canlılar yaşayamazdı.","Hiçbir şey değişmezdi.","Daha çok kar yağardı.","Geceler uzardı."],e:"Dünya’nın Güneş’e uzaklığı bile bu düzenin bir parçasıdır."},
 {q:"Hangisi bir akıl yürütme örneğidir?",o:["“Kumda ayak izleri var, buradan biri geçmiş olmalı.”","“Bugün hava güzel.”","“Elmayı çok severim.”","“Okul saat dokuzda başlar.”"],e:"Gördüğümüz bir izden onu yapanın varlığına ulaşırız."}
]},

"en-will":{s:"en",kind:"quiz",title:"Will or be going to?",
notes:`<h3>will + verb</h3><ul>
<li><b>Predictions and opinions</b> (often with <i>I think, I'm sure, maybe, probably</i>): <i>I think it <b>will</b> be sunny tomorrow.</i></li>
<li><b>Decisions you make right now</b>: <i>The phone is ringing. I<b>'ll</b> answer it!</i></li>
<li><b>Promises and offers</b>: <i>I <b>won't</b> tell anyone. · I<b>'ll</b> help you with your bag.</i></li>
<li><b>Future facts</b>: <i>I <b>will</b> be 11 next year.</i></li></ul>
<h3>be going to + verb</h3><ul>
<li><b>Plans you already made</b>: <i>We<b>'re going to</b> visit Cappadocia in July. We've booked the hotel.</i></li>
<li><b>Predictions with proof you can see now</b>: <i>Look at those black clouds! It<b>'s going to</b> rain.</i></li></ul>
<h3>Forms</h3><p>I <b>will</b> go · I <b>won't</b> go · <b>Will</b> you go?<br>I <b>am / 'm going to</b> go · She <b>is / 's going to</b> go · They <b>are / 're going to</b> go · She <b>isn't going to</b> go · <b>Are</b> you <b>going to</b> go?</p>
<p class="ex">Trick: Is there a plan or proof? → going to. Deciding now, promising, offering, guessing? → will.</p>`,
qs:[
 {q:"“I'm thirsty.” “Wait, I ___ get you some water.”",o:["'ll","'m going to","going to","am"],e:"An offer / a decision made now → will."},
 {q:"We ___ visit Cappadocia next summer. We've already booked the hotel.",o:["are going to","will","going to","are will"],e:"A plan already made → going to."},
 {q:"Look at that boy on the wall! He ___ fall!",o:["is going to","will","going","is will"],e:"You can see it now (proof) → going to."},
 {q:"I think it ___ be sunny tomorrow.",o:["will","is going","are going to","going to"],e:"“I think” + prediction → will."},
 {q:"Don't worry, I ___ tell anyone your secret.",o:["won't","am not going","not will","don't"],e:"A promise → will / won't."},
 {q:"Maybe people ___ live on the Moon in 2100.",o:["will","are going to","going to","is going to"],e:"A guess about the far future → will."},
 {q:"“What are your plans for the weekend?” “I ___ clean my room.”",o:["'m going to","'ll","will to","going"],e:"Plans → going to."},
 {q:"“The phone is ringing!” “I ___ answer it!”",o:["'ll","'m going to","am","going to"],e:"Deciding right now → will."},
 {q:"She has bought flour and eggs. She ___ make a cake.",o:["is going to","will","are going to","going to"],e:"Plan with proof (she bought the things) → going to."},

notes:`<h3>Telling the time</h3><p>Minutes 1–30 → <b>past</b> this hour. Minutes 31–59 → <b>to</b> the next hour.</p><ul>
<li>9:00 = nine <b>o'clock</b></li><li>9:05 = five past nine · 9:10 = ten past nine</li><li>9:15 = <b>quarter past</b> nine</li><li>9:20 = twenty past nine · 9:25 = twenty-five past nine</li>
<li>9:30 = <b>half past</b> nine</li><li>9:35 = twenty-five to ten · 9:40 = twenty to ten</li><li>9:45 = <b>quarter to</b> ten</li><li>9:50 = ten to ten · 9:55 = five to ten</li></ul>
<p class="ex">On the clock: the short hand shows the hour, the long red hand shows the minutes.</p>`},

 {h:"de / da: ayrı mı, bitişik mi?",html:`<p>Türkçede iki farklı “de” var ve ikisi çok karışır:</p>

<p><b>Çıkar testi:</b> “de”yi cümleden çıkar. Cümle hâlâ düzgünse <b>bağlaçtır</b> → ayrı yaz. Bozuluyorsa <b>ektir</b> → bitişik yaz. Aşağıda dene:</p>`,widget:"deda",

 {h:"Anahtar kelime, konu ve ana fikir",html:`<div class="two-col"><div class="box"><b>🔑 Anahtar kelimeler</b><p>Metnin konusunu en iyi anlatan, çoğu zaman <b>tekrar eden</b> önemli kelimelerdir.</p><p class="ex">Test: Sadece bu kelimeleri duysan metnin neyi anlattığını tahmin edebilir misin?</p></div>
<div class="box"><b>📌 Konu ve ana fikir</b><p><b>Konu:</b> Metin <i>neyi</i> anlatıyor? (kısa: “arıların önemi”)</p><p><b>Ana fikir:</b> Yazar bize <i>ne söylemek</i> istiyor? (cümle: “Doğayı korumalıyız.”)</p></div></div>`,
 check:{q:"“Ormanlar bize temiz hava verir. Ormanlarda pek çok hayvan yaşar. Ormanları korumak için ağaç dikmeli, ateş yakmamalıyız.” Anahtar kelimeler hangileridir?",o:["orman, ağaç, korumak","hava, hayvan, ateş","temiz, pek çok, dikmek","bize, için, yakmak"],e:"Metin ormanları ve onları korumayı anlatıyor."}},
 {h:"Görseli okumak ve dinleme sınavı",html:`<div class="two-col"><div class="box"><b>🖼️ Görsel okuma</b><ul><li>Sembollere bak: 🚫 yasak, ✅ doğru, ♻️ geri dönüşüm.</li><li>Yazılara, renklere ve yüz ifadelerine dikkat et.</li><li>Mesajı <b>tek cümleyle</b> söyle: “Bu görsel bize … anlatıyor.”</li></ul></div>
<div class="box"><b>🎧 Dinleme sınavı</b><ul><li>Dinlerken kâğıda kısa notlar al: <b>Kim? Nerede? Ne zaman? Ne oldu? Sayılar?</b></li><li>İlk dinlemede genel konuyu, ikincide ayrıntıları yakala.</li><li>Son cümleye çok dikkat et; ana fikir çoğu zaman oradadır.</li></ul></div></div>`,
 check:{q:"Dinleme sınavında not alırken en çok neye dikkat etmelisin?",o:["Kişi, yer, zaman ve sayılara","Sadece ilk cümleye","Kelimelerin yazımına","Hiçbir şeye, sadece dinlemeye"],e:"5N1K soruları (kim, ne, nerede, ne zaman…) ve sayılar sık sorulur."}}
]},
"L-fen-matter":{s:"fen",title:"States of matter & gases",sub:"particles, properties of gases, changes of state",practice:["fen-gas","fen-states-sort","fen-tf"],pages:[
 {h:"Everything is made of particles",html:`<p>All matter is made of tiny <b>particles</b> <span class="ex">(tanecik)</span>. How they are arranged and how they move decides if something is a <b>solid</b>, a <b>liquid</b> or a <b>gas</b>. Tap the buttons and watch the particles:</p>`,widget:"states",
 check:{q:"In which state do particles move fastest and are furthest apart?",o:["Gas","Solid","Liquid","They are all the same"],e:"Gas particles are far apart and move quickly in all directions."}},
 {h:"Solid, liquid, gas: compare",html:`<div class="tblwrap"><table class="tbl"><tr><th></th><th>Solid 🧊</th><th>Liquid 💧</th><th>Gas 💨</th></tr>
<tr><td>Shape</td><td>fixed</td><td>takes the container's shape</td><td>fills the whole container</td></tr>
<tr><td>Volume</td><td>fixed</td><td>fixed</td><td>not fixed</td></tr>
<tr><td>Can it flow?</td><td>no</td><td>yes</td><td>yes</td></tr>
<tr><td>Can it be squashed?</td><td>no</td><td>no</td><td><b>yes!</b></td></tr>
<tr><td>Particles</td><td>packed tightly, vibrate</td><td>close, slide past each other</td><td>far apart, move fast</td></tr></table></div>`,
 check:{q:"Why can we pump lots of air into a bicycle tyre?",o:["Gases can be squashed because their particles are far apart.","Air is a solid.","Air has no mass.","The tyre makes the air disappear."],e:"Gas particles can be pushed closer together (compressed)."}},
 {h:"Special facts about gases",html:`<ul><li><b>Gases have mass.</b> A pumped-up football is heavier than a flat one.</li>
<li><b>Gases spread out (diffusion).</b> Smells travel across a room because gas particles move everywhere.</li>
<li><b>Gases can be compressed.</b> Divers carry lots of air squashed into a small tank.</li>
<li><b>Examples:</b> oxygen (we breathe it in), carbon dioxide (we breathe it out), water vapour, helium (balloons). <b>Air</b> is a <i>mixture</i> of gases.</li></ul>`,
 check:{q:"Mum is baking a cake in the kitchen. You can smell it in your bedroom. What is this called?",o:["Diffusion","Condensation","Freezing","Melting"],e:"Gas particles spread from the kitchen to your room."}},
 {h:"Changes of state",html:`<div class="cycle"><span>🧊 solid</span><span class="arr">— melting →<br>← freezing —</span><span>💧 liquid</span><span class="arr">— evaporation →<br>← condensation —</span><span>💨 gas</span></div>
<ul><li><b>Evaporation:</b> liquid → gas (puddles dry in the sun).</li><li><b>Condensation:</b> gas → liquid (drops on a cold glass or a bathroom mirror).</li>
<li><b>Melting:</b> solid → liquid. <b>Freezing:</b> liquid → solid.</li></ul>`,
 check:{q:"Water drops appear on the outside of a cold glass of juice. What happened?",o:["Water vapour in the air condensed.","The glass melted.","The juice evaporated through the glass.","The ice froze."],e:"Gas (water vapour) cooled and turned into liquid → condensation."}}
]},
"L-fen-digest":{s:"fen",title:"The digestive system",sub:"teeth, organs and the journey of food",practice:["fen-digest","fen-order","fen-match"],pages:[
 {h:"What is digestion?",html:`<p><b>Digestion</b> <span class="ex">(sindirim)</span> means breaking food down into very small pieces so that the body can <b>absorb</b> them into the blood. The blood then carries the <b>nutrients</b> to every part of the body.</p>
<p>It starts in your mouth, with your <b>teeth</b>:</p><div class="teeth"><div><span>🔪</span><b>Incisors</b><br>front teeth, <b>cut</b></div><div><span>🐺</span><b>Canines</b><br>pointed, <b>tear</b></div><div><span>⚙️</span><b>Molars</b><br>back teeth, <b>grind</b> and chew</div></div>
<p><b>Saliva</b> makes food soft and wet so it is easy to swallow, and starts digestion.</p>`,
 check:{q:"Which teeth grind and chew food?",o:["Molars","Incisors","Canines","Milk teeth"],e:"Molars are the big flat teeth at the back."}},
 {h:"Follow the food!",html:`<p>Press <b>Next stop</b> to follow a bite of food through the body:</p>`,widget:"journey",
 check:{q:"Where are most nutrients absorbed into the blood?",o:["Small intestine","Large intestine","Stomach","Oesophagus"],e:"The small intestine is long and absorbs digested food."}},
 {h:"Remember it!",html:`<p class="big-mnemonic">My Old Sister Sings Loud Rock Anthems</p><p class="ex" style="text-align:center">Mouth · Oesophagus · Stomach · Small intestine · Large intestine · Rectum · Anus</p>
<p><b>Helpers:</b> the <b>liver</b> and <b>pancreas</b> make juices that help break food down, but food does not pass through them.</p>`,
 check:{q:"What is the main job of the large intestine?",o:["Absorbing water","Chewing food","Making saliva","Killing germs with acid"],e:"Water is taken back into the body in the large intestine."}}
]},
"L-fen-diet":{s:"fen",title:"A balanced diet",sub:"nutrient groups and the healthy plate",practice:["fen-diet","fen-food-sort","fen-all"],pages:[
 {h:"The healthy plate",html:`<p>Tap each part of the plate to see what it gives your body. The size shows roughly how much of your food should come from each group.</p>`,widget:"plate",
 check:{q:"Which group should be the biggest part of our food?",o:["Fruit and vegetables","Fats and oils","Sweets","Only protein"],e:"Fruit and vegetables fill about a third or more of a healthy plate."}},
 {h:"Nutrients and their jobs",html:`<div class="tblwrap"><table class="tbl"><tr><th>Nutrient</th><th>Job</th><th>Foods</th></tr>
<tr><td><b>Carbohydrates</b></td><td>give <b>energy</b> ⚡</td><td>bread, rice, pasta, potatoes</td></tr>
<tr><td><b>Proteins</b></td><td><b>growth and repair</b> 💪</td><td>meat, fish, eggs, beans, lentils</td></tr>
<tr><td><b>Fats</b></td><td>store energy, keep us warm</td><td>butter, oil, nuts (small amounts)</td></tr>
<tr><td><b>Vitamins & minerals</b></td><td>keep us <b>healthy</b>; calcium for bones and teeth</td><td>fruit, vegetables, milk</td></tr>
<tr><td><b>Fibre</b></td><td>helps food move through the <b>intestines</b></td><td>wholegrain bread, fruit, vegetables</td></tr>
<tr><td><b>Water</b></td><td>every cell needs it 💧</td><td>water!</td></tr></table></div>`,
 check:{q:"Kerem broke his arm. Which nutrient helps his body repair it?",o:["Protein","Fat","Fibre","Sugar"],e:"Proteins are for growth and repair."}},
 {h:"Healthy habits",html:`<ul><li>A <b>balanced diet</b> = all the groups, in the <b>right amounts</b>.</li><li>Too much <b>sugar</b> → tooth decay 🦷 and weight gain.</li><li>Too much <b>fat and salt</b> → heart problems later in life.</li>
<li>Not enough <b>fibre</b> → digestion problems.</li><li>Drink water, eat 5 portions of fruit and vegetables a day, and exercise!</li></ul>`,
 check:{q:"Which lunch is the most balanced?",o:["Fish, rice, salad and an apple","Chips and cola","Cake and juice","Only bread and butter"],e:"Protein + carbohydrate + vitamins + fibre."}}
]},
"L-en-will":{s:"en",title:"Will or be going to?",sub:"plans, predictions, promises and decisions",practice:["en-will","en-will-sort","en-will-type","en-will-speed"],pages:[
 {h:"will + verb",html:`<p>Use <b>will</b> for:</p><div class="cards4">
<div class="box"><b>🔮 Predictions / opinions</b><p class="ex">I think it <b>will</b> snow tomorrow.<br>Maybe robots <b>will</b> teach us.</p><p>Clue words: <i>I think, I'm sure, maybe, probably, I hope</i></p></div>
<div class="box"><b>⚡ Decisions made NOW</b><p class="ex">“The phone is ringing!” “I<b>'ll</b> answer it.”</p></div>
<div class="box"><b>🤝 Promises & offers</b><p class="ex">I <b>won't</b> tell anyone. · I<b>'ll</b> carry your bag.</p></div>
<div class="box"><b>📅 Future facts</b><p class="ex">I <b>will</b> be 11 next year.</p></div></div>`,
 check:{q:"“It's so hot in here!” “I ___ open the window.”",o:["'ll","'m going to","am","going to"],e:"You decide at this moment → will."}},
 {h:"be going to + verb",html:`<p>Use <b>be going to</b> for:</p><div class="two-col">
<div class="box"><b>📝 Plans already made</b><p class="ex">We<b>'re going to</b> visit Antalya in July. We've booked the hotel.</p><p>You decided <i>before</i> speaking.</p></div>
<div class="box"><b>👀 Predictions with proof</b><p class="ex">Look at those black clouds! It<b>'s going to</b> rain.</p><p>You can <i>see</i> it is about to happen.</p></div></div>`,
 check:{q:"Look! That glass is at the edge of the table. It ___ fall!",o:["is going to","will","going to","is will"],e:"You can see the proof → going to."}},
 {h:"How to build the sentences",html:`<div class="tblwrap"><table class="tbl"><tr><th></th><th>will</th><th>be going to</th></tr>
<tr><td>✅ Positive</td><td>I / You / She <b>will</b> go<br>(I'll, she'll)</td><td>I <b>am</b> going to go<br>She <b>is</b> going to go<br>We / They <b>are</b> going to go</td></tr>
<tr><td>❌ Negative</td><td>She <b>won't</b> go<br>(= will not)</td><td>I'm <b>not</b> going to go<br>She <b>isn't</b> going to go</td></tr>
<tr><td>❓ Question</td><td><b>Will</b> you go?</td><td><b>Are</b> you going to go?<br><b>Is</b> she going to go?</td></tr></table></div>
<p><b>Common mistakes:</b> ✗ <s>I will going to</s> · ✗ <s>She going to</s> (needs <b>is</b>) · ✗ <s>He will goes</s> → ✓ He will <b>go</b></p>`,
 check:{q:"Which sentence is correct?",o:["They are going to play tennis.","They going to play tennis.","They will going to play tennis.","They are going play tennis."],e:"are + going to + base verb."}},
 {h:"The decision machine",html:`<p>Not sure? Answer the questions and the machine will tell you:</p>`,widget:"willtree",
 check:{q:"Mum has bought paint. “We ___ paint my room this weekend.”",o:["are going to","will","going to","are will"],e:"A plan (she already bought the paint) → going to."}}
]},
"L-en-past":{s:"en",title:"Past simple & past continuous",sub:"was reading when the phone rang",practice:["en-past"],pages:[
 {h:"Two past tenses",html:`<div class="two-col"><div class="box"><b>Past simple</b><p>A <b>finished</b> action. Short.</p><p class="ex">I <b>visited</b> my grandma yesterday.<br>She <b>didn't watch</b> TV.<br><b>Did</b> you <b>see</b> it?</p></div>
<div class="box"><b>Past continuous</b><p>An action <b>in progress</b> in the past. Long.</p><p class="ex">At 8 pm I <b>was reading</b>.<br>They <b>were playing</b> football.</p><p><b>was</b> (I/he/she/it) · <b>were</b> (you/we/they) + -ing</p></div></div>`,widget:"timeline",
 check:{q:"At 7 o'clock yesterday, we ___ dinner.",o:["were having","had","was having","have"],e:"In progress at a time in the past, we → were."}},
 {h:"when & while",html:`<ul><li><b>when</b> + short action (past simple): I was sleeping <b>when</b> the alarm <b>rang</b>.</li>
<li><b>while</b> + long action (past continuous): <b>While</b> I <b>was walking</b> home, I saw a cat.</li></ul>
<p><b>Irregular verbs to know:</b></p><div class="chips static"><span>go → went</span><span>see → saw</span><span>have → had</span><span>come → came</span><span>ring → rang</span><span>eat → ate</span><span>take → took</span><span>make → made</span><span>buy → bought</span><span>write → wrote</span><span>find → found</span><span>fall → fell</span></div>`,
 check:{q:"While I ___ my homework, the lights went out.",o:["was doing","did","were doing","do"],e:"while + long action → was doing."}}
]},
"L-en-grammar":{s:"en",title:"Stative verbs & conditionals",sub:"know vs is knowing · if + will / would",practice:["en-verbs","en-cond"],pages:[
 {h:"Stative verbs don't like -ing",html:`<p><b>Action verbs</b> are things we do (run, cook, play). They can be continuous: <i>I'm cooking.</i></p>
<p><b>Stative verbs</b> are about thoughts, feelings, senses and owning. We usually don't use them with -ing:</p>
<div class="chips static"><span>know</span><span>like</span><span>love</span><span>hate</span><span>want</span><span>need</span><span>believe</span><span>understand</span><span>think (opinion)</span><span>own</span><span>seem</span><span>taste</span><span>smell</span></div>
<p>✓ I <b>know</b> the answer. ✗ <s>I'm knowing the answer.</s></p>`,
 check:{q:"This pizza ___ amazing!",o:["tastes","is tasting","tasting","taste"],e:"taste (= has a flavour) is stative."}},
 {h:"First vs second conditional",html:`<div class="tblwrap"><table class="tbl"><tr><th>First conditional</th><th>Second conditional</th></tr>
<tr><td>Real, possible future</td><td>Imaginary, unlikely</td></tr>
<tr><td><b>If</b> + present simple, <b>will</b> + verb</td><td><b>If</b> + past simple, <b>would</b> + verb</td></tr>
<tr><td class="ex">If it <b>rains</b>, we <b>will stay</b> at home.</td><td class="ex">If I <b>had</b> wings, I <b>would fly</b>.</td></tr>
<tr><td class="ex">If you <b>study</b>, you<b>'ll pass</b>.</td><td class="ex">If I <b>were</b> a millionaire, I<b>'d buy</b> a farm.</td></tr></table></div>`,
 check:{q:"If I ___ a superhero, I would save the world.",o:["were","am","will be","would be"],e:"Imaginary → second conditional: If I were…"}}
]},
"L-en-school":{s:"en",title:"School life, likes & telling the time",sub:"have to · mustn't · love doing · quarter past",practice:["en-school","en-time","en-school-match"],pages:[
 {h:"Rules: have to, must, mustn't, don't have to",html:`<div class="tblwrap"><table class="tbl"><tr><th></th><th>Meaning</th><th>Example</th></tr>
<tr><td>✅ <b>have to / must</b></td><td>It's necessary.</td><td class="ex">We <b>have to</b> wear a uniform.</td></tr>
<tr><td>🚫 <b>mustn't</b></td><td>It's not allowed!</td><td class="ex">You <b>mustn't</b> run in the corridor.</td></tr>
<tr><td>😌 <b>don't have to</b></td><td>It's not necessary (you can if you want).</td><td class="ex">We <b>don't have to</b> bring lunch.</td></tr></table></div>
<p><b>Likes:</b> love ❤️ → like / enjoy 🙂 → don't mind 😐 → don't like 🙁 → hate / can't stand 😖 <b>+ -ing</b>: <i>I enjoy <b>reading</b>.</i></p>`,
 check:{q:"Tomorrow is Saturday. We ___ get up early.",o:["don't have to","mustn't","have to","must"],e:"Not necessary → don't have to."}},
 {h:"Telling the time: try the clock!",html:`<p>Minutes 1–30 are <b>past</b> the hour. Minutes 31–59 are <b>to</b> the next hour. Use the buttons to move the clock and read the time:</p>`,widget:"clock",
 check:{q:"It's 6:45. How do you say it?",o:["It's quarter to seven.","It's quarter past six.","It's quarter to six.","It's six forty-five past."],e:"15 minutes before seven → quarter to seven."}}
]},
"L-din-duzen":{s:"din",title:"Evrendeki düzen ve Allah’ın birliği",sub:"akıl yürütme ve tevhid",practice:["din-duzen","din-tf"],pages:[
 {h:"Evrende mükemmel bir düzen var",html:`<div class="cards4"><div class="box"><b>☀️ Gece ve gündüz</b><p>Dünya kendi etrafında döner; güneş her gün doğar ve batar.</p></div>
<div class="box"><b>🍂 Mevsimler</b><p>İlkbahar, yaz, sonbahar ve kış hep aynı sırayla gelir.</p></div>
<div class="box"><b>🌍 Doğru uzaklık</b><p>Dünya Güneş’e ne çok yakın ne çok uzak; tam yaşamaya uygun.</p></div>
<div class="box"><b>❤️ Vücudumuz</b><p>Kalp hiç durmadan çalışır; her organın bir görevi var.</p></div></div>`,
 check:{q:"Hangisi evrendeki düzene örnektir?",o:["Ay’ın evrelerinin her ay aynı sırayla tekrarlanması","Odanın dağınık olması","Bir oyunda kaybetmek","Kalemin kırılması"],e:"Ay’ın evreleri düzenli olarak tekrarlanır."}},
 {h:"Akıl yürütme: Düzen, düzenleyeni gösterir",html:`<p><b>Akıl yürütme</b>, gördüğümüz şeylerden yola çıkarak bir sonuca ulaşmaktır.</p>
<ul><li>Kumda ayak izi gördüm → Buradan biri geçmiş. 👣</li><li>Güzel bir resim gördüm → Onu bir ressam yapmış. 🎨</li><li>Bir bina gördüm → Onu bir mimar tasarlamış. 🏛️</li></ul>
<p>Evrendeki bu muhteşem düzen de kendiliğinden oluşamaz. Bu düzen, onu yaratan ve yöneten <b>Allah</b>’ın varlığını gösterir.</p>`,
 check:{q:"“Bir saat, saatçinin varlığını gösterir.” Bu örnekle ne anlatılmak istenir?",o:["Düzenli bir şeyin onu yapan birinin olduğunu gösterdiği","Saatlerin pahalı olduğu","Zamanın önemli olduğu","Herkesin saati olması gerektiği"],e:"Düzen ve sanat, yapanı gösterir."}},
 {h:"Tevhid: Allah birdir",html:`<p>Evrendeki düzenin hiç bozulmadan sürmesi, onu yaratanın <b>bir</b> olduğunu gösterir. Kur’an’da şöyle buyrulur:</p>
<blockquote>“Eğer yerde ve gökte Allah’tan başka ilahlar olsaydı, ikisinin de düzeni bozulurdu.”<br><span class="ex">(Enbiyâ suresi, 22. ayet)</span></blockquote>
<p>Allah’ın bir ve tek olduğuna inanmaya <b>tevhid</b> denir. İslam’ın temeli tevhid inancıdır.</p>`,
 check:{q:"Tevhid ne demektir?",o:["Allah’ın bir ve tek olduğuna inanmak","Namaz kılmak","Kur’an okumak","Oruç tutmak"],e:"Tevhid = Allah’ı bir bilmek."}}
]},
"L-din-esma":{s:"din",title:"Allah’ın güzel isimleri",sub:"Esmaü’l-Hüsna ve bağlamına uygun kullanma",practice:["din-esma","din-esma-match","din-esmaq"],pages:[
 {h:"Esmaü’l-Hüsna nedir?",html:`<p><b>Esmaü’l-Hüsna</b>, “en güzel isimler” demektir. Allah kendini Kur’an’da güzel isimleriyle tanıtır. Bu isimler bize Allah’ın sıfatlarını öğretir.</p>
<p>Sınavda bir <b>durum</b> verilir, sen de o duruma uygun ismi bulursun. Örneğin “Allah dualarımızı duyar” → <b>Es-Semî</b>.</p>`,
 check:{q:"“Esmaü’l-Hüsna” ne demektir?",o:["En güzel isimler","Kutsal kitaplar","Peygamberler","Melekler"],e:"Esma = isimler, hüsna = en güzel."}},
 {h:"İsimler ve kullanıldıkları durumlar",html:`<div class="tblwrap"><table class="tbl"><tr><th>İsim</th><th>Anlamı</th><th>Hangi durumda?</th></tr>
<tr><td><b>Er-Rahmân</b></td><td>Dünyada bütün canlılara merhamet eden</td><td>Yağmur herkese yağar</td></tr>
<tr><td><b>Er-Rahîm</b></td><td>Çok merhametli</td><td>Kullarına şefkat gösterir</td></tr>
<tr><td><b>El-Hâlık</b></td><td>Yaratan</td><td>Her şeyi yoktan var eder</td></tr>
<tr><td><b>El-Musavvir</b></td><td>Şekil veren</td><td>Her yüz, her çiçek farklı</td></tr>
<tr><td><b>El-Alîm</b></td><td>Her şeyi bilen</td><td>İçimizden geçeni bilir</td></tr>
<tr><td><b>El-Hakîm</b></td><td>Her işi hikmetli olan</td><td>Hiçbir şey boşuna yaratılmadı</td></tr>
<tr><td><b>El-Kadîr</b></td><td>Her şeye gücü yeten</td><td>Gücünün yetmediği şey yok</td></tr>
<tr><td><b>Er-Rezzâk</b></td><td>Rızık veren</td><td>Bütün canlıları besler</td></tr>
<tr><td><b>Es-Semî</b></td><td>Her şeyi işiten</td><td>Dualarımızı duyar</td></tr>
<tr><td><b>El-Basîr</b></td><td>Her şeyi gören</td><td>Karanlıktaki karıncayı görür</td></tr>
<tr><td><b>El-Vedûd</b></td><td>Kullarını çok seven</td><td>Sevgisi sonsuzdur</td></tr>
<tr><td><b>El-Gafûr</b></td><td>Günahları çok bağışlayan</td><td>Pişman olanı affeder</td></tr>
<tr><td><b>El-Hafîz</b></td><td>Koruyan</td><td>Her şeyi korur, gözetir</td></tr>

// quiz
function quizQuestions(set){
  if(set.gen==="clock")return clockQuestions(set.n);
  if(set.mix){const all=set.mix.flatMap(m=>SETS[m].qs);return shuffle(all).slice(0,set.n)}
  return set.qs.slice();
}
function runQuiz(id,set,only){
  const qs=only||quizQuestions(set);let i=0,score=0;const wrong=[];
  const show=()=>{
    if(i>=qs.length)return end();
    const q=qs[i],opts=shuffle(q.o.map((t,k)=>({t,ok:k===0})));
    body().innerHTML=`<div class="progress">Question ${i+1} of ${qs.length} · ${score} right</div>
      ${q.p?`<div class="passage">${esc(q.p)}</div>`:""}${q.v?`<div class="visual">${q.v}</div>`:""}
      <div class="q">${q.q}</div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}</div><div id="fb"></div>`;
    body().querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,ok=opts[k].ok;
      body().querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(opts[j].ok)x.classList.add("right")});
      hit(ok);if(ok){score++;addXP(10)}else{b.classList.add("wrong");wrong.push(q)}
      $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"✓ Right!":"✗ Not quite."} ${esc(q.e||"")}</div>
        <div class="row" style="margin-top:12px"><button class="btn" id="nx">${i+1<qs.length?"Next →":"See score"}</button></div>`;
      $("#nx").onclick=()=>{i++;show();$("#sheet").scrollTop=0};$("#nx").focus();
    });
  };
  const end=()=>scoreEnd(id,set,score,qs.length,wrong,only,()=>runQuiz(id,set),w=>runQuiz(id,set,w));
  show();
}

// flashcards: cards you miss come back until you know them all
function runCards(id,set){

      body().innerHTML=`<div class="result"><div class="big">${total}/${total}</div><p>You know all the cards! 🌟</p></div>
        <div class="row center"><button class="btn quiet" id="ra">Go again</button><button class="btn" id="cl">Finish</button></div>`;
      $("#ra").onclick=()=>runCards(id,set);$("#cl").onclick=closeSheet;return}
    const c=deck[0];
    body().innerHTML=`<div class="progress">Known ${known} of ${total} · ${deck.length} left</div>
      <div class="card3d" id="cd" role="button" tabindex="0" aria-label="Flip card"><div class="flip" id="fl"><div class="face f">${esc(c.f)}</div><div class="face b">${c.b}</div></div></div>
      <p class="hint">Tap the card to flip it. Say the answer out loud first!</p>
      <div class="row center"><button class="btn quiet" id="ag">↻ Again later</button><button class="btn" id="kn">✓ I knew it</button></div>`;
    const flip=()=>$("#fl").classList.toggle("on");
    $("#cd").onclick=flip;$("#cd").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}};
    $("#kn").onclick=()=>{deck.shift();known++;show()};
    $("#ag").onclick=()=>{deck.push(deck.shift());if(deck.length>1){const c2=deck.pop();deck.splice(Math.min(3,deck.length),0,c2)}show()};
  };
  show();
}

// listening: the device reads the text aloud, then questions
function runListen(id,set){
  let plays=0;const can="speechSynthesis" in window;
  const pickVoice=()=>{const vs=speechSynthesis.getVoices(),l=set.lang.toLowerCase(),base=l.slice(0,2);
    return vs.find(v=>v.lang.toLowerCase().replace("_","-")===l)||vs.find(v=>v.lang.toLowerCase().startsWith(base))||null};
  const speak=()=>{
    if(!can)return;speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(set.text);u.lang=set.lang;u.rate=.9;const v=pickVoice();if(v)u.voice=v;
    u.onstart=()=>$("#pl")&&($("#pl").textContent="⏸");u.onend=()=>$("#pl")&&($("#pl").textContent="▶");
    speechSynthesis.speak(u);plays++;$("#pc")&&($("#pc").textContent=`Played ${plays} time${plays>1?"s":""}. In the real exam you usually hear it twice.`);
  };
  if(can){speechSynthesis.getVoices();cleanup=()=>speechSynthesis.cancel()}
  body().innerHTML=`<div class="notes"><h3>How it works</h3><p>Press play and listen <b>without reading</b>. You can take notes on paper: names, places, numbers. Then answer the questions.</p></div>
    ${can?`<button class="play" id="pl" aria-label="Play">▶</button><p class="hint" id="pc">Turn the sound on, then press play.</p>`:
    `<p class="hint">This device can't read aloud. Ask someone to read this text to you twice:</p><div class="passage">${esc(set.text)}</div>`}
    <div class="row center"><button class="btn" id="go">I'm ready – questions →</button></div>`;
  if(can)$("#pl").onclick=()=>{if(speechSynthesis.speaking){speechSynthesis.cancel();$("#pl").textContent="▶"}else speak()};
  $("#go").onclick=()=>{if(can)speechSynthesis.cancel();runQuiz(id,set);
    // after the quiz, offer the text
    const obs=new MutationObserver(()=>{if(body().querySelector(".result")&&!body().querySelector("#txt")){obs.disconnect();

// speed: as many as you can in 60 seconds, combos multiply points
function speedPool(set){

  if(set.fromSort){const s=SETS[set.fromSort];return s.items.map(it=>({q:it.t,o:[s.buckets[it.k],...s.buckets.filter((_,k)=>k!==it.k)]}))}
  const cs=SETS[set.cards].cards.map(c=>({f:c.f,b:strip(c.b)}));
  return cs.map(c=>({q:c.f,o:[c.b,shuffle(cs.filter(x=>x.b!==c.b))[0].b]}));

const norm=s=>s.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?,]/g,"").replace(/\s+/g," ").trim();

  const w=n.split(" ");if(SUBJW.includes(w[0])&&A.includes(w.slice(1).join(" ")))return true; // "it is going to rain"
  const m=n.match(/^([a-z]+)('s|'re|'m|'ll)\s(.*)$/);if(m&&A.includes(m[2]+" "+m[3]))return true; // "it's going to rain"
  return false;
}

// clock game questions, made fresh every time
const NUMW=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
const MINW={5:"five",10:"ten",15:"quarter",20:"twenty",25:"twenty-five",30:"half"};
const hn=h=>NUMW[(h-1)%12+1];
const timePhrase=(h,m)=>m===0?`${hn(h)} o'clock`:m<=30?`${MINW[m]} past ${hn(h)}`:`${MINW[60-m]} to ${hn(h+1)}`;
function clockSVG(h,m){
  const R=a=>a*Math.PI/180,ha=R(((h%12)+m/60)*30),ma=R(m*6);let ticks="",nums="";
  for(let k=0;k<60;k++){const a=R(k*6),r1=k%5?85:79;ticks+=`<line x1="${(100+r1*Math.sin(a)).toFixed(1)}" y1="${(100-r1*Math.cos(a)).toFixed(1)}" x2="${(100+90*Math.sin(a)).toFixed(1)}" y2="${(100-90*Math.cos(a)).toFixed(1)}" stroke-width="${k%5?1.5:3}"/>`}
  for(let k=1;k<=12;k++){const a=R(k*30);nums+=`<text x="${(100+66*Math.sin(a)).toFixed(1)}" y="${(100-66*Math.cos(a)+6).toFixed(1)}">${k}</text>`}
  return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="An analogue clock"><circle cx="100" cy="100" r="96" class="cface"/><g class="ticks">${ticks}</g><g class="nums">${nums}</g>
    <line x1="100" y1="100" x2="${(100+44*Math.sin(ha)).toFixed(1)}" y2="${(100-44*Math.cos(ha)).toFixed(1)}" class="hh"/>
    <line x1="100" y1="100" x2="${(100+72*Math.sin(ma)).toFixed(1)}" y2="${(100-72*Math.cos(ma)).toFixed(1)}" class="mh"/><circle cx="100" cy="100" r="5" class="pin"/></svg>`;
}
function clockQuestions(n){
  const ms=[0,5,10,15,20,25,30,35,40,45,50,55],qs=[];
  for(let i=0;i<n;i++){
    const h=1+Math.floor(Math.random()*12),m=ms[Math.floor(Math.random()*ms.length)],right=timePhrase(h,m),cand=new Set();
    [[h,(m+30)%60],[h+1,m],[h+11,m],[h,(60-m)%60],[h,(m+15)%60]].forEach(([a,b])=>{const t=timePhrase((a-1)%12+1,b);if(t!==right)cand.add(t)});
    const digital=i%3===2;
    qs.push({v:digital?`<div class="digital">${h}:${pad(m)}</div>`:clockSVG(h,m),q:digital?"How do you say this time?":"What time is it?",
      o:["It's "+right,...shuffle([...cand]).slice(0,3).map(w=>"It's "+w)],e:`${h}:${pad(m)} = ${right}.`});
  }
  return qs;
}

      <article class="lesson"><h2>${esc(pg.h)}</h2>${pg.html}${pg.widget?'<div class="widget" id="wg"></div>':""}${pg.tip?`<p class="tip">💡 ${esc(pg.tip)}</p>`:""}</article>

      <div class="row lessonnav">${p?'<button class="btn quiet" id="pv">← Back</button>':""}<button class="btn" id="nx2" ${pg.check?"disabled":""}>${p+1<L.pages.length?"Next →":"Finish the lesson ✓"}</button></div>`;
    if(pg.widget)WIDGETS[pg.widget]($("#wg"));
    if(pg.check){
      const c=pg.check,opts=shuffle(c.o.map((t,k)=>({t,ok:k===0})));
      $("#co").innerHTML=opts.map((o,k)=>`<button class="opt" data-k="${k}">${fmt(o.t)}</button>`).join("");
      $("#co").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        const ok=opts[+b.dataset.k].ok;hit(ok);
        if(ok){$("#co").querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("right");addXP(10);
          $("#cfb").innerHTML=`<div class="feedback ok">✓ Right! ${esc(c.e)}</div>`;$("#nx2").disabled=false;$("#nx2").focus()}
        else{b.classList.add("wrong");b.disabled=true;$("#cfb").innerHTML=`<div class="feedback no">✗ Not quite. Read the explanation above again and try another answer.</div>`}
      });
    }
    if(p)$("#pv").onclick=()=>{p--;show();$("#sheet").scrollTop=0};
    $("#nx2").onclick=()=>{p++;show();$("#sheet").scrollTop=0};
  };
  const done=()=>{
    const first=!S.lessons[id];S.lessons[id]=true;if(first)addXP(50);finishTask();confetti();
    body().innerHTML=`<div class="result"><div class="big">🎓</div><p><b>Lesson complete!</b>${first?" +50 XP":""}</p><p class="mute">Now practise what you learned:</p></div>
      <div class="sets">${L.practice.map(sid=>`<button class="set" style="--c:${SUBJ[SETS[sid].s].c}" data-practice="${sid}"><b>${esc(SETS[sid].title)}</b><span>${kindLabel(SETS[sid])}${bestText(sid)}</span></button>`).join("")}</div>
      <div class="row center" style="margin-top:16px"><button class="btn quiet" id="ra">Read it again</button><button class="btn" id="cl">Finish</button></div>`;
    body().querySelectorAll("[data-practice]").forEach(b=>b.onclick=()=>{closeSheet();openActivity(b.dataset.practice,null)});
    $("#ra").onclick=()=>{p=0;show()};$("#cl").onclick=closeSheet;
  };
  show();
}

 states(el){
  el.innerHTML=`<div class="wtitle">🔬 Particle model</div><canvas id="pc" width="640" height="300" aria-label="Moving particles"></canvas>
    <div class="row center seg"><button class="btn small" data-m="0">🧊 Solid</button><button class="btn small quiet" data-m="1">💧 Liquid</button><button class="btn small quiet" data-m="2">💨 Gas</button></div><p class="hint" id="pcap"></p>`;
  const c=$("#pc"),x=c.getContext("2d"),W=640,H=300,N=40,r=11,caps=["Solid: particles are packed tightly in rows. They only vibrate on the spot.","Liquid: particles are close together but slide past each other. They stay at the bottom.","Gas: particles are far apart and zoom around in every direction, filling the whole box."];
  let mode=0;const ps=Array.from({length:N},(_,i)=>({hx:150+(i%10)*34,hy:150+Math.floor(i/10)*30,x:150+(i%10)*34,y:150+Math.floor(i/10)*30,vx:0,vy:0}));
  const set=m=>{mode=m;el.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("quiet",+b.dataset.m!==m));$("#pcap").textContent=caps[m];
    ps.forEach(p=>{const sp=m===2?4.5:m===1?1.2:0;const a=Math.random()*6.28;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp})};
  el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>set(+b.dataset.m));set(0);
  let raf;const step=()=>{x.clearRect(0,0,W,H);x.strokeStyle="#3a3080";x.lineWidth=4;x.strokeRect(2,2,W-4,H-4);
    ps.forEach(p=>{
      if(mode===0){p.x+=(p.hx-p.x)*.2+(Math.random()-.5)*2.4;p.y+=(p.hy-p.y)*.2+(Math.random()-.5)*2.4}
      else{const top=mode===1?150:r+4;p.x+=p.vx;p.y+=p.vy;if(mode===1){p.vy+=.05;p.vx+=(Math.random()-.5)*.3;p.vx*=.98}
        if(p.x<r+4){p.x=r+4;p.vx=Math.abs(p.vx)}if(p.x>W-r-4){p.x=W-r-4;p.vx=-Math.abs(p.vx)}
        if(p.y<top){p.y=top;p.vy=Math.abs(p.vy)}if(p.y>H-r-4){p.y=H-r-4;p.vy=-Math.abs(p.vy)*(mode===1?.5:1)}}
      x.beginPath();x.arc(p.x,p.y,r,0,6.283);x.fillStyle=mode===0?"#7cc7ff":mode===1?"#4aa3ff":"#6ee7a8";x.fill()});
    raf=requestAnimationFrame(step)};
  step();cleanup=()=>cancelAnimationFrame(raf);
 },

 plate(el){
