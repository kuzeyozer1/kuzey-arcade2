  {q:"5.1 Metnin anahtar kelimelerinden üçünü yazınız.",pts:6,rub:[["Üç uygun anahtar kelime (leylek, göç, yolculuk, yuva…) – her biri 2 puan",6]],model:"leylek, göç, yuva"},
  {q:"5.2 Bu anahtar kelimelere bakarak metnin konusunu yazınız.",pts:6,rub:[["Konuyu doğru yazdı (leyleklerin göçü)",6]],model:"Leyleklerin göçü."}]},
 {k:"T.Y.5.13",text:`<div class="passage">Denize gittik. Su soğuktu. Kumdan kale yaptık. Akşam olunca döndük.</div>`,parts:[
  {q:"Yukarıdaki paragrafı; betimleyici kelimeler, duygularınızı anlatan ifadeler ve en az bir deyim ya da atasözü kullanarak daha etkili hâle getiriniz.",pts:16,rub:[["Betimleyici kelimeler ekledi",4],["Duygularını anlatan ifadeler ekledi",4],["Bir deyim veya atasözünü doğru kullandı",4],["Olayların sırasını ve anlamını korudu",4]],model:"Yazın son günü ailemle masmavi denize gittik. Su buz gibiydi, ilk girdiğimde tüylerim diken diken oldu. Kardeşimle ıslak kumdan kocaman bir kale yaptık; kale bitince ağzımız kulaklarımıza vardı. Güneş turuncu bir top gibi batarken mutlu ama yorgun eve döndük."}]},
 {k:"T.Y.5.16",text:`<div class="passage">Merhaba Ayşe 3 sınıftaki kardeşin bugün okula gelecek mi Veli toplantısı 20 11 2026 Cuma günü saat 15 00 te yapılacak Lütfen yanına şunları getir kalem defter ve silgi</div>`,parts:[
  {q:"Yukarıdaki notu yazım ve noktalama kurallarına uygun olarak yeniden yazınız.",pts:12,rub:[["Hitaptan sonra virgül (Ayşe,)",2],["Sıra sayısında nokta (3.)",2],["Soru cümlesinin sonunda soru işareti",2],["Tarih ve saatte nokta, saatte kesme (20.11.2026, 15.00’te)",2],["Açıklamadan önce iki nokta (şunları getir:)",2],["Sıralanan kelimeler arasında virgül",2]],model:"Merhaba Ayşe, 3. sınıftaki kardeşin bugün okula gelecek mi? Veli toplantısı 20.11.2026 Cuma günü saat 15.00’te yapılacak. Lütfen yanına şunları getir: kalem, defter ve silgi."}]}
]},
"ex-tr-dinle":{s:"tr",kind:"exam",title:"Türkçe Dinleme Sınavı",sub:"Metni dinle, 6 açık uçlu soruyu cevapla",mins:20,lang:"tr-TR",
 listen:"Geçen cumartesi sabahı mahallemizin köpeği Duman kayboldu. Duman, kulakları siyah, kendisi beyaz, çok uysal bir köpekti. Bütün çocuklar onu çok severdi. Kaybolduğunu ilk fark eden, her sabah ona su veren bakkal Hasan Amca oldu. Biz de arkadaşlarımla hemen bir arama ekibi kurduk. Elif, Duman’ın fotoğrafıyla küçük ilanlar hazırladı. Kerem ile ben ilanları parktaki ağaçlara ve duraklara astık. Öğleden sonra yağmur başladı ama aramaya devam ettik. Akşama doğru okulun bekçisi Ali Bey bizi aradı. Duman, yağmurdan korunmak için okulun spor salonunun kapısının önüne sığınmıştı. Onu görünce hepimiz sevinçten zıpladık. O gün, birlikte çalışınca en zor işlerin bile kolaylaştığını öğrendim.",
 qs:[
 {k:"Dinleme",parts:[
  {q:"1. Kaybolan köpeğin adı nedir ve nasıl bir köpektir? (görünüşü ve huyu)",pts:16,rub:[["Adı: Duman",4],["Kulakları siyah, kendisi beyaz",8],["Uysal bir köpek",4]],model:"Adı Duman’dır. Kulakları siyah, kendisi beyaz, çok uysal bir köpektir."},
  {q:"2. Duman’ın kaybolduğunu ilk kim fark etti? Neden?",pts:16,rub:[["Bakkal Hasan Amca",8],["Her sabah ona su veriyordu",8]],model:"Bakkal Hasan Amca, çünkü her sabah Duman’a su veriyordu."},
  {q:"3. Çocuklar Duman’ı bulmak için neler yaptı? İki örnek yazınız.",pts:16,rub:[["Elif ilan hazırladı",8],["İlanları parka ve duraklara astılar / aramaya devam ettiler",8]],model:"Bir arama ekibi kurdular. Elif fotoğraflı ilanlar hazırladı; Kerem ve anlatıcı ilanları parktaki ağaçlara ve duraklara astı."},
  {q:"4. Duman nerede bulundu ve oraya neden gitmişti?",pts:20,rub:[["Okulun spor salonunun kapısının önünde",10],["Yağmurdan korunmak için",10]],model:"Okulun spor salonunun kapısının önünde bulundu. Yağmurdan korunmak için oraya sığınmıştı."},
  {q:"5. Duman’ı bulduklarını çocuklara kim haber verdi?",pts:12,rub:[["Okulun bekçisi Ali Bey",12]],model:"Okulun bekçisi Ali Bey."},
  {q:"6. Bu metnin ana fikri nedir? Metne uygun bir başlık da yazınız.",pts:20,rub:[["Ana fikir: birlikte çalışınca zor işler kolaylaşır",12],["Metne uygun bir başlık",8]],model:"Ana fikir: Birlikte çalışınca en zor işler bile kolaylaşır. Başlık: “Duman’ı Arıyoruz” / “Kayıp Köpek”"}]}
]},
"ex-din-1":{s:"din",kind:"exam",title:"Din Kültürü Deneme 1 (Senaryo 4)",sub:"6 açık uçlu soru · 100 puan · 40 dakika",mins:40,qs:[
 {k:"DKAB.5.1.1",text:`<p>Okul bahçesindeki küçük gölette güneş ışığıyla büyüyen su bitkileri, bu bitkilerle beslenen küçük balıklar, sinekleri yakalayan kurbağalar ve balıkları avlayan bir balıkçıl kuşu yaşıyor.</p><div class="chain">☀️ → 🌿 su bitkisi → 🐟 küçük balık → 🐦 balıkçıl</div>`,parts:[
  {q:"1.1 Göletteki canlılar arasındaki iki ilişkiyi yazınız.",pts:6,rub:[["Birinci ilişki (ör. balıklar su bitkileriyle beslenir)",3],["İkinci ilişki (ör. balıkçıl balıkları avlar / bitkiler güneşle büyür)",3]],model:"Su bitkileri güneş ışığıyla büyür. Küçük balıklar bu bitkilerle beslenir. Balıkçıl kuşu da balıkları avlar."},
  {q:"1.2 Gölete zehirli atık dökülürse bu düzen nasıl etkilenir?",pts:5,rub:[["Bitkiler/balıklar zarar görür",3],["Zincirdeki diğer canlılar da etkilenir, denge bozulur",2]],model:"Su bitkileri ve balıklar ölür. Balıklarla beslenen balıkçıl da yiyecek bulamaz. Bir halka bozulunca bütün düzen bozulur."},
  {q:"1.3 Bu örnekten evrendeki düzenle ilgili hangi sonuca ulaşırsınız?",pts:4,rub:[["Canlılar birbirine bağlıdır, her birinin görevi vardır, düzen tesadüf değildir",4]],model:"Canlılar birbirine bağlıdır ve her birinin bir görevi vardır. Bu ölçülü düzen tesadüfen oluşamaz."}]},
 {k:"DKAB.5.1.2",text:`<p>Dünya kendi etrafında yaklaşık 24 saatte, Güneş’in etrafında yaklaşık 365 günde döner. Kur’an-ı Kerim’de şöyle buyrulur:</p><blockquote>“Güneş ve ay bir hesaba göre hareket etmektedir.” <span class="ex">(Rahmân suresi, 5. ayet)</span></blockquote>`,parts:[
  {q:"2.1 Dünya’nın iki hareketini ve bu hareketlerin sonuçlarını yazınız.",pts:8,rub:[["Kendi etrafında dönme → gece ve gündüz",4],["Güneş etrafında dolanma → mevsimler / yıl",4]],model:"Dünya kendi etrafında döner; bu yüzden gece ve gündüz oluşur. Güneş’in etrafında döner; bu yüzden yıl ve mevsimler oluşur."},
  {q:"2.2 Ayeti, evrendeki düzen ve Allah’ın varlığı ile ilişkilendirerek açıklayınız.",pts:8,rub:[["Hareketlerin bir hesaba / ölçüye göre olduğunu belirtti",4],["Bu hesaplı düzenin tesadüf olamayacağını, Allah’ın varlığını gösterdiğini yazdı",4]],model:"Güneş ve Ay belli bir hesaba göre hareket eder; bu yüzden takvimler, saatler yapılabilir. Bu kadar hesaplı bir düzen kendiliğinden olamaz; onu yaratan ve yöneten Allah’ın varlığını gösterir."}]},
 {k:"DKAB.5.1.2",text:`<blockquote>“Eğer yerde ve gökte Allah’tan başka ilahlar olsaydı, ikisinin de düzeni bozulurdu.” <span class="ex">(Enbiyâ suresi, 22. ayet)</span></blockquote><p>Bir sınıfta aynı anda iki öğretmen ders anlatsa ve birbirine zıt kurallar koysa sınıfta düzen kalmaz.</p>`,parts:[
  {q:"3.1 Ayette anlatılmak istenen düşünceyi kendi cümlelerinizle açıklayınız.",pts:6,rub:[["Birden fazla ilah olsaydı düzenin bozulacağını yazdı",6]],model:"Evrende Allah’tan başka ilahlar olsaydı her biri farklı şey isterdi ve düzen bozulurdu."},
  {q:"3.2 Sınıf örneği ile ayet arasında nasıl bir benzerlik vardır?",pts:6,rub:[["İki yönetici olunca düzenin bozulacağı benzerliğini kurdu",6]],model:"Sınıfta iki öğretmen zıt kurallar koyunca düzen bozulur. Evrende de birden fazla yaratıcı olsaydı düzen bozulurdu. Düzenin bozulmaması yaratıcının bir olduğunu gösterir."},
  {q:"3.3 Tevhid ne demektir? Evrendeki düzenle bağlantısını yazınız.",pts:6,rub:[["Tevhid: Allah’ın bir olduğuna inanmak",3],["Düzenin bozulmadan sürmesi Allah’ın birliğini gösterir",3]],model:"Tevhid, Allah’ın bir ve tek olduğuna inanmaktır. Evrendeki düzenin hiç bozulmadan sürmesi, onu yaratanın bir olduğunu gösterir."}]},
 {k:"DKAB.5.1.3",text:`<p>Panodaki isimler: <b>Er-Rahmân · Er-Rahîm · El-Alîm · Es-Semî · El-Basîr · El-Kadîr</b></p>`,parts:[
  {q:"4.1 Aşağıdaki her durumun hangi isimle ilgili olduğunu yazınız.<br>a) Güneş ışığını ve yağmuru bütün canlılara gönderir.<br>b) Gökyüzündeki milyarlarca yıldızı yaratmaya gücü yeter.<br>c) Ayşe’nin içinden sessizce ettiği duayı duyar.<br>ç) Toprağa düşen her tohumu ve kalplerden geçeni bilir.<br>d) Karanlık gecede siyah taşın üzerindeki karıncayı görür.<br>e) Pişman olup tövbe eden kuluna merhamet eder, onu bağışlar.",pts:12,rub:[["a) Er-Rahmân",2],["b) El-Kadîr",2],["c) Es-Semî",2],["ç) El-Alîm",2],["d) El-Basîr",2],["e) Er-Rahîm",2]],model:"a) Er-Rahmân b) El-Kadîr c) Es-Semî ç) El-Alîm d) El-Basîr e) Er-Rahîm"},
  {q:"4.2 İnsanın görmesi ve işitmesi ile Allah’ın Basîr ve Semî olması arasındaki farkı açıklayınız.",pts:4,rub:[["İnsan göz ve kulağa muhtaçtır, sınırlı görür ve işitir",2],["Allah hiçbir şeye muhtaç değildir, her şeyi görür ve işitir",2]],model:"İnsan görmek için göze, duymak için kulağa ihtiyaç duyar ve her şeyi göremez, duyamaz. Allah hiçbir şeye muhtaç değildir; gizli açık her şeyi görür ve işitir."}]},
 {k:"DKAB.5.1.3",text:`<p>Öğretmen dua kartlarını şu örnekle başlattı: <i>“Ya Basîr! Yaptıklarımızı görürsün, bizi güzel davranışlara yönelt.”</i></p>`,parts:[
  {q:"5. Aşağıdaki her kart için Allah’ın güzel isimlerinden birini kullanarak kısa bir dua yazınız.<br>Kart 1: Ali yarınki sınavı için çok heyecanlı.<br>Kart 2: Zeynep, küstüğü arkadaşıyla barışmak istiyor.<br>Kart 3: Can, arkadaşının kalbini kırdığı için pişman.",pts:15,rub:[["Kart 1: uygun isim ve anlamına uygun dua (ör. Ya Alîm / Ya Kadîr)",5],["Kart 2: uygun isim ve dua (ör. Ya Semî / Ya Rahmân)",5],["Kart 3: uygun isim ve dua (ör. Ya Rahîm / Ya Gafûr)",5]],model:"Kart 1: “Ya Alîm! Her şeyi bilirsin; öğrendiklerimi hatırlamamı kolaylaştır.” Kart 2: “Ya Semî! Duamı işitirsin; arkadaşımla barışmamı nasip et.” Kart 3: “Ya Rahîm! Merhametin sonsuzdur; hatamı bağışla, arkadaşımın gönlünü almayı bana kolaylaştır.”"}]},
 {k:"DKAB.5.1.4",text:`<p>Zehra, İhlas suresini sınıfta okudu. Emir de sureyle ilgili sorular sordu.</p>`,parts:[
  {q:"6.1 İhlas suresinin okunuşunu yazınız.",pts:8,rub:[["Dört ayeti doğru sırayla yazdı (her biri 2 puan)",8]],model:"Kul hüvallâhü ehad. Allâhüs-samed. Lem yelid ve lem yûled. Ve lem yekün lehû küfüven ehad."},
  {q:"6.2 “Allâhüs-samed” ayetinin anlamını yazınız.",pts:4,rub:[["Allah hiçbir şeye muhtaç değildir, her şey O’na muhtaçtır",4]],model:"Allah sameddir; her şey O’na muhtaçtır, O hiçbir şeye muhtaç değildir."},
  {q:"6.3 “Lem yelid ve lem yûled” ayetinin anlamını yazınız.",pts:4,rub:[["O doğurmamış ve doğurulmamıştır",4]],model:"O, doğurmamış ve doğurulmamıştır."},
  {q:"6.4 İhlas suresinin ana mesajı nedir?",pts:4,rub:[["Allah’ın bir olduğu (tevhid), hiçbir şeye muhtaç olmadığı ve benzerinin olmadığı",4]],model:"Allah birdir (tevhid); hiçbir şeye muhtaç değildir, doğmamış ve doğurmamıştır, hiçbir şey O’na denk değildir."}]}
]},
"ex-din-2":{s:"din",kind:"exam",title:"Din Kültürü Deneme 2 (Senaryo 4)",sub:"6 açık uçlu soru · 100 puan · 40 dakika",mins:40,qs:[
 {k:"DKAB.5.1.1",text:`<p>Vücudumuzda kalp hiç durmadan çalışır, kanı bütün vücuda pompalar. Gözümüz toz kaçmasın diye kendiliğinden kırpılır. Yediğimiz besinler sindirilir ve vücudumuza enerji olur.</p>`,parts:[
  {q:"1.1 Metinde vücudumuzdaki düzene verilen üç örneği yazınız.",pts:9,rub:[["Kalbin durmadan çalışması",3],["Gözün kendiliğinden kırpılması",3],["Besinlerin sindirilip enerjiye dönüşmesi",3]],model:"Kalbin durmadan kanı pompalaması, gözün kendiliğinden kırpılması, besinlerin sindirilip enerjiye dönüşmesi."},
  {q:"1.2 Bu örneklerden hangi sonuca ulaşırsınız?",pts:6,rub:[["Vücudumuz kusursuz bir düzenle çalışır; bu düzen tesadüf olamaz, bir yaratıcıyı gösterir",6]],model:"Vücudumuz kusursuz bir düzenle çalışır. Bu düzen kendiliğinden oluşamaz; onu yaratan Allah’ı gösterir."}]},
 {k:"DKAB.5.1.2",text:`<blockquote>“Rabbin bal arısına şöyle vahyetti: ‘Dağlardan, ağaçlardan ve insanların kurdukları çardaklardan kendine evler edin.’” <span class="ex">(Nahl suresi, 68. ayet)</span></blockquote><p>Arılar peteklerini hiç boşluk kalmayacak şekilde altıgen yapar, çiçekten çiçeğe polen taşır ve bal üretir. Arılara bunları kimse öğretmez.</p>`,parts:[
  {q:"2.1 Arıların hayatındaki düzene iki örnek yazınız.",pts:8,rub:[["Birinci örnek (altıgen petek)",4],["İkinci örnek (polen taşıma / bal yapma)",4]],model:"Peteklerini boşluk kalmayacak şekilde altıgen yapmaları; çiçekten çiçeğe polen taşıyıp bal yapmaları."},
  {q:"2.2 Ayeti ve arıların davranışlarını Allah’ın varlığı ile ilişkilendiriniz.",pts:8,rub:[["Arılara bu bilgiyi Allah’ın verdiğini (vahyettiğini) belirtti",4],["Bu düzenin Allah’ın varlığını gösterdiğini yazdı",4]],model:"Arılara kimse bir şey öğretmez; ayete göre onlara bunu Allah öğretmiştir. Arıların bu düzenli işleri, onları yaratan Allah’ın varlığını gösterir."}]},
 {k:"DKAB.5.1.2",text:`<p>Ahmet, gezide çok güzel ve sağlam bir köprü gördü. Babası: “Bu köprüyü usta bir mühendis tasarlamış.” dedi.</p>`,parts:[
  {q:"3.1 Babanın sözündeki akıl yürütmeyi açıklayınız.",pts:6,rub:[["Düzenli ve sağlam yapının onu yapan birini gösterdiğini yazdı",6]],model:"Düzenli ve sağlam bir köprü kendiliğinden oluşmaz; onu tasarlayan bir mühendis olmalıdır."},
  {q:"3.2 Bu akıl yürütmeyi evrene uygulayınız.",pts:6,rub:[["Evrendeki düzenin de bir yaratıcıyı (Allah) gösterdiğini yazdı",6]],model:"Köprü mühendisini gösterdiği gibi, evrendeki muhteşem düzen de onu yaratan Allah’ın varlığını gösterir."},
  {q:"3.3 Evrendeki düzenin hiç bozulmadan sürmesi neyi gösterir?",pts:6,rub:[["Allah’ın bir olduğunu (tevhid)",6]],model:"Evreni yaratanın bir olduğunu, yani Allah’ın birliğini (tevhid) gösterir."}]},
 {k:"DKAB.5.1.3",text:``,parts:[
  {q:"4.1 Aşağıdaki cümlelerdeki boşluklara uygun ismi yazınız.<br>a) Allah gizli açık her şeyi bilir; O, ______’dir.<br>b) Annemin hastanede ettiği duayı Allah işitir; O, ______’dir.<br>c) Bütün canlıları yaratan ve var eden Allah, ______’tır.<br>ç) Allah her şeye gücü yeter; O, ______’dir.<br>d) Okyanusun dibindeki balığı bile gören Allah, ______’dir.<br>e) Allah dünyada inanan inanmayan bütün canlılara merhamet eder; O, ______’dır.",pts:12,rub:[["a) Alîm",2],["b) Semî",2],["c) Hâlık",2],["ç) Kadîr",2],["d) Basîr",2],["e) Rahmân",2]],model:"a) Alîm b) Semî c) Hâlık ç) Kadîr d) Basîr e) Rahmân"},
  {q:"4.2 Seçtiğiniz bir ismin anlamını günlük hayattan bir örnekle açıklayınız.",pts:4,rub:[["İsmi doğru anlamla açıkladı",2],["Uygun bir günlük hayat örneği verdi",2]],model:"Er-Rezzâk rızık veren demektir. Kuşların her gün yiyecek bulması Allah’ın Rezzâk olduğunu gösterir."}]},
 {k:"DKAB.5.1.3",text:``,parts:[
  {q:"5. Aşağıdaki durumlar için birer cümle yazınız. Cümlede Allah’ın uygun bir ismini, anlamına uygun şekilde kullanınız.<br>a) Kardeşin karanlıktan korkuyor.<br>b) Arkadaşın bir hata yaptı ve çok üzgün.<br>c) Bir çiftçi tarlasına yağmur yağması için dua ediyor.",pts:15,rub:[["a) uygun isim ve cümle (ör. El-Basîr / El-Hafîz)",5],["b) uygun isim ve cümle (ör. Er-Rahîm / El-Gafûr)",5],["c) uygun isim ve cümle (ör. Er-Rezzâk / Er-Rahmân)",5]],model:"a) “Korkma, Allah Basîr’dir; karanlıkta da bizi görür ve korur.” b) “Üzülme, Allah Gafûr’dur; pişman olanları bağışlar.” c) “Ya Rezzâk! Tarlalarımıza bereketli yağmurlar gönder.”"}]},
 {k:"DKAB.5.1.4",text:``,parts:[
  {q:"6.1 İhlas suresinin her ayetinin anlamını sırasıyla yazınız.",pts:12,rub:[["1. ayet: De ki: O Allah birdir",3],["2. ayet: Allah sameddir, her şey O’na muhtaçtır",3],["3. ayet: Doğurmamış ve doğurulmamıştır",3],["4. ayet: Hiçbir şey O’na denk değildir",3]],model:"1. De ki: O, Allah’tır, bir tektir. 2. Allah sameddir (her şey O’na muhtaçtır, O hiçbir şeye muhtaç değildir). 3. O, doğurmamış ve doğurulmamıştır. 4. Hiçbir şey O’na denk değildir."},
  {q:"6.2 İhlas suresiyle ilgili iki bilgi yazınız (kaçıncı sure, ayet sayısı, nerede indiği, adının anlamı…).",pts:4,rub:[["İki doğru bilgi (112. sure, 4 ayet, Mekke, samimiyet)",4]],model:"Kur’an’ın 112. suresidir ve 4 ayettir. “İhlas” samimiyet, içtenlik demektir."},
  {q:"6.3 İhlas suresi Allah’ın birliğini nasıl anlatır?",pts:4,rub:[["Allah’ın bir olduğunu, benzerinin olmadığını ve hiçbir şeye muhtaç olmadığını yazdı",4]],model:"“O Allah birdir” der; O’na denk hiçbir şeyin olmadığını ve O’nun hiçbir şeye muhtaç olmadığını bildirir. Bu tevhidin özüdür."}]}
]},
"ex-en-meb":{s:"en",kind:"exam",title:"English Practice Exam (MEB Themes 1–2)",sub:"School life & classroom life · open-ended · 100 points",mins:40,qs:[
 {k:"School rules",text:`<div class="poster"><b>OUR SCHOOL RULES</b><small>✅ Wear your uniform. · ✅ Be on time. · 🚫 Don't run in the corridors. · 🚫 You can't use your phone in class. · 🚫 You mustn't eat in the library.</small></div>`,parts:[
  {q:"1.1 Write two things students must / have to do at this school.",pts:8,rub:[["Wear the uniform",4],["Be on time",4]],model:"Students have to wear their uniform. They must be on time."},
  {q:"1.2 Write two things students mustn't / can't do.",pts:8,rub:[["One correct rule with mustn't / can't / don't",4],["A second correct rule",4]],model:"You mustn't run in the corridors. You can't use your phone in class. You mustn't eat in the library."}]},
 {k:"Countries",text:``,parts:[
  {q:"2. Complete with the nationality:<br>a) Hiroshi is from Japan. He is ______.<br>b) Emma is from Canada. She is ______.<br>c) Hans and Lena are from Germany. They are ______.<br>d) I am from Türkiye. I am ______.",pts:16,rub:[["a) Japanese",4],["b) Canadian",4],["c) German",4],["d) Turkish",4]],model:"a) Japanese b) Canadian c) German d) Turkish"}]},
 {k:"Timetable & time",text:`<table class="tbl tt"><tr><th></th><th>Monday</th><th>Tuesday</th></tr><tr><td>09:00</td><td>Maths</td><td>Turkish</td></tr><tr><td>10:15</td><td>Science</td><td>Art</td></tr><tr><td>11:30</td><td>English</td><td>PE</td></tr></table>`,parts:[
  {q:"3.1 What time is the Science lesson on Monday? Write the time in words.",pts:6,rub:[["quarter past ten",6]],model:"It's at quarter past ten."},
  {q:"3.2 Which lessons do we have on Tuesday?",pts:6,rub:[["Turkish, Art and PE (2 each)",6]],model:"We have Turkish, Art and PE on Tuesday."},
  {q:"3.3 Write the times in words: 11:30 · 08:45 · 01:15",pts:6,rub:[["half past eleven",2],["quarter to nine",2],["quarter past one",2]],model:"half past eleven · quarter to nine · quarter past one"}]},
 {k:"Clubs & likes",text:`<p>Clubs: Art · Chess · Drama · Science · Sports · Music · Environment</p>`,parts:[
  {q:"4.1 Which club do you want to join? Why? Write two sentences.",pts:8,rub:[["Names a club correctly",3],["Gives a reason with like / love / enjoy + -ing",5]],model:"I want to join the chess club. I love solving problems and I enjoy playing chess with my friends."},
  {q:"4.2 Write about your likes and dislikes at school. Use love, like, don't like and hate + -ing.",pts:12,rub:[["love + -ing",3],["like + -ing",3],["don't like + -ing",3],["hate + -ing",3]],model:"I love drawing pictures in Art. I like reading books in the library. I don't like doing homework at the weekend. I hate getting up early."}]},
 {k:"Grammar",text:``,parts:[
  {q:"5.1 Write a, an or the:<br>a) She is ___ English teacher.<br>b) I have ___ new ruler.<br>c) ___ library is on the first floor.<br>d) He eats ___ apple every break.",pts:8,rub:[["a) an",2],["b) a",2],["c) The",2],["d) an",2]],model:"a) an b) a c) The d) an"},
  {q:"5.2 Write two classroom instructions (imperatives), one positive and one negative.",pts:10,rub:[["Positive imperative",5],["Negative imperative with Don't",5]],model:"Open your books, please. Don't talk during the test."}]},
 {k:"National days",text:``,parts:[
  {q:"6. Match and write: 29 October · 23 April · 19 May. What do we celebrate on these days?",pts:12,rub:[["29 October: Republic Day",4],["23 April: National Sovereignty and Children's Day",4],["19 May: Commemoration of Atatürk, Youth and Sports Day",4]],model:"29 October is Republic Day. 23 April is National Sovereignty and Children's Day. 19 May is the Commemoration of Atatürk, Youth and Sports Day."}]}
]},
"ex-en-cam":{s:"en",kind:"exam",title:"Cambridge English Practice Exam",sub:"Nature · past tenses · conditionals · will / going to · open-ended",mins:40,qs:[
 {k:"Reading",text:`<div class="passage" lang="en">Last summer, my family and I were camping near a lake when a big storm started. We were cooking dinner and my little brother was playing with a ball. Suddenly, the wind blew our tent away! We ran after it, but it flew into the lake. A park ranger helped us and told us about the forest. "Forests are very important," she said. "Trees give us oxygen, and many animals live here. Please don't leave rubbish." Next year, we are going to camp there again, and I think we will take a stronger tent!</div>`,parts:[
  {q:"1.1 What were the family doing when the storm started? Write two things.",pts:8,rub:[["They were cooking dinner",4],["The brother was playing with a ball",4]],model:"They were cooking dinner and the little brother was playing with a ball."},
  {q:"1.2 Why are forests important, according to the park ranger?",pts:6,rub:[["Trees give us oxygen",3],["Many animals live there",3]],model:"Because trees give us oxygen and many animals live there."},
  {q:"1.3 Find one plan and one prediction in the last sentence. Why does the writer use 'going to' and 'will'?",pts:12,rub:[["Plan: are going to camp (already decided)",6],["Prediction / decision: will take a stronger tent (opinion with I think)",6]],model:"Plan: 'we are going to camp there again' (decided before, so going to). Prediction: 'I think we will take a stronger tent' (opinion with I think, so will)."}]},
 {k:"Past simple & continuous",text:``,parts:[
  {q:"2. Complete with the past simple or past continuous:<br>a) I (read) ______ when the phone (ring) ______.<br>b) While we (walk) ______ to school, it (start) ______ to rain.<br>c) They (not / watch) ______ TV at 9 pm last night.",pts:15,rub:[["a) was reading / rang",5],["b) were walking / started",5],["c) weren't watching",5]],model:"a) was reading, rang b) were walking, started c) weren't watching"}]},
 {k:"Stative & action verbs",text:``,parts:[
  {q:"3. Correct the mistakes:<br>a) I am knowing the answer.<br>b) This cake is tasting delicious.<br>c) Look! The children play in the garden.",pts:15,rub:[["a) I know the answer.",5],["b) This cake tastes delicious.",5],["c) The children are playing in the garden.",5]],model:"a) I know the answer. b) This cake tastes delicious. c) Look! The children are playing in the garden."}]},
 {k:"Conditionals",text:``,parts:[
  {q:"4.1 Complete: If it rains tomorrow, we ______ (stay) at home.",pts:4,rub:[["will stay",4]],model:"will stay"},
  {q:"4.2 Complete: If I ______ (have) a million dollars, I would ______ (buy) …",pts:6,rub:[["had",3],["buy + a sensible ending",3]],model:"If I had a million dollars, I would buy a big house for my family."},
  {q:"4.3 Write your own sentence: If I were a superhero, …",pts:6,rub:[["would + base verb",4],["Makes sense",2]],model:"If I were a superhero, I would protect the forests and the animals."}]},
 {k:"Will / going to",text:``,parts:[
  {q:"5. Write will or be going to:<br>a) Look at those black clouds! It ______ rain.<br>b) I think robots ______ teach us one day.<br>c) We ______ visit Cappadocia in July. We have the tickets.<br>d) 'The bag is heavy.' 'I ______ help you.'",pts:12,rub:[["a) is going to",3],["b) will",3],["c) are going to",3],["d) will / 'll",3]],model:"a) is going to b) will c) are going to d) 'll (will)"}]},
 {k:"Writing",text:``,parts:[
  {q:"6. Write 4–5 sentences about your dream job. What are you going to do to make your dream come true? Use 'going to', 'will' and 'if'.",pts:16,rub:[["Names a job and says why",4],["Uses be going to for plans",4],["Uses will for a prediction",4],["Uses an if-sentence correctly",4]],model:"I want to be a vet because I love animals. I'm going to study hard at science. I'm also going to help at an animal shelter. I think I will be a good vet. If I become a vet, I will help sick animals every day."}]}
]},
"ex-en-dinle":{s:"en",kind:"exam",title:"English Listening Exam",sub:"Listen to Ella and answer 6 questions",mins:20,lang:"en-GB",
 listen:"Hi! My name is Ella and I'm eleven years old. I'm from Canada, so I'm Canadian, but now I live in Ankara with my family. I go to a big school near my house. My favourite place at school is the library because I love reading books. I'm in the chess club and the drama club. We have chess club on Wednesdays at half past three. At our school, we must wear a uniform and we mustn't run in the corridors. We can't use our phones in class either. My favourite lesson is Science, but I don't like Maths very much. Next week is very exciting. We are going to visit a science museum on Friday. I think it will be great fun!",
 qs:[{k:"Listening",parts:[
  {q:"1. Where is Ella from and what is her nationality?",pts:16,rub:[["Canada",8],["Canadian",8]],model:"She is from Canada. She is Canadian."},
  {q:"2. What is her favourite place at school and why?",pts:16,rub:[["The library",8],["Because she loves reading books",8]],model:"The library, because she loves reading books."},
  {q:"3. Which clubs is Ella in? When is chess club?",pts:20,rub:[["Chess club and drama club",10],["On Wednesdays at half past three",10]],model:"The chess club and the drama club. Chess club is on Wednesdays at half past three."},
  {q:"4. Write two school rules from the text.",pts:16,rub:[["One rule (must wear a uniform / mustn't run / can't use phones)",8],["A second rule",8]],model:"They must wear a uniform. They mustn't run in the corridors. They can't use their phones in class."},
  {q:"5. Which lesson does she like, and which doesn't she like?",pts:16,rub:[["Likes Science",8],["Doesn't like Maths",8]],model:"She likes Science, but she doesn't like Maths."},
  {q:"6. What is Ella going to do next Friday?",pts:16,rub:[["Visit a science museum",16]],model:"She is going to visit a science museum."}]}]
},
"ex-fen-cam":{s:"fen",kind:"exam",title:"Cambridge Science Practice Exam",sub:"Gases · digestive system · balanced diet · open-ended",mins:40,qs:[
 {k:"States of matter",text:`<div class="chain">Box A: ●●●●<br>●●●● (packed in rows) · Box B: ● ●● ●<br>●● ● ● (close, jumbled) · Box C: ●&nbsp;&nbsp;&nbsp;● &nbsp;&nbsp;●<br>&nbsp;●&nbsp;&nbsp;&nbsp;&nbsp;● (far apart)</div>`,parts:[
  {q:"1.1 Which box shows a solid, a liquid and a gas?",pts:6,rub:[["A = solid",2],["B = liquid",2],["C = gas",2]],model:"A is a solid, B is a liquid and C is a gas."},
  {q:"1.2 Describe how the particles move in a gas.",pts:6,rub:[["Far apart",3],["Move quickly in all directions",3]],model:"Gas particles are far apart and move quickly in all directions."}]},
 {k:"Gases",text:``,parts:[
  {q:"2.1 Why can we squash (compress) a gas but not a liquid?",pts:6,rub:[["Gas particles have big spaces between them",3],["Liquid particles are already close together",3]],model:"There is a lot of space between gas particles, so they can be pushed closer. Liquid particles are already close together."},
  {q:"2.2 Mum is baking bread in the kitchen. You smell it in your bedroom. Explain why.",pts:6,rub:[["Gas particles from the bread spread out / move everywhere",4],["Names diffusion",2]],model:"Gas particles from the bread spread out through the air until they reach my bedroom. This is called diffusion."},
  {q:"2.3 How can you show that air has mass?",pts:6,rub:[["Weigh a ball / balloon empty and then pumped up",3],["The pumped-up one is heavier",3]],model:"Weigh a flat football, then pump it up and weigh it again. It is heavier, so the air inside has mass."}]},
 {k:"Changes of state",text:``,parts:[
  {q:"3. Name the change: a) puddles dry in the sun · b) drops form on a cold glass · c) ice cream melts in your hand",pts:9,rub:[["a) evaporation",3],["b) condensation",3],["c) melting",3]],model:"a) evaporation b) condensation c) melting"}]},
 {k:"Digestive system",text:``,parts:[
  {q:"4.1 Write the parts of the digestive system in order, starting with the mouth.",pts:10,rub:[["mouth → oesophagus → stomach",5],["→ small intestine → large intestine → rectum → anus",5]],model:"mouth, oesophagus, stomach, small intestine, large intestine, rectum, anus"},
  {q:"4.2 What is the job of: a) saliva b) the stomach c) the small intestine d) the large intestine",pts:12,rub:[["a) softens/wets food, starts digestion",3],["b) churns food, acid kills germs",3],["c) nutrients absorbed into the blood",3],["d) water absorbed",3]],model:"a) Saliva makes food soft and wet and starts digestion. b) The stomach churns food and its acid kills germs. c) Nutrients pass into the blood in the small intestine. d) Water is absorbed in the large intestine."}]},
 {k:"Balanced diet",text:`<p>Deniz's lunch box: 🍫 chocolate bar · 🥤 cola · 🍟 crisps · 🍞 white bread</p>`,parts:[
  {q:"5.1 Is Deniz's lunch balanced? Explain your answer.",pts:15,rub:[["Says it is not balanced",5],["Too much sugar/fat",5],["Missing protein / vitamins / fibre",5]],model:"No. It has too much sugar and fat, and there is no protein, fruit or vegetables (vitamins, minerals and fibre)."},
  {q:"5.2 Suggest two changes and say which nutrient each one adds.",pts:8,rub:[["Change 1 with correct nutrient",4],["Change 2 with correct nutrient",4]],model:"Swap the crisps for an apple (vitamins and fibre). Add a cheese or egg sandwich on wholegrain bread (protein and fibre). Drink water instead of cola."},
  {q:"5.3 What is the job of protein and of carbohydrate?",pts:16,rub:[["Protein: growth and repair",8],["Carbohydrate: energy",8]],model:"Protein helps us grow and repairs the body. Carbohydrate gives us energy."}]}
]}
};

SETS["en-speak"]={s:"en",kind:"speak",title:"English Speaking Exam Practice",sub:"6 speaking tasks with sample answers and a checklist",tasks:[
 {t:"Introduce yourself",p:"Say your name, age, where you are from, your nationality, your school and your class.",ph:["My name is …","I'm … years old.","I'm from Türkiye. I'm Turkish.","I go to … school. I'm in class 5-…"],m:"Hello! My name is Kuzey. I'm ten years old. I'm from Türkiye, so I'm Turkish. I live in Ankara. I go to Beştepe College and I'm in class five."},
 {t:"My school and its rules",p:"Talk about your school: places you like and three school rules.",ph:["My favourite place is the … because …","We must / have to …","We mustn't / can't …"],m:"My school is big. My favourite place is the library because I love reading. We have to wear a uniform and we must be on time. We mustn't run in the corridors and we can't use our phones in class."},
 {t:"My timetable",p:"Talk about your lessons. Which lessons do you have on Monday and at what time? Use quarter past, half past, quarter to.",ph:["On Monday, we have …","… is at quarter past nine.","My favourite lesson is … because …"],m:"On Monday, we have Maths at nine o'clock. Then we have Science at quarter past ten. English is at half past eleven. My favourite lesson is Science because I love doing experiments."},
 {t:"Likes and dislikes",p:"Talk about things you love, like, don't like and hate doing. Add a club you want to join.",ph:["I love + -ing","I don't mind + -ing","I can't stand + -ing","I want to join the … club."],m:"I love playing football and I like drawing. I don't mind doing homework, but I hate getting up early. I want to join the chess club because I enjoy thinking."},
 {t:"Plans and predictions",p:"What are you going to do this weekend? What do you think your life will be like in 20 years?",ph:["This weekend, I'm going to …","I think I will …","Maybe …"],m:"This weekend, I'm going to visit my grandparents and I'm going to play games with my cousin. In twenty years, I think I will be an engineer. Maybe I will build robots."},
 {t:"My dream job",p:"What is your dream job? Why? What will you do if you get it?",ph:["I want to be a … because …","If I become a …, I will …","I'm going to … to make my dream come true."],m:"I want to be a game designer because I love making games. I'm going to learn coding. If I become a game designer, I will make fun games for children."}
]};

LESSONS["L-din-duzen"].pages.splice(2,0,{h:"Ayetlerde ve doğada düzen",html:`<blockquote>“Güneş ve ay bir hesaba göre hareket etmektedir.”<br><span class="ex">(Rahmân suresi, 5. ayet)</span></blockquote>

LESSONS["L-din-esma"].pages.push({h:"Güzel isimlerle dua yazmak",html:`<p>Sınavda bir durum verilir ve “uygun bir isimle dua yaz” denir. Formül:</p>
<p class="big-mnemonic" style="font-size:20px">Ya + isim! + ismin anlamı + isteğin</p>
<ul><li>Sınav heyecanı: “<b>Ya Alîm!</b> Her şeyi bilirsin; öğrendiklerimi hatırlamamı kolaylaştır.”</li>
<li>Pişmanlık: “<b>Ya Rahîm!</b> Merhametin sonsuzdur; hatamı bağışla.” (ya da Ya Gafûr)</li>
<li>Korku: “<b>Ya Basîr!</b> Her yeri görürsün; beni koru.” (ya da Ya Hafîz)</li>
<li>Bir istek: “<b>Ya Semî!</b> Duamı işitirsin; hasta dedemize şifa ver.”</li>
<li>Zor bir iş: “<b>Ya Kadîr!</b> Her şeye gücün yeter; bu işi bana kolaylaştır.”</li></ul>
<p class="ex">Puan: doğru isim + ismin anlamını kullanman + duruma uygun istek.</p>`,
 check:{q:"Arkadaşıyla küsen ve barışmak isteyen Zeynep için en uygun dua hangisidir?",o:["“Ya Semî! Duamı işitirsin; arkadaşımla barışmamı kolaylaştır.”","“Ya Rezzâk! Bana rızık ver.”","“Ya Musavvir! Bana şekil ver.”","“Ya Hâlık! Beni yarat.”"],e:"Durum, isim ve istek uyumlu olmalı."}});

 {h:"Rules: imperatives, can't, mustn't",html:`<ul><li><b>Imperatives</b> (commands): <i>Open your books. Stand up, please.</i> Negative: <i><b>Don't</b> be late! <b>Don't</b> shout!</i></li>
<li><b>can't</b> = not allowed: <i>You <b>can't</b> use your phone in class.</i></li><li><b>mustn't</b> = it's against the rules: <i>You <b>mustn't</b> run in the corridors.</i></li>
<li><b>must / have to</b> = necessary: <i>We <b>must</b> wear a uniform.</i></li></ul>
<p><b>National days:</b> 23 April – National Sovereignty and Children's Day · 19 May – Commemoration of Atatürk, Youth and Sports Day · 30 August – Victory Day · 29 October – Republic Day · 15 July – Democracy and National Unity Day</p>`,
 check:{q:"Which sentence is a negative imperative?",o:["Don't eat in the library.","You must eat lunch.","I don't like eating.","Can you eat?"],e:"Don't + verb = negative command."}},
 {h:"a / an / the, subjects & timetable",html:`<ul><li><b>a</b> + consonant sound: a book, a ruler, a teacher</li><li><b>an</b> + vowel sound: an apple, an eraser, an English book, an hour</li><li><b>the</b> = a specific one: <i>The library is on the first floor.</i></li></ul>
<p><b>Subjects:</b> Maths, Science, Turkish, English, Social Studies, Art, Music, PE, ICT, Religious Culture</p>
<p><b>Timetable:</b> <i>What time is the Maths lesson? It's at quarter past nine. · We have Art on Tuesday. · What's your favourite lesson? It's Science.</i></p>
<p><b>Days:</b> Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday</p>`,
 check:{q:"I have ___ eraser and ___ ruler.",o:["an / a","a / an","the / an","a / a"],e:"an eraser (vowel sound), a ruler."}}
]};

// quiz
function quizQuestions(set){
  if(set.gen==="clock")return clockQuestions(set.n);
  if(set.mix){const all=set.mix.flatMap(m=>SETS[m].qs);return shuffle(all).slice(0,set.n)}
  return set.qs.slice();
}
function runQuiz(id,set,only){
  const qs=only||quizQuestions(set);let i=0,score=0;const wrong=[];
  const show=()=>{
    if(i>=qs.length)return end();
    const q=qs[i],opts=shuffle(q.o.map((t,k)=>({t,ok:k===0})));
    body().innerHTML=`<div class="progress">Question ${i+1} of ${qs.length} · ${score} right</div>
      ${q.p?`<div class="passage">${esc(q.p)}</div>`:""}${q.v?`<div class="visual">${q.v}</div>`:""}
      <div class="q">${q.q}</div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}</div><div id="fb"></div>`;
    body().querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,ok=opts[k].ok;
      body().querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(opts[j].ok)x.classList.add("right")});
      hit(ok);if(ok){score++;addXP(10)}else{b.classList.add("wrong");wrong.push(q)}
      $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"✓ Right!":"✗ Not quite."} ${esc(q.e||"")}</div>
        <div class="row" style="margin-top:12px"><button class="btn" id="nx">${i+1<qs.length?"Next →":"See score"}</button></div>`;
      $("#nx").onclick=()=>{i++;show();$("#sheet").scrollTop=0};$("#nx").focus();
    });
  };
  const end=()=>scoreEnd(id,set,score,qs.length,wrong,only,()=>runQuiz(id,set),w=>runQuiz(id,set,w));
  show();
}

// flashcards: cards you miss come back until you know them all
function runCards(id,set){

        <div class="row center"><button class="btn quiet" id="ra">Go again</button><button class="btn" id="cl">Finish</button></div>`;
      $("#ra").onclick=()=>runCards(id,set);$("#cl").onclick=closeSheet;return}
    const c=deck[0];
    body().innerHTML=`<div class="progress">Known ${known} of ${total} · ${deck.length} left</div>
      <div class="card3d" id="cd" role="button" tabindex="0" aria-label="Flip card"><div class="flip" id="fl"><div class="face f">${esc(c.f)}</div><div class="face b">${c.b}</div></div></div>
      <p class="hint">Tap the card to flip it. Say the answer out loud first!</p>
      <div class="row center"><button class="btn quiet" id="ag">↻ Again later</button><button class="btn" id="kn">✓ I knew it</button></div>`;
    const flip=()=>$("#fl").classList.toggle("on");
    $("#cd").onclick=flip;$("#cd").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}};
    $("#kn").onclick=()=>{deck.shift();known++;show()};
    $("#ag").onclick=()=>{deck.push(deck.shift());if(deck.length>1){const c2=deck.pop();deck.splice(Math.min(3,deck.length),0,c2)}show()};
  };
  show();
}

// listening: the device reads the text aloud, then questions
function runListen(id,set){
  let plays=0;const can="speechSynthesis" in window;
  const pickVoice=()=>{const vs=speechSynthesis.getVoices(),l=set.lang.toLowerCase(),base=l.slice(0,2);
    return vs.find(v=>v.lang.toLowerCase().replace("_","-")===l)||vs.find(v=>v.lang.toLowerCase().startsWith(base))||null};
  const speak=()=>{
    if(!can)return;speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(set.text);u.lang=set.lang;u.rate=.9;const v=pickVoice();if(v)u.voice=v;
    u.onstart=()=>$("#pl")&&($("#pl").textContent="⏸");u.onend=()=>$("#pl")&&($("#pl").textContent="▶");
    speechSynthesis.speak(u);plays++;$("#pc")&&($("#pc").textContent=`Played ${plays} time${plays>1?"s":""}. In the real exam you usually hear it twice.`);
  };
  if(can){speechSynthesis.getVoices();cleanup=()=>speechSynthesis.cancel()}
  body().innerHTML=`<div class="notes"><h3>How it works</h3><p>Press play and listen <b>without reading</b>. You can take notes on paper: names, places, numbers. Then answer the questions.</p></div>
    ${can?`<button class="play" id="pl" aria-label="Play">▶</button><p class="hint" id="pc">Turn the sound on, then press play.</p>`:
    `<p class="hint">This device can't read aloud. Ask someone to read this text to you twice:</p><div class="passage">${esc(set.text)}</div>`}
    <div class="row center"><button class="btn" id="go">I'm ready – questions →</button></div>`;
  if(can)$("#pl").onclick=()=>{if(speechSynthesis.speaking){speechSynthesis.cancel();$("#pl").textContent="▶"}else speak()};
  $("#go").onclick=()=>{if(can)speechSynthesis.cancel();runQuiz(id,set);
    // after the quiz, offer the text
    const obs=new MutationObserver(()=>{if(body().querySelector(".result")&&!body().querySelector("#txt")){obs.disconnect();
      body().insertAdjacentHTML("beforeend",`<div class="notes" id="txt" style="margin-top:18px"><h3>The text</h3><p>${esc(set.text)}</p></div>`)}});
    obs.observe(body(),{childList:true});const prev=cleanup;cleanup=()=>{obs.disconnect();if(prev)prev()};
  };
}

const norm=s=>s.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?,]/g,"").replace(/\s+/g," ").trim();

}

// clock game questions, made fresh every time
const NUMW=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
const MINW={5:"five",10:"ten",15:"quarter",20:"twenty",25:"twenty-five",30:"half"};
const hn=h=>NUMW[(h-1)%12+1];
const timePhrase=(h,m)=>m===0?`${hn(h)} o'clock`:m<=30?`${MINW[m]} past ${hn(h)}`:`${MINW[60-m]} to ${hn(h+1)}`;
function clockSVG(h,m){
  const R=a=>a*Math.PI/180,ha=R(((h%12)+m/60)*30),ma=R(m*6);let ticks="",nums="";
  for(let k=0;k<60;k++){const a=R(k*6),r1=k%5?85:79;ticks+=`<line x1="${(100+r1*Math.sin(a)).toFixed(1)}" y1="${(100-r1*Math.cos(a)).toFixed(1)}" x2="${(100+90*Math.sin(a)).toFixed(1)}" y2="${(100-90*Math.cos(a)).toFixed(1)}" stroke-width="${k%5?1.5:3}"/>`}
  for(let k=1;k<=12;k++){const a=R(k*30);nums+=`<text x="${(100+66*Math.sin(a)).toFixed(1)}" y="${(100-66*Math.cos(a)+6).toFixed(1)}">${k}</text>`}
  return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="An analogue clock"><circle cx="100" cy="100" r="96" class="cface"/><g class="ticks">${ticks}</g><g class="nums">${nums}</g>
    <line x1="100" y1="100" x2="${(100+44*Math.sin(ha)).toFixed(1)}" y2="${(100-44*Math.cos(ha)).toFixed(1)}" class="hh"/>
    <line x1="100" y1="100" x2="${(100+72*Math.sin(ma)).toFixed(1)}" y2="${(100-72*Math.cos(ma)).toFixed(1)}" class="mh"/><circle cx="100" cy="100" r="5" class="pin"/></svg>`;
}
function clockQuestions(n){
  const ms=[0,5,10,15,20,25,30,35,40,45,50,55],qs=[];
  for(let i=0;i<n;i++){
    const h=1+Math.floor(Math.random()*12),m=ms[Math.floor(Math.random()*ms.length)],right=timePhrase(h,m),cand=new Set();
    [[h,(m+30)%60],[h+1,m],[h+11,m],[h,(60-m)%60],[h,(m+15)%60]].forEach(([a,b])=>{const t=timePhrase((a-1)%12+1,b);if(t!==right)cand.add(t)});
    const digital=i%3===2;
    qs.push({v:digital?`<div class="digital">${h}:${pad(m)}</div>`:clockSVG(h,m),q:digital?"How do you say this time?":"What time is it?",
      o:["It's "+right,...shuffle([...cand]).slice(0,3).map(w=>"It's "+w)],e:`${h}:${pad(m)} = ${right}.`});
  }
  return qs;
}

function barChart(c,tapKey,sel){
  const max=Math.max(...c.data.map(d=>d[1])),W=420,bh=34,gap=12,left=120,H=c.data.length*(bh+gap)+14;

    c.data.map((d,i)=>{const y=6+i*(bh+gap),w=Math.max(4,(W-left-50)*d[1]/max);
      return `<g class="${tapKey?"tapbar":""}${sel===d[0]?" on":""}" ${tapKey?`data-tap="${tapKey}" data-label="${esc(d[0])}" tabindex="0" role="button" aria-label="${esc(d[0])}: ${d[1]}"`:""}><text x="${left-8}" y="${y+bh/2+5}" text-anchor="end" class="cl">${esc(d[0])}</text><rect x="${left}" y="${y}" width="${w}" height="${bh}" rx="6" class="cb"/><text x="${left+w+6}" y="${y+bh/2+5}" class="cv">${d[1]}</text></g>`}).join("")+
    `</svg></figure>`;
}
// answers are compared without caring about capitals, extra spaces or the apostrophe style
const normA=(s,keepPunct)=>{s=String(s||"").replace(/[’‘`´]/g,"'").trim();if(keepPunct)return s;
  return s.toLocaleLowerCase("tr").replace(/ı/g,"i").replace(/[.!?,;:]+$/g,"").replace(/\s+/g," ").replace(/â/g,"a").replace(/î/g,"i").replace(/û/g,"u")};
const isPunct=a=>a.every(x=>/^[.,?!:;'’]$/.test(x));
const okAns=(given,acc)=>{const p=isPunct(acc),g=normA(given,p);return g!==""&&acc.some(a=>normA(a,p)===g)};
// how many items of an automatic part are right
function autoScore(p,v){
  if(p.type==="gaps"){let n=0,ok=0;p.items.forEach((it,i)=>it.a.forEach((acc,j)=>{n++;if(okAns((v||{})[i+"."+j],acc))ok++}));return[ok,n]}
  if(p.type==="table"){let n=0,ok=0;p.rows.forEach((r,ri)=>r.forEach((c,ci)=>{if(c&&c.a){n++;if(okAns((v||{})[ri+"."+ci],c.a))ok++}}));return[ok,n]}
  if(p.type==="tap")return[v===p.a?1:0,1];
  if(p.type==="match"){let ok=0;p.pairs.forEach((_,i)=>{if(v&&v.m&&+v.m[i]===i)ok++});return[ok,p.pairs.length]}
  return[0,0];
}

  const E=SETS[id];openSheet(E.title,E.s);S.drafts=S.drafts||{};const D=S.drafts[id]=S.drafts[id]||{};
  const parts=[];E.qs.forEach((q,qi)=>q.parts.forEach((p,pi)=>parts.push({qi,pi,key:qi+"."+pi,p})));
  const total=parts.reduce((a,x)=>a+x.p.pts,0);
  const intro=()=>{
    body().innerHTML=`<div class="examhead"><div class="big">📝</div><h2>${esc(E.title)}</h2><p>${esc(E.sub)}</p>
      <ul class="rules">${E.mixed?"<li>Bu karma denemede <b>tablo doldurma, grafiğe dokunma, eşleştirme ve boşluk doldurma</b> soruları otomatik puanlanır. Yazılı sorular ise cevap anahtarıyla kendin puanlarsın.</li>":"<li>Bütün sorular <b>açık uçlu</b>: cevabını kendi cümlelerinle yaz.</li>"}
      <li>${E.listen?"Önce metni dinle (en fazla 2 kez). Metin ekranda görünmez.":"Gerçek sınav gibi "+E.mins+" dakikan var."}</li>
      <li>Bitirince <b>cevap anahtarı</b> ve <b>puanlama ölçütleri</b> açılır.</li><li>Yaptıkların kaydedilir; çıkıp sonra devam edebilirsin.</li></ul>
      ${S.best[id]!=null?`<p class="mute">En iyi puanın: ${S.best[id]} / 100</p>`:""}</div>
      <div class="row center"><button class="btn" id="st">${Object.keys(D).length?"Devam et →":"Sınava başla →"}</button>${Object.keys(D).length?'<button class="btn quiet" id="clr">Boş kâğıtla başla</button>':""}</div>`;
    $("#st").onclick=paper;if($("#clr"))$("#clr").onclick=()=>{S.drafts[id]={};S.drafts[id+"#g"]={};save();runExam(id)};
  };
  const partHTML=(p,k)=>{
    const head=`<div class="pql"><span>${p.q}</span><em>(${p.pts} puan${p.type&&p.type!=="write"?" · otomatik":""})</em></div>`;
    if(p.type==="gaps"){const v=D[k]||{};return `<div class="pp">${head}<ol class="gaps">${p.items.map((it,i)=>{let j=0;
      return `<li>${esc(it.t).replace(/___/g,()=>{const jj=j++;return `<input class="gapin" data-k="${k}" data-c="${i}.${jj}" value="${esc(v[i+"."+jj]||"")}" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="boşluk">`})}</li>`}).join("")}</ol></div>`}
    if(p.type==="table"){const v=D[k]||{};return `<div class="pp">${head}<div class="tblwrap"><table class="tbl fill"><tr>${p.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${p.rows.map((r,ri)=>`<tr>${r.map((c,ci)=>c&&c.a?`<td><input class="cellin" data-k="${k}" data-c="${ri}.${ci}" value="${esc(v[ri+"."+ci]||"")}" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="${esc(p.head[ci]||"")}"></td>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div></div>`}
    if(p.type==="tap"){return `<div class="pp">${head}<p class="hint tapsel" id="ts${k.replace(".","_")}">${D[k]?"Seçimin: <b>"+esc(D[k])+"</b>":"Grafikte bir çubuğa dokun."}</p>${barChart(E.qs[+k.split(".")[0]].chart,k,D[k])}</div>`}
    if(p.type==="match"){const v=D[k]=D[k]||{m:{}};if(!v.o)v.o=shuffle(p.pairs.map((_,i)=>i));
      return `<div class="pp">${head}<div class="match ex" data-mk="${k}"><div class="col">${p.pairs.map((pr,i)=>`<button class="mt" data-s="L" data-i="${i}">${esc(pr[0])}<span class="badge-n"></span></button>`).join("")}</div>
        <div class="col">${v.o.map(i=>`<button class="mt" data-s="R" data-i="${i}">${esc(p.pairs[i][1])}<span class="badge-n"></span></button>`).join("")}</div></div><button class="linkbtn" data-mclear="${k}">Eşleştirmeleri sıfırla</button></div>`}
    return `<div class="pp"><label for="a${k}">${head}</label><textarea id="a${k}" data-k="${k}" rows="3" placeholder="Cevabını buraya yaz…">${esc(D[k]||"")}</textarea></div>`;
  };
  const paintMatch=box=>{const k=box.dataset.mk,v=D[k];const L=[...box.querySelectorAll('[data-s=L]')],R=[...box.querySelectorAll('[data-s=R]')];
    L.forEach(b=>{b.querySelector(".badge-n").textContent="";b.classList.remove("paired","sel")});R.forEach(b=>{b.querySelector(".badge-n").textContent="";b.classList.remove("paired","sel")});
    let n=0;Object.keys(v.m).forEach(l=>{n++;const lb=L.find(b=>b.dataset.i===l),rb=R.find(b=>b.dataset.i===String(v.m[l]));if(lb&&rb){[lb,rb].forEach(b=>{b.classList.add("paired");b.querySelector(".badge-n").textContent=n})}})};
  const paper=()=>{
    const end=Date.now()+E.mins*60e3;let plays=0;
    body().innerHTML=`<div class="examtimer" id="et"></div>
      ${E.listen?`<div class="listenbox"><button class="play" id="pl" aria-label="Metni dinle">▶</button><p class="hint" id="pc">Sesi aç ve dinle. Not almak serbest!</p></div>`:""}
      <ol class="paper">${E.qs.map((q,qi)=>`<li class="pq"><div class="pqh"><span class="qn">${qi+1}</span><span class="kz">${esc(q.k)} · ${q.parts.reduce((a,p)=>a+p.pts,0)} puan</span></div>
        ${q.text||""}${q.chart&&!q.parts.some(p=>p.type==="tap")?barChart(q.chart):""}${q.parts.map((p,pi)=>partHTML(p,qi+"."+pi)).join("")}</li>`).join("")}</ol>
      <div class="row center"><button class="btn" id="fin">Sınavı bitir ve kontrol et ✓</button></div>`;
    body().querySelectorAll("textarea").forEach(t=>t.oninput=()=>{D[t.dataset.k]=t.value;save()});
    body().querySelectorAll(".gapin,.cellin").forEach(t=>t.oninput=()=>{const o=D[t.dataset.k]=D[t.dataset.k]||{};o[t.dataset.c]=t.value;save()});
    const tapOn=g=>{const k=g.dataset.tap;D[k]=g.dataset.label;save();g.closest("svg").querySelectorAll(".tapbar").forEach(x=>x.classList.toggle("on",x===g));
      const el=$("#ts"+k.replace(".","_"));if(el)el.innerHTML="Seçimin: <b>"+esc(D[k])+"</b>"};
    body().querySelectorAll(".tapbar").forEach(g=>{g.onclick=()=>tapOn(g);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tapOn(g)}}});
    body().querySelectorAll(".match.ex").forEach(box=>{const k=box.dataset.mk,v=D[k];let sel=null;paintMatch(box);
      box.querySelectorAll(".mt").forEach(b=>b.onclick=()=>{
        const side=b.dataset.s,i=b.dataset.i;
        if(b.classList.contains("paired")){if(side==="L")delete v.m[i];else Object.keys(v.m).forEach(l=>{if(String(v.m[l])===i)delete v.m[l]});save();paintMatch(box);sel=null;return}
        if(!sel||sel.dataset.s===side){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
        const l=side==="L"?i:sel.dataset.i,r=side==="R"?i:sel.dataset.i;v.m[l]=+r;sel=null;save();paintMatch(box)});
      const c=body().querySelector(`[data-mclear="${k}"]`);if(c)c.onclick=()=>{v.m={};save();paintMatch(box)}});
    const tick=()=>{const left=Math.max(0,end-Date.now()),m=Math.floor(left/6e4),s=Math.floor(left%6e4/1e3);const el=$("#et");if(!el)return;
      el.textContent=left?`⏱ ${m}:${pad(s)}`:"⏱ Süre bitti! Cevaplarını kontrol edebilirsin.";el.classList.toggle("late",left<5*60e3)};
    const iv=setInterval(tick,1000);tick();
    let stopSpeak=()=>{};
    if(E.listen){
      const can="speechSynthesis" in window;
      if(!can){$("#pc").innerHTML="Bu cihaz sesli okuyamıyor. Birinden metni sana iki kez okumasını iste:<br><i>"+esc(E.listen)+"</i>"}
      else{speechSynthesis.getVoices();stopSpeak=()=>speechSynthesis.cancel();
        $("#pl").onclick=()=>{if(speechSynthesis.speaking){speechSynthesis.cancel();$("#pl").textContent="▶";return}
          if(plays>=2&&!$("#pl").dataset.ok){$("#pc").innerHTML='Gerçek sınavda metin genellikle 2 kez okunur. <button class="linkbtn" id="again">Yine de dinle</button>';$("#again").onclick=()=>{$("#pl").dataset.ok=1;$("#pl").click()};return}
          const u=new SpeechSynthesisUtterance(E.listen);u.lang=E.lang;u.rate=.88;const vs=speechSynthesis.getVoices(),l=E.lang.toLowerCase();
          const v=vs.find(v=>v.lang.toLowerCase().replace("_","-")===l)||vs.find(v=>v.lang.toLowerCase().startsWith(l.slice(0,2)));if(v)u.voice=v;
          u.onstart=()=>{$("#pl")&&($("#pl").textContent="⏸")};u.onend=()=>{$("#pl")&&($("#pl").textContent="▶")};
          speechSynthesis.speak(u);plays++;$("#pc").textContent=`${plays}. dinleme`}}
    }
    cleanup=()=>{clearInterval(iv);stopSpeak()};
    $("#fin").onclick=()=>{if(cleanup){cleanup();cleanup=null}grade();$("#sheet").scrollTop=0};
  };
  const autoDetail=(p,k)=>{const v=D[k];const mk=(ok,txt)=>`<li class="${ok?"good":"badc"}">${ok?"✓":"✗"} ${txt}</li>`;
    if(p.type==="gaps")return p.items.map((it,i)=>{let j=0;return mk(it.a.every((acc,jj)=>okAns((v||{})[i+"."+jj],acc)),esc(it.t).replace(/___/g,()=>{const jj=j++;const g=(v||{})[i+"."+jj];return `<b>${esc(g||"—")}</b>${okAns(g,it.a[jj])?"":` <span class="mute">(doğrusu: ${esc(it.a[jj][0])})</span>`}`}))}).join("");
    if(p.type==="table")return p.rows.map((r,ri)=>r.map((c,ci)=>c&&c.a?mk(okAns((v||{})[ri+"."+ci],c.a),`${esc(r.find(x=>typeof x==="string")||"")} → ${esc(p.head[ci])}: <b>${esc((v||{})[ri+"."+ci]||"—")}</b>${okAns((v||{})[ri+"."+ci],c.a)?"":` <span class="mute">(doğrusu: ${esc(c.a[0])})</span>`}`):"").join("")).join("");
    if(p.type==="tap")return mk(v===p.a,`Seçimin: <b>${esc(v||"—")}</b>${v===p.a?"":` <span class="mute">(doğrusu: ${esc(p.a)})</span>`}`);
    if(p.type==="match")return p.pairs.map((pr,i)=>{const g=v&&v.m&&v.m[i]!=null?p.pairs[v.m[i]][1]:"—";return mk(g===pr[1],`${esc(pr[0])} → <b>${esc(g)}</b>${g===pr[1]?"":` <span class="mute">(doğrusu: ${esc(pr[1])})</span>`}`)}).join("");
    return "";};
  const grade=()=>{
    const G=S.drafts[id+"#g"]=S.drafts[id+"#g"]||{};let auto=0;
    const html=E.qs.map((q,qi)=>`<li class="pq"><div class="pqh"><span class="qn">${qi+1}</span><span class="kz">${esc(q.k)}</span></div>
      ${q.parts.map((p,pi)=>{const k=qi+"."+pi;
        if(p.type&&p.type!=="write"){const [ok,n]=autoScore(p,D[k]),pts=Math.round(p.pts*ok/n);auto+=pts;
          return `<div class="pp graded"><div class="pq2">${p.q}</div><div class="autobox"><b>Otomatik puan: ${pts} / ${p.pts}</b> <span class="mute">(${ok}/${n} doğru)</span><ul>${autoDetail(p,k)}</ul></div></div>`}
        return `<div class="pp graded"><div class="pq2">${p.q}</div>
          <div class="yours"><b>Senin cevabın:</b> ${D[k]?esc(D[k]).replace(/\n/g,"<br>"):'<span class="mute">(boş)</span>'}</div>
          <div class="model"><b>Cevap anahtarı:</b> ${esc(p.model)}</div>
          <div class="rubric">${p.rub.map((r,ri)=>`<label><input type="checkbox" data-g="${k}.${ri}" data-pts="${r[1]}" ${G[k+"."+ri]?"checked":""}><span>${esc(r[0])}</span><b>${r[1]}</b></label>`).join("")}</div></div>`}).join("")}</li>`).join("");
    const hasWritten=parts.some(x=>!x.p.type||x.p.type==="write");
    body().innerHTML=`<div class="notes"><h3>Kendini puanla</h3><p>${E.mixed?"Tablo, grafik, eşleştirme ve boşluk soruları <b>otomatik puanlandı</b>. ":""}${hasWritten?"Yazılı sorularda cevap anahtarına bak ve cevabında olan her ölçütü işaretle. Dürüst ol, öğretmen de böyle puanlar!":""}</p></div>
      ${E.listen?`<details class="notes"><summary><b>Dinleme metnini göster</b></summary><p>${esc(E.listen)}</p></details>`:""}
      <ol class="paper">${html}</ol>
      <div class="scorebar"><span>Puanın: <b id="sc">0</b> / ${total}</span><button class="btn" id="save">Puanımı kaydet</button></div>`;
    const upd=()=>{let s=auto;body().querySelectorAll("[data-g]").forEach(c=>{G[c.dataset.g]=c.checked;if(c.checked)s+=+c.dataset.pts});$("#sc").textContent=s;save();return s};
    body().querySelectorAll("[data-g]").forEach(c=>c.onchange=upd);upd();
    $("#save").onclick=()=>{
      const s=Math.round(upd()/total*100),prev=S.best[id];S.best[id]=Math.max(prev||0,s);S.stats.exams=(S.stats.exams||0)+1;if(s>=85)S.stats.examHigh=true;
      addXP(Math.round(s/2));finishTask();if(s>=85)confetti();
      body().innerHTML=`<div class="result"><div class="big">${s}</div><p>/ 100 · +${Math.round(s/2)} XP</p>
        <p>${s>=85?"Harika! Bu sınava hazırsın. 🌟":s>=70?"Çok iyi! Kaçırdığın ölçütlere bir daha bak.":s>=50?"İyi bir başlangıç. Konu anlatımını tekrar et, sonra yeniden dene.":"Önce konu anlatımını oku, sonra boş kâğıtla tekrar dene."}</p>
        ${prev!=null?`<p class="mute">Önceki en iyi puanın: ${prev}</p>`:""}</div>
        <div class="row center"><button class="btn quiet" id="again">Boş kâğıtla tekrar çöz</button><button class="btn" id="cl">Bitir</button></div>`;
      $("#again").onclick=()=>{S.drafts[id]={};S.drafts[id+"#g"]={};save();runExam(id)};$("#cl").onclick=closeSheet;
    };
  };
  intro();
}

WIDGETS.chart5a=el=>{el.innerHTML='<div class="wtitle">📊 Örnek grafik</div>'+barChart({title:"5-A sınıfı: en sevilen oyun (28 öğrenci)",data:[["Saklambaç",9],["Futbol",7],["Mendil kapmaca",5],["Seksek",4],["Satranç",3]]})};

// ---------- speaking practice ----------
function runSpeak(id){
  const X=SETS[id];openSheet(X.title,X.s);let i=0,rec=null,chunks=[],url=null,recog=null;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const stopAll=()=>{try{rec&&rec.state==="recording"&&rec.stop()}catch(e){}try{recog&&recog.stop()}catch(e){}if("speechSynthesis" in window)speechSynthesis.cancel()};
  cleanup=stopAll;
  const sayModel=t=>{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.9;
    const v=speechSynthesis.getVoices().find(v=>/^en[-_]GB/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)};
  const show=()=>{
    stopAll();if(i>=X.tasks.length)return done();
    const T=X.tasks[i];
    body().innerHTML=`<div class="dots">${X.tasks.map((_,k)=>`<i class="${k<i?"past":k===i?"now":""}"></i>`).join("")}<span>Task ${i+1} / ${X.tasks.length}</span></div>
      <article class="lesson"><h2>🎤 ${esc(T.t)}</h2><p class="task-p">${esc(T.p)}</p>
      <div class="box"><b>Useful phrases</b><ul>${T.ph.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="speakctl"><div class="timer small" id="sp">0:30</div><p class="hint" id="sph">Press <b>Prepare</b>: 30 seconds to think, then speak for about 1 minute.</p>
      <div class="row center"><button class="btn" id="prep">⏳ Prepare (30 s)</button><button class="btn quiet" id="go">🎙️ Start speaking</button></div>
      <div id="recarea"></div><p class="transcript" id="tr" hidden></p></div>
      <details class="notes"><summary><b>Sample answer</b> (listen or read after you try)</summary><p>${esc(T.m)}</p><button class="btn small quiet" id="hear">🔊 Listen to the sample</button></details>
      <div class="box"><b>Check yourself</b>${["I answered every part of the task.","I spoke for about one minute.","I used full sentences.","I used some of the useful phrases.","I spoke clearly, not too fast."].map((c,k)=>`<label class="ck"><input type="checkbox" data-c="${k}"> ${c}</label>`).join("")}</div></article>
      <div class="row lessonnav">${i?'<button class="btn quiet" id="pv">← Back</button>':""}<button class="btn" id="nx">${i+1<X.tasks.length?"Next task →":"Finish ✓"}</button></div>`;
    $("#hear").onclick=()=>sayModel(T.m);
    let iv=null;const countdown=(sec,label,after)=>{clearInterval(iv);let left=sec;$("#sp").textContent=Math.floor(left/60)+":"+pad(left%60);$("#sph").textContent=label;
      iv=setInterval(()=>{left--;$("#sp")&&($("#sp").textContent=Math.floor(left/60)+":"+pad(left%60));if(left<=0){clearInterval(iv);after&&after()}},1000)};
    const prevClean=cleanup;cleanup=()=>{clearInterval(iv);stopAll()};
    $("#prep").onclick=()=>countdown(30,"Think about what you will say. You can look at the useful phrases.",()=>{$("#sph").textContent="Time to speak!";startSpeak()});
    $("#go").onclick=()=>startSpeak();
    const startSpeak=async()=>{
      countdown(60,"Speak now! Talk for about one minute.",()=>stopSpeak());
      $("#recarea").innerHTML="";
      try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);
        rec.ondataavailable=e=>chunks.push(e.data);
        rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||"audio/webm"}));
          $("#recarea")&&($("#recarea").innerHTML=`<p class="hint">Listen to yourself:</p><audio controls src="${url}"></audio>`)};
        rec.start();$("#recarea").innerHTML='<p class="recdot">● Recording… <button class="btn small quiet" id="stopr">Stop</button></p>';$("#stopr").onclick=()=>stopSpeak();
      }catch(e){$("#recarea").innerHTML='<p class="hint">Recording isn’t available here. That’s fine: speak out loud, maybe to someone at home, and use the checklist.</p>'}
      if(SR){try{recog=new SR();recog.lang="en-GB";recog.continuous=true;recog.interimResults=true;
        recog.onresult=ev=>{let t="";for(const r of ev.results)t+=r[0].transcript+" ";const el=$("#tr");if(el){el.hidden=false;el.textContent="What the device heard: "+t}};recog.onerror=()=>{};recog.start()}catch(e){}}
    };
    const stopSpeak=()=>{clearInterval(iv);try{rec&&rec.state==="recording"&&rec.stop()}catch(e){}try{recog&&recog.stop()}catch(e){}$("#sph")&&($("#sph").textContent="Well done! Listen to yourself, then compare with the sample answer.")};
    if(i)$("#pv").onclick=()=>{i--;show()};
    $("#nx").onclick=()=>{const ticked=body().querySelectorAll("[data-c]:checked").length;addXP(5+ticked*3);i++;show();$("#sheet").scrollTop=0};
    void prevClean;
  };
  const done=()=>{S.stats.spoke=true;finishTask();confetti();
    body().innerHTML=`<div class="result"><div class="big">🎤</div><p><b>Speaking practice complete!</b></p><p class="mute">Tip: do it again tomorrow morning, out loud, without looking at the phrases.</p></div>
      <div class="row center"><button class="btn quiet" id="ra">Practise again</button><button class="btn" id="cl">Finish</button></div>`;
    $("#ra").onclick=()=>{i=0;show()};$("#cl").onclick=closeSheet};
  show();
}

// ---------- start ----------
renderNext();renderPlan();renderXP();updateRewardDot();
setInterval(renderNext,60e3);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
})();
