// ---------- rewards: badges, stickers, chests and a study pet ----------
const PETS=[[1,"🥚","Yumurta"],[2,"🐣","Civciv"],[3,"🐥","Minik kuş"],[5,"🦜","Papağan"],[7,"🦉","Bilge Baykuş"],[10,"🐉","Ejderha"]];
const petFor=lv=>PETS.filter(p=>lv>=p[0]).pop();
const STICKERS=["🦊","🐼","🐙","🦖","🐳","🐝","🦋","🐢","🦁","🐧","🚀","🛸","🌋","⚽","🎸","🎮","🧪","🔭","🧲","🌙","⭐","🍕","🍩","🍉","🏆","🦕","🦈","🐱","🐶","🎨","💎","👑","🐲","🌈","🪐","🦄"];
const RARE=new Set(["💎","👑","🐲","🌈","🪐","🦄"]);
const allTaskIds=()=>DAYS.flatMap(d=>d.tasks.map(t=>t.id));
const subjOK=s=>Object.keys(SETS).filter(id=>SETS[id].s===s&&["quiz","sort","type","listen"].includes(SETS[id].kind)).every(id=>(S.best[id]||0)>=80);
const BADGES=[
 ["first","🚀","İlk adım","Finish your first task",()=>Object.keys(S.done).length>=1],
 ["lesson1","📖","Konu kurdu","Finish your first lesson",()=>Object.keys(S.lessons).length>=1],
 ["day","📅","Gün tamam","Finish every task of one day",()=>DAYS.some(d=>d.tasks.every(t=>S.done[t.id]))],
 ["perfect","💯","Mükemmel","Get 100% in a quiz, sort or typing game",()=>S.stats.perfect>=1],
 ["perfect5","🏅","Beş yıldız","Get 100% five times",()=>S.stats.perfect>=5],
 ["streak10","🔥","Alev alev","10 right answers in a row",()=>S.stats.maxStreak>=10],
 ["streak25","☄️","Durdurulamaz","25 right answers in a row",()=>S.stats.maxStreak>=25],
 ["speed200","⚡","Hız canavarı","200+ points in a 60-second challenge",()=>Object.keys(SETS).some(id=>SETS[id].kind==="speed"&&(S.best[id]||0)>=200)],
 ["match45","🧩","Eşleştirme ustası","Finish a match game in under 45 seconds",()=>Object.values(S.bestTime||{}).some(t=>t<45)],
 ["clock","🕒","Saat ustası","12/12 in the clock game",()=>(S.best["en-time"]||0)===100],
 ["future","🔮","Future master","100% in “Type it: will or going to”",()=>(S.best["en-will-type"]||0)===100],
 ["tr","📝","Türkçe şampiyonu","80%+ in every Türkçe quiz",()=>subjOK("tr")],
 ["fen","🔬","Bilim insanı","80%+ in every science quiz",()=>subjOK("fen")],
 ["en","🗣️","English star","80%+ in every English quiz",()=>subjOK("en")],
 ["din","🌙","Din Kültürü yıldızı","80%+ in every Din Kültürü quiz",()=>subjOK("din")],
 ["profesor","🎓","Profesör","Finish all the lessons",()=>Object.keys(LESSONS).every(id=>S.lessons[id])],
 ["lv5","🦜","Papağan","Reach level 5",()=>(S.xp||0)>=4*LV],
 ["lv10","🐉","Ejderha","Reach level 10",()=>(S.xp||0)>=9*LV],
 ["king","👑","Yazılı kralı","Finish every task in the whole plan",()=>allTaskIds().every(id=>S.done[id])]
];
function hit(ok){S.stats.streak=ok?(S.stats.streak||0)+1:0;if(S.stats.streak>(S.stats.maxStreak||0))S.stats.maxStreak=S.stats.streak}
function giveSticker(rare){
  const pool=rare?[...RARE]:STICKERS.filter(s=>!RARE.has(s)||Math.random()<.15);
  const fresh=pool.filter(s=>!S.stickers[s]),src=fresh.length&&Math.random()<.75?fresh:pool,pick=src[Math.floor(Math.random()*src.length)];
  S.stickers[pick]=(S.stickers[pick]||0)+1;return pick;
}
let rewardQueue=[];
function afterProgress(){
  // a chest for every finished day
  DAYS.forEach(d=>{if(!S.dayChest[d.d]&&d.tasks.every(t=>S.done[t.id])){S.dayChest[d.d]=true;S.chests++;rewardQueue.push(`🎁 Day complete! A treasure chest is waiting in Rewards.`)}});
  BADGES.forEach(([id,em,name])=>{if(!S.badges[id]&&BADGES.find(b=>b[0]===id)[4]()){S.badges[id]=Date.now();const st=giveSticker(false);rewardQueue.push(`${em} New badge: ${name}! +1 sticker ${st}`)}});
  save();updateRewardDot();
  if(rewardQueue.length){confetti();rewardQueue.splice(0).forEach(toast)}
}
function updateRewardDot(){const b=document.querySelector('[data-tab=rewards]');if(b)b.classList.toggle("dot",S.chests>0)}
function renderRewards(){
  const xp=S.xp||0,lv=Math.floor(xp/LV)+1,pet=petFor(lv),next=PETS.find(p=>p[0]>lv);
  const got=BADGES.filter(b=>S.badges[b[0]]).length,owned=STICKERS.filter(s=>S.stickers[s]).length;
  $("#tab-rewards").innerHTML=`
   <div class="petcard"><div class="pet">${pet[1]}</div><div><h2>${pet[2]}</h2><p>Level ${lv} · ${xp} XP</p><div class="bar wide"><i style="width:${xp%LV/LV*100}%"></i></div>
     <p class="mute">${next?`At level ${next[0]} your pet becomes ${next[1]} ${next[2]}!`:"Your pet is fully grown. Legend! 🏆"}</p></div></div>
   <div class="chestrow">${S.chests>0?`<button class="chest" id="openChest"><span class="ce">🎁</span><b>Open your treasure chest!</b><span class="mute">${S.chests} waiting</span></button>`:
     `<div class="chest off"><span class="ce">🎁</span><b>Finish every task of a day to win a treasure chest.</b><span class="mute">Each chest has 3 stickers.</span></div>`}</div>
   <h2 class="sech">🏅 Badges <span class="mute">${got} / ${BADGES.length}</span></h2>
   <div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b[0]]?"got":""}"><span>${S.badges[b[0]]?b[1]:"🔒"}</span><b>${b[2]}</b><small>${b[3]}</small></div>`).join("")}</div>
   <h2 class="sech">📒 Sticker album <span class="mute">${owned} / ${STICKERS.length}</span></h2>
   <p class="mute">Stickers come from chests, badges and level-ups. Gold ones are rare!</p>
   <div class="album">${STICKERS.map(s=>`<div class="stk ${S.stickers[s]?"got":""} ${RARE.has(s)?"rare":""}">${S.stickers[s]?s:"?"}${S.stickers[s]>1?`<small>×${S.stickers[s]}</small>`:""}</div>`).join("")}</div>`;
  const oc=$("#openChest");if(oc)oc.onclick=openChest;
}
function openChest(){
  if(S.chests<1)return;S.chests--;const got=[giveSticker(Math.random()<.25),giveSticker(false),giveSticker(false)];save();updateRewardDot();
  openSheet("Treasure chest","brk");
  body().innerHTML=`<div class="chestopen"><div class="bigchest" id="bc">🎁</div><p class="hint" id="bch">Tap the chest!</p><div class="reveal" id="rv"></div></div>`;
  let taps=0;$("#bc").onclick=()=>{taps++;$("#bc").classList.remove("shake");void $("#bc").offsetWidth;$("#bc").classList.add("shake");
    if(taps<3){$("#bch").textContent=taps===1?"Again!":"One more time!";return}
    $("#bc").textContent="✨";$("#bch").textContent="You got:";confetti();
    $("#rv").innerHTML=got.map((s,k)=>`<div class="stk got pop ${RARE.has(s)?"rare":""}" style="animation-delay:${k*.25}s">${s}</div>`).join("")+
      `<div class="row center" style="grid-column:1/-1;margin-top:14px">${S.chests?'<button class="btn" id="more">Open the next chest</button>':""}<button class="btn quiet" id="cl">Done</button></div>`;
    $("#cl").onclick=()=>{closeSheet();renderRewards()};if(S.chests)$("#more").onclick=openChest;$("#bc").onclick=null};
}

// ---------- start ----------
renderNext();renderPlan();renderXP();updateRewardDot();
setInterval(renderNext,60e3);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
})();
