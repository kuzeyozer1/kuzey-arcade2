<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yazılı">
<title>Yazılı Planı</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* A night-time study desk: day chips on top, a stack of task cards for the chosen day, activities open as a full-screen sheet. Dark only, like the rest of the arcade. */
:root{
  --night:#141033; --panel:#1e1849; --panel-hi:#2a2263; --line:#3a3080; --ink:#f4f1ff; --mute:#b1a8db;
  --gold:#ffd166; --good:#6ee7a8; --bad:#ff7a7a;
  --tr:#ff9a76; --fen:#6ee7a8; --en:#7cc7ff; --din:#ffd166; --brk:#f0a6ff;
  --display:'Fredoka', ui-rounded, system-ui, sans-serif; --body:'Nunito', system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(ellipse at 85% -10%,#2b2170 0%,var(--night) 55%) fixed,var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
.mute{color:var(--mute)}
header{padding-block:16px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;color:inherit;text-decoration:none}
.brand img{width:40px;height:40px;border-radius:11px}
.brand h1{font-size:23px}
.brand p{margin:0;font-size:13px;color:var(--mute)}
.next{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-size:14px;line-height:1.3}
.next b{font-family:var(--display);font-weight:600;font-size:16px;display:block}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;margin:12px 0}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer;color:var(--mute)}
.tabs button[aria-selected=true]{background:var(--panel-hi);color:var(--ink)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-bottom:8px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:76px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 10px;text-align:center;cursor:pointer;line-height:1.2}
.day small{display:block;font-size:12px;color:var(--mute)}
.day b{font-family:var(--display);font-size:20px;font-weight:600}
.day .st{display:block;font-size:12px;margin-top:2px;color:var(--gold);min-height:15px}
.day[aria-pressed=true]{background:var(--panel-hi);border-color:var(--gold)}
.day.today small{color:var(--gold);font-weight:800}
.dayhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:10px 0 12px}
.dayhead h2{font-size:26px;margin-right:auto}
.bar{height:10px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line);flex:1 1 160px;max-width:240px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffb347);width:0;transition:width .4s}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px;background:var(--panel);border:1px dashed var(--line)}
.banner b{color:var(--gold)}
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 12px 12px 14px}
.task .chk{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--c);background:none;cursor:pointer;display:grid;place-items:center;font-size:18px;color:#141033}
.task.done .chk{background:var(--c)}
.task.done .chk::after{content:"✓";font-weight:800}
.task .body{flex:1;min-width:0}
.task .sub{font-size:13px;font-weight:800;color:var(--c)}
.task h3{font-size:18px}
.task p{margin:2px 0 0;font-size:14px;color:var(--mute)}
.task.done h3{text-decoration:line-through;text-decoration-color:var(--c);opacity:.75}
.go{flex:0 0 auto;border:0;border-radius:12px;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer;background:var(--c);color:#141033}
.btn{border:0;border-radius:12px;padding:11px 18px;font-family:var(--display);font-weight:600;font-size:17px;cursor:pointer;background:var(--gold);color:#241a00}
.btn.quiet{background:var(--panel-hi);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.group{margin-bottom:18px}
.group h2{font-size:21px;margin-bottom:8px;color:var(--c)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.set{text-align:left;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:12px;cursor:pointer}
.set b{font-family:var(--display);font-weight:600;font-size:17px;display:block}
.set span{font-size:13px;color:var(--mute)}
.exam{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.exam .when{flex:0 0 92px;font-family:var(--display);line-height:1.2}
.exam .when b{font-size:18px;font-weight:600;display:block}
.exam .when span{font-size:13px;color:var(--mute)}
.exam h3{font-size:18px}
.exam p{margin:0;font-size:14px;color:var(--mute)}
.exam.past{opacity:.55}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--panel-hi);color:var(--mute);margin-left:6px;vertical-align:2px}
.tag.cd{background:var(--gold);color:#241a00}
.donelist{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
/* activity sheet */
.sheet{position:fixed;inset:0;background:var(--night);z-index:10;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.sheet header{position:sticky;top:0;background:var(--night);z-index:2;border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:16px}
.sheet header .wrap{display:flex;align-items:center;gap:10px;width:100%}
.sheet header h2{font-size:20px;margin-right:auto;color:var(--c)}
.x{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:800}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:16px}
.notes h3{font-size:19px;color:var(--c);margin:6px 0 4px}
.notes ul{margin:4px 0 8px;padding-left:20px}
.notes li{margin:3px 0}
.notes .ex{color:var(--mute);font-style:italic}
.progress{font-size:14px;color:var(--mute);margin-bottom:8px}
.passage{background:#fff8e8;color:#2a2340;border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:16px}
.visual{font-size:46px;text-align:center;background:var(--panel);border-radius:14px;padding:10px;margin-bottom:12px;line-height:1.3}
.visual small{display:block;font-size:16px;font-weight:800;color:var(--gold)}
.q{font-family:var(--display);font-weight:500;font-size:22px;margin-bottom:14px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:13px 16px;cursor:pointer;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt.right{border-color:var(--good);background:#1c4a3d}
.opt.wrong{border-color:var(--bad);background:#4d1f33}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;border-radius:14px;padding:12px 16px;font-size:16px}
.feedback.ok{background:#1c4a3d}
.feedback.no{background:#4d1f33}
.result{text-align:center;padding:20px 0}
.result .big{font-family:var(--display);font-size:64px;font-weight:700;color:var(--gold);line-height:1}
.result p{font-size:18px}
.card3d{perspective:1200px;margin:6px auto 16px;max-width:520px;cursor:pointer}
.flip{position:relative;height:250px;transition:transform .45s;transform-style:preserve-3d}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:grid;place-items:center;text-align:center;padding:20px;font-size:20px}
.face.f{background:var(--panel-hi);border:2px solid var(--c);font-family:var(--display);font-size:30px;font-weight:600}
.face.b{background:#fff8e8;color:#2a2340;transform:rotateY(180deg)}
.hint{text-align:center;font-size:14px;color:var(--mute);margin-bottom:12px}
.center{justify-content:center}
.play{display:grid;place-items:center;width:110px;height:110px;margin:10px auto;border-radius:50%;border:0;background:var(--c);color:#141033;font-size:44px;cursor:pointer}
.timer{font-family:var(--display);font-size:72px;font-weight:700;text-align:center;color:var(--brk);line-height:1;margin:10px 0}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.games a{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:600;text-align:center}
.games a span{display:block;font-size:30px}
.xp{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.xp b{font-family:var(--display);font-weight:600;color:var(--gold)}
.xpbar{width:64px;height:8px;background:var(--panel-hi);border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--gold);color:#241a00;font-family:var(--display);font-weight:600;font-size:18px;padding:10px 20px;border-radius:99px;z-index:30;box-shadow:0 6px 24px #0008}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.gap{display:inline-block;min-width:2.6em;border-bottom:3px solid var(--c);color:var(--c);line-height:1.1}
.sortcard{background:#fff8e8;color:#2a2340;border-radius:18px;padding:24px 20px;font-size:21px;font-family:var(--display);font-weight:500;text-align:center;margin:4px 0 16px;line-height:1.35}
.sortcard .gap{border-color:#6b4fe0;color:#6b4fe0}
.sortcard.ok{box-shadow:0 0 0 4px var(--good)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bucket{border:2px solid var(--c);background:var(--panel);border-radius:16px;padding:16px 10px;font-family:var(--display);font-weight:600;font-size:19px;cursor:pointer}
.bucket:hover:not([disabled]){background:var(--panel-hi)}
.bucket.right{background:#1c4a3d;border-color:var(--good)}
.bucket.wrong{background:#4d1f33;border-color:var(--bad)}
.bucket[disabled]{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;cursor:pointer;font-size:16px;min-height:58px;overflow-wrap:anywhere;transition:opacity .3s}
.mt.sel{border-color:var(--gold);background:var(--panel-hi)}
.mt.done{border-color:var(--good);background:#1c4a3d;opacity:.45;cursor:default}
.mt.wrong{border-color:var(--bad);background:#4d1f33}
.speedhud{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:6px}
.speedhud .pts{text-align:right;font-size:15px}
.speedhud b{font-family:var(--display);font-size:36px;color:var(--gold);font-variant-numeric:tabular-nums}
.timer.small{font-size:56px;margin:0;color:var(--c);font-variant-numeric:tabular-nums}
.tbar{height:8px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:18px}
.tbar i{display:block;height:100%;background:var(--c);width:100%}
.opts.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.opt.big{text-align:center;font-family:var(--display);font-weight:600;font-size:19px;padding:18px 12px}
.typeform{display:flex;gap:8px;flex-wrap:wrap}
.typeform input{flex:1 1 220px;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:19px;color:var(--ink)}
.typeform input:focus{border-color:var(--c);outline:none}
.linkbtn{background:none;border:0;color:var(--c);text-decoration:underline;cursor:pointer;padding:10px 0;font-weight:700}
.ordered{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:12px 12px 12px 40px;min-height:56px;margin:0 0 14px}
.ordered li{padding:3px 0;font-weight:700;color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c);background:var(--panel);border-radius:99px;padding:10px 16px;cursor:pointer;font-size:16px;text-align:left}
.chip.wrong{border-color:var(--bad);background:#4d1f33}
.clock{width:210px;max-width:100%;display:block;margin:0 auto}
.clock .cface{fill:#fff8e8;stroke:var(--c);stroke-width:4}
.clock .ticks line{stroke:#2a2340}
.clock .nums text{font:600 17px var(--display);fill:#2a2340;text-anchor:middle}
.clock .hh{stroke:#2a2340;stroke-width:7;stroke-linecap:round}
.clock .mh{stroke:#e2553f;stroke-width:4;stroke-linecap:round}
.clock .pin{fill:#2a2340}
.digital{font-family:var(--display);font-size:64px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;padding:10px 0}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.flip{transition:none}}
@media (max-width:520px){
  .task{flex-wrap:wrap}
  .task .go{margin-left:46px}
  .q{font-size:20px}
  .exam .when{flex-basis:76px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="../" aria-label="Back to Kuzey Arcade">
      <img src="icons/icon-192.png" alt="">
      <div><h1>Yazılı Planı</h1><p>1. Dönem 1. Yazılılar · 5. sınıf</p></div>
    </a>
    <div class="next" id="next"></div>
    <div class="xp" id="xp"></div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="plan" aria-selected="true">Plan</button>
    <button role="tab" data-tab="practice" aria-selected="false">Practice</button>
    <button role="tab" data-tab="exams" aria-selected="false">Exams</button>
  </div>

  <section id="tab-plan">
    <div class="days" id="days"></div>
    <div class="dayhead"><h2 id="dayTitle"></h2><div class="bar" title="Tasks done"><i id="dayBar"></i></div></div>
    <div id="dayBanner"></div>
    <div class="tasks" id="tasks"></div>
  </section>

  <section id="tab-practice" hidden></section>
  <section id="tab-exams" hidden></section>
</div>

<div class="sheet" id="sheet" hidden>
  <header><div class="wrap"><h2 id="sheetTitle"></h2><button class="x" id="sheetClose">Close</button></div></header>
  <div class="wrap" id="sheetBody"></div>
</div>

<script>
(()=>{
// ---------- subjects ----------
const SUBJ={
  tr:{name:"Türkçe",c:"var(--tr)"},
  fen:{name:"Cambridge Science",c:"var(--fen)"},
  en:{name:"English",c:"var(--en)"},
  din:{name:"Din Kültürü",c:"var(--din)"},
  brk:{name:"Break",c:"var(--brk)"}
};

// ---------- exams still to come ----------
const EXAMS=[
  {d:"2026-11-10",t:"09.20–10.00",s:"tr",name:"Türkçe"},
  {d:"2026-11-10",t:"10.15–10.55",s:"tr",name:"Türkçe – Dinleme Sınavı"},
  {d:"2026-11-11",t:"09.20–10.00",s:"brk",name:"Kültür ve Medeniyetimize Yön Verenler",skip:true},
  {d:"2026-11-11",t:"11.10–11.50",s:"fen",name:"Cambridge Fen Bilimleri"},
  {d:"2026-11-12",t:"09.20–10.00",s:"en",name:"Yabancı Dil / İngilizce"},
  {d:"2026-11-12",t:"10.15–10.55",s:"en",name:"İngilizce – Dinleme Sınavı"},
  {d:"2026-11-13",t:"09.20–10.00",s:"en",name:"Cambridge İngiliz Dili"},
  {d:"2026-11-13",t:"10.15–10.55",s:"din",name:"Din Kültürü ve Ahlak Bilgisi"}
];
const DONE_ALREADY=["Matematik","Cambridge Matematik","Fen Bilimleri","Sosyal Bilgiler","Almanca","Türkçe konuşma sınavı"];

// ---------- practice sets ----------
// Quiz questions: o[0] is always the right answer; options are shuffled when shown.
const P_ARI="Arılar, çiçekten çiçeğe konarak nektar toplar. Bu sırada bacaklarına yapışan polenleri başka çiçeklere taşırlar. Böylece bitkilerin tozlaşmasına yardım ederler. Tozlaşma olmasaydı pek çok meyve ve sebze yetişmezdi. Bilim insanları, arıların sayısının son yıllarda azaldığını söylüyor. Tarım ilaçları ve iklim değişikliği bu azalmanın başlıca sebepleri arasında. Arıları korumak için bahçelerimize çiçek ekebilir, ilaç kullanımını azaltabiliriz.";
const SETS={
"tr-yazim":{s:"tr",kind:"quiz",title:"Yazım ve noktalama",
notes:`<h3>Ayrı mı, bitişik mi?</h3><ul>
<li><b>de / da</b> bağlaç ise <b>ayrı</b>: “Ben <u>de</u> geldim.” Ek ise bitişik: “Ev<u>de</u> kaldım.” <span class="ex">İpucu: Çıkarınca anlam bozulmuyorsa bağlaçtır → ayrı yaz.</span></li>
<li><b>ki</b> bağlaç ise ayrı: “Öyle yoruldum <u>ki</u>…” Ek ise bitişik: “masa<u>daki</u>, yarın<u>ki</u>”.</li>
<li>Soru eki <b>mı / mi / mu / mü</b> her zaman <b>ayrı</b>: “Geldin <u>mi</u>?”</li>
<li><b>her şey, bir şey</b> ayrı; <b>hiçbir, birkaç, birçok</b> bitişik.</li>
<li>Sık karışanlar: <b>herkes</b> (herkez değil), <b>yalnız</b> (yanlız değil), <b>yanlış</b> (yalnış değil).</li></ul>
<h3>Büyük harf ve kesme işareti</h3><ul>
<li>Cümle ve özel isimler (kişi, şehir, ülke, hayvana verilen ad) büyük harfle başlar.</li>
<li>Özel isimlere gelen ekler <b>kesme işaretiyle (’)</b> ayrılır: Ankara’ya, Atatürk’ün, Türkiye’de. Cins isimlerde kesme yok: okula, kitabı.</li></ul>
<h3>Noktalama</h3><ul>
<li><b>Nokta (.)</b> tamamlanmış cümlenin sonunda.</li>
<li><b>Virgül (,)</b> sıralanan kelimeler arasında: “defter, kalem, silgi ve cetvel”; hitaptan sonra: “Ali, buraya gel.”</li>
<li><b>Soru işareti (?)</b> soru cümlesinin sonunda.</li>
<li><b>Ünlem (!)</b> sevinç, korku, şaşırma, seslenme bildiren cümlelerde: “Eyvah, geç kaldık!”</li>
<li><b>İki nokta (:)</b> açıklama veya örnek verilecekse: “Şunları aldım: kalem, defter.”</li></ul>`,
qs:[
 {q:"Hangi cümlede “de/da”nın yazımı yanlıştır?",o:["Bende seninle sinemaya geleceğim.","Kitabı masada bıraktım.","Ali de bizimle gelecek.","Okulda çok eğlendik."],e:"“ben de” bağlaçtır, ayrı yazılır: “Ben de seninle…”"},
 {q:"Hangisinde soru eki doğru yazılmıştır?",o:["Bu kitap senin mi?","Ödevini bitirdinmi?","Yarın gelecekmisin?","Sinemaya gidelimmi?"],e:"Soru eki mı/mi/mu/mü her zaman ayrı yazılır."},

"tr-anlam":{s:"tr",kind:"quiz",title:"Kelime anlamı ve söz varlığı",
notes:`<h3>Bilmediğin kelimenin anlamını tahmin et</h3><ul>
<li>Kelimenin <b>önündeki ve arkasındaki cümleleri</b> oku; ipucu genelde oradadır.</li>
<li>Kelimenin yerine tahmin ettiğin anlamı koy: cümle hâlâ mantıklı mı?</li></ul>
<h3>Yazını zenginleştir</h3><ul>
<li>“güzel, iyi, çok” yerine daha canlı kelimeler seç: <i>masmavi, pırıl pırıl, rengârenk</i>.</li>
<li>Deyim, atasözü, benzetme ve eş anlamlı kelimeler kullan.</li></ul>`,
qs:[
 {q:"“Dedem bahçedeki <b>fidanları</b> özenle suladı; birkaç yıl sonra hepsi kocaman ağaç olacaktı.” Altı çizili kelimenin anlamı nedir?",o:["Genç, küçük ağaç","Çiçek tohumu","Sebze","Kuru dal"],e:"“kocaman ağaç olacaktı” ipucu: fidan küçük, genç ağaçtır."},
 {q:"“Yağmurdan sonra ormandaki dar <b>patikada</b> dikkatli yürüdük.” “patika” ne demektir?",o:["Dar yol","Köprü","Nehir","Çadır"],e:"“dar … yürüdük” ipucu: patika, dar yoldur."},
 {q:"“Kardeşim sınavı kazanınca sevinçten <b>havalara uçtu</b>.” Deyimin anlamı nedir?",o:["Çok sevinmek","Uçağa binmek","Çok korkmak","Yüksekten atlamak"],e:"“sevinçten” kelimesi ipucu verir."},
 {q:"“Ali çok <b>cömert</b> biridir; harçlığını bile arkadaşlarıyla paylaşır.” “cömert” ne demektir?",o:["Eli açık, paylaşmayı seven","Cimri","Utangaç","Tembel"],e:"“paylaşır” ipucu: cömert = eli açık."},
 {q:"Hangi cümle söz varlığı bakımından en zengindir?",o:["Gökyüzü masmavi, güneş pırıl pırıldı; serin bir rüzgâr yüzümüzü okşuyordu.","Hava güzeldi.","Hava çok çok güzeldi.","Güzel bir havaydı."],e:"Renkli sıfatlar ve benzetmeler anlatımı zenginleştirir."},
 {q:"“Damlaya damlaya göl olur.” atasözünün anlamı nedir?",o:["Küçük birikimler zamanla büyür.","Yağmur çok yağınca göl oluşur.","Su israf edilmemelidir.","Göller damlalardan oluşmaz."],e:"Az az biriktirilen şey zamanla çoğalır."},
 {q:"“Kitaba şöyle bir <b>göz attım</b>.” Deyimin anlamı nedir?",o:["Kısaca bakmak","Çok dikkatli okumak","Gözünü kapatmak","Kitabı atmak"],e:"Göz atmak = üstünkörü, kısaca bakmak."},

"tr-okuma":{s:"tr",kind:"quiz",title:"Metin, anahtar kelime ve görsel",
notes:`<h3>Okuma sorularında</h3><ul>

<li><b>Anahtar kelime:</b> Metnin konusunu en iyi anlatan, en çok tekrar eden önemli kelimeler.</li>
<li><b>Konu:</b> Metin neyi anlatıyor? <b>Ana fikir:</b> Yazar bize ne söylemek istiyor?</li>
<li><b>Görsel:</b> Resimdeki işaretlere, renklere ve yazılara bak; mesajı tek cümleyle söyle.</li></ul>`,

"fen-gas":{s:"fen",kind:"quiz",title:"Gases",
notes:`<h3>Solids, liquids and gases</h3><ul>
<li><b>Solid:</b> fixed shape, fixed volume. Particles packed tightly and only vibrate.</li>
<li><b>Liquid:</b> fixed volume, but it takes the shape of its container. Particles close but slide past each other.</li>
<li><b>Gas:</b> no fixed shape, no fixed volume. Particles are <b>far apart</b> and move <b>quickly in all directions</b>.</li></ul>
<h3>Properties of gases</h3><ul>
<li>A gas <b>spreads out to fill</b> any container.</li>
<li>A gas can be <b>squashed (compressed)</b> because there is lots of space between particles.</li>
<li>Gases <b>flow</b> and <b>have mass</b>: a pumped-up ball is heavier than a flat one.</li>
<li><b>Diffusion:</b> gas particles spread out, so a smell travels across a room.</li>
<li>Examples: oxygen, carbon dioxide, water vapour, helium. <b>Air</b> is a mixture of gases.</li>
<li><b>Evaporation:</b> liquid → gas. <b>Condensation:</b> gas → liquid.</li></ul>`,
qs:[
 {q:"Which sentence describes the particles in a gas?",o:["They are far apart and move quickly in all directions.","They are packed tightly and only vibrate.","They are close together and slide past each other.","They do not move at all."],e:"Gas particles have big gaps and move fast."},
 {q:"Why can a gas be squashed (compressed)?",o:["There is a lot of space between its particles.","Its particles are very hard.","It has a fixed shape.","It is always hot."],e:"The particles can be pushed closer together."},
 {q:"You put some gas in a closed jar. What happens?",o:["It spreads out to fill the whole jar.","It stays at the bottom.","It makes a fixed shape.","It turns into a solid."],e:"Gases fill any container."},
 {q:"Which one is a gas at room temperature?",o:["Oxygen","Ice","Milk","Sand"],e:"Ice and sand are solids; milk is a liquid."},
 {q:"Someone opens a bottle of perfume in a corner. Soon you can smell it across the room. Why?",o:["Gas particles spread out (diffusion).","The perfume turns into a solid.","Sound carries the smell.","The bottle gets bigger."],e:"This spreading is called diffusion."},
 {q:"Does air have mass?",o:["Yes – a pumped-up ball is heavier than a flat ball.","No – air weighs nothing.","Only cold air has mass.","Only when it is wet."],e:"All gases have mass."},
 {q:"Water changing into water vapour is called…",o:["evaporation","condensation","melting","freezing"],e:"Liquid → gas = evaporation."},
 {q:"Which state has a fixed volume but no fixed shape?",o:["Liquid","Solid","Gas","None of them"],e:"Liquids take the shape of their container but keep their volume."},
 {q:"Which gas do we breathe out more of?",o:["Carbon dioxide","Oxygen","Helium","Water"],e:"We breathe in oxygen and breathe out carbon dioxide."}
]},
"fen-digest":{s:"fen",kind:"quiz",title:"The digestive system",
notes:`<h3>The journey of food</h3><p><b>mouth → oesophagus → stomach → small intestine → large intestine → rectum → anus</b></p><ul>
<li><b>Mouth:</b> teeth break food into small pieces. <i>Incisors</i> cut, <i>canines</i> tear, <i>molars</i> grind. <b>Saliva</b> makes food soft and wet and starts digestion.</li>
<li><b>Oesophagus</b> (food pipe): muscles squeeze food down to the stomach.</li>
<li><b>Stomach:</b> a muscly bag that churns food. Its <b>acid</b> kills germs and helps digest food.</li>
<li><b>Small intestine:</b> the longest part. Digested food (<b>nutrients</b>) is <b>absorbed into the blood</b>.</li>
<li><b>Large intestine:</b> <b>water is absorbed</b>.</li>
<li><b>Rectum</b> stores waste; it leaves the body through the <b>anus</b>.</li>
<li><b>Liver</b> and <b>pancreas</b> make juices that help digestion.</li>
<li><b>Digestion</b> = breaking food down into small pieces the body can absorb.</li></ul>`,
qs:[
 {q:"What is the correct order?",o:["mouth → oesophagus → stomach → small intestine → large intestine","mouth → stomach → oesophagus → large intestine → small intestine","oesophagus → mouth → stomach → small intestine → large intestine","mouth → small intestine → stomach → oesophagus → large intestine"],e:"Learn the order: mouth, oesophagus, stomach, small intestine, large intestine, rectum, anus."},
 {q:"Where are nutrients absorbed into the blood?",o:["Small intestine","Large intestine","Oesophagus","Mouth"],e:"The small intestine absorbs digested food."},
 {q:"What is the main job of the large intestine?",o:["To absorb water","To chew food","To make saliva","To kill germs with acid"],e:"Water is absorbed in the large intestine."},
 {q:"What does saliva do?",o:["Makes food soft and wet and starts digestion","Absorbs nutrients","Pushes food down to the stomach","Stores waste"],e:"Saliva is made in the mouth."},
 {q:"Which teeth grind and chew food?",o:["Molars","Incisors","Canines","None"],e:"Incisors cut, canines tear, molars grind."},
 {q:"What does the oesophagus do?",o:["Carries food from the mouth to the stomach","Absorbs water","Makes acid","Removes waste"],e:"It is the food pipe."},
 {q:"Why does the stomach contain acid?",o:["To kill germs and help digest food","To absorb water","To make teeth strong","To push food out"],e:"Acid kills germs and breaks down food."},
 {q:"Digestion means…",o:["breaking food down so the body can absorb it","only chewing food","drinking water","breathing in oxygen"],e:"Food must be broken into tiny pieces to enter the blood."}
]},
"fen-diet":{s:"fen",kind:"quiz",title:"Balanced diet",
notes:`<h3>Nutrients and their jobs</h3><ul>
<li><b>Carbohydrates</b> – give us <b>energy</b>: bread, rice, pasta, potatoes.</li>
<li><b>Proteins</b> – help us <b>grow and repair</b> the body: meat, fish, eggs, beans, lentils.</li>
<li><b>Fats</b> – store energy and keep us warm: butter, oil, cheese, nuts (eat small amounts).</li>
<li><b>Vitamins and minerals</b> – keep us <b>healthy</b>: fruit and vegetables. <b>Calcium</b> (milk, yoghurt, cheese) makes bones and teeth strong.</li>
<li><b>Fibre</b> – helps food <b>move through the intestines</b>: wholegrain bread, fruit, vegetables.</li>
<li><b>Water</b> – every part of the body needs it.</li></ul>
<p>A <b>balanced diet</b> has all of these in the <b>right amounts</b>. Too much sugar → tooth decay; too much fat and sugar → weight gain.</p>`,
qs:[
 {q:"What is the main job of proteins?",o:["Growth and repair","Giving quick energy","Helping food move through the gut","Keeping us cool"],e:"Proteins build and repair the body."},
 {q:"Which food is rich in carbohydrates?",o:["Pasta","Fish","Butter","Lettuce"],e:"Pasta, bread, rice and potatoes give energy."},
 {q:"Fibre helps us…",o:["move food through the intestines","grow taller","see in the dark","make saliva"],e:"Fibre keeps digestion working well."},
 {q:"Which mineral makes bones and teeth strong?",o:["Calcium","Sugar","Fat","Fibre"],e:"Milk, yoghurt and cheese contain calcium."},
 {q:"What is a balanced diet?",o:["Eating all the nutrient groups in the right amounts","Eating only fruit","Eating a lot of one food","Never eating fat"],e:"Balance = every group, right amounts."},
 {q:"Which lunch is the most balanced?",o:["Grilled chicken, rice, salad and an orange","Chips, crisps and cola","Cake and chocolate milk","Only bread and butter"],e:"It has protein, carbohydrate, vitamins and fibre."},
 {q:"Eating too much sugar can cause…",o:["tooth decay","strong bones","better eyesight","more fibre"],e:"Sugar feeds the bacteria that damage teeth."},
 {q:"Fruit and vegetables mainly give us…",o:["vitamins, minerals and fibre","mostly fat","mostly protein","nothing useful"],e:"Eat lots of fruit and vegetables!"}
]},

"en-verbs":{s:"en",kind:"quiz",title:"Stative and action verbs",
notes:`<h3>Action verbs</h3><p>Things we <b>do</b>: run, swim, cook, write, play. They can be in the continuous form: <i>I <b>am cooking</b> now.</i></p>
<h3>Stative verbs</h3><p>Feelings, thoughts, senses and owning: <b>know, like, love, hate, want, need, believe, understand, think</b> (= opinion), <b>own, have</b> (= own), <b>seem, taste, smell</b>.</p>
<p>We usually <b>don't</b> use them with -ing: ✔ <i>I <b>know</b> the answer.</i> ✘ <i>I am knowing the answer.</i></p>`,
qs:[
 {q:"I ___ this song. It's great!",o:["love","am loving","loving","am love"],e:"“love” is stative → present simple."},

"en-past":{s:"en",kind:"quiz",title:"Past simple & past continuous",
notes:`<h3>Past simple</h3><p>A finished action: <i>I <b>visited</b> my grandma yesterday.</i> Irregular: go → <b>went</b>, see → <b>saw</b>, have → <b>had</b>, ring → <b>rang</b>. Negative/question: <b>didn't + verb</b>, <b>Did … + verb?</b></p>
<h3>Past continuous</h3><p>An action in progress in the past: <b>was/were + -ing</b>. <i>At 8 pm we <b>were watching</b> TV.</i></p>
<h3>Together</h3><p>Long action (past continuous) interrupted by a short one (past simple):<br><i>I <b>was reading</b> <u>when</u> the phone <b>rang</b>.</i> · <i><u>While</u> she <b>was walking</b> home, it <b>started</b> to rain.</i></p>`,
qs:[
 {q:"Yesterday I ___ to the park.",o:["went","go","was go","goed"],e:"go → went."},
 {q:"I was reading when the phone ___.",o:["rang","was ringing","rings","ring"],e:"Short interrupting action → past simple."},
 {q:"At 8 pm last night, we ___ TV.",o:["were watching","watched","are watching","was watching"],e:"In progress at a past time; we → were."},
 {q:"While she ___ home, it started to rain.",o:["was walking","walked","were walking","walks"],e:"While + long action → past continuous; she → was."},
 {q:"Did you ___ the film last night?",o:["see","saw","seen","seeing"],e:"Did + base verb."},
 {q:"They ___ football when the teacher came.",o:["were playing","was playing","played","plays"],e:"They → were + -ing."},
 {q:"We ___ go to school last Sunday.",o:["didn't","don't","weren't","wasn't"],e:"Past simple negative: didn't + verb."},
 {q:"When I ___ at the station, the train was leaving.",o:["arrived","was arriving","arrive","arrives"],e:"Short action → past simple."},
 {q:"Which sentence is in the past continuous?",o:["He was sleeping.","He slept.","He sleeps.","He is sleeping."],e:"was/were + -ing."}
]},
"en-cond":{s:"en",kind:"quiz",title:"Conditionals, future, goals & jobs",
notes:`<h3>First conditional – real, possible</h3><p><b>If + present simple, will + verb</b>: <i>If it rains tomorrow, we <b>will stay</b> at home.</i></p>
<h3>Second conditional – imaginary, unlikely</h3><p><b>If + past simple, would + verb</b>: <i>If I <b>had</b> a million dollars, I <b>would buy</b> a farm.</i> · <i>If I <b>were</b> a bird, I would fly.</i></p>
<h3>Future</h3><ul><li><b>be going to</b> – plans already decided, or predictions with proof: <i>Look at the clouds! It's <b>going to</b> rain.</i></li>
<li><b>will</b> – predictions/opinions: <i>I think robots <b>will</b> clean our houses.</i></li></ul>
<h3>Goals & jobs</h3><p><i>goal, dream, achieve, work hard, vet, architect, engineer, pilot, astronaut, scientist, doctor, chef, journalist</i></p>`,
qs:[
 {q:"If it rains tomorrow, we ___ at home.",o:["will stay","would stay","stayed","stay"],e:"First conditional: if + present, will + verb."},
 {q:"If I had a million dollars, I ___ a big house.",o:["would buy","will buy","buy","bought"],e:"Second conditional: if + past, would + verb."},
 {q:"If I ___ a bird, I would fly to Paris.",o:["were","am","will be","be"],e:"Second conditional: If I were…"},
 {q:"If you study hard, you ___ the exam.",o:["will pass","would pass","passed","passing"],e:"Real possibility → first conditional."},
 {q:"Which sentence is a second conditional?",o:["If I won the lottery, I would travel the world.","If it is sunny, we will go swimming.","I will call you tomorrow.","If you heat ice, it melts."],e:"if + past simple, would + verb."},
 {q:"Look at those dark clouds! It ___ rain.",o:["is going to","would","rains","rained"],e:"A prediction with proof → going to."},
 {q:"I've decided. I ___ be a vet when I grow up.",o:["am going to","would","was","am"],e:"A plan already decided → going to."},
 {q:"I think people ___ live on Mars one day.",o:["will","are","would","did"],e:"An opinion about the future → will."},
 {q:"A person who looks after sick animals is a…",o:["vet","pilot","chef","journalist"],e:"vet = veteriner."},
 {q:"A person who designs buildings is an…",o:["architect","astronaut","engineer","author"],e:"architect = mimar."}
]},

"en-school":{s:"en",kind:"quiz",title:"School life, likes & telling time",
notes:`<h3>Obligations</h3><ul><li><b>have to / must</b> – it's necessary: <i>We <b>have to</b> wear a uniform.</i></li>
<li><b>mustn't</b> – it's not allowed: <i>You <b>mustn't</b> run in the corridors.</i></li>
<li><b>don't have to</b> – it's not necessary: <i>We <b>don't have to</b> bring lunch.</i></li></ul>
<h3>Likes and dislikes (+ -ing)</h3><p>love ❤️ · like / enjoy 🙂 · don't mind 😐 · don't like 🙁 · hate / can't stand 😖<br><i>I <b>enjoy reading</b>. She <b>can't stand getting</b> up early.</i></p>
<h3>Telling the time</h3><p>9:15 = <b>quarter past</b> nine · 3:30 = <b>half past</b> three · 7:45 = <b>quarter to</b> eight · 10:10 = ten past ten · 4:50 = ten to five</p>
<h3>Present simple</h3><p>Routines and facts: <i>Tom <b>goes</b> to school by bus every day.</i> (he/she/it + -s)</p>`,

 {q:"It's 7:45. What time is it?",o:["It's quarter to eight.","It's quarter past seven.","It's half past seven.","It's quarter to seven."],e:"15 minutes before eight."},

"din-duzen":{s:"din",kind:"quiz",title:"Evrendeki düzen ve Allah’ın birliği",
notes:`<h3>Evrende mükemmel bir düzen var</h3><ul>
<li>Güneş her gün doğar ve batar; gece ile gündüz birbirini izler.</li>
<li>Mevsimler sırayla gelir; Ay’ın evreleri hep aynı düzende tekrarlanır.</li>
<li>Dünya, Güneş’e canlıların yaşayabileceği kadar uzaklıktadır. Daha yakın olsa çok sıcak, daha uzak olsa çok soğuk olurdu.</li>
<li>Vücudumuzda kalp durmadan çalışır; her organın bir görevi vardır.</li></ul>
<h3>Akıl yürütme</h3><ul>
<li>Bir resim bir ressamı, bir bina bir mimarı gösterir. Evrendeki bu düzen de kendiliğinden olamaz; onu yaratan <b>Allah</b>’ı gösterir.</li>

"din-ihlas":{s:"din",kind:"quiz",title:"İhlas suresi",
notes:`<h3>Okunuşu</h3><p><b>Bismillâhirrahmânirrahîm.</b><br>1. Kul hüvallâhü ehad.<br>2. Allâhüs-samed.<br>3. Lem yelid ve lem yûled.<br>4. Ve lem yekün lehû küfüven ehad.</p>
<h3>Anlamı</h3><p>Rahmân ve Rahîm olan Allah’ın adıyla.<br>1. De ki: O, Allah’tır, bir tektir.<br>2. Allah sameddir (her şey O’na muhtaçtır, O hiçbir şeye muhtaç değildir).<br>3. O, doğurmamış ve doğurulmamıştır.<br>4. Hiçbir şey O’na denk değildir.</p>
<h3>Bilgiler</h3><ul><li>Kur’an-ı Kerim’in <b>112.</b> suresidir, <b>4 ayettir</b>, Mekke’de inmiştir.</li>
<li>“İhlas” <b>samimiyet, içtenlik</b> demektir.</li>
<li>Ana konusu <b>tevhid</b>: Allah’ın bir ve tek olması.</li></ul>`,
qs:[
 {q:"İhlas suresi kaç ayettir?",o:["4","7","3","6"],e:"4 ayettir."},
 {q:"İhlas suresinin ana konusu nedir?",o:["Allah’ın birliği (tevhid)","Namazın önemi","Peygamberlerin hayatı","Ahiret günü"],e:"Sure baştan sona Allah’ın birliğini anlatır."},
 {q:"“Lem yelid ve lem yûled” ayetinin anlamı nedir?",o:["O, doğurmamış ve doğurulmamıştır.","De ki: O, Allah’tır, bir tektir.","Hiçbir şey O’na denk değildir.","Allah sameddir."],e:"3. ayet."},
 {q:"“Allâhüs-samed” ayetinin anlamı nedir?",o:["Her şey O’na muhtaçtır, O hiçbir şeye muhtaç değildir.","Allah her şeyi görür.","Allah çok merhametlidir.","Allah her şeyi yaratır."],e:"Samed = muhtaç olmayan, her şeyin O’na muhtaç olduğu."},

"en-will":{s:"en",kind:"quiz",title:"Will or be going to?",
notes:`<h3>will + verb</h3><ul>
<li><b>Predictions and opinions</b> (often with <i>I think, I'm sure, maybe, probably</i>): <i>I think it <b>will</b> be sunny tomorrow.</i></li>
<li><b>Decisions you make right now</b>: <i>The phone is ringing. I<b>'ll</b> answer it!</i></li>
<li><b>Promises and offers</b>: <i>I <b>won't</b> tell anyone. · I<b>'ll</b> help you with your bag.</i></li>
<li><b>Future facts</b>: <i>I <b>will</b> be 11 next year.</i></li></ul>
<h3>be going to + verb</h3><ul>
<li><b>Plans you already made</b>: <i>We<b>'re going to</b> visit Cappadocia in July. We've booked the hotel.</i></li>
<li><b>Predictions with proof you can see now</b>: <i>Look at those black clouds! It<b>'s going to</b> rain.</i></li></ul>
<h3>Forms</h3><p>I <b>will</b> go · I <b>won't</b> go · <b>Will</b> you go?<br>I <b>am / 'm going to</b> go · She <b>is / 's going to</b> go · They <b>are / 're going to</b> go · She <b>isn't going to</b> go · <b>Are</b> you <b>going to</b> go?</p>
<p class="ex">Trick: Is there a plan or proof? → going to. Deciding now, promising, offering, guessing? → will.</p>`,
qs:[
 {q:"“I'm thirsty.” “Wait, I ___ get you some water.”",o:["'ll","'m going to","going to","am"],e:"An offer / a decision made now → will."},
 {q:"We ___ visit Cappadocia next summer. We've already booked the hotel.",o:["are going to","will","going to","are will"],e:"A plan already made → going to."},
 {q:"Look at that boy on the wall! He ___ fall!",o:["is going to","will","going","is will"],e:"You can see it now (proof) → going to."},
 {q:"I think it ___ be sunny tomorrow.",o:["will","is going","are going to","going to"],e:"“I think” + prediction → will."},
 {q:"Don't worry, I ___ tell anyone your secret.",o:["won't","am not going","not will","don't"],e:"A promise → will / won't."},
 {q:"Maybe people ___ live on the Moon in 2100.",o:["will","are going to","going to","is going to"],e:"A guess about the far future → will."},
 {q:"“What are your plans for the weekend?” “I ___ clean my room.”",o:["'m going to","'ll","will to","going"],e:"Plans → going to."},
 {q:"“The phone is ringing!” “I ___ answer it!”",o:["'ll","'m going to","am","going to"],e:"Deciding right now → will."},
 {q:"She has bought flour and eggs. She ___ make a cake.",o:["is going to","will","are going to","going to"],e:"Plan with proof (she bought the things) → going to."},
 {q:"I'm sure you ___ pass the exam.",o:["will","are going","going to","are will"],e:"“I'm sure” + prediction → will."},
 {q:"Are you going to ___ football tomorrow?",o:["play","playing","plays","played"],e:"going to + base verb."},
 {q:"Which sentence is a prediction with proof?",o:["The sky is black. It's going to rain.","I think it will rain next week.","I'll take an umbrella.","Maybe it will rain."],e:"“The sky is black” is the proof."},
 {q:"Which sentence is a decision made right now?",o:["Oh, it's cold. I'll close the window.","I'm going to close the window at 8.","We're going to buy a new window.","The window is going to break."],e:"Instant decision → will."},
 {q:"He ___ going to come to school today. He is ill.",o:["isn't","won't","doesn't","not"],e:"Negative: isn't going to."},
 {q:"Next year I ___ 11 years old.",o:["will be","am going","be","will"],e:"A future fact → will be."},
 {q:"___ you help me with my homework, please?",o:["Will","Are","Going","Do going"],e:"Asking for help → Will you…?"}
]},

"en-time":{s:"en",kind:"quiz",title:"Clock game: what time is it?",gen:"clock",n:12,
notes:`<h3>Telling the time</h3><p>Minutes 1–30 → <b>past</b> this hour. Minutes 31–59 → <b>to</b> the next hour.</p><ul>
<li>9:00 = nine <b>o'clock</b></li><li>9:05 = five past nine · 9:10 = ten past nine</li><li>9:15 = <b>quarter past</b> nine</li><li>9:20 = twenty past nine · 9:25 = twenty-five past nine</li>
<li>9:30 = <b>half past</b> nine</li><li>9:35 = twenty-five to ten · 9:40 = twenty to ten</li><li>9:45 = <b>quarter to</b> ten</li><li>9:50 = ten to ten · 9:55 = five to ten</li></ul>
<p class="ex">On the clock: the short hand shows the hour, the long red hand shows the minutes.</p>`},

function quizQuestions(set){

function runQuiz(id,set,only){
  const qs=only||quizQuestions(set);let i=0,score=0;const wrong=[];
  const show=()=>{
    if(i>=qs.length)return end();
    const q=qs[i],opts=shuffle(q.o.map((t,k)=>({t,ok:k===0})));
    body().innerHTML=`<div class="progress">Question ${i+1} of ${qs.length} · ${score} right</div>
      ${q.p?`<div class="passage">${esc(q.p)}</div>`:""}${q.v?`<div class="visual">${q.v}</div>`:""}
      <div class="q">${q.q}</div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}</div><div id="fb"></div>`;
    body().querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,ok=opts[k].ok;
      body().querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(opts[j].ok)x.classList.add("right")});
      if(ok){score++;addXP(10)}else{b.classList.add("wrong");wrong.push(q)}
      $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"✓ Right!":"✗ Not quite."} ${esc(q.e||"")}</div>

    });
  };
  const end=()=>scoreEnd(id,set,score,qs.length,wrong,only,()=>runQuiz(id,set),w=>runQuiz(id,set,w));

}

// listening: the device reads the text aloud, then questions
function runListen(id,set){
  let plays=0;const can="speechSynthesis" in window;
  const pickVoice=()=>{const vs=speechSynthesis.getVoices(),l=set.lang.toLowerCase(),base=l.slice(0,2);
    return vs.find(v=>v.lang.toLowerCase().replace("_","-")===l)||vs.find(v=>v.lang.toLowerCase().startsWith(base))||null};
  const speak=()=>{
    if(!can)return;speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(set.text);u.lang=set.lang;u.rate=.9;const v=pickVoice();if(v)u.voice=v;
    u.onstart=()=>$("#pl")&&($("#pl").textContent="⏸");u.onend=()=>$("#pl")&&($("#pl").textContent="▶");
    speechSynthesis.speak(u);plays++;$("#pc")&&($("#pc").textContent=`Played ${plays} time${plays>1?"s":""}. In the real exam you usually hear it twice.`);
  };
  if(can){speechSynthesis.getVoices();cleanup=()=>speechSynthesis.cancel()}
  body().innerHTML=`<div class="notes"><h3>How it works</h3><p>Press play and listen <b>without reading</b>. You can take notes on paper: names, places, numbers. Then answer the questions.</p></div>
    ${can?`<button class="play" id="pl" aria-label="Play">▶</button><p class="hint" id="pc">Turn the sound on, then press play.</p>`:
    `<p class="hint">This device can't read aloud. Ask someone to read this text to you twice:</p><div class="passage">${esc(set.text)}</div>`}
    <div class="row center"><button class="btn" id="go">I'm ready – questions →</button></div>`;
  if(can)$("#pl").onclick=()=>{if(speechSynthesis.speaking){speechSynthesis.cancel();$("#pl").textContent="▶"}else speak()};
  $("#go").onclick=()=>{if(can)speechSynthesis.cancel();runQuiz(id,set);
    // after the quiz, offer the text
    const obs=new MutationObserver(()=>{if(body().querySelector(".result")&&!body().querySelector("#txt")){obs.disconnect();
      body().insertAdjacentHTML("beforeend",`<div class="notes" id="txt" style="margin-top:18px"><h3>The text</h3><p>${esc(set.text)}</p></div>`)}});
    obs.observe(body(),{childList:true});const prev=cleanup;cleanup=()=>{obs.disconnect();if(prev)prev()};
  };
}

const LV=250;
function renderXP(){const xp=S.xp||0,lv=Math.floor(xp/LV)+1;
  $("#xp").innerHTML=`<b>⭐ Level ${lv}</b><span class="xpbar" title="${xp%LV} of ${LV} XP to the next level"><i style="width:${xp%LV/LV*100}%"></i></span><span class="mute">${xp} XP</span>`}
function addXP(n){const before=Math.floor((S.xp||0)/LV);S.xp=(S.xp||0)+n;save();renderXP();
  if(Math.floor(S.xp/LV)>before){toast("Level up! ⭐ Level "+(Math.floor(S.xp/LV)+1));confetti()}}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(){if(calm)return;const c=document.createElement("canvas");c.className="confetti";document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext("2d"),cols=["#ffd166","#6ee7a8","#7cc7ff","#ff9a76","#f0a6ff"];
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:5+Math.random()*6,c:cols[Math.random()*5|0],a:Math.random()*6}));
  let t=0;const step=()=>{x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.a+=.12;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++t<140)requestAnimationFrame(step);else c.remove()};step()}
const fmt=t=>esc(t).replace(/___/g,'<span class="gap">___</span>');
const strip=h=>String(h).replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim();
const fmtT=s=>Math.floor(s/60)+":"+pad(Math.round(s%60));
function bestText(id){const x=SETS[id];if(!x||x.kind==="cards"||x.kind==="order")return"";
  if(x.kind==="speed")return S.best[id]!=null?` · best ${S.best[id]} pts`:"";
  if(x.kind==="match")return S.bestTime&&S.bestTime[id]!=null?` · best ${fmtT(S.bestTime[id])}`:"";
  return S.best[id]!=null?` · best ${S.best[id]}%`:""}
function kindLabel(x){return {cards:"Flashcards · "+(x.cards||[]).length,listen:"Listening · "+(x.qs||[]).length+" questions",
  speed:"⚡ 60-second challenge",match:"🧩 Match pairs",sort:"🗂️ Sort it · "+(x.items||[]).length,type:"⌨️ Type the answer · "+(x.items||[]).length,
  order:"🔢 Put in order",quiz:x.gen==="clock"?"🕒 Clock game · "+x.n:"Quiz · "+(x.mix?x.n:(x.qs||[]).length)+" questions"}[x.kind]}

// shared score screen for quiz, sort and type
function scoreEnd(id,set,score,total,wrong,only,again,retry){
  const pct=Math.round(score/total*100);
  if(!only){S.best[id]=Math.max(S.best[id]||0,pct)}
  finishTask();if(!only&&pct>=80)addXP(pct===100?40:20);save();if(pct===100)confetti();
  const msg=pct===100?"Perfect! 🌟":pct>=80?"Great job! 💪":pct>=50?"Good. Look again at the ones you missed.":"Read the notes again and try once more.";
  body().innerHTML=`<div class="result"><div class="big">${score}/${total}</div><p>${msg}</p>${!only&&pct>=80?`<p class="mute">+${pct===100?40:20} bonus XP</p>`:""}</div>
    <div class="row center">${wrong.length?'<button class="btn" id="rw">Try my mistakes again</button>':""}
    <button class="btn quiet" id="ra">Do it all again</button>${set.notes?'<button class="btn quiet" id="rn">Read the notes</button>':""}<button class="btn quiet" id="cl">Finish</button></div>`;
  if(wrong.length)$("#rw").onclick=()=>retry(shuffle(wrong));
  $("#ra").onclick=again;
  if(set.notes)$("#rn").onclick=()=>openActivity(id,curTask);
  $("#cl").onclick=closeSheet;
}

// sort: put each sentence in the right box
function runSort(id,set,only){
  const items=only||shuffle(set.items);let i=0,score=0,streak=0;const wrong=[];
  const show=()=>{
    if(i>=items.length)return scoreEnd(id,set,score,items.length,wrong,only,()=>runSort(id,set),w=>runSort(id,set,w));
    const it=items[i];
    body().innerHTML=`<div class="progress">${i+1} of ${items.length} · ${score} right${streak>=3?` · 🔥 ${streak} in a row`:""}</div>
      ${set.ask?`<p class="hint">${esc(set.ask)}</p>`:""}<div class="sortcard" id="sc">${fmt(it.t)}</div>
      <div class="buckets">${set.buckets.map((b,k)=>`<button class="bucket" data-k="${k}">${esc(b)}</button>`).join("")}</div><div id="fb"></div>`;
    body().querySelectorAll(".bucket").forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.k===it.k;
      body().querySelectorAll(".bucket").forEach(x=>{x.disabled=true;if(+x.dataset.k===it.k)x.classList.add("right")});
      if(ok){score++;streak++;addXP(streak>=3?15:10);$("#sc").classList.add("ok")}
      else{streak=0;b.classList.add("wrong");$("#sc").classList.add("shake");wrong.push(it)}
      $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"✓ Right!":"✗ It's <b>"+esc(set.buckets[it.k])+"</b>."} ${esc(it.e||"")}</div>
        <div class="row" style="margin-top:12px"><button class="btn" id="nx">Next →</button></div>`;
      $("#nx").onclick=()=>{i++;show()};$("#nx").focus();
    });
  };
  show();
}

// match: tap a word, then its meaning
function matchPairs(set){return set.pairs||SETS[set.cards].cards.map(c=>[c.f,strip(c.b)])}
function runMatch(id,set){
  const all=shuffle(matchPairs(set)),per=5,rounds=Math.ceil(all.length/per);let round=0,mistakes=0;const t0=Date.now();
  const iv=setInterval(()=>{const el=$("#tm2");if(el)el.textContent=fmtT((Date.now()-t0)/1000)},500);cleanup=()=>clearInterval(iv);
  const show=()=>{
    if(round>=rounds)return end();
    const pairs=all.slice(round*per,round*per+per);let sel=null,left=pairs.length;
    const L=shuffle(pairs.map((p,k)=>({t:p[0],k}))),R=shuffle(pairs.map((p,k)=>({t:p[1],k})));
    body().innerHTML=`<div class="progress">Round ${round+1} of ${rounds} · ⏱ <span id="tm2">${fmtT((Date.now()-t0)/1000)}</span> · <span id="mk">${mistakes}</span> mistakes</div>
      <p class="hint">Tap a word, then tap its meaning.</p>
      <div class="match"><div class="col">${L.map(x=>`<button class="mt" data-s="L" data-k="${x.k}">${esc(x.t)}</button>`).join("")}</div>
      <div class="col">${R.map(x=>`<button class="mt" data-s="R" data-k="${x.k}">${esc(x.t)}</button>`).join("")}</div></div>`;
    body().querySelectorAll(".mt").forEach(b=>b.onclick=()=>{
      if(b.disabled)return;
      if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
      const a=sel;sel=null;
      if(a.dataset.k===b.dataset.k){[a,b].forEach(x=>{x.classList.remove("sel");x.classList.add("done");x.disabled=true});addXP(5);
        if(--left===0){round++;setTimeout(show,400)}}
      else{mistakes++;$("#mk").textContent=mistakes;[a,b].forEach(x=>x.classList.add("wrong"));setTimeout(()=>[a,b].forEach(x=>x.classList.remove("wrong","sel")),500)}
    });
  };
  const end=()=>{
    clearInterval(iv);const sec=Math.round((Date.now()-t0)/1000);S.bestTime=S.bestTime||{};const prev=S.bestTime[id];
    const record=prev==null||sec<prev;if(record)S.bestTime[id]=sec;finishTask();save();if(record||mistakes===0)confetti();
    body().innerHTML=`<div class="result"><div class="big">${fmtT(sec)}</div><p>${all.length} pairs · ${mistakes} mistake${mistakes===1?"":"s"}</p>
      ${prev!=null&&record?"<p>🏆 New record!</p>":prev!=null?`<p class="mute">Record: ${fmtT(prev)}</p>`:""}</div>
      <div class="row center"><button class="btn" id="ra">Play again</button><button class="btn quiet" id="cl">Finish</button></div>`;
    $("#ra").onclick=()=>runMatch(id,set);$("#cl").onclick=closeSheet;
  };
  show();
}

// speed: as many as you can in 60 seconds, combos multiply points
function speedPool(set){
  if(set.items)return set.items.map(x=>({q:x.q,o:x.o}));
  if(set.fromSort){const s=SETS[set.fromSort];return s.items.map(it=>({q:it.t,o:[s.buckets[it.k],...s.buckets.filter((_,k)=>k!==it.k)]}))}
  const cs=SETS[set.cards].cards.map(c=>({f:c.f,b:strip(c.b)}));
  return cs.map(c=>({q:c.f,o:[c.b,shuffle(cs.filter(x=>x.b!==c.b))[0].b]}));
}
function runSpeed(id,set){
  const DUR=60;
  body().innerHTML=`<div class="result"><div class="big">⚡ ${DUR}s</div><p>${esc(set.how||"Answer as many as you can before the time runs out!")}</p>
    <p class="mute">3 in a row = ×2 points · 6 in a row = ×3 · 9 in a row = ×4${S.best[id]!=null?` · Your best: ${S.best[id]} points`:""}</p></div>
    <div class="row center"><button class="btn" id="go">Start!</button></div>`;
  $("#go").onclick=()=>{
    let pool=shuffle(speedPool(set)),i=0,pts=0,right=0,wrong=0,combo=0,lock=false;const end=Date.now()+DUR*1000,misses=new Map();
    body().innerHTML=`<div class="speedhud"><div class="timer small" id="st">${DUR}</div><div class="pts"><b id="sp">0</b> points<br><span id="sc2">&nbsp;</span></div></div>
      <div class="tbar"><i id="tb"></i></div><div class="q" id="sq"></div><div class="opts two" id="so"></div>`;
    const mult=()=>Math.min(1+Math.floor(combo/3),4);
    const hud=()=>{$("#sp").textContent=pts;$("#sc2").innerHTML=combo>=3?`🔥 ×${mult()} combo`:"&nbsp;"};
    const next=()=>{
      if(i>=pool.length){pool=shuffle(pool);i=0}
      const q=pool[i++],opts=shuffle(q.o.map((t,k)=>({t,ok:k===0})));
      $("#sq").innerHTML=fmt(q.q);
      $("#so").innerHTML=opts.map((o,k)=>`<button class="opt big" data-k="${k}">${esc(o.t)}</button>`).join("");
      $("#so").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        if(lock)return;lock=true;const ok=opts[+b.dataset.k].ok;
        if(ok){right++;combo++;pts+=10*mult();b.classList.add("right");addXP(2)}
        else{wrong++;combo=0;b.classList.add("wrong");$("#so").querySelectorAll(".opt").forEach((x,j)=>{if(opts[j].ok)x.classList.add("right")});misses.set(q.q,q.o[0])}
        hud();setTimeout(()=>{lock=false;if(Date.now()<end)next()},ok?250:900);
      });
    };
    next();hud();
    const iv=setInterval(()=>{const left=Math.max(0,end-Date.now());$("#st").textContent=Math.ceil(left/1000);$("#tb").style.width=(left/DUR/10)+"%";
      if(!left){clearInterval(iv);finish()}},100);
    cleanup=()=>clearInterval(iv);
    const finish=()=>{
      const prev=S.best[id],record=prev==null||pts>prev;if(record)S.best[id]=pts;finishTask();save();if(record&&right>=5)confetti();
      body().innerHTML=`<div class="result"><div class="big">${pts}</div><p>points · ${right} right, ${wrong} wrong</p>
        ${prev!=null&&record?"<p>🏆 New best score!</p>":prev!=null?`<p class="mute">Your best: ${prev}</p>`:""}</div>
        ${misses.size?`<div class="notes"><h3>Check these</h3><ul>${[...misses].map(([q,a])=>`<li>${fmt(q)} → <b>${esc(a)}</b></li>`).join("")}</ul></div>`:""}
        <div class="row center"><button class="btn" id="ra">Play again</button><button class="btn quiet" id="cl">Finish</button></div>`;
      $("#ra").onclick=()=>runSpeed(id,set);$("#cl").onclick=closeSheet;
    };
  };
}

// type: write the answer yourself
const norm=s=>s.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?,]/g,"").replace(/\s+/g," ").trim();
const SUBJW=["i","you","he","she","it","we","they"];
function typeOK(inp,ans){
  const n=norm(inp),A=ans.map(norm);if(A.includes(n))return true;
  const w=n.split(" ");if(SUBJW.includes(w[0])&&A.includes(w.slice(1).join(" ")))return true; // "it is going to rain"
  const m=n.match(/^([a-z]+)('s|'re|'m|'ll)\s(.*)$/);if(m&&A.includes(m[2]+" "+m[3]))return true; // "it's going to rain"
  return false;
}
function runType(id,set,only){
  const qs=only||shuffle(set.items);let i=0,score=0;const wrong=[];
  const show=()=>{
    if(i>=qs.length)return scoreEnd(id,set,score,qs.length,wrong,only,()=>runType(id,set),w=>runType(id,set,w));
    const q=qs[i];
    body().innerHTML=`<div class="progress">${i+1} of ${qs.length} · ${score} right</div>${set.ask?`<p class="hint">${esc(set.ask)}</p>`:""}
      <div class="q">${fmt(q.t)}</div>
      <form id="tf" class="typeform" autocomplete="off"><input id="ti" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the missing words" aria-label="Your answer"><button class="btn" id="tb2">Check</button></form>
      ${q.h?`<button class="linkbtn" id="hb" type="button">Need a hint?</button><p class="hint" id="ht" hidden>💡 ${esc(q.h)}</p>`:""}<div id="fb"></div>`;
    const ti=$("#ti");ti.focus();
    if(q.h)$("#hb").onclick=()=>{$("#ht").hidden=false;$("#hb").hidden=true};
    $("#tf").onsubmit=e=>{e.preventDefault();if(!ti.value.trim()||ti.disabled)return;
      const ok=typeOK(ti.value,q.a);ti.disabled=true;$("#tb2").disabled=true;
      if(ok){score++;addXP(15)}else wrong.push(q);
      $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"✓ Right!":"✗ The answer is <b>"+esc(q.a[0])+"</b>."} ${esc(q.e||"")}</div>
        <div class="row" style="margin-top:12px"><button class="btn" id="nx">Next →</button></div>`;
      $("#nx").onclick=()=>{i++;show()};$("#nx").focus()};
  };
  show();
}

// order: tap the pieces in the right order
function runOrder(id,set){
  let p=0,mistakes=0;
  const show=()=>{
    const pz=set.puzzles[p];if(!pz)return end();
    let next=0;const items=pz.items.map((t,k)=>({t,k}));
    body().innerHTML=`<div class="progress">Puzzle ${p+1} of ${set.puzzles.length} · <span id="mk">${mistakes}</span> mistakes</div><div class="q">${esc(pz.title)}</div>
      <ol class="ordered" id="od"></ol><div class="chips" id="ch">${shuffle(items).map(x=>`<button class="chip" data-k="${x.k}">${esc(x.t)}</button>`).join("")}</div>`;
    $("#ch").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
      if(+b.dataset.k===next){next++;$("#od").insertAdjacentHTML("beforeend",`<li>${esc(b.textContent)}</li>`);b.remove();addXP(3);
        if(next===items.length){p++;$("#ch").innerHTML=`<div class="feedback ok">✓ Perfect order!</div><div class="row" style="margin-top:12px"><button class="btn" id="nx">${p<set.puzzles.length?"Next puzzle →":"See result"}</button></div>`;$("#nx").onclick=show}}
      else{mistakes++;$("#mk").textContent=mistakes;b.classList.add("shake","wrong");setTimeout(()=>b.classList.remove("shake","wrong"),450)}
    });
  };
  const end=()=>{finishTask();if(mistakes===0){addXP(20);confetti()}save();
    body().innerHTML=`<div class="result"><div class="big">${mistakes===0?"🌟":mistakes}</div><p>${mistakes===0?"No mistakes! +20 bonus XP":mistakes+" mistake"+(mistakes===1?"":"s")+". Try again for a perfect round!"}</p></div>
      <div class="row center"><button class="btn" id="ra">Play again</button><button class="btn quiet" id="cl">Finish</button></div>`;
    $("#ra").onclick=()=>runOrder(id,set);$("#cl").onclick=closeSheet};
  show();
}

// clock game questions, made fresh every time
const NUMW=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
const MINW={5:"five",10:"ten",15:"quarter",20:"twenty",25:"twenty-five",30:"half"};
const hn=h=>NUMW[(h-1)%12+1];
const timePhrase=(h,m)=>m===0?`${hn(h)} o'clock`:m<=30?`${MINW[m]} past ${hn(h)}`:`${MINW[60-m]} to ${hn(h+1)}`;
function clockSVG(h,m){
  const R=a=>a*Math.PI/180,ha=R(((h%12)+m/60)*30),ma=R(m*6);let ticks="",nums="";
  for(let k=0;k<60;k++){const a=R(k*6),r1=k%5?85:79;ticks+=`<line x1="${(100+r1*Math.sin(a)).toFixed(1)}" y1="${(100-r1*Math.cos(a)).toFixed(1)}" x2="${(100+90*Math.sin(a)).toFixed(1)}" y2="${(100-90*Math.cos(a)).toFixed(1)}" stroke-width="${k%5?1.5:3}"/>`}
  for(let k=1;k<=12;k++){const a=R(k*30);nums+=`<text x="${(100+66*Math.sin(a)).toFixed(1)}" y="${(100-66*Math.cos(a)+6).toFixed(1)}">${k}</text>`}
  return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="An analogue clock"><circle cx="100" cy="100" r="96" class="cface"/><g class="ticks">${ticks}</g><g class="nums">${nums}</g>
    <line x1="100" y1="100" x2="${(100+44*Math.sin(ha)).toFixed(1)}" y2="${(100-44*Math.cos(ha)).toFixed(1)}" class="hh"/>
    <line x1="100" y1="100" x2="${(100+72*Math.sin(ma)).toFixed(1)}" y2="${(100-72*Math.cos(ma)).toFixed(1)}" class="mh"/><circle cx="100" cy="100" r="5" class="pin"/></svg>`;
}
function clockQuestions(n){
  const ms=[0,5,10,15,20,25,30,35,40,45,50,55],qs=[];
  for(let i=0;i<n;i++){
    const h=1+Math.floor(Math.random()*12),m=ms[Math.floor(Math.random()*ms.length)],right=timePhrase(h,m),cand=new Set();
    [[h,(m+30)%60],[h+1,m],[h+11,m],[h,(60-m)%60],[h,(m+15)%60]].forEach(([a,b])=>{const t=timePhrase((a-1)%12+1,b);if(t!==right)cand.add(t)});
    const digital=i%3===2;
    qs.push({v:digital?`<div class="digital">${h}:${pad(m)}</div>`:clockSVG(h,m),q:digital?"How do you say this time?":"What time is it?",
      o:["It's "+right,...shuffle([...cand]).slice(0,3).map(w=>"It's "+w)],e:`${h}:${pad(m)} = ${right}.`});
  }
  return qs;
}
