<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Typing Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Chakra+Petch:wght@400;600;700&display=swap">
<link rel="stylesheet" href="lab.css">
<style>
:root{--acc:#3ef0ff}
.words{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:24px;line-height:1.7;min-height:130px;max-height:170px;overflow:hidden;font-family:ui-monospace,Menlo,monospace;word-spacing:6px}
.words span.ok{color:var(--green)}.words span.bad{color:#ff6b6b;text-decoration:underline}.words span.cur{background:#2a2470;border-radius:6px;padding:0 4px}
#inp{width:100%;font-size:24px;margin-top:10px;font-family:ui-monospace,Menlo,monospace}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.stat div{flex:1;min-width:110px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-family:var(--display);font-size:28px;color:var(--acc)}
.res{text-align:center;padding:10px}.res .big{font-size:56px;color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
<header><h1>TYPING TRAINER</h1><a class="back" href="./">← ARCADE</a></header>
<p class="sub">Type the words as fast and as correctly as you can. See your speed in words per minute (WPM).</p>
<div class="panel"><div class="row"><div class="tabs" style="margin:0;flex:1"><button data-l="en" class="on">ENGLISH</button><button data-l="tr">TÜRKÇE</button></div><select id="secs" aria-label="Test length"><option value="30">30 seconds</option><option value="60" selected>60 seconds</option><option value="120">2 minutes</option></select><button class="btn alt small" id="restart">↺ NEW TEST</button></div></div>
<div class="panel"><div class="words" id="words"></div><input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Start typing here…" aria-label="Type here">
<div class="stat"><div><small>Time left</small><b id="tLeft">60</b></div><div><small>Speed (WPM)</small><b id="wpm">0</b></div><div><small>Accuracy</small><b id="acc">100%</b></div><div><small>Best</small><b id="best">0</b></div></div></div>
<div class="panel res" id="res" hidden></div>
<p class="note">Tip: keep your eyes on the words, not your fingers. Accuracy first, speed comes with practice!</p>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
let toastT;function toast(m,ms=1800){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Could not save: storage is full')}}};
const W={en:'the be to of and a in that have it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us is was are were been has had did said each tell does set three air play small end put home read hand port large spell add land here must big high such follow act why ask men change went light kind off need house picture try again animal point mother world near build self earth father head stand own page should country found answer school grow study still learn plant cover food sun four between state keep eye never last let thought city tree cross farm hard start might story saw far sea draw left late run'.split(' '),tr:'bir bu ve için çok ne da de ben sen o biz siz onlar var yok gibi daha en ama her şey kadar sonra önce şimdi bugün yarın dün evet hayır iyi güzel büyük küçük yeni eski zaman gün yıl ay hafta saat ev okul kitap kalem defter ders öğretmen öğrenci arkadaş anne baba kardeş aile su ekmek elma yemek oyun top kedi köpek kuş ağaç çiçek deniz güneş yıldız gökyüzü yağmur kar rüzgar sıcak soğuk mavi kırmızı yeşil sarı beyaz siyah gel git yap oku yaz bak dur koş otur kalk sev bil gör duy konuş düşün başla bitir sor cevap soru kapı pencere masa sandalye şehir köy yol araba bisiklet uçak gemi tren müzik resim spor futbol basketbol bilgisayar telefon oyuncak hediye mutlu üzgün hızlı yavaş kolay zor'.split(' ')};
let lang=store.get('typeLang','en'),list=[],i=0,start=0,timer=null,good=0,bad=0,goodChars=0,done=false;
function gen(){list=Array.from({length:120},()=>W[lang][Math.floor(Math.random()*W[lang].length)]);i=0;good=bad=goodChars=0;start=0;done=false;clearInterval(timer);$('inp').value='';$('inp').disabled=false;$('res').hidden=true;$('tLeft').textContent=$('secs').value;$('wpm').textContent=0;$('acc').textContent='100%';$('best').textContent=store.get('typeBest_'+lang,0);draw()}
function draw(){$('words').innerHTML=list.map((w,k)=>`<span id="w${k}" class="${k<i?(list[k].res?'ok':'bad'):k===i?'cur':''}">${esc(w)}</span>`).join(' ');const c=$('w'+i);if(c)$('words').scrollTop=c.offsetTop-$('words').offsetTop-10}
function stats(){const el=(Date.now()-start)/60000;$('wpm').textContent=el>0?Math.round(goodChars/5/el):0;$('acc').textContent=(good+bad?Math.round(good/(good+bad)*100):100)+'%'}
function finish(){done=true;clearInterval(timer);$('inp').disabled=true;stats();const wpm=+$('wpm').textContent,b=store.get('typeBest_'+lang,0);let msg='';if(wpm>b){store.set('typeBest_'+lang,wpm);msg='🏆 New best score!'}
  $('res').hidden=false;$('res').innerHTML=`<div class="big">${wpm} WPM</div><p>${good} words right, ${bad} wrong · accuracy ${$('acc').textContent}</p><p style="color:var(--gold)">${msg}</p><button class="btn" id="again">TRY AGAIN</button>`;$('again').onclick=gen;$('best').textContent=store.get('typeBest_'+lang,0)}
$('inp').addEventListener('input',e=>{if(done)return;if(!start){start=Date.now();const L=+$('secs').value;timer=setInterval(()=>{const left=Math.max(0,L-Math.floor((Date.now()-start)/1000));$('tLeft').textContent=left;stats();if(left<=0)finish()},250)}
  const v=$('inp').value;if(v.endsWith(' ')){const typed=v.trim();if(!typed){$('inp').value='';return}const ok=typed.toLocaleLowerCase(lang)===list[i].toLocaleLowerCase(lang);list[i]=Object.assign(new String(list[i]),{res:ok});if(ok){good++;goodChars+=typed.length+1}else bad++;i++;$('inp').value='';draw();stats()}
  else{const c=$('w'+i);if(c)c.classList.toggle('bad',!list[i].toLocaleLowerCase(lang).startsWith(v.toLocaleLowerCase(lang)))}});
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('typeLang',lang);document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x===b));gen();$('inp').focus()});
document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x.dataset.l===lang));
$('restart').onclick=()=>{gen();$('inp').focus()};$('secs').onchange=gen;gen();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
