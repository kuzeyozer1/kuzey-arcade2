<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>World Flags</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Chakra+Petch:wght@400;600;700&display=swap">
<link rel="stylesheet" href="lab.css">
<style>
:root{--acc:#3b82f6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cty{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:center;color:var(--ink);font:inherit}
.cty .f{font-size:52px;line-height:1.1;display:block}.cty b{display:block;font-size:14px}.cty small{color:var(--mute)}
.cty.open{border-color:var(--acc);background:#13204a}
.conts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.conts button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 13px var(--body);cursor:pointer}.conts button.on{background:var(--acc);border-color:var(--acc)}
.qf{font-size:120px;text-align:center;line-height:1.1}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px;margin:10px auto}
.opts button{padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:700 16px var(--body);cursor:pointer}.opts button.right{background:#1f7a4d;border-color:#5cf2b4}.opts button.wrong{background:#7a1f2a}
.fact{margin-top:8px;font-size:13px;color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
<header><h1>WORLD FLAGS</h1><a class="back" href="./">← ARCADE</a></header>
<p class="sub">Explore 130 countries: their flags, capitals and continents. Then test yourself with the flag quiz!</p>
<div class="tabs"><button data-t="explore" class="on">🗺️ EXPLORE</button><button data-t="quiz">❓ FLAG QUIZ</button></div>
<section id="explore"><div class="panel"><input id="q" placeholder="Search a country or capital…" style="width:100%" aria-label="Search countries"><div class="conts" id="conts"></div></div><div class="grid" id="grid"></div></section>
<section id="quiz" hidden><div class="panel" style="text-align:center"><div class="row" style="justify-content:center"><label>Continent <select id="qc"><option value="">Whole world</option></select></label><label>Ask for <select id="qk"><option value="name">the country</option><option value="cap">the capital</option></select></label></div>
<div class="qf" id="qf"></div><p id="qq" style="font-weight:700"></p><div class="opts" id="opts"></div><p id="score" class="note"></p><button class="btn" id="nextQ" hidden>NEXT ➜</button></div></section>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
let toastT;function toast(m,ms=1800){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Could not save: storage is full')}}};
const D=[["TR", "Türkiye", "Ankara", "Europe"], ["GB", "United Kingdom", "London", "Europe"], ["FR", "France", "Paris", "Europe"], ["DE", "Germany", "Berlin", "Europe"], ["IT", "Italy", "Rome", "Europe"], ["ES", "Spain", "Madrid", "Europe"], ["PT", "Portugal", "Lisbon", "Europe"], ["NL", "Netherlands", "Amsterdam", "Europe"], ["BE", "Belgium", "Brussels", "Europe"], ["CH", "Switzerland", "Bern", "Europe"], ["AT", "Austria", "Vienna", "Europe"], ["PL", "Poland", "Warsaw", "Europe"], ["CZ", "Czechia", "Prague", "Europe"], ["SK", "Slovakia", "Bratislava", "Europe"], ["HU", "Hungary", "Budapest", "Europe"], ["RO", "Romania", "Bucharest", "Europe"], ["BG", "Bulgaria", "Sofia", "Europe"], ["GR", "Greece", "Athens", "Europe"], ["RS", "Serbia", "Belgrade", "Europe"], ["HR", "Croatia", "Zagreb", "Europe"], ["SI", "Slovenia", "Ljubljana", "Europe"], ["BA", "Bosnia and Herzegovina", "Sarajevo", "Europe"], ["AL", "Albania", "Tirana", "Europe"], ["MK", "North Macedonia", "Skopje", "Europe"], ["ME", "Montenegro", "Podgorica", "Europe"], ["UA", "Ukraine", "Kyiv", "Europe"], ["BY", "Belarus", "Minsk", "Europe"], ["RU", "Russia", "Moscow", "Europe"], ["SE", "Sweden", "Stockholm", "Europe"], ["NO", "Norway", "Oslo", "Europe"], ["FI", "Finland", "Helsinki", "Europe"], ["DK", "Denmark", "Copenhagen", "Europe"], ["IS", "Iceland", "Reykjavík", "Europe"], ["IE", "Ireland", "Dublin", "Europe"], ["EE", "Estonia", "Tallinn", "Europe"], ["LV", "Latvia", "Riga", "Europe"], ["LT", "Lithuania", "Vilnius", "Europe"], ["MD", "Moldova", "Chișinău", "Europe"], ["CY", "Cyprus", "Nicosia", "Europe"], ["MT", "Malta", "Valletta", "Europe"], ["LU", "Luxembourg", "Luxembourg", "Europe"], ["AZ", "Azerbaijan", "Baku", "Asia"], ["GE", "Georgia", "Tbilisi", "Asia"], ["AM", "Armenia", "Yerevan", "Asia"], ["KZ", "Kazakhstan", "Astana", "Asia"], ["UZ", "Uzbekistan", "Tashkent", "Asia"], ["TM", "Turkmenistan", "Ashgabat", "Asia"], ["KG", "Kyrgyzstan", "Bishkek", "Asia"], ["TJ", "Tajikistan", "Dushanbe", "Asia"], ["CN", "China", "Beijing", "Asia"], ["JP", "Japan", "Tokyo", "Asia"], ["KR", "South Korea", "Seoul", "Asia"], ["MN", "Mongolia", "Ulaanbaatar", "Asia"], ["IN", "India", "New Delhi", "Asia"], ["PK", "Pakistan", "Islamabad", "Asia"], ["BD", "Bangladesh", "Dhaka", "Asia"], ["NP", "Nepal", "Kathmandu", "Asia"], ["AF", "Afghanistan", "Kabul", "Asia"], ["IR", "Iran", "Tehran", "Asia"], ["IQ", "Iraq", "Baghdad", "Asia"], ["SY", "Syria", "Damascus", "Asia"], ["SA", "Saudi Arabia", "Riyadh", "Asia"], ["AE", "United Arab Emirates", "Abu Dhabi", "Asia"], ["QA", "Qatar", "Doha", "Asia"], ["KW", "Kuwait", "Kuwait City", "Asia"], ["OM", "Oman", "Muscat", "Asia"], ["JO", "Jordan", "Amman", "Asia"], ["LB", "Lebanon", "Beirut", "Asia"], ["TH", "Thailand", "Bangkok", "Asia"], ["VN", "Vietnam", "Hanoi", "Asia"], ["MY", "Malaysia", "Kuala Lumpur", "Asia"], ["SG", "Singapore", "Singapore", "Asia"], ["ID", "Indonesia", "Jakarta", "Asia"], ["PH", "Philippines", "Manila", "Asia"], ["KH", "Cambodia", "Phnom Penh", "Asia"], ["LA", "Laos", "Vientiane", "Asia"], ["EG", "Egypt", "Cairo", "Africa"], ["MA", "Morocco", "Rabat", "Africa"], ["DZ", "Algeria", "Algiers", "Africa"], ["TN", "Tunisia", "Tunis", "Africa"], ["LY", "Libya", "Tripoli", "Africa"], ["SD", "Sudan", "Khartoum", "Africa"], ["ET", "Ethiopia", "Addis Ababa", "Africa"], ["KE", "Kenya", "Nairobi", "Africa"], ["TZ", "Tanzania", "Dodoma", "Africa"], ["UG", "Uganda", "Kampala", "Africa"], ["NG", "Nigeria", "Abuja", "Africa"], ["GH", "Ghana", "Accra", "Africa"], ["SN", "Senegal", "Dakar", "Africa"], ["CI", "Côte d'Ivoire", "Yamoussoukro", "Africa"], ["CM", "Cameroon", "Yaoundé", "Africa"], ["CD", "DR Congo", "Kinshasa", "Africa"], ["AO", "Angola", "Luanda", "Africa"], ["ZA", "South Africa", "Pretoria", "Africa"], ["ZW", "Zimbabwe", "Harare", "Africa"], ["ZM", "Zambia", "Lusaka", "Africa"], ["MZ", "Mozambique", "Maputo", "Africa"], ["MG", "Madagascar", "Antananarivo", "Africa"], ["SO", "Somalia", "Mogadishu", "Africa"], ["RW", "Rwanda", "Kigali", "Africa"], ["ML", "Mali", "Bamako", "Africa"], ["BW", "Botswana", "Gaborone", "Africa"], ["NA", "Namibia", "Windhoek", "Africa"], ["US", "United States", "Washington, D.C.", "North America"], ["CA", "Canada", "Ottawa", "North America"], ["MX", "Mexico", "Mexico City", "North America"], ["CU", "Cuba", "Havana", "North America"], ["JM", "Jamaica", "Kingston", "North America"], ["GT", "Guatemala", "Guatemala City", "North America"], ["PA", "Panama", "Panama City", "North America"], ["CR", "Costa Rica", "San José", "North America"], ["DO", "Dominican Republic", "Santo Domingo", "North America"], ["HN", "Honduras", "Tegucigalpa", "North America"], ["SV", "El Salvador", "San Salvador", "North America"], ["BR", "Brazil", "Brasília", "South America"], ["AR", "Argentina", "Buenos Aires", "South America"], ["CL", "Chile", "Santiago", "South America"], ["PE", "Peru", "Lima", "South America"], ["CO", "Colombia", "Bogotá", "South America"], ["VE", "Venezuela", "Caracas", "South America"], ["EC", "Ecuador", "Quito", "South America"], ["UY", "Uruguay", "Montevideo", "South America"], ["PY", "Paraguay", "Asunción", "South America"], ["GY", "Guyana", "Georgetown", "South America"], ["SR", "Suriname", "Paramaribo", "South America"], ["AU", "Australia", "Canberra", "Oceania"], ["NZ", "New Zealand", "Wellington", "Oceania"], ["FJ", "Fiji", "Suva", "Oceania"], ["PG", "Papua New Guinea", "Port Moresby", "Oceania"], ["WS", "Samoa", "Apia", "Oceania"]].map(([c,n,cap,co])=>({c,n,cap,co})),FACTS={"TR": "Türkiye sits on two continents, Europe and Asia, joined in İstanbul.", "JP": "Japan is made of more than 14,000 islands.", "BR": "Most of the Amazon rainforest is in Brazil.", "RU": "Russia is the biggest country in the world.", "CA": "Canada has more lakes than any other country.", "EG": "The Great Pyramid of Giza in Egypt is about 4,500 years old.", "AU": "Australia is both a country and a continent.", "CN": "The Great Wall of China is thousands of kilometres long.", "IS": "Iceland has volcanoes and glaciers on the same island.", "NP": "Mount Everest, the highest mountain on Earth, is on the border of Nepal.", "IN": "India has more people than any other country.", "CH": "Switzerland has four official languages.", "NZ": "New Zealand was one of the last places on Earth reached by people.", "CL": "Chile is about 4,300 km long but very narrow.", "MG": "Most animals on Madagascar live nowhere else on Earth, like lemurs.", "IT": "Italy has two tiny countries inside it: Vatican City and San Marino.", "NO": "In summer, the Sun never sets in the far north of Norway.", "KE": "Kenya is famous for the great wildlife migration on its savannas.", "PE": "Machu Picchu, an ancient Inca city, is high in the mountains of Peru.", "MX": "Mexico City is built on top of an old lake."};
const flag=c=>String.fromCodePoint(...[...c].map(ch=>127397+ch.charCodeAt(0)));
let cont='',openC=null;const CONTS=[...new Set(D.map(d=>d.co))];
$('conts').innerHTML=['All',...CONTS].map(c=>`<button data-c="${c==='All'?'':c}" class="${c==='All'?'on':''}">${c}</button>`).join('');
$('conts').onclick=e=>{const b=e.target.closest('button');if(!b)return;cont=b.dataset.c;$('conts').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render()};
function render(){const q=$('q').value.trim().toLowerCase();$('grid').innerHTML=D.filter(d=>(!cont||d.co===cont)&&(!q||d.n.toLowerCase().includes(q)||d.cap.toLowerCase().includes(q))).map(d=>`<button class="cty ${openC===d.c?'open':''}" data-c="${d.c}"><span class="f">${flag(d.c)}</span><b>${esc(d.n)}</b><small>${openC===d.c?'Capital: '+esc(d.cap)+'<br>'+esc(d.co):'tap for capital'}</small>${openC===d.c&&FACTS[d.c]?`<div class="fact">${esc(FACTS[d.c])}</div>`:''}</button>`).join('')||'<p class="note">No country found.</p>'}
$('q').oninput=render;$('grid').onclick=e=>{const b=e.target.closest('.cty');if(!b)return;openC=openC===b.dataset.c?null:b.dataset.c;render()};
$('qc').innerHTML+=CONTS.map(c=>`<option>${c}</option>`).join('');
let right=0,total=0,ans=null;
function quiz(){const pool=D.filter(d=>!$('qc').value||d.co===$('qc').value),k=$('qk').value;ans=pool[Math.floor(Math.random()*pool.length)];const opts=[ans];while(opts.length<4){const o=pool[Math.floor(Math.random()*pool.length)];if(!opts.includes(o))opts.push(o)}opts.sort(()=>Math.random()-.5);
  $('qf').textContent=flag(ans.c);$('qq').textContent=k==='name'?'Which country has this flag?':'What is the capital of the country with this flag?';$('nextQ').hidden=true;
  $('opts').innerHTML=opts.map(o=>`<button data-c="${o.c}">${esc(k==='name'?o.n:o.cap)}</button>`).join('')}
$('opts').onclick=e=>{const b=e.target.closest('button');if(!b||!$('nextQ').hidden)return;total++;const ok=b.dataset.c===ans.c;if(ok)right++;b.classList.add(ok?'right':'wrong');$('opts').querySelector(`[data-c="${ans.c}"]`).classList.add('right');
  $('score').textContent=`${ok?'✅ Correct!':'❌ It was '+ans.n+' (capital '+ans.cap+')'} · Score ${right} / ${total}`;$('nextQ').hidden=false};
$('nextQ').onclick=quiz;$('qc').onchange=quiz;$('qk').onchange=quiz;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));$('explore').hidden=b.dataset.t!=='explore';$('quiz').hidden=b.dataset.t!=='quiz';if(b.dataset.t==='quiz')quiz()});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
