function mcStep(q,done,{extra=''}={}){
  const tf=q.tf,opts=tf?[{t:'True ✔',ok:q.a===true},{t:'False ✘',ok:q.a===false}]:shuffle(q.o.map((t,k)=>({t,ok:k===0})));
  stage().innerHTML=`${extra}<div class="q">${esc(q.q).replace(/___/g,'<span class="gap">?</span>')}</div>
    <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.pe?`<span class="pe">${o.pe}</span>`:''}${esc(o.t)}</button>`).join('')}</div>
    <div id="fb"></div>${MODE==='board'?'<div class="row center" id="rv"><button class="btn ghost" id="reveal">👀 Reveal answer</button></div>':''}`;
  const show=(ok,picked)=>{stage().querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(opts[j].ok)b.classList.add('right')});if(picked&&!ok)picked.classList.add('wrong');
    if($('#rv'))$('#rv').remove();$('#fb').outerHTML=`<div class="fb ${ok===null?'info':ok?'ok':'no'}">${ok===null?'':ok?'✔ Right! ':'✘ Not quite. '}${esc(q.e||'')}</div>`+nextBtn();$('#nx').onclick=done;$('#nx').focus()};
  stage().querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=opts[+b.dataset.k].ok;award(ok);if(ok)beep(990,.12);show(ok,b)});
  if($('#reveal'))$('#reveal').onclick=()=>show(null)}

     const opts=shuffle([t,...others]).map(v=>({t:MODE==='solo'?'':v[1],pe:v[0],ok:v===t,w:v[1]}));
     stage().innerHTML=`<div class="row center"><button class="btn" id="play" style="font-size:1.4em">🔊 Listen</button></div><div class="q" style="text-align:center">${q.q}</div>
       <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-label="${esc(o.w)}"><span class="pe">${o.pe}</span>${esc(o.t)}</button>`).join('')}</div><div id="fb"></div>`;
     $('#play').onclick=()=>say(t[1]);setTimeout(()=>say(t[1]),300);
     stage().querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=opts[+b.dataset.k].ok;award(ok);if(ok)beep(990,.12);
       stage().querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(opts[j].ok)x.classList.add('right')});if(!ok)b.classList.add('wrong');
       $('#fb').outerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✔ Right!':'✘ Not quite.'} ${esc(q.e)}</div>`+nextBtn();$('#nx').onclick=done})})},
 match(u){frame(u,'🧩 Match the words');const all=shuffle(u.vocab).slice(0,12);P={i:0,n:Math.ceil(all.length/6),score:0,total:0};
   const round=()=>{if(P.i>=P.n)return finish(u,'match');setProg();const pairs=all.slice(P.i*6,P.i*6+6);let left=pairs.length,sel=null;
     const L=shuffle(pairs.map((p,k)=>({t:p[0]+' '+p[1],k}))),R=shuffle(pairs.map((p,k)=>({t:p[2],k})));
     stage().innerHTML=`<p class="mute" style="margin:0">Tap an English word, then its Turkish meaning.</p><div class="match"><div class="col">${L.map(x=>`<button class="mt" data-s="L" data-k="${x.k}">${esc(x.t)}</button>`).join('')}</div><div class="col">${R.map(x=>`<button class="mt" data-s="R" data-k="${x.k}">${esc(x.t)}</button>`).join('')}</div></div>`;
     stage().querySelectorAll('.mt').forEach(b=>b.onclick=()=>{if(b.disabled)return;if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
       const a=sel;sel=null;const ok=a.dataset.k===b.dataset.k;award(ok);
       if(ok){beep(990,.1);[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done');x.disabled=true});say(pairs[+a.dataset.k][1]);if(--left===0){P.i++;setTimeout(round,600)}}
       else{[a,b].forEach(x=>x.classList.add('wrong'));setTimeout(()=>[a,b].forEach(x=>x.classList.remove('wrong','sel')),500)}})};round()},
 grammar(u){frame(u,'💡 Grammar box');let i=0;const draw=()=>{const g=u.grammar[i];
   stage().innerHTML=`<div class="prog">${i+1} / ${u.grammar.length}</div><div class="slide"><h3>${esc(g.h)}</h3>${g.html}
     <p style="margin:12px 0 4px"><b>Examples:</b></p>${g.ex.map((x,k)=>`<div class="ex-s"><button class="say" data-say="${k}">🔊</button><i>${esc(x)}</i></div>`).join('')}</div>
     <div class="row center"><button class="btn ghost" id="pv" ${i?'':'disabled'}>← Back</button><button class="btn" id="nv">${i<u.grammar.length-1?'Next →':'Practise now ✅'}</button></div>`;
   stage().querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(g.ex[+b.dataset.say]));
   $('#pv').onclick=()=>{i--;draw()};$('#nv').onclick=()=>{if(i<u.grammar.length-1){i++;draw()}else location.hash='u'+u.id+'-choose'}};draw()},
 choose(u){frame(u,'✅ Choose the right answer');runList(u,'choose',shuffle(u.choose),(q,done)=>mcStep(q,done))},
 gaps(u){frame(u,'📝 Fill in the gaps');runList(u,'gaps',shuffle(u.gaps),(g,done)=>{
   const norm=s=>String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?]/g,'').replace(/\s+/g,' ').trim();
   const sentence=esc(g.t).replace('___','<span class="gap">?</span>');
   if(MODE==='solo'){stage().innerHTML=`<div class="q">${sentence}</div><form class="row" id="gf" autocomplete="off"><input class="gapin" id="gi" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type your answer" aria-label="Your answer"><button class="btn">Check</button></form><div id="fb"></div>`;
     $('#gi').focus();$('#gf').onsubmit=ev=>{ev.preventDefault();const v=$('#gi').value;if(!v.trim())return;const ok=g.a.some(a=>norm(a)===norm(v));award(ok);$('#gi').disabled=true;
       $('#fb').outerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✔ Right!':'✘ The answer is <b>'+esc(g.a[0])+'</b>.'} ${esc(g.e||'')}</div>`+nextBtn();$('#nx').onclick=done;$('#nx').focus()}}
   else{stage().innerHTML=`<div class="q">${sentence}</div><p class="mute">Say the answer out loud, then reveal it.</p><div class="row center"><button class="btn" id="rv">👀 Reveal answer</button></div><div id="fb"></div>`;
     $('#rv').onclick=()=>{$('#rv').parentElement.remove();stage().querySelector('.gap').textContent=g.a[0];
       $('#fb').outerHTML=`<div class="fb info">${esc(g.e||'')}</div>`+(MODE==='teams'?`<div class="row center"><button class="btn good" id="yes">✔ ${esc(teams[turn].n)} got it</button><button class="btn bad" id="no">✘ Wrong</button></div>`:nextBtn());
       if(MODE==='teams'){$('#yes').onclick=()=>{award(true);beep(990,.12);done()};$('#no').onclick=()=>{award(false);done()}}else $('#nx').onclick=done}}})},
 order(u){frame(u,'🔀 Put the words in order');runList(u,'order',shuffle(u.order),(s,done)=>{
   const words=s.replace(/[.?!]$/,'').split(' '),end=s.slice(-1),chips=shuffle(words.map((w,k)=>({w,k})));let built=[];
   const draw=()=>{stage().innerHTML=`<p class="mute" style="margin:0">Tap the words to make a sentence.</p><div class="built" id="bt">${built.map((c,j)=>`<button class="chip" data-b="${j}">${esc(c.w)}</button>`).join('')||'<span class="mute">…</span>'}<b>${esc(end)}</b></div>
     <div class="chips">${chips.map((c,j)=>`<button class="chip${built.includes(c)?' used':''}" data-c="${j}" ${built.includes(c)?'disabled':''}>${esc(c.w)}</button>`).join('')}</div>
     <div class="row center"><button class="btn ghost" id="clr">↺ Start again</button><button class="btn" id="ck" ${built.length===words.length?'':'disabled'}>Check</button></div><div id="fb"></div>`;
     stage().querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{built.push(chips[+b.dataset.c]);draw()});
     stage().querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{built.splice(+b.dataset.b,1);draw()});
     $('#clr').onclick=()=>{built=[];draw()};
     $('#ck').onclick=()=>{const ok=built.map(c=>c.w).join(' ').toLowerCase()===words.join(' ').toLowerCase();award(ok);if(ok)beep(990,.12);say(s);
       stage().querySelectorAll('button').forEach(b=>b.disabled=true);$('#fb').outerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✔ Right!':'✘ The sentence is:'} <b>${esc(s)}</b></div>`+nextBtn();$('#nx').onclick=done}};draw()})},
 read(u){const R=u.read;frame(u,'📖 Reading: '+esc(R.title));const text=`<div class="passage"><div class="row" style="justify-content:space-between"><b>${esc(R.title)}</b><button class="say" id="rd">🔊 Read aloud</button></div>${R.text.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
   runList(u,'read',R.qs,(q,done)=>{mcStep(q,done,{extra:text});$('#rd').onclick=()=>{if(window.speechSynthesis)speechSynthesis.cancel();say(R.text.join(' '))}})},
 listening(u){const L=u.listen;frame(u,'🎧 Listening: '+esc(L.title));const who=[...new Set(L.lines.map(l=>l[0]))];
   const play=()=>{if(!('speechSynthesis' in window))return toast('This device cannot read aloud.');speechSynthesis.cancel();L.lines.forEach(([s,t])=>say(t,who.indexOf(s)))};
   let showScript=false;const top=()=>`<div class="row center"><button class="btn" id="pl">▶ Play the dialogue</button><button class="btn ghost" id="sc">${showScript?'🙈 Hide':'📄 Show'} the script</button></div>
     ${showScript?`<div class="script">${L.lines.map(([s,t])=>`<div><b>${esc(s)}:</b> ${esc(t)}</div>`).join('')}</div>`:''}`;
   const bindTop=()=>{$('#pl').onclick=play;$('#sc').onclick=()=>{showScript=!showScript;const q=stage().querySelector('.q');const keep=stage().innerHTML;stage().querySelector('#lt').innerHTML=top();bindTop()}};
   runList(u,'listening',L.qs,(q,done)=>{mcStep(q,done,{extra:'<div id="lt"></div>'});$('#lt').innerHTML=top();bindTop()})},
 speak(u){frame(u,'🎤 Speaking cards');let i=0;const draw=()=>{const s=u.speak[i];
   stage().innerHTML=`<div class="prog">${i+1} / ${u.speak.length}</div><div class="q">${esc(s.p)}</div><div class="phr"><b>Useful phrases</b><ul>${s.ph.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
     <div class="row center"><button class="btn ghost" id="t30">⏳ 30s to think</button><button class="btn ghost" id="t60">🎤 1 minute to speak</button><button class="btn ghost" id="sm">💬 Sample answer</button></div><div id="mdl"></div>
     ${MODE==='teams'?`<div class="row center"><span class="turnlbl">Points for ${teams[turn].e} ${esc(teams[turn].n)}:</span><button class="btn good" data-aw="1">+1</button><button class="btn good" data-aw="2">+2</button><button class="btn good" data-aw="3">+3</button><button class="btn ghost" data-aw="0">No points</button></div>`:''}
     <div class="row center"><button class="btn ghost" id="pv" ${i?'':'disabled'}>← Back</button><button class="btn" id="nv">${i<u.speak.length-1?'Next card →':'Finish'}</button></div>`;
   $('#t30').onclick=()=>{window.scrollTo(0,0);startTimer(30)};$('#t60').onclick=()=>{window.scrollTo(0,0);startTimer(60)};
   $('#sm').onclick=()=>{$('#mdl').innerHTML=`<div class="model">${esc(s.m)} <button class="say" id="sms">🔊</button></div>`;$('#sms').onclick=()=>say(s.m)};
   stage().querySelectorAll('[data-aw]').forEach(b=>b.onclick=()=>{const n=+b.dataset.aw;if(n)teams[turn].s+=n;turn=(turn+1)%teams.length;saveTeams();renderScore();paintTurn();if(n)beep(990,.12);draw()});
   $('#pv').onclick=()=>{i--;draw()};$('#nv').onclick=()=>{if(i<u.speak.length-1){i++;draw()}else{P={score:0,total:0};finish(u,'speak')}}};draw()},
 write(u){frame(u,'✍️ Writing task');let i=0;const draw=()=>{const w=u.write[i],key=`w${u.id}-${i}`;
   stage().innerHTML=`<div class="prog">${i+1} / ${u.write.length}</div><div class="q">${esc(w.p)}</div><div class="phr"><b>Tips</b><ul>${w.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
     ${MODE==='solo'?`<textarea class="wr" id="wr" placeholder="Write here…" aria-label="Your writing">${esc(store.get(key,''))}</textarea><p class="mute" id="wc" style="margin:0"></p>`:''}
     <div class="row center"><button class="btn ghost" id="sm">💡 Show a model answer</button></div><div id="mdl"></div>
     <div class="row center"><button class="btn ghost" id="pv" ${i?'':'disabled'}>← Back</button><button class="btn" id="nv">${i<u.write.length-1?'Next task →':'Finish'}</button></div>`;
   const wr=$('#wr');if(wr){const cnt=()=>{const n=wr.value.trim()?wr.value.trim().split(/\s+/).length:0;$('#wc').textContent=`${n} words`};wr.oninput=()=>{store.set(key,wr.value);cnt()};cnt()}
   $('#sm').onclick=()=>{$('#mdl').innerHTML=`<div class="model">${esc(w.m)} <button class="say" id="sms">🔊</button></div>`;$('#sms').onclick=()=>say(w.m)};
   $('#pv').onclick=()=>{i--;draw()};$('#nv').onclick=()=>{if(i<u.write.length-1){i++;draw()}else{P={score:0,total:0};finish(u,'write')}}};draw()}
};

/* ================= ROUTER ================= */
function route(){
  if('speechSynthesis' in window)speechSynthesis.cancel();
  const h=location.hash.slice(1),m=h.match(/^u(\d+)(?:-(\w+))?$/);document.documentElement.style.setProperty('--c','#2f7de1');
  const u=m&&unitOf(+m[1]);
  if(!u||u.soon){home();return}
  document.documentElement.style.setProperty('--c',u.color);
  if(m[2]&&EX[m[2]])EX[m[2]](u);else unitPage(u);
  window.scrollTo(0,0)}
addEventListener('hashchange',route);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'){$('#sheet').hidden=true;renderScore()}});
setMode(MODE);
})();
</script>
</body>
