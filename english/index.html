<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>Kuzey English Class</title>

<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* A bright classroom workbook: cream paper, one colour per unit, big tap targets.
   Board mode scales everything up for a projector; Teams mode adds a scoreboard strip. Light only, for projectors. */
:root{
  --paper:#fff7e8; --card:#ffffff; --ink:#1f2340; --mute:#5d6283; --line:#e6dcc6;
  --good:#1f9d63; --bad:#d6455d; --gold:#f2a516; --c:#2f7de1;
  --display:'Baloo 2', ui-rounded, system-ui, sans-serif; --body:'Nunito', system-ui, sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  padding:env(safe-area-inset-top,0px) 0 calc(30px + env(safe-area-inset-bottom,0px))}
body.board{font-size:24px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
a{color:inherit}
.mute{color:var(--mute)}
.btn{border:0;border-radius:14px;padding:12px 20px;font-family:var(--display);font-weight:700;font-size:1.05em;cursor:pointer;background:var(--c);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
/* top */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px 8px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none}
.logo span{font-size:34px}
.logo h1{font-size:1.5em;color:var(--ink)}
.logo p{margin:0;font-size:.7em;color:var(--mute)}
.modes{display:flex;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px}
.modes button{border:0;background:none;border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:800;font-size:.85em;color:var(--mute)}
.modes button[aria-pressed=true]{background:var(--ink);color:#fff}
/* scoreboard */
.score{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.team{flex:1 1 150px;display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:6px 10px}
.team.turn{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 30%,transparent)}
.team .em{font-size:1.5em}
.team .nm{font-weight:800;flex:1;min-width:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .pt{font-family:var(--display);font-size:1.6em;font-weight:800;color:var(--tc);min-width:1.5em;text-align:center;font-variant-numeric:tabular-nums}
.team button{border:0;background:var(--paper);border-radius:8px;width:30px;height:30px;font-weight:800;cursor:pointer}
.turnlbl{font-weight:800;color:var(--mute);font-size:.85em}
/* home */
.hero{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 20px;margin:6px 0 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero h2{font-size:1.6em}
.hero p{margin:4px 0 0;color:var(--mute);max-width:60ch}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.unit{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-top:10px solid var(--uc);border-radius:20px;padding:16px;cursor:pointer;text-decoration:none;color:var(--ink);min-height:150px}
.unit .ue{font-size:2.2em;line-height:1}
.unit b{font-family:var(--display);font-size:.9em;color:var(--uc);letter-spacing:.04em}
.unit h3{font-size:1.25em}
.unit small{color:var(--mute)}
.unit.soon{border-top-color:var(--line);opacity:.7;cursor:default}
/* unit page */
.uhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--uc);color:#fff;border-radius:22px;padding:16px 20px;margin:6px 0 18px}
.uhead .ue{font-size:2.6em}
.uhead h2{font-size:1.8em}
.uhead p{margin:2px 0 0;opacity:.9}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;text-decoration:none;color:var(--mute);margin-top:4px}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.sec{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:1.2em;display:flex;gap:8px;align-items:center}
.ex{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none;color:var(--ink);background:var(--paper);font-weight:700}
.ex:hover{border-color:var(--uc)}
.ex .i{font-size:1.4em}
.ex .st{margin-left:auto;color:var(--gold);font-size:.85em;white-space:nowrap}
/* player */
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.pbar h2{font-size:1.35em;margin-right:auto}
.prog{font-weight:800;color:var(--mute)}
.timer{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.timer.run{border-color:var(--c);color:var(--c)}.timer.end{background:var(--bad);color:#fff;border-color:var(--bad)}
.stage{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;min-height:340px;display:flex;flex-direction:column;gap:16px}
.q{font-family:var(--display);font-size:1.45em;font-weight:700;line-height:1.25}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer;font-weight:700;font-size:1.05em}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt.right{border-color:var(--good);background:#e2f6ec}
.opt.wrong{border-color:var(--bad);background:#fde6ea}
.opt[disabled]{cursor:default}
.opt .pe{font-size:2.2em;display:block;text-align:center}
.fb{border-radius:14px;padding:10px 14px;font-weight:700}
.fb.ok{background:#e2f6ec;color:#145c3b}.fb.no{background:#fde6ea;color:#8a1f33}.fb.info{background:#eef4ff;color:#1d3f7a}
.gap{display:inline-block;min-width:4em;border-bottom:3px solid var(--c);color:var(--c);text-align:center;padding:0 4px}
.gapin{border:3px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0;flex:1 1 200px;background:var(--paper)}
.gapin:focus{outline:none;border-color:var(--c)}
.passage{background:#fffdf7;border:2px dashed var(--line);border-radius:16px;padding:14px 18px;font-size:1.02em}
.passage p{margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid var(--c);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer}
.chip.used{opacity:.25;cursor:default}
.built{min-height:60px;border:3px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.built .chip{border-color:var(--ink)}
.card3d{perspective:1400px;cursor:pointer;max-width:620px;width:100%;margin:0 auto}
.flip{position:relative;height:300px;transition:transform .45s;transform-style:preserve-3d}
body.board .flip{height:400px}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px}
.face.f{background:var(--paper);border:4px solid var(--c)}
.face.f .pe{font-size:5em;line-height:1}
.face.f b{font-family:var(--display);font-size:2em}
.face.b{background:var(--c);color:#fff;transform:rotateY(180deg)}
.face.b b{font-family:var(--display);font-size:2em}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:12px;cursor:pointer;font-weight:700;min-height:56px;overflow-wrap:anywhere}
.mt.sel{border-color:var(--gold);background:#fff4d8}.mt.done{border-color:var(--good);background:#e2f6ec;opacity:.55;cursor:default}.mt.wrong{border-color:var(--bad);background:#fde6ea}
.slide h3{font-size:1.4em;color:var(--c);margin-bottom:6px}
.slide table{border-collapse:collapse;width:100%}
.slide td,.slide th{border:2px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.slide th{background:var(--paper)}
.ex-s{display:flex;align-items:center;gap:8px;margin:6px 0}
.say{border:0;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:4px 10px;cursor:pointer;font-size:.95em}
.script{display:flex;flex-direction:column;gap:6px}
.script div{background:var(--paper);border-radius:12px;padding:6px 12px}
.script b{color:var(--c)}
.phr{background:var(--paper);border-radius:14px;padding:10px 14px}
.phr ul{margin:4px 0 0;padding-left:22px}
textarea.wr{width:100%;min-height:150px;border:3px solid var(--line);border-radius:16px;padding:12px;background:#fffdf7;resize:vertical}
.model{background:#e2f6ec;border-radius:14px;padding:12px 14px}
.fin{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.fin .big{font-family:var(--display);font-size:3.4em;font-weight:800;color:var(--c);line-height:1}
.stars{font-size:2.4em;letter-spacing:.1em}
.sheet{position:fixed;inset:0;background:rgba(31,35,64,.45);display:grid;place-items:center;padding:16px;z-index:20}
.sheet .box{background:var(--card);border-radius:22px;padding:20px;width:min(520px,100%);display:flex;flex-direction:column;gap:12px}
.sheet input{border:2px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 18px;font-weight:800;z-index:30;max-width:90vw;text-align:center}
@media (max-width:600px){.match{gap:6px}.mt{padding:8px;font-size:.9em}.q{font-size:1.25em}.flip{height:240px}}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="#"><span>🧭</span><div><h1>Kuzey English Class</h1><p>Practice for our Compass units</p></div></a>
    <div class="modes" role="group" aria-label="Mode">
      <button data-mode="board" title="Teacher on the board">📺 Board</button>
      <button data-mode="teams" title="Class teams game">👥 Teams</button>
      <button data-mode="solo" title="Students on tablets">📱 Solo</button>
    </div>
  </header>
  <div id="score"></div>
  <main id="app"></main>
</div>
<div class="sheet" id="sheet" hidden><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem('kec:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('kec:'+k,JSON.stringify(v))}catch(e){}}};
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400)}

/* ================= CONTENT ================= */
// Each unit: vocab, grammar slides, choose (multiple choice), gaps, word order, reading, listening, speaking, writing.
// To add a unit, copy one of these objects and change the content. Units without content show as "coming soon".
const UNITS=[
{id:1,title:'Why Do We Need Nature?',emoji:'🌳',color:'#2e9d5b',topics:'The natural world · natural resources · stative and action verbs · narrative tenses (past simple, past continuous, past perfect)',
 vocab:[['🌲','forest','orman'],['🏞️','river','nehir'],['🌊','ocean','okyanus'],['⛰️','mountain','dağ'],['🟫','soil','toprak'],['💧','water','su'],['💨','air','hava'],['☀️','sunlight','güneş ışığı'],
   ['🌬️','wind','rüzgâr'],['🪨','coal','kömür'],['🛢️','oil','petrol'],['🪵','wood','odun, tahta'],['🌱','plant','bitki'],['🦌','wildlife','yaban hayatı'],['🏭','pollution','kirlilik'],['♻️','recycle','geri dönüştürmek'],
   ['🛡️','protect','korumak'],['🐼','endangered','nesli tükenmekte'],['🏡','habitat','yaşam alanı'],['🔋','renewable energy','yenilenebilir enerji']],
 grammar:[
  {h:'Natural resources',html:`<p><b>Natural resources</b> are things from nature that people use.</p><table><tr><th>♻️ Renewable (won't run out)</th><th>⛔ Non-renewable (will run out)</th></tr><tr><td>sunlight, wind, water, wood (if we plant new trees)</td><td>coal, oil, natural gas (fossil fuels)</td></tr></table>`,ex:['The sun is a renewable resource.','Coal and oil are non-renewable.']},
  {h:'Stative and action verbs',html:`<p><b>Action verbs</b> are things we do. They can be in the continuous form: <i>She <b>is planting</b> a tree.</i></p><p><b>Stative verbs</b> are about thoughts, feelings, senses and owning. We usually <b>don't</b> use them with -ing:<br><b>know, like, love, hate, want, need, believe, understand, think</b> (opinion)<b>, own, belong, seem, taste, smell</b></p><p>✓ <i>I know the answer.</i> &nbsp; ✗ <i>I'm knowing the answer.</i></p>`,ex:['We need clean water.','Look! The children are planting trees.']},
  {h:'Past simple',html:`<p>A <b>finished</b> action in the past.</p><table><tr><th>✅</th><td>I <b>visited</b> the forest. · We <b>saw</b> a deer.</td></tr><tr><th>❌</th><td>I <b>didn't visit</b> the forest.</td></tr><tr><th>❓</th><td><b>Did</b> you <b>visit</b> the forest?</td></tr></table><p>Irregular: go → went, see → saw, have → had, take → took, find → found, fall → fell, grow → grew, swim → swam</p>`,ex:['Last summer we went to the mountains.','Did you see the river?']},
  {h:'Past continuous',html:`<p>An action <b>in progress</b> at a time in the past: <b>was / were + verb-ing</b>.</p><table><tr><td>I / he / she / it <b>was</b> walking</td><td>you / we / they <b>were</b> walking</td></tr></table><p>Long action + short action:<br><i>I <b>was walking</b> in the forest <b>when</b> I <b>saw</b> a deer.</i><br><i><b>While</b> we <b>were swimming</b>, it <b>started</b> to rain.</i></p>`,ex:['I was walking in the forest when I saw a deer.','While we were swimming, it started to rain.']},
  {h:'Past perfect',html:`<p>An action that happened <b>before</b> another action in the past: <b>had + past participle</b>.</p><p><i>When we arrived at the lake, the rain <b>had stopped</b>.<br>I couldn't go in because I <b>had lost</b> my key.<br>She was tired because she <b>had walked</b> for hours.</i></p><table><tr><th>1st (earlier)</th><th>2nd (later)</th></tr><tr><td>The bus <b>had left</b></td><td>when we <b>got</b> to the stop.</td></tr></table>`,ex:['When we got to the forest, the sun had gone down.','I had never seen a deer before that day.']}],
 choose:[
  {q:'I ___ the answer to this question.',o:['know','am knowing','knowing','am know'],e:'know is a stative verb.'},
  {q:'Look! Those people ___ rubbish on the beach.',o:['are picking up','pick up','picks up','picked up'],e:'Look! = happening now → present continuous.'},
  {q:'We ___ more trees in our city.',o:['need','are needing','needing','needs'],e:'need is stative.'},
  {q:'Yesterday we ___ a fox in the forest.',o:['saw','see','were seeing','seed'],e:'Finished past action → past simple (see → saw).'},
  {q:'At 10 o\'clock yesterday, I ___ my bike by the river.',o:['was riding','rode','am riding','were riding'],e:'In progress at a time in the past; I → was.'},
  {q:'While they ___ in the lake, it started to rain.',o:['were swimming','was swimming','swam','swim'],e:'while + long action; they → were.'},
  {q:'I was reading about pandas when my mum ___ me.',o:['called','was calling','calls','call'],e:'The short action that interrupts → past simple.'},
  {q:'Which one is a renewable resource?',o:['wind','coal','oil','natural gas'],e:'Wind will never run out.'},
  {q:'Which one is a stative verb?',o:['believe','plant','swim','carry'],e:'believe = a thought, not an action.'},
  {q:'Pandas are ___ animals. There are very few of them.',o:['endangered','renewable','polluted','recycled'],e:'endangered = in danger of disappearing.'},
  {q:'Factories and cars cause air ___.',o:['pollution','habitat','soil','energy'],e:'pollution = making air, water or land dirty.'},
  {q:'___ you recycle the bottles yesterday?',o:['Did','Were','Do','Was'],e:'Past simple question: Did + subject + verb.'},
  {q:'When we arrived at the beach, the storm ___.',o:['had stopped','stopped','was stopping','has stopped'],e:'The earlier action → past perfect.'},
  {q:'I couldn\'t open the door because I ___ my key.',o:['had lost','lost','was losing','have lost'],e:'Lost the key before → past perfect.'}],
 gaps:[
  {t:'This soup ___ delicious. (taste)',a:['tastes'],e:'Stative verb in the present simple.'},
  {t:'Shh! The baby bird ___ . (sleep)',a:['is sleeping'],e:'Happening now → is sleeping.'},
  {t:'Last weekend we ___ ten trees. (plant)',a:['planted'],e:'Past simple, regular verb.'},
  {t:'I ___ a deer while I was walking. (see)',a:['saw'],e:'Irregular past: see → saw.'},
  {t:'They ___ football when it started to rain. (play)',a:['were playing'],e:'Long action → past continuous.'},
  {t:'Oil and coal are ___ resources. (renewable / non-renewable)',a:['non-renewable','nonrenewable'],e:'They will run out one day.'},
  {t:'We ___ plastic bottles to help the planet. (recycle)',a:['recycle'],e:'Present simple for habits.'},
  {t:'My sister ___ animals very much. (love)',a:['loves'],e:'Stative verb, she → loves.'},
  {t:'When we got to the river, the fish ___ away. (swim, past perfect)',a:['had swum'],e:'had + past participle (swim → swum).'}],
 order:['When we arrived, the rain had stopped.','The children were planting trees in the park.','I don\'t understand this word.','We saw a deer while we were walking.','She loves the smell of the forest.','Do you know the name of this river?','They were recycling bottles when it started to rain.'],
 read:{title:'The Amazon Rainforest',text:['The Amazon is the biggest rainforest in the world. It is in South America, and it covers parts of nine countries. Millions of kinds of plants and animals live there.','The trees of the Amazon produce a lot of oxygen, so people call it "the lungs of the planet". But the forest is in danger. People are cutting down trees for wood and farmland. When the trees disappear, animals lose their habitat and many species become endangered.','Scientists say we can all help. We can use less paper, recycle, and buy products that do not harm forests.'],
  qs:[{q:'Where is the Amazon rainforest?',o:['In South America','In Africa','In Asia','In Europe'],e:'"It is in South America."'},
   {q:'Why do people call it "the lungs of the planet"?',o:['Its trees produce a lot of oxygen.','It is very big.','It has many rivers.','People breathe there.'],e:'Paragraph 2.'},
   {q:'Why are people cutting down trees?',o:['For wood and farmland','For fun','To build schools','To make the rivers bigger'],e:'"for wood and farmland"'},
   {q:'What happens to animals when the trees disappear?',o:['They lose their habitat.','They get bigger.','They move to the city.','Nothing happens.'],e:'Paragraph 2.'},
   {tf:true,q:'The Amazon covers parts of nine countries.',a:true},{tf:true,q:'The Amazon is in no danger.',a:false},{tf:true,q:'Recycling and using less paper can help.',a:true}]},
 listen:{title:'A weekend at the lake',lines:[['Mia','Hi Tom! What did you do at the weekend?'],['Tom','I went camping at Pine Lake with my family.'],['Mia','Cool! What were you doing when it got dark?'],['Tom','We were cooking dinner on the campfire. Then my dad saw an owl in a tree!'],['Mia','Wow! Did you swim in the lake?'],['Tom','Yes, but while we were swimming, it started to rain, so we ran back to the tent.'],['Mia','Oh no! Was there any rubbish at the lake?'],['Tom','A little. We picked it up and recycled the plastic bottles.']],
  qs:[{q:'Where did Tom go at the weekend?',o:['Camping at Pine Lake','To the beach','To the city','To a farm'],e:'"I went camping at Pine Lake."'},
   {q:'What were they doing when it got dark?',o:['Cooking dinner on the campfire','Swimming','Sleeping','Fishing'],e:'"We were cooking dinner on the campfire."'},
   {q:'What did his dad see?',o:['An owl','A deer','A fox','A fish'],e:'"my dad saw an owl in a tree"'},
   {q:'What happened while they were swimming?',o:['It started to rain.','They saw a bear.','The sun came out.','They lost the tent.'],e:'Long action + short action.'},
   {q:'What did they do with the rubbish?',o:['They picked it up and recycled the bottles.','They left it there.','They burned it.','They put it in the lake.'],e:'Last line.'}]},
 speak:[{p:'Why do we need nature? Give three reasons.',ph:['We need nature because …','Trees give us …','Without … we can\'t …'],m:'We need nature because trees give us oxygen. Rivers and lakes give us water to drink. Nature is also a home for animals, and it makes people happy and healthy.'},
  {p:'What do you do to protect nature?',ph:['I always …','I never …','At school we …'],m:'I always recycle paper and plastic. I never leave rubbish in the park. At school we turn off the lights, and last year we planted trees in the garden.'},
  {p:'Tell us about a time you were in nature. What were you doing? What happened?',ph:['Last summer I …','I was … when …','While we were …'],m:'Last summer I went to the mountains with my family. We were walking near a river when we saw a deer. While we were having a picnic, a bird took my sandwich!'},
  {p:'Renewable or non-renewable? Name two of each and say why.',ph:['… is renewable because …','… is non-renewable because …'],m:'Sunlight and wind are renewable because they never run out. Coal and oil are non-renewable because they will run out one day.'}],
 write:[{p:'Write 5 sentences: How can our school protect nature?',tips:['Use "We can …" and "We should …"','Give at least 3 ideas','Use nature words: recycle, protect, plant, pollution'],m:'Our school can protect nature in many ways. We can recycle paper, plastic and glass. We should turn off the lights when we leave the classroom. We can plant trees and flowers in the garden. We can also walk or cycle to school to reduce air pollution.'},
  {p:'Write about a day in nature. Use the past simple and the past continuous (when / while).',tips:['Where did you go? Who with?','What were you doing when something happened?','How did you feel?'],m:'Last spring my class went to a forest near our town. We were walking along a river when our teacher saw a big turtle. While we were watching it, it started to rain! We ran under the trees and laughed. It was a great day.'}]},
{id:2,title:'How Can We Make Our Dreams Come True?',emoji:'🚀',color:'#7a4fe0',topics:'Goals & jobs · first and second conditional · future plans (be going to) and predictions (will)',
 vocab:[['🩺','doctor','doktor'],['🐶','vet','veteriner'],['🏛️','architect','mimar'],['🚀','astronaut','astronot'],['⚙️','engineer','mühendis'],['✈️','pilot','pilot'],['🧑‍🍳','chef','aşçı'],['📰','journalist','gazeteci'],
   ['🔬','scientist','bilim insanı'],['🚒','firefighter','itfaiyeci'],['🦷','dentist','diş hekimi'],['💻','programmer','programcı'],['📷','photographer','fotoğrafçı'],['🎯','goal','hedef'],['💭','dream','hayal'],['🏆','achieve','başarmak'],
   ['🏋️','practise','pratik yapmak'],['🧠','skill','beceri'],['💪','hard-working','çalışkan'],['⭐','talented','yetenekli']],
 grammar:[
  {h:'Future plans: be going to',html:`<p>Use <b>be going to + verb</b> for <b>plans</b> you have already made, and for <b>predictions with proof</b> you can see now.</p><table><tr><td>I <b>am</b> going to study</td><td>He / She <b>is</b> going to study</td><td>We / They <b>are</b> going to study</td></tr></table><p><i>I'm going to join the robotics club. · Look at the clouds! It's going to rain.</i></p>`,ex:['I am going to practise the piano every day.','Look at those clouds! It is going to rain.']},
  {h:'Predictions: will',html:`<p>Use <b>will + verb</b> for <b>predictions and opinions</b> (often with <i>I think, I'm sure, maybe, probably</i>), for <b>promises</b> and for <b>decisions you make now</b>.</p><p><i>I think robots <b>will</b> help doctors. · I <b>won't</b> give up! · The phone is ringing. I<b>'ll</b> answer it.</i></p><p class="mute">✗ I will going to · ✗ She going to · ✗ He will goes</p>`,ex:['I think people will live on Mars.','I promise I won\'t give up.']},
  {h:'First conditional',html:`<p>A <b>real</b>, possible situation in the future.</p><p style="font-size:1.15em"><b>If</b> + present simple, <b>will</b> + verb</p><p><i>If you <b>practise</b> every day, you <b>will improve</b>. · If it <b>rains</b>, we <b>won't play</b> outside.</i></p>`,ex:['If you work hard, you will achieve your goals.','If it rains, we will stay at home.']},
  {h:'Second conditional',html:`<p>An <b>imaginary</b> or unlikely situation.</p><p style="font-size:1.15em"><b>If</b> + past simple, <b>would</b> + verb</p><p><i>If I <b>had</b> a million dollars, I <b>would build</b> a school. · If I <b>were</b> an astronaut, I <b>would visit</b> the Moon.</i></p><table><tr><th>First (real)</th><th>Second (imaginary)</th></tr><tr><td>If I <b>pass</b> the test, I <b>will be</b> happy.</td><td>If I <b>were</b> a bird, I <b>would fly</b>.</td></tr></table>`,ex:['If I were a pilot, I would fly around the world.','If I had more time, I would learn Japanese.']}],
 choose:[
  {q:'If you practise every day, you ___ better.',o:['will get','would get','got','get'],e:'First conditional: If + present, will + verb.'},
  {q:'If I ___ a superhero, I would help everyone.',o:['were','am','will be','be'],e:'Second conditional: If I were …'},
  {q:'If I had a robot, it ___ my homework.',o:['would do','will do','does','did'],e:'Second conditional: would + verb.'},
  {q:'I\'ve decided. I ___ join the science club.',o:['am going to','will','would','going to'],e:'A plan already made → be going to.'},
  {q:'I think robots ___ teach children in the future.',o:['will','are going','would','going to'],e:'"I think" + prediction → will.'},
  {q:'Look at that dark sky! It ___ rain.',o:['is going to','will','would','rains'],e:'Proof you can see → going to.'},
  {q:'A person who looks after sick animals is a ___.',o:['vet','pilot','chef','journalist'],e:'vet = veteriner'},
  {q:'A person who designs buildings is an ___.',o:['architect','astronaut','engineer','photographer'],e:'architect = mimar'},
  {q:'She ___ to be a doctor. She studies biology every day.',o:['is going','will','would','goes'],e:'is going to be = a plan.'},
  {q:'If it ___ tomorrow, we won\'t have the picnic.',o:['rains','will rain','rained','would rain'],e:'If + present simple.'},

  {q:'Which sentence is a promise?',o:['I won\'t give up!','It\'s going to rain.','If I were rich, I would travel.','She is a chef.'],e:'Promises use will / won\'t.'}],

 order:['If you practise every day, you will improve.','I am going to join the robotics club.','If I were a pilot, I would fly around the world.','I think robots will help doctors.','She wants to be a vet because she loves animals.','We are going to visit a science museum next week.'],
 read:{title:'From a Small Village to the Stars',text:['Elif lives in a small village near the mountains. Every night she looks at the stars from her window. Her big dream is to become an astronaut.','Last year, while she was reading a book about space, she made a plan. Now she is going to study science and maths very hard, and next summer she is going to attend a space camp.','"Some people say my dream is impossible," Elif says. "But if I work hard, I will achieve it. If I were an astronaut today, I would take photos of Earth for my village!" Her teacher thinks Elif will be a great scientist one day.'],
  qs:[{q:'What is Elif\'s dream?',o:['To become an astronaut','To become a teacher','To live in a city','To be a photographer'],e:'Paragraph 1.'},
   {q:'What was she doing when she made a plan?',o:['She was reading a book about space.','She was looking at the stars.','She was at space camp.','She was taking photos.'],e:'Past continuous: was reading.'},
   {q:'What is she going to do next summer?',o:['Attend a space camp','Visit the Moon','Move to a city','Write a book'],e:'A plan → going to.'},
   {q:'"If I work hard, I will achieve it." What kind of sentence is this?',o:['First conditional','Second conditional','Past continuous','Past simple'],e:'If + present, will + verb.'},
   {tf:true,q:'Elif lives in a big city.',a:false},{tf:true,q:'Her teacher thinks she will be a great scientist.',a:true},{tf:true,q:'If Elif were an astronaut, she would take photos of Earth.',a:true}]},
 listen:{title:'Meet a young chef',lines:[['Reporter','Hello Deniz! You are only twenty and you are a chef. When did you start cooking?'],['Deniz','I started when I was eight. I was helping my grandma in the kitchen when I made my first cake.'],['Reporter','What is your next goal?'],['Deniz','I\'m going to open my own restaurant next year. I have already found the building!'],['Reporter','Do you think it will be successful?'],['Deniz','I think it will be very popular, because the food will be healthy and delicious.'],['Reporter','What advice do you have for young people?'],['Deniz','If you love something, practise it every day. If you work hard, your dreams will come true.']],
  qs:[{q:'How old is Deniz?',o:['Twenty','Eight','Twelve','Thirty'],e:'"You are only twenty."'},
   {q:'What was Deniz doing when he made his first cake?',o:['Helping his grandma in the kitchen','Watching TV','Working in a restaurant','Shopping'],e:'Past continuous.'},
   {q:'What is he going to do next year?',o:['Open his own restaurant','Go to university','Write a cookbook','Move abroad'],e:'A plan → going to.'},
   {q:'Why does he think the restaurant will be popular?',o:['The food will be healthy and delicious.','It will be cheap.','It will be very big.','His grandma will cook.'],e:'A prediction with will.'},
   {q:'What is his advice?',o:['Practise what you love every day.','Never cook at home.','Stop dreaming.','Only work at weekends.'],e:'Last line.'}]},
 speak:[{p:'What is your dream job? Why?',ph:['I want to be a … because …','I love …','I\'m good at …'],m:'I want to be an engineer because I love building things. I\'m good at maths and science, and I enjoy solving problems.'},
  {p:'What are you going to do to make your dream come true?',ph:['I\'m going to …','Next year I\'m going to …','Every day I …'],m:'I\'m going to study hard at school. Next year I\'m going to join the robotics club, and I\'m going to practise coding every week.'},
  {p:'If you were famous, what would you do?',ph:['If I were famous, I would …','I would also …'],m:'If I were famous, I would help children who can\'t go to school. I would also travel around the world and meet interesting people.'},
  {p:'How will the world be in 2050? Make three predictions.',ph:['I think … will …','Maybe …','I\'m sure …'],m:'I think cars will fly. Maybe people will live on Mars. I\'m sure robots will help us at home and at school.'}],
 write:[{p:'Write a paragraph: My Dream Job.',tips:['What do you want to be? Why?','Use "be going to" for your plans','Use one first conditional (If I …, I will …)'],m:'I want to be a vet because I love animals. I\'m going to study science very hard at school. Next summer I\'m going to help at an animal shelter. If I work hard, I will become a good vet. I think I will open my own animal hospital one day.'},
  {p:'Write four sentences that start with "If I were …".',tips:['If I were + a job / an animal / a famous person','… I would + verb'],m:'If I were a bird, I would fly over the mountains. If I were a teacher, I would give no homework on Fridays. If I were a scientist, I would find a cure for diseases. If I were rich, I would build a park in my town.'}]},
{id:3,title:'How Important Is Money?',emoji:'💰',color:'#d98a00',topics:'Shopping · money verbs · quantifiers (too much/many, too, (not) enough) · present perfect (ever, never, already, yet, for, since)',
 vocab:[['🛒','shopping cart','alışveriş arabası'],['🧾','receipt','fiş'],['💳','credit card','kredi kartı'],['💵','cash','nakit'],['🏷️','price tag','fiyat etiketi'],['🛍️','shopping bag','alışveriş poşeti'],['🏬','shopping mall','alışveriş merkezi'],['📉','sale','indirimli satış'],

 grammar:[
  {h:'Too much, too many, too',html:`<table><tr><th>too many + countable</th><td>There are <b>too many</b> people in the shop.</td></tr><tr><th>too much + uncountable</th><td>I spent <b>too much</b> money.</td></tr><tr><th>too + adjective</th><td>These shoes are <b>too expensive</b>. (more than I want)</td></tr></table>`,ex:['I have too many toys.','This bike is too expensive for me.']},
  {h:'(not) enough',html:`<table><tr><th>enough + noun</th><td>I have <b>enough money</b> for a ticket.</td></tr><tr><th>adjective + enough</th><td>He isn't <b>old enough</b> to drive.</td></tr><tr><th>not enough</th><td>We do<b>n't</b> have <b>enough time</b>.</td></tr></table><p class="mute">Remember: <b>enough</b> goes <b>before</b> a noun but <b>after</b> an adjective.</p>`,ex:['I don\'t have enough money.','Is the box big enough?']},
  {h:'Present perfect: have / has + past participle',html:`<p>Life experiences and recent actions, when we don't say exactly when.</p><table><tr><td>I / you / we / they <b>have</b> saved</td><td>he / she / it <b>has</b> saved</td></tr></table><p><b>ever</b> (questions) · <b>never</b> (not at any time): <i>Have you <b>ever</b> lost your wallet? I have <b>never</b> been to a market.</i><br><b>already</b> (sooner than expected) · <b>yet</b> (questions and negatives, at the end): <i>I have <b>already</b> paid. Have you paid <b>yet</b>? I haven't paid <b>yet</b>.</i></p><p>Irregular participles: buy → bought, spend → spent, pay → paid, lend → lent, be → been, see → seen, go → gone</p>`,ex:['Have you ever saved money for something special?','I have already spent my pocket money.']},
  {h:'For and since',html:`<table><tr><th>for + a period of time</th><td>I have saved money <b>for</b> three months.</td></tr><tr><th>since + a starting point</th><td>I have saved money <b>since</b> January.</td></tr></table><p><i>for two years · for a week · since 2024 · since Monday · since I was eight</i></p>`,ex:['She has worked at the bank for ten years.','We have lived here since 2020.']}],

 order:['I have never borrowed money from a friend.','There are too many shops in this street.','Have you finished your shopping yet?','She has saved money since January.','We don\'t have enough money for a new car.','My parents have already paid the bill.'],
 read:{title:'The Girl Who Saved',text:['Zeynep is eleven, and for two years she has saved half of her pocket money every week. She has never spent money on things she doesn\'t need. "Before I buy something, I ask myself: Do I really need it?" she says.','Last year Zeynep wanted a new bike, but it was too expensive. She didn\'t have enough money, so she made a plan. She sold her old books and toys at a school market and earned 300 lira. She has already bought the bike, and now she is saving for a laptop.','Zeynep thinks money is important, but not the most important thing. "My family and friends are more important," she says. "But if you save a little, you can afford the things you really want."'],
  qs:[{q:'How long has Zeynep saved half of her pocket money?',o:['For two years','Since last week','For two months','Since she was two'],e:'"for two years"'},
   {q:'Why couldn\'t she buy the bike at first?',o:['It was too expensive.','It was too small.','The shop was closed.','She didn\'t like it.'],e:'Paragraph 2.'},
   {q:'How did she earn 300 lira?',o:['She sold her old books and toys.','She borrowed it from her dad.','She found it.','She worked in a shop.'],e:'"She sold her old books and toys at a school market."'},
   {q:'What is she saving for now?',o:['A laptop','A bike','A phone','A holiday'],e:'"now she is saving for a laptop"'},
   {tf:true,q:'Zeynep has already bought the bike.',a:true},{tf:true,q:'Zeynep thinks money is the most important thing.',a:false},{tf:true,q:'She asks herself if she really needs something before she buys it.',a:true}]},
 listen:{title:'At the shop',lines:[['Cashier','Hello! Can I help you?'],['Ali','Yes, how much is this T-shirt?'],['Cashier','It\'s 400 lira, but it\'s on sale today, so it\'s 250.'],['Ali','Hmm, that\'s still too expensive for me. I only have 200.'],['Cashier','This blue one is 180 lira. Have you seen it?'],['Ali','No, I haven\'t. Oh, I like it! Can I pay by card?'],['Cashier','Of course. Here\'s your receipt. If there\'s a problem, you can get a refund.'],['Ali','Great, thanks! I\'ve never found such a bargain.']],

 speak:[{p:'How important is money to you? Why?',ph:['I think money is … because …','But … is more important than money.'],m:'I think money is important because we need it for food, clothes and school. But my family and friends are more important than money.'},
  {p:'Have you ever saved money for something? What was it?',ph:['I have saved money for …','I have already / haven\'t … yet','for … / since …'],m:'Yes, I have. I have saved money for a new skateboard since September. I haven\'t bought it yet, but I have almost got enough money.'},
  {p:'Talk about a time you spent too much money.',ph:['I spent too much on …','It was too …','I didn\'t have enough …'],m:'Last summer I spent too much money on ice cream and snacks. At the end of the holiday I didn\'t have enough money for a book I wanted.'},
  {p:'Give three tips to save money.',ph:['You should …','Don\'t …','If you …, you will …'],m:'You should make a list before you go shopping. Don\'t buy things you don\'t need. If you save a little every week, you will have enough for something special.'}],
 write:[{p:'Write a short paragraph: How I spend and save my pocket money.',tips:['How much pocket money do you get?','What do you spend it on? What do you save it for?','Use the present perfect with for / since and too much / enough'],m:'I get 100 lira of pocket money every week. I usually spend some on snacks and comics. I have saved money for a new game since October, but I don\'t have enough yet. Sometimes I spend too much on sweets, so now I write down everything I buy.'},
  {p:'Write five "Have you ever …?" questions about money and shopping, and answer them.',tips:['Have you ever … ? Yes, I have. / No, I haven\'t.','Use: lost, found, borrowed, lent, bought, sold'],m:'Have you ever lost your wallet? No, I haven\'t. Have you ever found money? Yes, I have. Have you ever borrowed money from a friend? Yes, I have. Have you ever sold something online? No, I haven\'t. Have you ever bought something on sale? Yes, I have.'}]},
{id:4,title:'How Do Our Minds and Bodies Work?',emoji:'🧠',color:'#e0457b',topics:'Parts of the body · thinking expressions · comparatives, superlatives and (not) as … as · sense verbs (look, sound, feel …; like / as if / as though)',
 vocab:[['🧠','brain','beyin'],['❤️','heart','kalp'],['🫁','lungs','akciğerler'],['🦴','bones','kemikler'],['💪','muscles','kaslar'],['🖐️','skin','deri'],['🩸','blood','kan'],['👁️','eye','göz'],['👂','ear','kulak'],['👅','tongue','dil'],['🦷','teeth','dişler'],['💀','skeleton','iskelet'],

 grammar:[
  {h:'Comparatives and superlatives',html:`<table><tr><th></th><th>comparative</th><th>superlative</th></tr><tr><td>short: fast</td><td>fast<b>er</b> than</td><td>the fast<b>est</b></td></tr><tr><td>-y: heavy</td><td>heav<b>ier</b></td><td>the heav<b>iest</b></td></tr><tr><td>long: important</td><td><b>more</b> important</td><td>the <b>most</b> important</td></tr><tr><td>good / bad / far</td><td>better / worse / further</td><td>the best / the worst / the furthest</td></tr></table>`,ex:['The heart is stronger than you think.','The brain is the most amazing organ.']},
  {h:'(not) as … as',html:`<p><b>as + adjective + as</b> = the same. <b>not as … as</b> = less.</p><p><i>My brother is <b>as tall as</b> my dad.</i><br><i>A cat's brain is <b>not as big as</b> a human brain.</i></p>`,ex:['My left hand is not as strong as my right hand.','Her memory is as good as a computer!']},
  {h:'Sense verbs',html:`<p><b>look, sound, smell, taste, feel + adjective</b> (perception and speculation):</p><p><i>You <b>look tired</b>. · That <b>sounds</b> great! · This soup <b>tastes delicious</b>. · I <b>feel</b> nervous.</i></p><p><b>sense verb + like + noun</b>: <i>It <b>looks like</b> a heart. · He <b>sounds like</b> a robot.</i></p>`,ex:['You look tired today.','This cake smells like chocolate.']},
  {h:'as if / as though',html:`<p><b>sense verb + as if / as though + sentence</b> (how something seems):</p><p><i>You <b>look as if</b> you haven't slept. · It <b>sounds as though</b> she is crying. · I <b>feel as if</b> my head is going to explode!</i></p><p class="mute">like + noun · as if / as though + subject + verb</p>`,ex:['He looks as if he has seen a ghost.','It feels as though my legs are made of jelly.']}],

 order:['The brain is the most amazing part of the body.','You look as if you have seen a ghost.','My arms are not as strong as my legs.','This soup smells like my grandma\'s cooking.','He changed his mind about the trip.','Your heart is bigger than you think.'],
 read:{title:'Amazing Facts About Your Body',text:['Your body is more amazing than any machine. An adult has 206 bones, but a baby is born with more, about 300! Some of them join together as the baby grows.','Your brain uses about 20% of your body\'s energy, so thinking is harder work than you think. Your heart beats about 100,000 times a day, and your skin is the largest organ of your body.','Scientists say your brain works best when you sleep well, eat healthy food and exercise. So if you feel as if you can\'t think clearly, maybe you need a walk or a good night\'s sleep!'],
  qs:[{q:'How many bones does an adult have?',o:['206','300','100','20'],e:'Paragraph 1.'},
   {q:'What happens to some of a baby\'s bones?',o:['They join together.','They disappear.','They get softer.','They break.'],e:'"Some of them join together as the baby grows."'},
   {q:'Which is the largest organ?',o:['The skin','The brain','The heart','The lungs'],e:'Paragraph 2.'},
   {q:'When does your brain work best?',o:['When you sleep well, eat healthy food and exercise','When you play video games','When you are hungry','At night'],e:'Paragraph 3.'},
   {tf:true,q:'A baby has fewer bones than an adult.',a:false},{tf:true,q:'The brain uses about 20% of the body\'s energy.',a:true},{tf:true,q:'The heart beats about 100,000 times a day.',a:true}]},
 listen:{title:'At the science fair',lines:[['Ece','Hi Can! Your model looks amazing. What is it?'],['Can','It\'s a model of the human brain. It\'s bigger than a real brain, of course.'],['Ece','It looks like a giant walnut!'],['Can','Ha! Yes. This part helps us think, and this part controls our balance.'],['Ece','Which part is the most important?'],['Can','They\'re all important, but this one controls the heart and breathing.'],['Ece','You sound as if you\'re a real scientist!'],['Can','Thanks! I was in two minds about the topic, but I\'m happy I chose the brain.']],
  qs:[{q:'What is Can\'s model?',o:['A model of the human brain','A model of the heart','A robot','A skeleton'],e:'"a model of the human brain"'},
   {q:'Is the model bigger or smaller than a real brain?',o:['Bigger','Smaller','The same size','We don\'t know'],e:'"It\'s bigger than a real brain."'},
   {q:'What does Ece say it looks like?',o:['A giant walnut','A cloud','An apple','A ball'],e:'"It looks like a giant walnut!"'},
   {q:'What does one part of the brain control?',o:['The heart and breathing','The weather','The teeth','The skin colour'],e:'"this one controls the heart and breathing"'},
   {q:'"I was in two minds" means …',o:['he couldn\'t decide','he was very clever','he had a headache','he changed schools'],e:'be in two minds = kararsız olmak.'}]},
 speak:[{p:'Compare yourself with someone in your family. Use comparatives and (not) as … as.',ph:['I\'m taller / faster / … than …','I\'m not as … as …','… is the … in my family.'],m:'I\'m taller than my sister, but I\'m not as tall as my dad. My mum is the funniest person in my family, and my brother is the best at football.'},
  {p:'Look around the classroom. Use sense verbs: look, sound, feel, smell.',ph:['… looks …','… looks like …','It sounds as if …'],m:'Our teacher looks happy today. The board looks like a big black window. It sounds as if it\'s raining outside.'},
  {p:'Tell us about a time you changed your mind.',ph:['I was in two minds about …','At first I …, but then I changed my mind because …'],m:'I was in two minds about joining the chess club. At first I wanted to join the football team, but then I changed my mind because chess is quieter and I love thinking games.'},
  {p:'What do you do to keep your mind and body healthy?',ph:['I always …','It\'s better to … than …','The most important thing is …'],m:'I always sleep nine hours and I play basketball twice a week. It\'s better to walk to school than to go by car. The most important thing is to eat healthy food.'}],
 write:[{p:'Write five facts about the human body using comparatives and superlatives.',tips:['The … is the … organ.','… is … than …','… is not as … as …'],m:'The skin is the largest organ of the body. The thigh bone is the longest bone. Your heart is stronger than many machines. A baby\'s bones are softer than an adult\'s bones. Your nose is not as sensitive as a dog\'s nose.'},
  {p:'Describe a picture of a person. How do they look and feel? Use sense verbs with like / as if.',tips:['He / She looks …','He / She looks like …','It looks as if / as though …'],m:'The boy in the picture looks very excited. He looks like a footballer because he is wearing a team shirt. It looks as if his team has just won the match, and he looks as though he is shouting with happiness.'}]},
{id:5,title:'What Effect Does Technology Have on Our Lives?',emoji:'💻',color:'#1f8fb8',topics:'Compound adjectives · innovation · passives · permission and obligation (allow, let, make)',
 vocab:[['🌟','well-known','ünlü, tanınmış'],['🤖','high-tech','ileri teknoloji'],['🔋','battery-powered','pille çalışan'],['👍','user-friendly','kullanımı kolay'],['⏱️','time-saving','zaman kazandıran'],['🌍','eco-friendly','çevre dostu'],['🎧','hands-free','eller serbest'],['📻','old-fashioned','eski moda'],
   ['🌧️','water-resistant','suya dayanıklı'],['✨','life-changing','hayatı değiştiren'],['💡','invent','icat etmek'],['🏆','invention','icat'],['🧑‍🔬','inventor','mucit'],['📱','device','cihaz'],['🦾','robot','robot'],['🧪','prototype','prototip'],
   ['🔍','discover','keşfetmek'],['✏️','design','tasarlamak'],['🧠','artificial intelligence','yapay zekâ'],['🖨️','3D printer','3D yazıcı']],
 grammar:[
  {h:'The passive: present and past',html:`<p>We use the passive when the <b>action</b> is more important than <b>who</b> does it: <b>be + past participle</b> (+ by …).</p><table><tr><th>Present</th><td>Phones <b>are made</b> in factories.</td></tr><tr><th>Past</th><td>The telephone <b>was invented</b> in 1876.</td></tr><tr><th>by</th><td>The light bulb was improved <b>by</b> Thomas Edison.</td></tr></table>`,ex:['Millions of messages are sent every day.','The first computer was built in the 1940s.']},
  {h:'The passive: continuous and present perfect',html:`<table><tr><th>Present continuous</th><td>A new robot <b>is being tested</b> right now.</td></tr><tr><th>Past continuous</th><td>The app <b>was being updated</b> when it crashed.</td></tr><tr><th>Present perfect</th><td>My phone <b>has been repaired</b>.</td></tr></table><p class="mute">Active: Engineers are testing a robot. → Passive: A robot is being tested.</p>`,ex:['The school computers are being updated.','Our tablets have been charged.']},
  {h:'Permission: allow, let',html:`<table><tr><th>let + person + verb</th><td>My parents <b>let me play</b> games at the weekend.</td></tr><tr><th>allow + person + to + verb</th><td>The teacher <b>allows us to use</b> tablets.</td></tr><tr><th>be allowed to</th><td>We <b>are</b>n't <b>allowed to</b> use phones in class.</td></tr></table>`,ex:['My mum lets me watch a film on Fridays.','We are allowed to use the computers at break.']},
  {h:'Obligation: make',html:`<p><b>make + person + verb</b> (no "to") = force someone to do something.</p><p><i>My dad <b>makes me turn off</b> my tablet at 9 o'clock.<br>The teacher <b>made us rewrite</b> the story.</i></p><p class="mute">✗ makes me to turn off · ✗ lets me to play</p>`,ex:['My parents make me do my homework first.','The coach made us run five laps.']}],

 order:['The telephone was invented by Alexander Graham Bell.','My parents let me use the computer at weekends.','A new robot is being tested in the lab.','We are not allowed to use phones in class.','My phone has been repaired.','The teacher made us switch off our tablets.'],
 read:{title:'Robots in Our Lives',text:['Robots are used in many places today. In factories, cars are built by robot arms. In hospitals, some operations are helped by robots, and in some homes floors are cleaned by small robot vacuum cleaners.','The first industrial robot was used in a car factory in the United States in 1961. Since then, robots have been improved a lot. Now new robots are being designed with artificial intelligence, so they can learn.','Some people worry that robots will take our jobs. Others say robots let people do more interesting work and make dangerous jobs safer. What do you think?'],
  qs:[{q:'Where are cars built by robot arms?',o:['In factories','In hospitals','In homes','In schools'],e:'Paragraph 1.'},
   {q:'When was the first industrial robot used?',o:['In 1961','In 2001','In 1876','In 1990'],e:'Paragraph 2.'},
   {q:'What can new robots with artificial intelligence do?',o:['They can learn.','They can sleep.','They can eat.','They can\'t move.'],e:'"so they can learn"'},
   {q:'What do some people worry about?',o:['Robots will take our jobs.','Robots are too small.','Robots are too cheap.','Robots can\'t clean.'],e:'Paragraph 3.'},
   {tf:true,q:'Floors in some homes are cleaned by robots.',a:true},{tf:true,q:'Robots have not changed since 1961.',a:false},{tf:true,q:'Some people say robots make dangerous jobs safer.',a:true}]},
 listen:{title:'Screen time rules',lines:[['Leo','Do your parents let you play video games on school days?'],['Sara','No, they don\'t. I\'m only allowed to play at the weekend.'],['Leo','My mum lets me play for thirty minutes after homework. But she makes me do my homework first!'],['Sara','My dad makes me turn off my tablet at nine o\'clock.'],['Leo','That\'s fair. Hey, did you know our school tablets are being replaced?'],['Sara','Really? Who told you?'],['Leo','Our teacher. The new tablets were ordered last month, and they\'ve already been delivered!'],['Sara','Cool! I hope they\'re more user-friendly than the old ones.']],
  qs:[{q:'When is Sara allowed to play video games?',o:['At the weekend','Every day','After school','Never'],e:'"I\'m only allowed to play at the weekend."'},
   {q:'What does Leo\'s mum make him do first?',o:['His homework','The dishes','Go to bed','Read a book'],e:'"she makes me do my homework first"'},
   {q:'What time does Sara have to turn off her tablet?',o:['At nine o\'clock','At eight o\'clock','At ten o\'clock','At seven o\'clock'],e:'"at nine o\'clock"'},
   {q:'What is happening to the school tablets?',o:['They are being replaced.','They are being sold.','They are broken.','They are lost.'],e:'Present continuous passive.'},
   {q:'When were the new tablets ordered?',o:['Last month','Yesterday','Last year','Next week'],e:'"ordered last month"'}]},
 speak:[{p:'What rules about technology do you have at home?',ph:['My parents let me …','I\'m (not) allowed to …','They make me …'],m:'My parents let me use my tablet for one hour a day. I\'m not allowed to take my phone to bed, and they make me turn off the TV at dinner.'},
  {p:'Choose an invention. When was it invented? How has it changed our lives?',ph:['… was invented in … by …','Before …, people …','Now …'],m:'The smartphone was invented about thirty years ago. Before smartphones, people used maps and cameras. Now we can do everything with one device.'},
  {p:'Describe a gadget using compound adjectives.',ph:['It\'s …-friendly','It\'s battery-powered / water-resistant / hands-free …'],m:'My headphones are battery-powered and hands-free. They\'re also water-resistant, so I can use them in the rain. They\'re very user-friendly.'},
  {p:'Is technology good or bad for children? Give your opinion.',ph:['I think technology is … because …','On the other hand, …'],m:'I think technology is good because we can learn new things and talk to our friends. On the other hand, too much screen time is bad for our eyes and our sleep.'}],
 write:[{p:'Write about an invention in the passive: when, where and by whom was it invented? How is it used today?',tips:['It was invented in … by …','It is used for …','It has been improved …'],m:'The bicycle was invented in Germany in the 1800s. The first bicycles were made of wood. Today bicycles are used all over the world, and they have been improved a lot. Now electric bikes are being designed for cities.'},
  {p:'Design your own invention. Describe it with compound adjectives and passives.',tips:['What is it called? What does it do?','Use compound adjectives: eco-friendly, time-saving …','It is powered by … / It can be used …'],m:'My invention is called the Homework Helper. It is a small, battery-powered robot. It is very user-friendly and time-saving. It can be used to check your spelling, and it is powered by solar energy, so it is eco-friendly.'}]},
{id:6,title:'What Makes Us Different from Animals?',emoji:'🦒',color:'#c4602c',topics:'Animal body parts · word families · so (that) and such (a/an) · defining and non-defining relative clauses',
 vocab:[['🐦','beak','gaga'],['🦅','claws','pençeler'],['🦊','fur','kürk'],['🪶','feathers','tüyler'],['🐟','fins','yüzgeçler'],['🫧','gills','solungaçlar'],['🐴','hooves','toynaklar'],['🦌','antlers','boynuzlar (geyik)'],['🐐','horns','boynuzlar'],['🐾','paws','patiler'],
   ['🐍','scales','pullar'],['🐒','tail','kuyruk'],['🐘','trunk','hortum'],['🐱','whiskers','bıyıklar'],['🦋','wings','kanatlar'],['🧠','intelligent → intelligence','zeki → zekâ'],['🎨','create → creative → creativity','yaratmak → yaratıcı → yaratıcılık'],['💭','imagine → imagination','hayal etmek → hayal gücü'],['😊','emotion → emotional','duygu → duygusal'],['🗣️','communicate → communication','iletişim kurmak → iletişim']],
 grammar:[
  {h:'so … (that)',html:`<p><b>so + adjective / adverb (+ that + result)</b></p><p><i>Dolphins are <b>so intelligent</b>!<br>The elephant was <b>so heavy that</b> the bridge broke.<br>The cheetah ran <b>so fast that</b> we couldn't see it.</i></p>`,ex:['The parrot is so clever that it can say fifty words.','The film was so sad that I cried.']},
  {h:'such (a/an) … (that)',html:`<p><b>such + (adjective) + noun (+ that …)</b></p><table><tr><th>such a/an + singular</th><td>It was <b>such a clever dog that</b> it opened the door.</td></tr><tr><th>such + plural / uncountable</th><td>They are <b>such beautiful birds</b>. · It was <b>such bad weather that</b> we stayed inside.</td></tr></table><p class="mute">so + adjective · such + adjective + noun</p>`,ex:['It\'s such a big animal!','They were such friendly monkeys that they took our food.']},
  {h:'Defining relative clauses',html:`<p>They give <b>necessary</b> information about a noun. No commas.</p><table><tr><th>who / that</th><td>people: A vet is a person <b>who</b> looks after animals.</td></tr><tr><th>which / that</th><td>things, animals: A gill is the part <b>which</b> helps a fish breathe.</td></tr><tr><th>where</th><td>places: This is the zoo <b>where</b> I saw a panda.</td></tr><tr><th>whose</th><td>possession: She's the girl <b>whose</b> cat can open doors.</td></tr></table>`,ex:['An elephant is an animal which has a trunk.','This is the scientist who studies crows.']},
  {h:'Non-defining relative clauses',html:`<p>They give <b>extra</b> information. We use <b>commas</b>, and we <b>can't</b> use <b>that</b>.</p><p><i>Dolphins, <b>which</b> live in groups, are very social.<br>My uncle, <b>who</b> works at the zoo, feeds the lions.<br>Antalya, <b>where</b> I was born, has a big aquarium.</i></p>`,ex:['Crows, which are very clever, can use tools.','My cousin, who loves animals, wants to be a vet.']}],

  {q:'The cheetah ran ___ fast that we couldn\'t see it.',o:['so','such','such a','very'],e:'so + adverb.'},

  {q:'This is the forest ___ the bears live.',o:['where','which','who','whose'],e:'Places → where.'},

  {q:'Elephants, ___ have very good memories, live for a long time.',o:['which','that','who','where'],e:'Non-defining: no "that"; animals → which.'},

 order:['Crows are such clever birds that they use tools.','The dog was so tired that it slept all day.','A vet is a person who looks after animals.','This is the zoo where I saw a panda.','Dolphins, which live in groups, are very social.','An elephant uses its trunk to pick up food.'],
 read:{title:'Clever Animals',text:['Humans are not the only intelligent animals. Crows, which are very clever birds, can use sticks as tools to get food. Some crows even bend wires to make hooks!','Dolphins, which live in groups, use special whistles like names to call each other. Elephants, whose memories are excellent, can recognise themselves in a mirror. Only a few animals can do that.','So what makes us different? Humans have such powerful imaginations that we can create stories, art and music. We can also communicate complex ideas with language, and we can share them with people who live far away.'],
  qs:[{q:'What can crows use as tools?',o:['Sticks','Stones only','Their feathers','Leaves'],e:'Paragraph 1.'},
   {q:'How do dolphins call each other?',o:['With special whistles like names','With their tails','With colours','They can\'t'],e:'Paragraph 2.'},
   {q:'What can elephants do with a mirror?',o:['Recognise themselves','Break it','Talk to it','Nothing'],e:'Paragraph 2.'},
   {q:'According to the text, what makes humans different?',o:['Powerful imaginations and language','Bigger bodies','Better hearing','Longer lives'],e:'Paragraph 3.'},
   {tf:true,q:'Some crows can bend wires to make hooks.',a:true},{tf:true,q:'Dolphins live alone.',a:false},{tf:true,q:'Elephants have excellent memories.',a:true}]},
 listen:{title:'A day with a zookeeper',lines:[['Reporter','Hi Ms Kaya! You\'re the zookeeper who looks after the big cats, right?'],['Ms Kaya','That\'s right. I work with lions and tigers.'],['Reporter','Which animal is the cleverest?'],['Ms Kaya','The orangutan, which lives next to the lions, is so clever that it can open locks!'],['Reporter','Wow! Is it dangerous?'],['Ms Kaya','Not really. It\'s such a friendly animal. But the tiger, whose claws are very sharp, can be dangerous.'],['Reporter','What do you love about your job?'],['Ms Kaya','Every animal has its own personality. It\'s such an interesting job!']],
  qs:[{q:'Which animals does Ms Kaya work with?',o:['Lions and tigers','Dolphins','Birds','Snakes'],e:'"I work with lions and tigers."'},
   {q:'Which animal is the cleverest?',o:['The orangutan','The lion','The tiger','The parrot'],e:'"The orangutan … is so clever that it can open locks!"'},
   {q:'What can the orangutan do?',o:['Open locks','Fly','Talk','Swim fast'],e:'so … that …'},
   {q:'Why can the tiger be dangerous?',o:['Its claws are very sharp.','It is very hungry.','It is very old.','It can climb.'],e:'"whose claws are very sharp"'},
   {q:'What does she love about her job?',o:['Every animal has its own personality.','The money.','The holidays.','The uniform.'],e:'Last line.'}]},
 speak:[{p:'What makes humans different from animals? Give two ideas.',ph:['Humans can … but animals can\'t.','Humans have such … that …'],m:'Humans can write stories and make art, but animals can\'t. Humans have such good imaginations that we can invent new things.'},
  {p:'Describe an animal using body parts and a relative clause.',ph:['It\'s an animal which …','It has …','It\'s so … that …'],m:'It\'s an animal which lives in Africa. It has a very long neck and four legs with hooves. It\'s so tall that it can eat leaves from the top of trees. It\'s a giraffe!'},
  {p:'Talk about the cleverest animal you know.',ph:['… is such a clever animal that …','… which / who …'],m:'My cat is such a clever animal that she can open the kitchen door. She knows when I come home, and she always waits for me.'},
  {p:'Guessing game: describe an animal; the class guesses.',ph:['This is an animal which / whose …','It has …','It can …'],m:'This is an animal whose body is covered in scales. It has no legs, and it moves on the ground. Some of them are dangerous. It\'s a snake!'}],
 write:[{p:'Write a fact file about an animal. Use body parts, so/such and relative clauses.',tips:['Where does it live? What does it eat?','What body parts does it have?','Use: which / where / whose; so … that; such …'],m:'The polar bear is an animal which lives in the Arctic, where it is very cold. It has thick white fur and big paws that help it walk on ice. It is such a strong swimmer that it can swim for days. Polar bears, whose favourite food is seals, are in danger because the ice is melting.'},
  {p:'Write 5 sentences: What can humans do that animals can\'t?',tips:['Humans can … , but animals can\'t …','Use word families: create / creative / creativity, imagine / imagination'],m:'Humans can write books, but animals can\'t. We are creative, so we make music and art. Our imagination helps us invent new things. We can communicate with people who live far away. We can also learn other languages.'}]},
{id:7,title:'Where Can We Find Out What Is Happening?',emoji:'📰',color:'#4f5bd5',topics:'The news · social media · infinitives and gerunds · different meanings (stop, try, remember, forget)',

 grammar:[
  {h:'Verbs + -ing (gerund)',html:`<p>After these verbs we use <b>verb-ing</b>: <b>enjoy, like, love, hate, avoid, finish, mind, suggest, keep, practise</b></p><p><i>I <b>enjoy reading</b> the news. · She <b>avoids sharing</b> fake news. · Do you <b>mind waiting</b>?</i></p><p>Also after prepositions and as a subject: <i>I'm good <b>at writing</b>. · <b>Reading</b> the news is interesting.</i></p>`,ex:['I enjoy watching the news with my dad.','Sharing photos online can be dangerous.']},
  {h:'Verbs + to + infinitive',html:`<p>After these verbs we use <b>to + verb</b>: <b>want, decide, hope, plan, agree, promise, learn, need, would like</b></p><p><i>I <b>want to be</b> a journalist. · We <b>decided to start</b> a school newspaper. · He <b>promised to check</b> the facts.</i></p><p>Also after adjectives: <i>It's important <b>to check</b> the facts.</i></p>`,ex:['We decided to write an article about our town.','It\'s important to check where news comes from.']},
  {h:'Different meanings: stop and try',html:`<table><tr><th>stop doing</th><td>finish an activity: <i>I <b>stopped using</b> that app. (I don't use it now.)</i></td></tr><tr><th>stop to do</th><td>stop in order to do something: <i>I <b>stopped to read</b> the headline.</i></td></tr><tr><th>try doing</th><td>do it as an experiment: <i><b>Try turning</b> it off and on again.</i></td></tr><tr><th>try to do</th><td>make an effort (it's difficult): <i>I <b>tried to call</b> you, but you didn't answer.</i></td></tr></table>`,ex:['He stopped to take a photo of the accident.','Try reading the article again.']},
  {h:'Different meanings: remember and forget',html:`<table><tr><th>remember doing</th><td>a memory of the past: <i>I <b>remember reading</b> that story.</i></td></tr><tr><th>remember to do</th><td>don't forget a task: <i><b>Remember to post</b> the photo!</i></td></tr><tr><th>forget doing</th><td>lose a memory: <i>I'll never <b>forget meeting</b> the reporter.</i></td></tr><tr><th>forget to do</th><td>not do a task: <i>I <b>forgot to charge</b> my phone.</i></td></tr></table>`,ex:['Remember to check the facts before you share.','I\'ll never forget seeing myself on TV.']}],

 order:['I enjoy reading the news on Sundays.','We decided to interview our head teacher.','Remember to check the facts before you share.','He stopped to read the headline.','She is good at writing articles.','Try turning the tablet off and on again.'],
 read:{title:'How to Spot Fake News',text:['Every day millions of people share news on social media. But not everything we read online is true. Fake news is information that looks like real news but is false.','Before you share a story, stop to think. Try finding the same news on a well-known news website. Check the date, because some old stories are shared again and again. Remember to look at who wrote it: is it a real journalist?','Be careful with headlines that make you feel very angry or very surprised. People who make fake news want you to click and share quickly. If you\'re not sure, avoid sharing it. It\'s better to be careful than sorry!'],
  qs:[{q:'What is fake news?',o:['Information that looks like real news but is false','Old news','News about sport','A newspaper'],e:'Paragraph 1.'},
   {q:'What should you do before you share a story?',o:['Stop to think','Share it quickly','Add a hashtag','Like it'],e:'"stop to think"'},
   {q:'Why should you check the date?',o:['Some old stories are shared again and again.','Old news is always fake.','New stories are always true.','To know the weather.'],e:'Paragraph 2.'},
   {q:'What do people who make fake news want?',o:['They want you to click and share quickly.','They want you to read slowly.','They want to help you.','They want you to check the facts.'],e:'Paragraph 3.'},
   {tf:true,q:'Everything we read online is true.',a:false},{tf:true,q:'You should try finding the news on a well-known website.',a:true},{tf:true,q:'If you\'re not sure, it\'s better not to share the story.',a:true}]},
 listen:{title:'The school newspaper',lines:[['Emir','Hi Defne! Did you finish writing your article for the school newspaper?'],['Defne','Almost! I decided to write about the new library.'],['Emir','Great idea. I want to interview the head teacher.'],['Defne','Remember to ask her about the school trip!'],['Emir','Good idea. Oh no, I forgot to bring my notebook.'],['Defne','Try using your phone to record the interview.'],['Emir','Yes! And I\'ll stop to take some photos on the way.'],['Defne','Perfect. Let\'s post the newspaper on the school website on Friday!']],

 speak:[{p:'Where do you find out what is happening in the world?',ph:['I usually … on …','I enjoy … -ing','I avoid … -ing'],m:'I usually watch the news on TV with my family. I enjoy reading science news online, but I avoid reading news on social media because some of it is fake.'},
  {p:'What are the good and bad things about social media?',ph:['It\'s good for … -ing','The problem is …','You should remember to …'],m:'Social media is good for sharing photos and talking to friends. The problem is that there is a lot of fake news. You should remember to check the facts and to protect your profile.'},
  {p:'Be a reporter! Read a headline you invent and explain the story.',ph:['Breaking news: …','Today, …','People decided to …'],m:'Breaking news: Students plant 500 trees! Today, students from our school decided to plant trees in the park. They want to help the environment and hope to plant more next year.'},
  {p:'Tell us something you remember doing when you were younger, and something you must remember to do this week.',ph:['I remember … -ing when I was …','This week I must remember to …'],m:'I remember riding my first bike when I was five. This week I must remember to take my library book back and to buy a present for my sister.'}],
 write:[{p:'Write a short news article for a school newspaper.',tips:['Headline: short and interesting','Who? What? Where? When? Why?','Use: decided to, hope to, enjoy -ing'],m:'Class 5A Wins the Science Fair! On Friday, students from class 5A won the city science fair. They decided to build a robot that can sort rubbish. "We enjoyed working as a team," said Mert. The class hopes to show the robot at the national fair next year.'},
  {p:'Write five rules for using social media safely. Use gerunds and infinitives.',tips:['Remember to …','Avoid … -ing','Try to …','Stop … -ing if …'],m:'Remember to keep your profile private. Avoid sharing your address or phone number. Try to check the facts before you share news. Stop chatting if someone makes you feel uncomfortable. Don\'t forget to tell an adult if something is wrong.'}]},

 vocab:[['👋','wave','el sallamak'],['🙂','smile','gülümsemek'],['🤷','shrug','omuz silkmek'],['🙆','nod','başını sallamak'],['🤌','gesture','jest, el hareketi'],['😮','facial expression','yüz ifadesi'],['👀','eye contact','göz teması'],['🧍','body language','beden dili'],['🤫','whisper','fısıldamak'],['📢','shout','bağırmak'],

 grammar:[
  {h:'Reported speech: tense changes',html:`<p>When we report what someone said, the verb usually goes <b>one step back</b>:</p><table><tr><th>Direct</th><th>Reported</th></tr><tr><td>"I <b>am</b> tired."</td><td>She said (that) she <b>was</b> tired.</td></tr><tr><td>"I <b>like</b> pizza."</td><td>He said he <b>liked</b> pizza.</td></tr><tr><td>"I <b>am writing</b> a letter."</td><td>She said she <b>was writing</b> a letter.</td></tr><tr><td>"I <b>will</b> call you."</td><td>He said he <b>would</b> call me.</td></tr><tr><td>"I <b>can</b> swim."</td><td>She said she <b>could</b> swim.</td></tr><tr><td>"I <b>saw</b> a film."</td><td>He said he <b>had seen</b> a film.</td></tr></table>`,ex:['Ali said that he was hungry.','My mum said she would call me back.']},
  {h:'Reported speech: say, tell and other changes',html:`<p><b>say</b> (something) · <b>tell</b> + person: <i>She <b>said</b> that … / She <b>told me</b> that …</i></p><p>Pronouns and time words change too:</p><table><tr><td>I → he / she · my → his / her</td><td>today → that day · tomorrow → the next day</td></tr><tr><td>now → then · here → there</td><td>yesterday → the day before</td></tr></table><p><i>"I'm going to the park <b>today</b>." → He said he was going to the park <b>that day</b>.</i></p>`,ex:['She told me that she was busy.','He said that he would come the next day.']},
  {h:'Separable phrasal verbs',html:`<p>The object can go <b>in the middle</b> or <b>at the end</b>. With a <b>pronoun</b> (it, him, her, them) it <b>must</b> go in the middle.</p><p><i>I'll call <b>my friend</b> back. ✓ · I'll call back <b>my friend</b>. ✓<br>I'll call <b>him</b> back. ✓ · ✗ I'll call back him.</i></p><p>Separable: <b>call back, bring up, point out, sum up, cut off, put on, turn off, pick up</b></p>`,ex:['Can you sum it up for me?','She brought the problem up in class.']},
  {h:'Inseparable phrasal verbs',html:`<p>The object always goes <b>after</b> the whole phrasal verb.</p><p><i>I <b>look after</b> my little sister. ✓ (✗ look my sister after)<br>We <b>talked about it</b>. · Can you <b>get on with</b> your classmates?</i></p><p>Inseparable: <b>look after, look for, get on with, come across, run into, listen to</b></p>`,ex:['I\'m looking for my phone.','She gets on with everyone in her class.']}],

 order:['She said that she was very tired.','He told me that he would call me back.','Can you speak up, please?','I will look after my little brother.','The teacher pointed out my mistake.','He shrugged and said nothing.'],
 read:{title:'Talking Without Words',text:['We don\'t only communicate with words. Our faces, hands and bodies say a lot. Scientists say that a big part of a message comes from body language and tone of voice, not just the words.','But body language isn\'t the same everywhere. In many countries a nod means "yes", but in Bulgaria a nod can mean "no"! In some countries the "thumbs up" gesture is friendly, but in others it is rude. Eye contact is polite in some cultures but not in others.','So when you travel, watch how people communicate. If you don\'t understand something, don\'t be afraid to speak up and ask. A smile, of course, is understood almost everywhere!'],
  qs:[{q:'According to scientists, where does a big part of a message come from?',o:['Body language and tone of voice','Only words','Writing','Phones'],e:'Paragraph 1.'},
   {q:'What can a nod mean in Bulgaria?',o:['"No"','"Yes"','"Hello"','"Goodbye"'],e:'Paragraph 2.'},
   {q:'What does the text say about the "thumbs up" gesture?',o:['It is friendly in some countries and rude in others.','It is always rude.','It is always friendly.','Nobody uses it.'],e:'Paragraph 2.'},
   {q:'What is understood almost everywhere?',o:['A smile','A nod','Eye contact','A shrug'],e:'Last sentence.'},
   {tf:true,q:'Body language is the same in every country.',a:false},{tf:true,q:'Eye contact is polite in some cultures but not in others.',a:true},{tf:true,q:'The text says you should speak up and ask if you don\'t understand.',a:true}]},
 listen:{title:'A phone message',lines:[['Mum','Hi Deniz, did anyone call while I was out?'],['Deniz','Yes, Aunt Leyla called. She said she was coming on Saturday.'],['Mum','Great! Did she say anything else?'],['Deniz','She told me that she would bring a cake. And she said that Uncle Can had found a new job.'],['Mum','Wonderful news! Did you ask her to call me back?'],['Deniz','Yes, I did. But the line was bad and she was cut off.'],['Mum','Never mind, I\'ll call her back now.'],['Deniz','Oh, and she said to tell you she couldn\'t find her phone charger!']],
  qs:[{q:'Who called?',o:['Aunt Leyla','Uncle Can','Grandma','A friend'],e:'"Aunt Leyla called."'},
   {q:'When is Aunt Leyla coming?',o:['On Saturday','On Sunday','Today','Tomorrow'],e:'"She said she was coming on Saturday."'},
   {q:'What will she bring?',o:['A cake','Flowers','A present','Pizza'],e:'"she would bring a cake"'},
   {q:'What happened during the call?',o:['She was cut off.','She shouted.','She whispered.','She sang.'],e:'cut off = the line stopped.'},
   {q:'What did Uncle Can do?',o:['He found a new job.','He bought a car.','He moved house.','He lost his phone.'],e:'"Uncle Can had found a new job"'}]},
 speak:[{p:'Report what your partner said. Ask them three questions first.',ph:['He / She said that …','He / She told me that …'],m:'Elif said that she liked swimming. She told me that she was going to Antalya in the summer. She said that she could speak a little German.'},
  {p:'Show an emotion with only your face and body. The class guesses.',ph:['You look …','You\'re shrugging, so …','I think you feel …'],m:'You\'re smiling and waving, so I think you feel happy. You\'re shrugging, so maybe you don\'t know the answer.'},
  {p:'What is the best way to communicate with a friend who is far away?',ph:['I think … is the best because …','You can …','It\'s hard to … when …'],m:'I think video calls are the best because you can see your friend\'s face and body language. It\'s hard to understand someone\'s tone of voice in a text message.'},
  {p:'Talk about a time someone didn\'t understand you.',ph:['I tried to get my idea across, but …','In the end, I …'],m:'On holiday I tried to get my idea across to a waiter, but he didn\'t understand my English. In the end, I pointed at the picture on the menu and smiled.'}],
 write:[{p:'Write a conversation (4 lines) and then report it.',tips:['First write the direct speech with " "','Then report it: He said that … / She told him that …','Change the tenses and pronouns'],m:'Ali: "I am going to the cinema." Ece: "I will come with you." Ali said that he was going to the cinema. Ece told him that she would come with him.'},
  {p:'Write a guide: 5 tips for good communication.',tips:['Use phrasal verbs: speak up, point out, sum up, call back','Use body language words: eye contact, smile, nod'],m:'Make eye contact when someone is talking to you. Nod to show that you are listening. Don\'t cut people off when they are speaking. If you don\'t understand, speak up and ask. At the end, sum up what you talked about.'}]},

let voices=[];const loadV=()=>{voices=('speechSynthesis' in window)?speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)):[]};if('speechSynthesis' in window){loadV();speechSynthesis.onvoiceschanged=loadV}
function say(text,who=0,rate=.88){if(!('speechSynthesis' in window)){toast('This device cannot read aloud.');return null}
  const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=rate;const gb=voices.filter(v=>/GB/i.test(v.lang)),pool=gb.length>1?gb:voices;
  if(pool.length)u.voice=pool[who%pool.length];u.pitch=who%2?.85:1.1;speechSynthesis.speak(u);return u}
let AC;function beep(f=880,d=.25){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
let tLeft=0,tIv=null;const TIMES=[0,30,60,90];let tSel=0;
function timerBtn(){return `<button class="timer" id="tm" title="Timer">${tIv?'⏱ '+tLeft+'s':TIMES[tSel]?'⏱ '+TIMES[tSel]+'s':'⏱ Timer'}</button>`}
function bindTimer(){const b=$('#tm');if(!b)return;b.onclick=()=>{if(tIv){clearInterval(tIv);tIv=null;b.className='timer';b.textContent='⏱ Timer';return}
  tSel=(tSel+1)%TIMES.length;if(!TIMES[tSel]){b.textContent='⏱ Timer';return}b.textContent='⏱ '+TIMES[tSel]+'s · tap to start';b.onclick=()=>startTimer(TIMES[tSel])}}
function startTimer(sec){clearInterval(tIv);tLeft=sec;const tick=()=>{const b=$('#tm');if(!b){clearInterval(tIv);tIv=null;return}b.className='timer run';b.textContent='⏱ '+tLeft+'s';
  if(tLeft<=0){clearInterval(tIv);tIv=null;b.className='timer end';b.textContent='⏰ Time!';beep(660,.6);setTimeout(bindTimer,50);return}if(tLeft<=3)beep();tLeft--};tick();tIv=setInterval(tick,1000)}

    <button data-pt="${i}:-1" aria-label="${esc(t.n)} minus one">−</button><span class="pt">${t.s}</span><button data-pt="${i}:1" aria-label="${esc(t.n)} plus one">+</button></div>`).join('')}
    <button class="btn ghost" id="teamSet" style="padding:8px 14px">⚙️ Teams</button></div>`;
  el.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.pt.split(':').map(Number);teams[i].s=Math.max(0,teams[i].s+d);saveTeams();renderScore()});
  el.querySelectorAll('[data-turn]').forEach(b=>b.onclick=()=>{turn=+b.dataset.turn;saveTeams();renderScore();paintTurn()});
  $('#teamSet').onclick=teamSheet}
function paintTurn(){const t=$('#turnlbl');if(t)t.innerHTML=MODE==='teams'?`Turn: <span style="color:${teams[turn].c}">${teams[turn].e} ${esc(teams[turn].n)}</span>`:''}

    ${teams.map((t,i)=>`<label class="row"><span style="font-size:1.6em">${t.e}</span><input value="${esc(t.n)}" data-name="${i}" aria-label="Team ${i+1} name"></label>`).join('')}

    box.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;teams=TEAMDEF.slice(0,n).map((d,i)=>teams[i]||{...d,s:0});turn=0;saveTeams();draw()});

    $('#ok').onclick=()=>{$('#sheet').hidden=true;renderScore();paintTurn()}};draw()}
