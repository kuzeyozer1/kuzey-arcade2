<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Book Club">
<title>Kuzey Book Club</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a green club-room header with the search bar, then either the club shelf or search results, and a book page that slides over both. */
:root{
  --paper:#eef4ef; --card:#ffffff; --sunk:#e1ebe3; --line:#cbdacf; --ink:#13241c; --mute:#56695e;
  --club:#1f4d3a; --club-ink:#f3f8f4; --brass:#b9871d; --brass-soft:#f3e5c2; --rose:#c8503c;
  --display:'DM Serif Display', Georgia, serif; --body:'Atkinson Hyperlegible', system-ui, sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101a15; --card:#17241d; --sunk:#1e2e25; --line:#2b3f34; --ink:#e8f0ea; --mute:#9db1a4;
  --club:#163a2b; --club-ink:#e8f0ea; --brass:#e0b44f; --brass-soft:#3a3018; --rose:#f07d68; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101a15; --card:#17241d; --sunk:#1e2e25; --line:#2b3f34; --ink:#e8f0ea; --mute:#9db1a4;
  --club:#163a2b; --club-ink:#e8f0ea; --brass:#e0b44f; --brass-soft:#3a3018; --rose:#f07d68; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--club);color:var(--club-ink);padding-block:22px 26px}
header .wrap{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:40px;height:40px;border-radius:10px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1;margin:0}
.brand p{margin:2px 0 0;opacity:.8;font-size:14px}
form.search{display:flex;gap:8px}
form.search input{flex:1;min-width:0;border:0;border-radius:12px;padding:14px 16px;font-size:17px;background:var(--card);color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--brass);color:#1d1404}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:9px}
main{padding-block:22px 48px;display:flex;flex-direction:column;gap:26px}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.15;text-wrap:balance}
.sect{display:flex;flex-direction:column;gap:12px}
.sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mute{color:var(--mute)}
.pick{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;background:var(--brass-soft);border-radius:16px;padding:16px;cursor:pointer;border:0;text-align:left;width:100%}
.pick .cover{width:96px}
.pick .label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.pick h3{font-family:var(--display);font-weight:400;font-size:24px;margin:2px 0;line-height:1.15}
.when{display:inline-block;margin-top:8px;font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.tab[aria-pressed="true"]{background:var(--club);color:var(--club-ink);border-color:var(--club)}
.tab b{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.book{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.book b{font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book small{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover{aspect-ratio:2/3;width:100%;border-radius:6px;overflow:hidden;background:var(--sunk);box-shadow:0 2px 0 rgba(0,0,0,.08),0 6px 16px rgba(19,36,28,.14);position:relative;display:grid;place-items:center}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{padding:10px;text-align:center;font-family:var(--display);font-size:15px;line-height:1.2;color:var(--club-ink)}
.badge{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--mute)}
.badge.free{background:var(--club);color:var(--club-ink)}
.readbox{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.readrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn.read{background:var(--club);color:var(--club-ink)}
a.btn{text-decoration:none;display:inline-block}
.small{font-size:14px;margin:0}
.stars-mini{color:var(--brass);font-size:13px;letter-spacing:1px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--brass)}
.status{color:var(--mute)}
/* book page */
.sheet{position:fixed;inset:0;z-index:30;background:var(--paper);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .top{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line)}
.sheet .top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.back{background:none;border:0;font-weight:700;cursor:pointer;padding:8px 4px;color:var(--club)}
:root[data-theme="dark"] .back{color:var(--brass)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .back{color:var(--brass)}}
.detail{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding-block:24px 48px}
@media (max-width:640px){.detail{grid-template-columns:1fr}.detail .side{max-width:180px}}
.detail h2{font-size:clamp(28px,5vw,40px)}
.byline{font-size:18px;margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:14px;margin-top:8px}
.summary{margin-top:18px;max-width:65ch}
.summary p{margin:0 0 12px}
.source{font-size:13px;color:var(--mute)}
.source a{color:inherit}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:20px;max-width:65ch}
.panel h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.shelfbtns{display:flex;gap:6px;flex-wrap:wrap}
.shelfbtns button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.shelfbtns button[aria-pressed="true"]{background:var(--club);color:var(--club-ink);border-color:var(--club)}
.rate{display:flex;gap:2px}
.rate button{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.rate button.on{color:var(--brass)}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);resize:vertical}
input[type=date]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
ol.qs{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.saved{font-size:13px;color:var(--mute);min-height:1.2em}
.subjects{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.subjects span{font-size:12px;background:var(--sunk);padding:3px 9px;border-radius:999px;color:var(--mute)}
.skel{background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px;height:14px;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
footer{padding-block:20px 32px;color:var(--mute);font-size:13px}
.clubbar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:var(--club-ink);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left;width:100%}
.clubbar:hover{background:rgba(255,255,255,.16)}
.clubbar b{font-weight:700}
.clubbar span{opacity:.8;font-size:14px}
.clubbar .go{margin-left:auto;font-weight:700;color:var(--brass);white-space:nowrap}
.clubbar .dotc{width:10px;height:10px;border-radius:50%;background:var(--brass);flex:none}
.clubbody{padding-block:24px 48px;display:flex;flex-direction:column;gap:16px;max-width:720px}
.clubbody .panel{margin-top:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute);font-weight:700}
.field input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);color:var(--ink);font-weight:400;font-size:16px}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:clamp(15px,3.6vw,20px);letter-spacing:.06em;background:var(--sunk);border-radius:10px;padding:12px 14px;word-break:break-all;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.members{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.members li{display:flex;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--brass-soft);color:var(--brass);padding:2px 8px;border-radius:999px}
.err{color:var(--rose);font-size:14px;margin:0}
.ok{color:var(--club);font-size:14px;margin:0}
.lock{font-size:14px;color:var(--mute);margin:0}
.voices{display:flex;flex-direction:column;gap:12px}
.voice{border-top:1px solid var(--line);padding-top:10px}
.voice:first-child{border-top:0;padding-top:0}
.voice b{display:block}
.voice p{margin:4px 0 0;white-space:pre-wrap}
.avg{font-size:15px}
.switch{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.clubpick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0}
.clubpick b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clubpick span{font-size:13px;color:var(--mute)}
.clubpick[aria-pressed="true"]{border-color:var(--club);box-shadow:0 0 0 2px var(--club) inset}
details summary{cursor:pointer;color:var(--mute);font-size:14px}
button[disabled],input[disabled]{opacity:.55;cursor:not-allowed}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:46;background:var(--club);color:var(--club-ink);font-weight:700;padding:10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);font-weight:700;font-size:15px}
.upd button{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer}
.upd .now{background:var(--brass);color:var(--ink)}
.upd .later{background:transparent;color:inherit;opacity:.75}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><img src="icons/icon-192.png" alt=""><div><h1>Kuzey Book Club</h1><p>Search any book. Read the summary. Pick the next one together.</p></div></div>
    <form class="search" id="searchForm" role="search">
      <input id="q" type="search" placeholder="Search a title or author" autocomplete="off" aria-label="Search books">
      <button class="btn" type="submit">Search</button>
    </form>
    <button class="clubbar" id="clubBtn"><i class="dotc"></i><b>Start or join a book club</b><span id="clubSub">Share one shelf with your friends</span><span class="go">Open</span></button>
  </div>
</header>

<main class="wrap">
  <div id="home">
    <div class="sect" id="pickSect"></div>
    <div class="sect" style="margin-top:26px">
      <div class="sect-head"><h2>Our shelf</h2><div class="tabs" id="tabs"></div></div>
      <div id="shelf"></div>
    </div>
    <div class="sect" style="margin-top:26px">
      <h2>Need an idea?</h2>
      <div class="chips" id="ideas"></div>
    </div>
  </div>
  <div id="results" class="sect" hidden>
    <div class="sect-head"><h2 id="resTitle">Results</h2><button class="btn quiet small" id="clearRes">Back to the shelf</button></div>
    <p class="status" id="resStatus"></p>
    <div class="grid" id="resGrid"></div>
  </div>
</main>
<footer class="wrap">Book data and covers from Open Library. Summaries from Wikipedia (CC BY-SA). <span id="where">Your shelf, notes and ratings stay on this device.</span> <span id="ver">Version 10</span></footer>

<div class="sheet" id="clubSheet" hidden role="dialog" aria-modal="true" aria-label="Book club">
  <div class="top"><div class="wrap"><button class="back" id="clubBack">‹ Back</button></div></div>
  <div class="wrap clubbody" id="clubBody"></div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="bTitle">
  <div class="top"><div class="wrap"><button class="back" id="back">‹ Back</button></div></div>
  <div class="wrap detail" id="detail"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SHELVES=[['reading','Reading now'],['next','Up next'],['done','Finished']];
const SHELF_KEYS=SHELVES.map(s=>s[0]);
const IDEAS=['Wonder','Holes','Percy Jackson','Harry Potter','The Hobbit','Diary of a Wimpy Kid','Charlotte\'s Web','The Hunger Games','Matilda','Animal Farm'];

/* ---------- storage on this device ---------- */
let solo={books:{},pick:null,tab:'reading'};
try{const s=JSON.parse(localStorage.getItem('bookClub')||'null');if(s&&s.books)solo=Object.assign(solo,s)}catch(e){}
let db=solo;
const save=()=>{try{localStorage.setItem('bookClub',JSON.stringify(solo))}catch(e){}};
let summaries={};try{summaries=JSON.parse(localStorage.getItem('bookClubSummaries')||'{}')||{}}catch(e){}
const saveSummaries=()=>{try{localStorage.setItem('bookClubSummaries',JSON.stringify(summaries))}catch(e){}};

/* ---------- the shared club ---------- */
// Clubs live in Supabase (the same project as FLL Pit Crew). The database rules decide
// who may change what: only the host changes the shelf, pick and date; everyone their own ratings and notes.
const SB_URL='https://ahdidgzraaisooduipkt.supabase.co',SB_KEY='sb_publishable_PMvvVoPQYgi9Awd4kmtz-Q_is5vBUfn';
// a separate sign-in from FLL Pit Crew, so signing out there never drops you from a club
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bookclub-auth',detectSessionInUrl:false}}):null;
// every club this device is in, and which one is showing (none = your own shelf)
let clubs=[];try{clubs=JSON.parse(localStorage.getItem('bookClubClubs')||'[]');if(!Array.isArray(clubs))clubs=[]}catch(e){clubs=[]}
const oldClubs=clubs.some(c=>c&&!c.code)||!!localStorage.getItem('bookClubMember');
clubs=clubs.filter(c=>c&&typeof c.id==='string'&&typeof c.code==='string'&&typeof c.mid==='string');
let active=null;try{active=localStorage.getItem('bookClubActive')}catch(e){}
const loadCache=id=>{try{return JSON.parse(localStorage.getItem('bookClubCache:'+id)||'null')}catch(e){return null}};
let member=clubs.find(c=>c.id===active)||null;
let club=member?loadCache(member.id):null;
let showForms=false;
let isHost=false,lastSync=0,syncMsg='';
const saveMember=()=>{
  if(member){const i=clubs.findIndex(c=>c.id===member.id);if(i>=0)clubs[i]=member;else clubs.push(member)}
  try{localStorage.setItem('bookClubClubs',JSON.stringify(clubs));localStorage.setItem('bookClubActive',member?member.id:'');localStorage.removeItem('bookClubMember');localStorage.removeItem('bookClubCache')}catch(e){}
};
const saveCache=()=>{if(!(member&&club))return;member.name=String(club.clubName||'').slice(0,40);
  try{localStorage.setItem('bookClubCache:'+member.id,JSON.stringify(club))}catch(e){}saveMember()};
saveMember();
const hex=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const fmtCode=c=>{c=String(c||'').toUpperCase();return c.length===8?c.slice(0,4)+'-'+c.slice(4):c};
const parseCode=s=>{const m=String(s||'').replace(/^.*#join=/,'').replace(/[^0-9a-z]/gi,'').toUpperCase();return /^[0-9A-F]{8}$/.test(m)?m:null};
const inviteLink=()=>location.origin+location.pathname+'#join='+member.code;
class ClubError extends Error{}
const ERR={offline:'You seem to be offline. Showing the club as it was last time.',missing:'No club was found with that code. Check the code and try again.',
  server:'The club storage didn\'t answer. Try again in a minute.',hostkey:'That host key doesn\'t match this club.',host:'Only the host can change that.',
  nolib:'Clubs couldn\'t load. Check your internet connection and reload the page.',anon:'Joining clubs is turned off in the club storage. Ask whoever set up Supabase to turn on "Allow anonymous sign-ins".',
  gone:'This club was deleted, or you were removed from it.'};
function errText(e){const m=String(e&&e.message||e||'');
  if(ERR[m])return ERR[m];if(/no club with that code/i.test(m))return ERR.missing;if(/wrong host key/i.test(m))return ERR.hostkey;if(/anonymous/i.test(m))return ERR.anon;
  if(/row-level security|permission denied/i.test(m))return ERR.host;if(/fetch|network|load failed/i.test(m)||!navigator.onLine)return ERR.offline;return ERR.server}
const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.keys(x).sort().map(k=>[k,x[k]])):x);
async function ensureUser(){if(!sb)throw new ClubError('nolib');const {data:{session}}=await sb.auth.getSession();if(session)return session.user;
  const {data,error}=await sb.auth.signInAnonymously();if(error)throw error;return data.user}
const must=r=>{if(r.error)throw r.error;return r.data};
// everything about one club, in the shape the rest of the page uses
async function readClub(id){
  if(!sb)throw new ClubError('nolib');
  const [c,m,b,v]=await Promise.all([sb.from('bc_clubs').select('id,code,name,pick,meet').eq('id',id).maybeSingle(),sb.from('bc_members').select('user_id,nick,role').eq('club_id',id),
    sb.from('bc_books').select('book_id,book,shelf,updated_at').eq('club_id',id),sb.from('bc_votes').select('user_id,book_id,rating,notes').eq('club_id',id)]);
  const row=must(c);if(!row)throw new ClubError('gone');
  const members={};for(const x of must(m))members[x.user_id]={nick:x.nick,role:x.role,ratings:{},notes:{}};
  for(const x of must(v)){const p=members[x.user_id];if(!p)continue;if(x.rating)p.ratings[x.book_id]=x.rating;if(x.notes)p.notes[x.book_id]=x.notes}
  const books={};for(const x of must(b))books[x.book_id]={book:x.book,shelf:x.shelf,t:Date.parse(x.updated_at)||0};
  return{v:1,clubName:row.name,code:row.code,pick:row.pick||null,meet:row.meet||'',books,members,hostMid:Object.keys(members).find(k=>members[k].role==='host')||null};
}
// read the newest copy, change it, and write only what changed
async function push(mutate){
  const fresh=await readClub(member.id),d=JSON.parse(JSON.stringify(fresh));
  mutate(d);
  const id=member.id,nowIso=new Date().toISOString();
  if(d.pick!==fresh.pick||d.meet!==fresh.meet)must(await sb.from('bc_clubs').update({pick:d.pick,meet:d.meet||''}).eq('id',id));
  const up=[],gone=[];
  for(const bid of new Set([...Object.keys(fresh.books),...Object.keys(d.books)])){
    const a=fresh.books[bid],x=d.books[bid];
    if(!x){gone.push(bid);continue}
    if(!a||canon({b:a.book,s:a.shelf})!==canon({b:x.book,s:x.shelf}))up.push({club_id:id,book_id:bid,book:x.book,shelf:x.shelf||null,updated_at:nowIso});
  }
  if(up.length)must(await sb.from('bc_books').upsert(up,{onConflict:'club_id,book_id'}));
  if(gone.length)must(await sb.from('bc_books').delete().eq('club_id',id).in('book_id',gone));
  const me0=obj(fresh.members[member.mid]),me1=obj(d.members[member.mid]);
  for(const bid of new Set([...Object.keys(obj(me0.ratings)),...Object.keys(obj(me0.notes)),...Object.keys(obj(me1.ratings)),...Object.keys(obj(me1.notes))])){
    const r0=+obj(me0.ratings)[bid]||0,n0=String(obj(me0.notes)[bid]||''),r1=+obj(me1.ratings)[bid]||0,n1=String(obj(me1.notes)[bid]||'');
    if(r0===r1&&n0===n1)continue;
    if(!r1&&!n1.trim())must(await sb.from('bc_votes').delete().eq('club_id',id).eq('user_id',member.mid).eq('book_id',bid));
    else must(await sb.from('bc_votes').upsert({club_id:id,user_id:member.mid,book_id:bid,rating:r1||null,notes:n1||null,updated_at:nowIso},{onConflict:'club_id,user_id,book_id'}));
  }
  club=await readClub(id);saveCache();lastSync=Date.now();syncMsg='';await applyClub();
}
async function pull(){
  if(!member)return;
  syncMsg='Checking for updates…';renderClubBar();
  try{club=await readClub(member.id);saveCache();lastSync=Date.now();syncMsg=''}
  catch(e){syncMsg=errText(e)}
  await applyClub();
}
function cleanBook(id,b){b=obj(b);return{id,title:String(b.title||'Untitled').slice(0,200),author:String(b.author||'Unknown author').slice(0,120),
  year:Number.isFinite(+b.year)&&b.year?+b.year:null,cover:Number.isFinite(+b.cover)&&b.cover?+b.cover:null,pages:Number.isFinite(+b.pages)&&b.pages?+b.pages:null,
  subjects:Array.isArray(b.subjects)?b.subjects.slice(0,6).map(s=>String(s).slice(0,40)):[],access:b.access===undefined?undefined:String(b.access),
  ia:b.ia?String(b.ia):null,lend:b.lend?String(b.lend):null,gid:b.gid?String(b.gid):null}}
async function applyClub(){
  if(member&&club){
    isHost=obj(club.members[member.mid]).role==='host';member.role=isHost?'host':'member';
    const books={};
    for(const [id,x] of Object.entries(obj(club.books))){if(!/^OL\d+W$/.test(id)||!x||!x.book)continue;
      books[id]={book:cleanBook(id,x.book),shelf:SHELF_KEYS.includes(x.shelf)?x.shelf:null,t:+x.t||0,summary:summaries[id],meet:id===club.pick?String(club.meet||''):''}}
    db={books,pick:club.pick&&books[club.pick]?club.pick:null,tab:solo.tab};
  }else{db=solo;isHost=false}
  renderClubBar();renderHome();
  if(!$('clubSheet').hidden)renderClubSheet();
  if(openId)paintBook(openId);
}
function people(){return Object.entries(club?obj(club.members):{}).map(([mid,m])=>({mid,nick:String(obj(m).nick||'Someone').slice(0,20),ratings:obj(obj(m).ratings),notes:obj(obj(m).notes),host:obj(m).role==='host'}))}
function entry(id){
  const e=Object.assign({},db.books[id]||{});
  if(member&&club){const me=obj(club.members[member.mid]);e.rating=+obj(me.ratings)[id]||0;e.notes=String(obj(me.notes)[id]||'')}
  return e;
}
async function startClub(name,nick){
  const u=await ensureUser(),hostKey=hex(12);
  const r=must(await sb.rpc('bc_create',{club_name:name,nickname:nick,key_hash:await sha(hostKey)}));
  const prev=member;member={id:r.id,code:r.code,mid:u.id,nick,hostKey,role:'host'};saveMember();
  // books on your own shelf are copied into the new club
  try{await push(d=>{
    for(const [id,x] of Object.entries(solo.books)){if(x.shelf)d.books[id]={book:cleanBook(id,x.book),shelf:x.shelf};
      const me=d.members[member.mid];if(me){if(x.rating)me.ratings[id]=x.rating;if(x.notes)me.notes[id]=String(x.notes).slice(0,1000)}}
    if(solo.pick&&d.books[solo.pick]){d.pick=solo.pick;d.meet=(solo.books[solo.pick]||{}).meet||''}
  })}catch(e){club=await readClub(member.id).catch(()=>null);saveCache();await applyClub()}
  void prev;
}
async function joinClub(code,nick,hostKey){
  const known=clubs.find(c=>c.code===code);
  if(known&&(!hostKey||known.hostKey===hostKey)){await switchClub(known.id);return}
  const u=await ensureUser();
  const r=must(await sb.rpc('bc_join',{join_code:code,nickname:nick,key_hash:hostKey?await sha(hostKey):null}));
  member={id:r.id,code:r.code,mid:u.id,nick,hostKey:hostKey||(known&&known.hostKey)||null,role:hostKey?'host':'member'};
  club=await readClub(member.id);saveCache();lastSync=Date.now();syncMsg='';await applyClub();
}
async function switchClub(id){
  flushNotes&&flushNotes();
  member=clubs.find(c=>c.id===id)||null;club=member?loadCache(member.id):null;lastSync=0;syncMsg='';showForms=false;
  saveMember();await applyClub();if(member)pull();
}
function leaveClub(){
  const id=member.id;clubs=clubs.filter(c=>c.id!==id);try{localStorage.removeItem('bookClubCache:'+id)}catch(e){}
  member=null;club=null;saveMember();switchClub(clubs[0]?clubs[0].id:null);
}
async function change(kind,value,info){
  if(['shelf','pick','meet'].includes(kind)&&!isHost)throw new ClubError('host');
  await push(d=>{
    const id=info.id;
    const ensure=()=>{d.books[id]=obj(d.books[id]);d.books[id].book=cleanBook(id,info);d.books[id].shelf=d.books[id].shelf||null};
    if(kind==='shelf'){if(value){ensure();d.books[id].shelf=value}else if(d.pick===id){ensure();d.books[id].shelf=null}else delete d.books[id]}
    if(kind==='pick'){if(value){ensure();if(!d.books[id].shelf)d.books[id].shelf='reading';if(d.pick!==id)d.meet='';d.pick=id}else if(d.pick===id){d.pick=null;d.meet='';if(!obj(d.books[id]).shelf)delete d.books[id]}}
    if(kind==='meet'&&d.pick===id)d.meet=/^\d{4}-\d{2}-\d{2}$/.test(value)?value:'';
    if(kind==='rating'||kind==='notes'){const m=d.members[member.mid]=obj(d.members[member.mid]);m.ratings=obj(m.ratings);m.notes=obj(m.notes);
      if(kind==='rating'){if(value)m.ratings[id]=value;else delete m.ratings[id]}
      else{const v=String(value).slice(0,1000);if(v.trim())m.notes[id]=v;else delete m.notes[id]}}
  });
}

const PH=['#1f4d3a','#7a3b2e','#2e4a7a','#5b3f7a','#7a6a2e','#2e6a6a'];
function coverHTML(b,size='M'){
  const bg=PH[(b.title||'').length%PH.length];
  const img=b.cover?`<img src="https://covers.openlibrary.org/b/id/${encodeURIComponent(b.cover)}-${size}.jpg" alt="" loading="lazy" onerror="this.remove()">`:'';
  return `<div class="cover" style="background:${bg}"><div class="ph" style="position:absolute;inset:0;display:grid;place-items:center">${esc(b.title)}</div>${img?`<div style="position:absolute;inset:0">${img}</div>`:''}</div>`;
}

/* ---------- search ---------- */
let searchCtl=null;
async function search(q){
  q=q.trim();if(!q)return;
  $('home').hidden=true;$('results').hidden=false;$('resTitle').textContent='Results for "'+q+'"';
  $('resStatus').textContent='Searching…';$('resGrid').innerHTML='';
  searchCtl?.abort();searchCtl=new AbortController();
  try{
    const r=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=24&fields=key,title,author_name,first_publish_year,cover_i,number_of_pages_median,subject,ebook_access,ia,lending_edition_s,id_project_gutenberg',{signal:searchCtl.signal});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    const list=(j.docs||[]).filter(d=>d.key&&d.title).map(d=>({id:d.key.replace('/works/',''),title:d.title,author:(d.author_name||[])[0]||'Unknown author',year:d.first_publish_year||null,cover:d.cover_i||null,pages:d.number_of_pages_median||null,subjects:(d.subject||[]).slice(0,8),access:d.ebook_access||'no_ebook',ia:(d.ia||[])[0]||null,lend:d.lending_edition_s||null,gid:(d.id_project_gutenberg||[]).map(Number).filter(n=>n>0).sort((x,y)=>x-y).map(String)[0]||null}));
    $('resStatus').textContent=list.length?list.length+' books found. Tap one for its summary.':'No books found. Check the spelling, or try the author\'s name.';
    $('resGrid').innerHTML='';list.forEach(b=>$('resGrid').appendChild(bookTile(b)));
  }catch(e){if(e.name==='AbortError')return;$('resStatus').textContent='The book search did not answer. Check your internet connection and try again.'}
}
function bookTile(b){
  const el=document.createElement('button');el.className='book';
  const mine=entry(b.id);
  el.innerHTML=coverHTML(b)+`<b>${esc(b.title)}</b><small>${esc(b.author)}${b.year?' · '+esc(b.year):''}</small>${b.gid||b.access==='public'?'<span class="badge free">Free to read</span>':b.access==='borrowable'?'<span class="badge">Borrow free</span>':''}${mine.rating?`<span class="stars-mini">${'★'.repeat(mine.rating)}</span>`:''}`;
  el.onclick=()=>openBook(b);return el;
}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();$('q').blur();search($('q').value)});
$('clearRes').onclick=()=>{$('results').hidden=true;$('home').hidden=false;$('q').value='';renderHome()};

/* ---------- summaries ---------- */
const BOOKISH=/novel|book|series|novella|memoir|story|fiction|poem|play|comic|manga|picture book|autobiograph/i;
async function wikiSummary(title){
  const tryTitle=async t=>{
    const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t.replace(/ /g,'_')));
    if(!r.ok)return null;const j=await r.json();
    if(j.type!=='standard'||!j.extract)return null;
    if(!BOOKISH.test((j.description||'')+' '+j.extract.slice(0,200)))return null;
    return {text:j.extract,url:j.content_urls?.desktop?.page,title:j.title};
  };
  const clean=title.replace(/\s*[:(].*$/,'').trim();
  for(const t of [clean+' (novel)',clean,clean+' (book)',title]){try{const s=await tryTitle(t);if(s)return s}catch(e){}}
  try{ // fall back to a search
    const r=await fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=3&srsearch='+encodeURIComponent(clean+' book'));
    const j=await r.json();for(const h of j.query?.search||[]){const s=await tryTitle(h.title);if(s)return s}
  }catch(e){}
  return null;
}
async function olDescription(id){
  try{const r=await fetch('https://openlibrary.org/works/'+id+'.json');if(!r.ok)return null;const j=await r.json();
    let d=j.description;if(d&&typeof d==='object')d=d.value;if(!d)return null;
    d=String(d).split(/\n-{3,}|\n\*\*|\(\[source\]/)[0].replace(/\r/g,'').trim();
    return d?{text:d.slice(0,1500),url:'https://openlibrary.org/works/'+id,source:'Open Library'}:null}catch(e){return null}
}

  // club changes go online; solo changes stay on this device

  };

    if(member&&club){send('pick',on,'clubMsg');return}

function paintShelf(v){$('shelfBtns').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===v))}
function paintRating(v){$('rate').querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.n<=v))}
function paintBook(id){
  if(openId!==id||!$('shelfBtns'))return;
  const e=entry(id),inClub=!!(member&&club),locked=inClub&&!isHost;
  paintShelf(e.shelf);paintRating(e.rating||0);
  $('isPick').checked=db.pick===id;$('meet').value=db.pick===id?(e.meet||''):'';$('meet').disabled=locked||db.pick!==id;
  $('shelfBtns').querySelectorAll('button').forEach(x=>x.disabled=locked);$('isPick').disabled=locked;

    ${others.length?`<div class="voices">${others.map(p=>`<div class="voice"><b>${esc(p.nick)}${p.host?' <span class="tag">Host</span>':''}${p.ratings[id]?` <span class="stars-mini">${'★'.repeat(Math.min(5,+p.ratings[id]||0))}</span>`:''}</b>${p.notes[id]?`<p>${esc(String(p.notes[id]).slice(0,1000))}</p>`:''}</div>`).join('')}</div>`
      :'<p class="lock">Nobody else has rated this book or written notes yet.</p>'}`;
}
async function loadSummary(book){
  const id=book.id,cached=summaries[id]||(solo.books[id]||{}).summary;
  const put=s=>{if(openId!==id)return;
    $('sum').innerHTML=s?s.text.split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')+`<p class="source">Summary from ${s.source==='Open Library'?'Open Library':'Wikipedia'}${s.url?` · <a href="${esc(s.url)}" target="_blank" rel="noopener">Read more</a>`:''}</p>`
      :`<p class="mute">There's no summary for this book yet. Try a different edition in the search results, or add your own in the notes below.</p>`};
  if(cached)put(cached);
  let s=await wikiSummary(book.title);if(s)s.source='Wikipedia';else s=await olDescription(id);
  if(s){summaries[id]=s;saveSummaries();put(s)}else if(!cached)put(null);
}
async function renderRead(book){
  const box=$('readBox'),id=book.id;
  if(book.access===undefined){ // saved before the app knew about free copies: look it up
    box.innerHTML='<p class="mute small">Looking for a free copy…</p>';
    try{const r=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent('key:/works/'+id)+'&limit=1&fields=ebook_access,ia,lending_edition_s,id_project_gutenberg');
      const d=((await r.json()).docs||[])[0]||{};
      book.access=d.ebook_access||'no_ebook';book.ia=(d.ia||[])[0]||null;book.lend=d.lending_edition_s||null;
      book.gid=(d.id_project_gutenberg||[]).map(Number).filter(n=>n>0).sort((x,y)=>x-y).map(String)[0]||null;
      if(solo.books[id])Object.assign(solo.books[id].book,{access:book.access,ia:book.ia,lend:book.lend,gid:book.gid}),save();
      if(openInfo&&openInfo.id===id)Object.assign(openInfo,{access:book.access,ia:book.ia,lend:book.lend,gid:book.gid});
    }catch(e){book.access='no_ebook'}
    if(openId!==id)return;
  }
  const draw=gid=>{
    if(openId!==id)return;
    const btns=[];
    if(gid)btns.push(`<a class="btn read" href="https://www.gutenberg.org/ebooks/${encodeURIComponent(gid)}.html.images" target="_blank" rel="noopener">Read free</a><span class="mute small">The whole book, free from Project Gutenberg</span>`);
    else if(book.access==='public'&&book.ia)btns.push(`<a class="btn read" href="https://archive.org/details/${encodeURIComponent(book.ia)}?view=theater" target="_blank" rel="noopener">Read free</a><span class="mute small">The whole book, free from the Internet Archive</span>`);
    if(book.access==='borrowable'&&book.lend)btns.push(`<a class="btn quiet" href="https://openlibrary.org/books/${encodeURIComponent(book.lend)}" target="_blank" rel="noopener">Borrow free</a><span class="mute small">Borrow it like a library book. You need a free Open Library account.</span>`);
    box.innerHTML=btns.length?btns.map(b=>`<div class="readrow">${b}</div>`).join(''):`<p class="mute small">No free copy of this book online. Ask at your school or local library.</p>`;
  };
  if(book.gid||book.access!=='no_ebook'||!(book.year&&book.year<1930)){draw(book.gid);return}
  // older books Open Library doesn't link: ask Project Gutenberg directly
  box.innerHTML='<p class="mute small">Looking for a free copy…</p>';
  const q=book.title.replace(/\s*[:(].*$/,'')+' '+(book.author||'').split(' ').pop();
  fetch('https://gutendex.com/books/?search='+encodeURIComponent(q)).then(r=>r.ok?r.json():null).then(j=>{
    const hit=(j&&j.results||[]).find(r=>!r.copyright&&r.title.toLowerCase().startsWith(book.title.toLowerCase().slice(0,12)));
    if(hit){book.gid=String(hit.id);if(solo.books[id]){solo.books[id].book.gid=book.gid;save()}}
    draw(book.gid);
  }).catch(()=>draw(null));
}
function closeBook(){flushNotes&&flushNotes();flushNotes=null;$('sheet').hidden=true;openId=null;openInfo=null;document.body.style.overflow='';renderHome();if(!$('results').hidden)search($('q').value)}
$('back').onclick=closeBook;
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('sheet').hidden)closeBook();else if(!$('clubSheet').hidden)closeClub()});

/* ---------- club page ---------- */
function ago(t){if(!t)return'';const s=(Date.now()-t)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return new Date(t).toLocaleDateString()}
function renderClubBar(){
  const btn=$('clubBtn');
  $('where').textContent=member&&club?'Your club is shared with everyone who joined it.':'Your shelf, notes and ratings stay on this device.';
  if(member&&club){btn.querySelector('b').textContent=String(club.clubName||'Our book club').slice(0,40);
    $('clubSub').textContent=(isHost?'You\'re the host':'You\'re a member')+' as '+member.nick+(syncMsg?' · '+syncMsg:lastSync?' · updated '+ago(lastSync):'');
    btn.querySelector('.go').textContent=clubs.length>1?'Switch':'Club';}
  else if(clubs.length){btn.querySelector('b').textContent='My own shelf';$('clubSub').textContent='You\'re in '+clubs.length+' club'+(clubs.length>1?'s':'')+'. Tap to switch.';btn.querySelector('.go').textContent='Switch'}
  else{btn.querySelector('b').textContent='Start or join a book club';$('clubSub').textContent='Share one shelf with your friends';btn.querySelector('.go').textContent='Open'}
}
function copy(text,btn){
  const done=()=>{const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1300)};
  try{navigator.clipboard.writeText(text).then(done,()=>prompt('Copy this:',text))}catch(e){prompt('Copy this:',text)}
}
let prefill='';
function switcherHTML(){
  if(!clubs.length)return'';
  return `<div class="panel"><h3>Your clubs</h3><div class="switch">${clubs.map(c=>`<button class="clubpick" data-id="${esc(c.id)}" aria-pressed="${!!(member&&member.id===c.id)}"><b>${esc(c.name||'Club '+fmtCode(c.code))}</b><span>${c.role==='host'||c.hostKey?'Host':'Member'} as ${esc(String(c.nick||'').slice(0,20))}</span></button>`).join('')}
    <button class="clubpick" data-id="" aria-pressed="${!member}"><b>My own shelf</b><span>Just for this device</span></button></div>
    ${member&&club&&!showForms?'<div class="row"><button class="btn quiet small" id="another">Join or start another club</button></div>':''}</div>`;
}
function bindSwitcher(){
  $('clubBody').querySelectorAll('.clubpick').forEach(x=>x.onclick=()=>{if(x.getAttribute('aria-pressed')!=='true')switchClub(x.dataset.id||null)});
  if($('another'))$('another').onclick=()=>{showForms=true;renderClubSheet()};
  if($('cancelForms'))$('cancelForms').onclick=()=>{showForms=false;prefill='';renderClubSheet()};
}
function renderClubSheet(){
  const b=$('clubBody');
  if(!(member&&club)||showForms){
    const nick=String((member&&member.nick)||localStorage.getItem('bookClubNick')||'');
    b.innerHTML=switcherHTML()+`<div><h2>${clubs.length?'Join or start another club':'Book club'}</h2><p class="mute">Start a club and share its code. Everyone who joins sees the same shelf, club pick and meeting date. Only the host can change those. Everyone can rate books and write notes, and the whole club can see them.</p></div>
      <div class="panel"><h3>Join a club</h3>
        <label class="field">Club code<input id="jCode" autocomplete="off" autocapitalize="characters" placeholder="ABCD-1234, or paste the invite link" value="${esc(prefill)}"></label>
        <label class="field">Your nickname<input id="jNick" maxlength="20" autocomplete="nickname" value="${esc(nick)}"></label>
        <details><summary>I'm the host, joining on another device</summary><label class="field" style="margin-top:8px">Host key<input id="jKey" autocomplete="off"></label></details>
        <div class="row"><button class="btn" id="jGo">Join the club</button></div></div>
      <div class="panel"><h3>Start a new club</h3>
        <label class="field">Club name<input id="cName" maxlength="40" placeholder="Kuzey's Book Club"></label>
        <label class="field">Your nickname<input id="cNick" maxlength="20" autocomplete="nickname" value="${esc(nick)}"></label>
        <p class="lock">You'll be the host. Books on your own shelf are copied into the new club.</p>
        <div class="row"><button class="btn" id="cGo">Start the club</button></div></div>
      <p class="err" id="clubErr" hidden></p>
      ${oldClubs?'<p class="err">Clubs moved to a new, safer storage, so clubs from before can\'t be opened any more. Ask your host for the new club code.</p>':''}<p class="lock">Only people who join with the club code can see the club. Keep notes friendly, and don't write anything private.</p>
      ${member&&club?'<div class="row"><button class="btn quiet" id="cancelForms">Cancel</button></div>':''}`;
    bindSwitcher();
    const fail=e=>{$('clubErr').hidden=false;$('clubErr').textContent=e instanceof ClubError||!/^(Type|Paste)/.test(e.message||'')?errText(e):e.message};
    const busy=(btn,on,label)=>{btn.disabled=on;if(label)btn.textContent=label};
    $('jGo').onclick=async()=>{const code=parseCode($('jCode').value),nick=$('jNick').value.trim().slice(0,20),key=($('jKey').value||'').trim();
      if(!code)return fail(new Error('Type the 8-letter club code, like ABCD-1234, or paste the invite link.'));
      if(!nick)return fail(new Error('Type a nickname so the club knows who you are.'));
      try{localStorage.setItem('bookClubNick',nick)}catch(e){}
      busy($('jGo'),true,'Joining…');try{await joinClub(code,nick,key);prefill='';showForms=false;renderClubSheet()}catch(e){fail(e);busy($('jGo'),false,'Join the club')}};
    $('cGo').onclick=async()=>{const name=$('cName').value.trim().slice(0,40)||'Our Book Club',nick=$('cNick').value.trim().slice(0,20);
      if(!nick)return fail(new Error('Type a nickname so the club knows who you are.'));
      try{localStorage.setItem('bookClubNick',nick)}catch(e){}
      busy($('cGo'),true,'Starting…');try{await startClub(name,nick);showForms=false;renderClubSheet()}catch(e){fail(e);busy($('cGo'),false,'Start the club')}};
    return;
  }
  const ps=people();
  b.innerHTML=switcherHTML()+`<div><h2>${esc(String(club.clubName||'Our book club').slice(0,40))}</h2>
      <p class="mute">You're ${isHost?'<b>the host</b>':'a member'} as <b>${esc(member.nick)}</b>. ${syncMsg?esc(syncMsg):lastSync?'Updated '+ago(lastSync)+'.':''}</p></div>
    <div class="panel"><h3>Invite people</h3>
      <div class="codebox" id="codeBox">${esc(fmtCode(member.code))}</div>
      <div class="row"><button class="btn small" id="cpLink">Copy invite link</button><button class="btn quiet small" id="cpCode">Copy code</button></div>
      <p class="lock">Send the link to your friends. They open it, type a nickname, and they're in. The code never changes.</p></div>
    ${isHost&&member.hostKey?`<div class="panel"><h3>Your host key</h3>
      <p class="lock">Keep this secret. To manage the club on your other devices too, join there with the code and enter this key under "I'm the host".</p>
      <div class="codebox">${esc(member.hostKey)}</div><div class="row"><button class="btn quiet small" id="cpKey">Copy host key</button></div></div>`:''}
    <div class="panel"><h3>Members (${ps.length})</h3>
      <ul class="members">${ps.map(p=>`<li>${esc(p.nick)}${p.host?' <span class="tag">Host</span>':''}${p.mid===member.mid?' <span class="mute small">(you)</span>':''}</li>`).join('')}</ul></div>
    <div class="row"><button class="btn quiet" id="refresh">Check for updates</button><button class="btn quiet" id="leave">Leave this club on this device</button></div>
    <p class="lock">Leaving only removes this club from this device. You can join again any time with the code${isHost?' and your host key':''}.</p>`;
  bindSwitcher();
  $('cpLink').onclick=e=>copy(inviteLink(),e.target);$('cpCode').onclick=e=>copy(fmtCode(member.code),e.target);
  if($('cpKey'))$('cpKey').onclick=e=>copy(member.hostKey,e.target);
  $('refresh').onclick=()=>pull();
  let armed=false;$('leave').onclick=e=>{if(!armed){armed=true;e.target.textContent=isHost?'Tap again. Save your host key first!':'Tap again to leave';setTimeout(()=>{armed=false;if(e.target.isConnected)e.target.textContent='Leave this club on this device'},4000);return}leaveClub()};
}
function openClub(){renderClubSheet();$('clubSheet').hidden=false;$('clubSheet').scrollTop=0;document.body.style.overflow='hidden';$('clubBack').focus()}
function closeClub(){$('clubSheet').hidden=true;document.body.style.overflow='';renderHome()}
$('clubBtn').onclick=openClub;$('clubBack').onclick=closeClub;

/* ---------- home ---------- */
function renderHome(){
  const pick=db.pick&&db.books[db.pick];
  const locked=member&&club&&!isHost;
  if(pick){const b=pick.book;let when='';
    if(pick.meet){const d=new Date(pick.meet+'T12:00:00'),days=Math.round((d-new Date().setHours(12,0,0,0))/864e5);
      when=days>1?`We meet in ${days} days`:days===1?'We meet tomorrow':days===0?'We meet today!':'Last meeting: '+d.toLocaleDateString()}
    $('pickSect').innerHTML='';const btn=document.createElement('button');btn.className='pick';
    btn.innerHTML=coverHTML(b)+`<div><div class="label">Our club pick</div><h3>${esc(b.title)}</h3><div class="mute">by ${esc(b.author)}</div>${when?`<span class="when">${when}</span>`:`<span class="when mute">${locked?'No meeting date yet':'Set a meeting date on the book page'}</span>`}</div>`;
    btn.onclick=()=>openBook(b);$('pickSect').appendChild(btn);
  }else $('pickSect').innerHTML=`<div class="empty"><b>No club pick yet.</b> ${locked?'The host will choose one soon.':'Search for a book, open it, and tick "This is our club pick".'}</div>`;
  const counts=Object.fromEntries(SHELVES.map(([k])=>[k,Object.values(db.books).filter(x=>x.shelf===k).length]));
  $('tabs').innerHTML=SHELVES.map(([k,l])=>`<button class="tab" data-k="${k}" aria-pressed="${solo.tab===k}">${l}<b>${counts[k]}</b></button>`).join('');
  $('tabs').onclick=e=>{const k=e.target.closest('.tab')?.dataset.k;if(k){solo.tab=k;db.tab=k;save();renderHome()}};
  const list=Object.values(db.books).filter(x=>x.shelf===solo.tab).sort((a,b)=>(b.t||0)-(a.t||0));
  const sh=$('shelf');sh.innerHTML='';
  if(!list.length){sh.innerHTML=`<div class="empty">Nothing on "${SHELVES.find(s=>s[0]===solo.tab)[1]}" yet. ${locked?'The host adds books to the club shelf.':'Open any book and tap the shelf button to add it here.'}</div>`;return}
  const g=document.createElement('div');g.className='grid';list.forEach(x=>g.appendChild(bookTile(x.book)));sh.appendChild(g);
}
IDEAS.forEach(t=>{const c=document.createElement('button');c.className='chip';c.textContent=t;c.onclick=()=>{$('q').value=t;search(t)};$('ideas').appendChild(c)});

/* ---------- start ---------- */
applyClub();
if(member)pull();
// invite links: #join=CODE
function checkInvite(){
  const inv=location.hash.startsWith('#join=')?parseCode(location.hash):null;
  if(!inv)return;
  history.replaceState(null,'',location.pathname);
  const k=clubs.find(c=>c.code===inv);if(k){switchClub(k.id).then(openClub);return} // already in that club
  prefill=fmtCode(inv);showForms=true;openClub();
}
checkInvite();addEventListener('hashchange',checkInvite);
// check again when coming back to the app, at most every 2 minutes
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&member&&Date.now()-lastSync>15000)pull()});
setInterval(()=>{if(member&&document.visibilityState==='visible')pull()},45000);
if(oldClubs&&!clubs.length)setTimeout(()=>{$('clubSub').textContent='Clubs moved to a safer storage. Ask your host for the new code.'},500);
setInterval(()=>{if(member&&club)renderClubBar()},30000);
// short messages at the bottom of the screen
function toast(m){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=m;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
/* ---------- updates: wait for a calm moment and keep what's on screen ---------- */
const UI_KEY='bc:ui';
let interacted=false,updateReady=false;
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{interacted=true},{once:true,capture:true}));
const busyNow=()=>false;
function saveUI(){try{sessionStorage.setItem(UI_KEY,JSON.stringify(Object.assign({scroll:scrollY,at:Date.now()},(()=>{return{q:$('results').hidden?'':$('q').value,book:openInfo,notes:openInfo&&$('notes')&&$('notes').dataset.dirty?$('notes').value:null,club:!$('clubSheet').hidden}})())))}catch(e){}}
function applyUpdate(){if(busyNow()){toast('Finish the timer first, then tap Update.');return}saveUI();location.reload()}
function showUpdate(){
  if(document.getElementById('upd'))return;
  const d=document.createElement('div');d.className='upd';d.id='upd';d.setAttribute('role','status');
  d.innerHTML='<span>A new version of the app is ready.</span><button class="now">Update now</button><button class="later">Later</button>';
  d.querySelector('.now').onclick=applyUpdate;d.querySelector('.later').onclick=()=>d.remove();document.body.appendChild(d);
}
// put back what was on screen before an update
(()=>{let s=null;try{s=JSON.parse(sessionStorage.getItem(UI_KEY)||'null');sessionStorage.removeItem(UI_KEY)}catch(e){}
  if(!s||Date.now()-s.at>10*60*1000)return;
  setTimeout(()=>{try{const after=()=>{if(s.book){openBook(s.book);if(s.notes!=null){$('notes').value=s.notes;$('notes').dispatchEvent(new Event('input'))}}if(s.club)openClub()};if(s.q){$('q').value=s.q;search(s.q).then(after)}else after();}catch(e){}requestAnimationFrame(()=>scrollTo(0,+s.scroll||0));toast('Updated to the newest version')},150)})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&updateReady&&!busyNow()){saveUI();location.reload()}});
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||updateReady)return;updateReady=true;
    // right after opening, nothing is in progress yet: update straight away
    if(!interacted&&performance.now()<5000&&!busyNow()){saveUI();location.reload()}else showUpdate()});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
}
})();
</script>
</body>
</html>
