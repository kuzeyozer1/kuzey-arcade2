<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Illusion Lab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Chakra+Petch:wght@400;600;700&display=swap">
<link rel="stylesheet" href="lab.css">
<style>
/* Layout: a grid of illusion cards; each card has the picture, a question, and a button that reveals the truth. */
:root{--acc:#ffd23f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card canvas{width:100%;aspect-ratio:4/3;display:block;background:#fff}
.card div{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h2{margin:0}
.card p{margin:0;color:var(--mute);font-size:14px}
.card .truth{color:var(--ink);background:#1a1440;border-left:3px solid var(--gold);border-radius:8px;padding:8px 10px}
.card button{align-self:flex-start}
</style>
</head>
<body>
<div class="wrap">
<header><h1>ILLUSION LAB</h1><a class="back" href="./">← ARCADE</a></header>
<p class="sub">Your brain is amazing, but it can be tricked! Look at each picture, answer the question in your head, then press the button to see the truth.</p>
<div class="grid" id="grid"></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const IL=[
 {t:'Crooked lines?',q:'Are the grey lines between the rows straight, or do they slope?',a:'They are perfectly straight and parallel! This is the Café Wall illusion, first noticed on the tiles of a café wall in England. The shifted black and white tiles trick your brain into seeing wedges.',
  d(x,w,h,tr){x.fillStyle='#fff';x.fillRect(0,0,w,h);const s=w/9,rows=6,top=(h-rows*s)/2;for(let r=0;r<rows;r++){const off=[0,s*.25,s*.5,s*.25][r%4];for(let c=-1;c<10;c++)if(c%2===0){x.fillStyle='#000';x.fillRect(c*s+off,top+r*s,s,s)}x.fillStyle='#888';x.fillRect(0,top+r*s-1,w,2)}x.fillStyle='#888';x.fillRect(0,top+rows*s-1,w,2);
   if(tr){x.strokeStyle='#ff2d55';x.lineWidth=2;for(let r=0;r<=rows;r++){x.beginPath();x.moveTo(0,top+r*s);x.lineTo(w,top+r*s);x.stroke()}}}},
 {t:'Which orange circle is bigger?',q:'Look at the two orange circles in the middle. Which one is bigger?',a:'They are exactly the same size! This is the Ebbinghaus illusion. Your brain compares each circle with its neighbours, so surrounded by big circles it looks small, and surrounded by small circles it looks big.',
  d(x,w,h,tr){x.fillStyle='#fff';x.fillRect(0,0,w,h);const r=w*.055,L=[w*.27,h/2],R=[w*.73,h/2];x.fillStyle='#8aa4ff';
   if(!tr)for(let i=0;i<6;i++){const a=i/6*Math.PI*2;x.beginPath();x.arc(L[0]+Math.cos(a)*w*.15,L[1]+Math.sin(a)*w*.15,w*.07,0,7);x.fill()}
   if(!tr)for(let i=0;i<8;i++){const a=i/8*Math.PI*2;x.beginPath();x.arc(R[0]+Math.cos(a)*w*.085,R[1]+Math.sin(a)*w*.085,w*.022,0,7);x.fill()}
   x.fillStyle='#ff8a1f';[L,R].forEach(p=>{x.beginPath();x.arc(p[0],p[1],r,0,7);x.fill()});if(tr){x.strokeStyle='#ff2d55';x.setLineDash([6,4]);x.beginPath();x.moveTo(0,h/2-r);x.lineTo(w,h/2-r);x.moveTo(0,h/2+r);x.lineTo(w,h/2+r);x.stroke();x.setLineDash([])}}},
 {t:'Which line is longer?',q:'Which of the two horizontal lines is longer, the top one or the bottom one?',a:'Both lines are exactly the same length! This is the Müller-Lyer illusion. The arrow ends pointing out or in make your brain guess the lengths wrongly.',
  d(x,w,h,tr){x.fillStyle='#fff';x.fillRect(0,0,w,h);const a=w*.25,b=w*.75,y1=h*.33,y2=h*.68,f=w*.07;x.strokeStyle='#111';x.lineWidth=4;x.lineCap='round';
   x.beginPath();x.moveTo(a,y1);x.lineTo(b,y1);x.moveTo(a,y1);x.lineTo(a+f,y1-f);x.moveTo(a,y1);x.lineTo(a+f,y1+f);x.moveTo(b,y1);x.lineTo(b-f,y1-f);x.moveTo(b,y1);x.lineTo(b-f,y1+f);
   x.moveTo(a,y2);x.lineTo(b,y2);x.moveTo(a,y2);x.lineTo(a-f,y2-f);x.moveTo(a,y2);x.lineTo(a-f,y2+f);x.moveTo(b,y2);x.lineTo(b+f,y2-f);x.moveTo(b,y2);x.lineTo(b+f,y2+f);x.stroke();
   if(tr){x.strokeStyle='#ff2d55';x.lineWidth=2;x.setLineDash([6,4]);x.beginPath();x.moveTo(a,h*.12);x.lineTo(a,h*.9);x.moveTo(b,h*.12);x.lineTo(b,h*.9);x.stroke();x.setLineDash([])}}},
 {t:'Same grey?',q:'Is the square on the left darker or lighter than the square on the right?',a:'They are the exact same grey! Your brain judges brightness by comparing with the background. On a dark background the square looks lighter, and on a light background it looks darker.',
  d(x,w,h,tr){const g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'#111');g.addColorStop(1,'#eee');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#808080';const s=w*.16;x.fillRect(w*.2-s/2,h/2-s/2,s,s);x.fillRect(w*.8-s/2,h/2-s/2,s,s);if(tr)x.fillRect(w*.2,h/2-s*.15,w*.6,s*.3)}},
 {t:'Grey dots that are not there',q:'Look at the white crossings between the black squares. Do you see grey dots? Try to look straight at one.',a:'There are no grey dots at all! This is the Hermann grid. The cells in your eyes that see the edges react differently at the crossings, so you see ghostly dots, but they vanish when you look straight at them.',
  d(x,w,h,tr){x.fillStyle='#fff';x.fillRect(0,0,w,h);const n=6,g=w*.022,s=(h-g*(n+1))/n,ox=(w-(n*s+(n+1)*g))/2;x.fillStyle='#000';for(let i=0;i<n;i++)for(let j=0;j<n;j++)x.fillRect(ox+g+i*(s+g),g+j*(s+g),s,s);if(tr){x.fillStyle='#fff';x.strokeStyle='#ff2d55';x.lineWidth=2;x.beginPath();x.arc(ox+g/2+3*(s+g),g/2+3*(s+g),g*1.6,0,7);x.stroke()}}},
 {t:'The disappearing pink dots',anim:1,q:'Stare at the black cross in the middle for 20 seconds. Do not move your eyes! What happens to the pink dots?',a:'The pink dots seem to vanish and you see a green dot racing around instead! This is the Lilac Chaser. When you stare, your brain stops noticing the still pink dots, and the gap where a dot disappears looks green (the opposite colour of pink).',
  d(x,w,h,tr,t){x.fillStyle='#c8c8c8';x.fillRect(0,0,w,h);const n=12,miss=Math.floor(t/.12)%n,R=h*.36;for(let i=0;i<n;i++){if(i===miss&&!tr)continue;const a=i/n*Math.PI*2,px=w/2+Math.cos(a)*R,py=h/2+Math.sin(a)*R,g=x.createRadialGradient(px,py,0,px,py,h*.07);g.addColorStop(0,'rgba(230,80,200,.95)');g.addColorStop(1,'rgba(230,80,200,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,h*.07,0,7);x.fill()}x.strokeStyle='#000';x.lineWidth=2;x.beginPath();x.moveTo(w/2-8,h/2);x.lineTo(w/2+8,h/2);x.moveTo(w/2,h/2-8);x.lineTo(w/2,h/2+8);x.stroke()}},
 {t:'Walking boxes',anim:1,q:'Watch the yellow and the blue box. Do they move smoothly, or do they take turns stepping?',a:'They move at exactly the same steady speed the whole time! This is the Stepping Feet illusion. The stripes behind them change how much each box stands out, so they seem to speed up and slow down. Press the button to remove the stripes.',
  d(x,w,h,tr,t){x.fillStyle='#808080';x.fillRect(0,0,w,h);if(!tr){const s=w/40;for(let i=0;i<40;i++){x.fillStyle=i%2?'#fff':'#000';x.fillRect(i*s,0,s,h)}}const bw=w*.12,bx=((t*w*.08)%(w+bw))-bw;x.fillStyle='#ffe600';x.fillRect(bx,h*.3,bw,h*.12);x.fillStyle='#1a1a8c';x.fillRect(bx,h*.58,bw,h*.12)}},
 {t:'The melting spiral',anim:1,spiral:1,q:'Press START and stare at the middle of the spinning spiral until it stops. Then look at your hand or the wall!',a:'After the spiral stops, still things seem to move or shrink! This is the motion aftereffect. The parts of your brain that detect the spiral\'s motion get tired, so for a few seconds everything seems to move the other way.',
  d(x,w,h,tr,t,st){x.fillStyle='#fff';x.fillRect(0,0,w,h);const left=st?Math.max(0,20-(t-st)):0,spin=st&&left>0?(t-st)*2.2:0;x.save();x.translate(w/2,h/2);x.rotate(spin);x.strokeStyle='#000';x.lineWidth=h*.035;x.beginPath();for(let a=0;a<Math.PI*14;a+=.08){const r=a*h*.0105;const px=Math.cos(a)*r,py=Math.sin(a)*r;a?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();x.restore();
   x.fillStyle='#ff2d55';x.beginPath();x.arc(w/2,h/2,5,0,7);x.fill();x.fillStyle='#0b0820';x.font='700 16px Chakra Petch, sans-serif';x.fillText(st?(left>0?`Stare… ${Math.ceil(left)}`:'Now look at your hand!'):'Press START',10,22)}}
];
$('grid').innerHTML=IL.map((il,i)=>`<article class="card"><canvas id="c${i}" width="480" height="360" aria-label="${il.t}"></canvas><div><h2>${il.t}</h2><p>${il.q}</p><p class="truth" id="a${i}" hidden>${il.a}</p><button class="btn small" data-i="${i}">${il.spiral?'▶ START':'SHOW THE TRUTH'}</button></div></article>`).join('');
const state=IL.map(()=>({truth:false,st:0}));
$('grid').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const i=+b.dataset.i,s=state[i],il=IL[i];
  if(il.spiral){s.st=performance.now()/1000;$('a'+i).hidden=true;setTimeout(()=>{$('a'+i).hidden=false},20500);return}
  s.truth=!s.truth;$('a'+i).hidden=!s.truth;b.textContent=s.truth?'HIDE THE TRUTH':'SHOW THE TRUTH';draw(i)};
function draw(i,t=performance.now()/1000){const c=$('c'+i),x=c.getContext('2d');IL[i].d(x,c.width,c.height,state[i].truth,t,state[i].st)}
IL.forEach((_,i)=>draw(i));
const vis=new Set();const io=new IntersectionObserver(es=>es.forEach(e=>{const i=+e.target.id.slice(1);e.isIntersecting?vis.add(i):vis.delete(i)}));IL.forEach((il,i)=>{if(il.anim)io.observe($('c'+i))});
(function loop(){const t=performance.now()/1000;vis.forEach(i=>draw(i,t));requestAnimationFrame(loop)})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
